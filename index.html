자 상당수가 대출에 기대고 있다는 뜻이며, 주담대 한도가 추가로 낮아지면 이 지역 매수 수요가 가장 먼저 꺾일 수 있다.[1][2]\n- 9월 노원구 아파트 매매가가 전월 대비 2.32% 올라 서울 자치구 중 1위를 기록한 것은, 5분위 배율 하락(고가-저가 격차 축소)의 주된 동력이 중저가 지역 가격 상승이라는 설명과 맞물린다.[3]\n- 세제개편안 이후 9억원 이하 거래 비중은 늘고 9억~15억원 구간은 계속 줄고 있어, 상계주공 같은 중저가 구축 단지의 수요층이 더 저가 쪽으로 몰리는 흐름이 이어지고 있다.[4][5]\n\n## 오늘의 개념\n\n### 디딤돌대출\n\n무주택 서민을 위한 정부의 정책 모기지로, 시중 금리보다 낮은 이자로 주택 구입 자금을 지원한다. 기사에 따르면 대상 주택 평가액 기준은 일반 가구 5억원 이하, 신혼·2자녀 이상 가구는 6억원 이하이며 무주택 요건과 소득·자산 기준도 충족해야 한다.\n\n*오늘*: 노원구 상계동 공인중개사는 전월세 매물 부족으로 신혼부부 등이 디딤돌대출(최대 3억2천만원, 연 3%대)을 받아 매수로 전환하는 사례가 늘고 있다고 전했다 — 상계주공 재건축 후에도 이런 저가 실수요층이 주요 매수 기반이 될 수 있음을 보여준다.[4][5]\n\n## 참고 원문\n\n1. 대출한도 또 줄인다고?...강남보다 노도강 대출 비중 제일 높아 — 매일경제 · [원문](https://mk.co.kr/article/12167950)\n2. 지역별로 엇갈린 부동산 대출 의존도…강남 9%·노원38% — 매일경제 · [원문](https://mk.co.kr/article/12167967)\n3. 서울 집값 격차 줄었다는데…서민 ‘내 집’은 더 멀어졌다 — 서울경제 · [원문](https://sedaily.com/article/20097947)\n4. 세제개편안 후 서울 아파트 15억원 이하 거래 비중 80% 육박 — 연합뉴스 · [원문](https://yna.co.kr/view/AKR20261005011500003?input=1195m)\n5. 서울 아파트 거래 절반은 9억원 이하…자기자금 부담에 매수 쏠림 — SR타임스 · [원문](http://srtimes.kr/news/articleView.html?idxno=213950)\n\n## 오늘 흘려보낸 것\n\n중복 23건 · 후속보도 신규정보 없음 0건 · 기준 미달 220건\n"}, {"date": "2026-10-04", "markdown": "# 2026-10-04 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 묶음은 상계주공7단지의 거래 강세, 노원구 상계동에 새로 지정된 공공주도 주택사업, 노원구 대출 의존도 급등이라는 세 갈래로 나뉜다. 공통적으로 '저가 매수 여력'이 노원구 재건축 생태계를 떠받치고 있다는 그림이 보이지만, 이는 매매 심리·금융 조달 환경에 관한 것이지 실제 공사비·분담금 수치는 오늘 보도에 담기지 않았다. 재건축 비용 자체를 가늠할 새로운 숫자는 없었던 날로 봐야 한다.\n\n## 선별 3건\n\n### 1. 🔴 [상계주공7단지] \"7억도 비싸다 했는데 10억 됐다\"...이 가격 다시 안 온다, 외곽 덮친 '몸...\n\n파이낸셜뉴스 · 2026-10-02 · [원문](https://fnnews.com/news/202610020809305608)\n\n아실 집계 기준 올 7~9월 서울에서 가장 많이 거래된 아파트 상위권에 도봉구 신동아1단지, 노원구 미미삼에 이어 노원구 상계동 '상계주공7단지'가 42건으로 3위에 올랐다. 인근 중개업소는 조합원 지위 양도가 막히기 전에 매수하려는 수요가 몰린 것이라고 설명했다. 같은 외곽 재건축 단지인 미미삼 전용59㎡는 7월말 12억원에 신고가를 기록해 1년 전 7억2000만원 대비 올랐다.\n\n**이번에 새로 나온 것**: 7~9월(3분기) 아실 집계 기준 상계주공7단지가 거래량 42건으로 서울 전체 3위에 올랐다는 새 순위 데이터가 보도됐다.\n\n*왜 골랐나*: 상계주공7단지가 거래량 순위에 다시 올랐고, 우선순위 지역 규정상 비용 수치가 약해도 먼저 검토 대상이 됐다.\n\n### 2. 🔴 [노원구] LH, 수락산·대림역 일대 3207호 공급 추진… 도심복합 예정지구 지정\n\nnewscj.com · 2026-10-02 · [원문](https://newscj.com/news/articleView.html?idxno=3437309)\n\nLH가 노원구 상계동 1105-75번지 일원(2만7921㎡)에 지하철 7호선 수락산역 인근 도심공공주택복합사업 예정지구를 지정·공고했다. 이 사업으로 1191가구가 공급될 예정이며, 같은 유형 사업으로 구로구 대림역 인근에 2016가구가 추진된다. LH는 지정일로부터 1년 이내 토지등소유자 2/3 이상, 토지면적 1/2 이상의 동의 확보를 진행할 계획이다.\n\n**정책 포인트**\n\n- 도심공공주택복합사업 예정지구 지정은 공공 주도 절차로, 지정일로부터 1년 내 토지등소유자 2/3 이상·토지면적 1/2 이상 동의 확보가 본지구 지정의 선결 조건이다.\n\n*왜 골랐나*: 노원구 상계동에 공공주도 주택공급 사업이 새로 지정·공고된 사례로, 민간 재건축과는 별개지만 상계동 생활권의 주택 공급 구조에 영향을 줄 수 있어 선별했다.\n\n### 3. 🔴 [노원구] 대출 더 조이면 누가 영향받나…노도강 매입자금 30%대가 대출\n\n연합뉴스 · 2026-10-04 · [원문](https://yna.co.kr/view/AKR20261003043500003?input=1195m)\n\n국회 국토위 김종양 의원이 국토부에서 받은 자료에 따르면 올해 1~8월 노원구 주택 구매자의 매입자금 중 금융기관 대출 비중이 38.2%로 작년 30.0%보다 8.2%포인트 올랐다. 도봉구는 28.0%에서 31.9%로, 강북구는 31%대를 유지했다. 반면 강남3구·용산구는 대출 비중이 9~14%대로 낮아졌다. 노원구 아파트 거래의 99.8%가 15억원 이하여서, 현행 6억원 대출한도가 추가로 축소되면 노원구 등 외곽 구매자가 더 큰 영향을 받을 수 있다는 지적이 나온다.\n\n**정책 포인트**\n\n- 15억원 이하 주택 주담대 한도(현행 최대 6억원)를 추가로 낮추는 방안이 거론되고 있으며, 시행되면 대출 의존도가 높은 노원구 등 외곽 지역 구매자가 상대적으로 더 큰 영향을 받을 수 있다.\n\n*왜 골랐나*: 노원구를 콕 집어 대출 의존도 급등 수치를 제시한 기사로, 15억원 이하 주담대 한도 추가 축소 논의가 재건축 단지 매수·자금 조달 여건에 영향을 줄 수 있어 선별했다.\n\n## 인사이트\n\n- 상계주공7단지는 7~9월 거래량 서울 전체 3위(42건)를 기록해, 기존 '노도강 구축' 거래 강세 흐름이 3분기에도 이어지고 있음을 보여준다.[1]\n- 노원구 주택 매입자금 중 대출 비중은 38.2%로 전년보다 8.2%포인트 올랐고, 강남3구는 반대로 9%대까지 낮아졌다. 15억원 이하 주담대 한도가 더 줄어들면 대출 의존도가 높은 노원구 매수자·조합원의 자금 조달 부담이 상대적으로 커질 수 있다.[2]\n- LH가 노원구 상계동(수락산역 인근)에 도심공공주택복합사업 예정지구를 지정해 1191가구 공급을 추진한다. 이는 민간 재건축과 별개 절차이며, 본지구 지정 여부는 향후 주민 동의율 확보 결과에 달려 있다.[3]\n\n## 오늘의 개념\n\n### 몸테크\n\n'몸'으로 '재테크'를 한다는 뜻의 조어로, 노후 아파트에 직접 거주하면서 재건축에 따른 시세 차익을 기대하는 매수·거주 전략을 말한다. 신축 대비 가격이 낮은 외곽 재건축 단지에서 주로 나타나는 매수 패턴이다.\n\n*오늘*: 7~9월 거래량 상위에 오른 상계주공7단지·신동아1단지 등 외곽 재건축 단지를 두고 '몸테크' 수요가 몰렸다는 설명이 오늘 기사에 등장했다.[1]\n\n### 5분위 배율\n\n아파트를 가격순으로 5등분해 상위 20%(5분위) 평균가격을 하위 20%(1분위) 평균가격으로 나눈 값으로, 고가·저가 아파트 간 가격 격차를 보여주는 지표다. 수치가 낮아질수록 격차가 줄었다는 뜻이다.\n\n*오늘*: 9월 서울 5분위 배율이 6.28배로 8개월 연속 하락했는데, 고가 아파트 하락보다는 노원구 등 중저가 지역 가격이 더 가파르게 오른 영향으로 풀이됐다.[4]\n\n## 참고 원문\n\n1. \"7억도 비싸다 했는데 10억 됐다\"...이 가격 다시 안 온다, 외곽 덮친 '몸... — 파이낸셜뉴스 · [원문](https://fnnews.com/news/202610020809305608)\n2. 대출 더 조이면 누가 영향받나…노도강 매입자금 30%대가 대출 — 연합뉴스 · [원문](https://yna.co.kr/view/AKR20261003043500003?input=1195m)\n3. LH, 수락산·대림역 일대 3207호 공급 추진… 도심복합 예정지구 지정 — newscj.com · [원문](https://newscj.com/news/articleView.html?idxno=3437309)\n4. 서울 집값 격차 줄었다는데…서민 ‘내 집’은 더 멀어졌다 — 서울경제 · [원문](https://sedaily.com/article/20097947)\n\n## 오늘 흘려보낸 것\n\n중복 50건 · 후속보도 신규정보 없음 1건 · 기준 미달 363건\n"}, {"date": "2026-10-03", "markdown": "# 2026-10-03 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘자 상계동 관련 뉴스는 민간 재건축 분담금 수치보다 공공주도 개발과 인접 생활권 변화가 중심이다. LH가 상계동 수락산역 인근에 도심공공주택복합사업 예정지구를 지정했고, 광운대역세권에서는 '서울원' 복합개발이 4조8000억원 규모로 진행 중이라는 사실이 확인됐다. 같은 시기 노원구에서는 재건축 기대 단지를 중심으로 증여 거래가 급증하고 생애최초 매수자의 매물 소진이 이어지는 등, 분담금 수치보다 거래·소유 구조 변화가 두드러지는 하루였다. 도봉구 서울아레나 관광특구 추진은 창동·상계 인접 생활권의 교통·문화 기반 변화 가능성을 시사하지만 아직 정책 검토 단계다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] LH, 수락산·대림역 인근 도심복합사업 추진…3207가구 공급\n\n뉴스핌 · 2026-10-01 · [원문](https://newspim.com/news/view/20261001001082)\n\nLH가 노원구 상계동 1105-75번지 일대(2만7921㎡)를 수락산역 인근 도심공공주택복합사업 예정지구로 지정·공고했다. 이 구역에는 1191가구가 공급될 예정이며, 구로구 대림역 인근(2016가구)과 합쳐 총 3207가구 규모다. LH는 지정일로부터 1년 이내 토지 등 소유자 3분의 2 이상, 토지면적 2분의 1 이상의 동의를 확보해야 본지구 지정 절차로 넘어간다. 민간 정비사업이 정체된 역세권을 공공이 수용 방식으로 개발하는 사업이라는 점에서 기존 상계동 재건축 사업장들과는 추진 주체와 방식이 다르다.\n\n**정책 포인트**\n\n- 도심공공주택복합사업 예정지구 지정·공고(수락산역 인근, 노원구 상계동 1105-75)\n- 지정일로부터 1년 이내 토지 등 소유자 2/3 이상·토지면적 1/2 이상 동의 확보가 본지구 지정의 관건\n- 동의율 확보 후 중앙토지수용위원회 심의 등 인허가 절차 진행 예정\n\n*왜 골랐나*: 상계동 1105-75번지에 공공주도 개발이 새로 지정된 사실로, 노원구 상계 생활권의 토지이용 변화를 보여주는 최우선 정책 뉴스다.\n\n### 2. 🔴 [노원구] 사람과 돈이 머무는 자족도시로… 대규모 복합개발이 이끄는 지역 가치\n\n파이낸셜뉴스 · 2026-10-02 · [원문](https://fnnews.com/news/202610021023564203)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 서울원(광운대역세권 복합개발) | 총공사비 | 4조 8,000억 | — |\n\n노원구 광운대역세권 일대 약 15만㎡ 부지에서 IPARK현대산업개발이 약 4조8000억원 사업비를 들여 추진하는 복합개발 '서울원'이 진행 중이다. 주거·프라임 오피스·쇼핑몰·5성급 호텔이 순차 조성될 계획이며, 두 번째 주거시설 '파크로쉬 서울원'(전용 70~80㎡, 768가구 민간임대)이 분양 중이다. 인접한 '서울원 아이파크'와 '월계한진한화그랑빌'의 최근 거래가가 언급됐다.\n\n> ⚠️ 4조 8000억원은 IPARK현대산업개발이 추진하는 복합개발사업 전체 사업비로, 조합원 개인이 부담하는 분담금이나 세대 단위 금액이 아닙니다.\n> ⚠️ 이 사업은 공공·민간 복합개발 방식이라 재건축 조합의 종전자산 평가·비례율·권리가액 개념이 그대로 적용되지 않습니다.\n> ⚠️ 기사에 이 금액이 어느 시점(설계 변경 전·후, 공사비 증액 반영 여부) 기준인지 나와 있지 않아 향후 달라질 수 있는 추정치로 봐야 합니다.\n\n*왜 골랐나*: 노원구 내 사업비가 명시된 대규모 복합개발로, 광운대역 일대 일자리·상업기반 확충이 상계 생활권에 영향을 줄 수 있는 도시계획 변화다.\n\n### 3. 🔴 [노원구] \"집 팔아 현금 줄 바엔…\" 서울 아파트 '통째 증여' 급증 이유는\n\n핀포인트뉴스 · 2026-10-02 · [원문](https://pinpointnews.co.kr/news/articleView.html?idxno=492308)\n\n8월 서울 아파트 증여 거래가 1036건으로 1년 전보다 126.7% 늘었고, 노원구는 130건으로 441.7% 증가해 자치구 중 가장 큰 증가폭을 보였다. 올해 상반기 기준 단지별 증여 등기는 양천구 목동신시가지아파트(102건)에 이어 노원구 상계주공아파트(95건)가 두 번째로 많았다. 다주택자 양도세 중과 재개(5월 9일)와 재건축 기대가 맞물린 자산 이전 수요로 풀이된다.\n\n**정책 포인트**\n\n- 다주택자 양도소득세 중과 유예가 5월 9일 종료되며 2주택자 기본세율+20%p, 3주택 이상 +30%p 가산 적용\n\n*왜 골랐나*: 상계주공아파트가 서울에서 두 번째로 증여가 많은 단지로 집계돼, 노원구 소유 구조 변화를 수치로 보여주는 기사다.\n\n### 4. 🔴 [도봉구] 민주당 도봉갑·을-도봉구 첫 당정협의회…서울아레나 중심 관광산업 본...\n\nmhns.co.kr · 2026-10-02 · [원문](https://mhns.co.kr/news/articleView.html?idxno=762678)\n\n민주당 도봉갑·을 지역위원회와 도봉구가 첫 당정협의회를 열고 2027년 개관 예정인 서울아레나를 중심으로 관광특구 지정을 공동 추진하기로 했다. 창동역과 지역 상권, 도봉산을 연결하는 관광동선 구축 계획이 제시됐고, '서울아레나 특별위원회' 구성도 추진된다. 관광특구 지정은 개관 전부터 기반을 준비하자는 취지로, 아직 타당성 검토·후보구역 설정 단계다.\n\n**정책 포인트**\n\n- 서울아레나 관광특구 지정은 타당성 검토·후보구역 설정 등 초기 단계이며 아직 지정되지 않음\n- 국민의힘 김재섭 의원이 '예비 관광특구' 제도 도입 관광진흥법 개정안을 발의한 상태\n\n*왜 골랐나*: 창동역 일대 개발은 상계 생활권과 인접한 교통·문화 거점 변화로, 지정 여부가 확정되지 않은 정책 검토 단계임을 명시해 포함했다.\n\n### 5. 🔴 [노원구] 생애최초 실수요자가 휩쓸고 간 노원구…매매·전세 씨 말랐다\n\n헤럴드경제 · 2026-10-01 · [원문](https://biz.heraldcorp.com/article/10890264)\n\n8월 노원구 생애최초 매수인은 604명으로 강동구 다음으로 많았고 이 중 76%가 2030세대였다. 상계주공 3단지·5단지·7단지 인근 중개업소들은 저가 매물이 소진되며 전세·매매 모두 물건이 부족하다고 전했다. 17~18평대 소형 매물 시세가 6억원대 중반까지 올랐다는 현장 전언이 포함됐다.\n\n*왜 골랐나*: 상계주공3·5·7단지 현장 코멘트를 통해 노원구 매물 소진과 실수요 쏠림을 보여주는 기사로, 비용 수치는 약하지만 노원 우선순위 기준에 따라 선정했다.\n\n## 인사이트\n\n- 노원구 상계동은 민간 재건축(상계주공 단지들)과 공공주도 도심복합사업(수락산역 예정지구)이 같은 생활권 내에서 서로 다른 트랙으로 동시 추진되고 있어, 두 사업의 추진 속도 차이가 향후 생활환경 변화 시점을 가를 수 있다.[1]\n- 상계주공아파트는 올 상반기 증여 등기 95건으로 서울 단지 중 목동신시가지아파트(102건)에 이어 두 번째로 많아, 재건축 기대 단지에서 세대 간 자산 이전이 활발하다는 신호다.[2]\n- 광운대역세권 서울원(4조8000억원)과 서울아레나(도봉구)는 각각 노원·도봉 생활권의 업무·문화 기반을 넓히는 사업이지만, 둘 다 상계주공9단지의 용적률이나 분담금에 직접 영향을 준다는 근거는 오늘 기사에 없다.[3][4]\n- 노원구는 9월 넷째 주 기준 상계·월계동 위주로 0.34% 올라 강북 14개구 상승을 이끈 지역 중 하나로 집계됐지만, 이는 매매가 동향이지 재건축 분담금 수치와는 별개 축이다.[5][6]\n\n## 오늘의 개념\n\n### 관광특구\n\n일정 요건(외국인 관광객 수 등)을 갖춘 지역에 관광객 유치·관광산업 활성화를 위한 각종 지원이 이뤄지는 제도다. 대규모 문화시설이 개관하기 전에는 요건 충족이 어려워 지정에 제약이 있다는 지적이 있다.\n\n*오늘*: 도봉구가 2027년 개관 예정인 서울아레나를 앞두고 개관 전부터 관광특구 지정 기반을 준비하기로 했는데, 이는 창동·상계 인접 생활권의 교통·관광 인프라 투자로 이어질 수 있는 사전 단계다.[4]\n\n## 참고 원문\n\n1. LH, 수락산·대림역 인근 도심복합사업 추진…3207가구 공급 — 뉴스핌 · [원문](https://newspim.com/news/view/20261001001082)\n2. \"집 팔아 현금 줄 바엔…\" 서울 아파트 '통째 증여' 급증 이유는 — 핀포인트뉴스 · [원문](https://pinpointnews.co.kr/news/articleView.html?idxno=492308)\n3. 사람과 돈이 머무는 자족도시로… 대규모 복합개발이 이끄는 지역 가치 — 파이낸셜뉴스 · [원문](https://fnnews.com/news/202610021023564203)\n4. 민주당 도봉갑·을-도봉구 첫 당정협의회…서울아레나 중심 관광산업 본... — mhns.co.kr · [원문](https://mhns.co.kr/news/articleView.html?idxno=762678)\n5. 서울 집값 86주째 쑥…평균 15억 넘는 자치구 5년새 5곳→13곳 — 매일경제 · [원문](https://mk.co.kr/article/12166392)\n6. [속보] 강남이 꺾여도 오른다…서울 아파트값, 역대 최장 86주 연속 상승 — 매일경제 · [원문](https://mk.co.kr/article/12165942)\n\n## 오늘 흘려보낸 것\n\n중복 91건 · 후속보도 신규정보 없음 1건 · 기준 미달 660건\n"}, {"date": "2026-10-02", "markdown": "# 2026-10-02 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘자 후보군은 강남·용산 중심의 시황·하락거래 기사가 다수였지만, 노원구 안에서는 거래량·증여·정비사업이 동시에 움직이는 모습이 뚜렷했다. 상계동에서는 민간 재건축(상계한신3차 정비구역지정)과 LH 주도 공공주택 복합사업(수락산역 예정지구)이 같은 생활권에서 별도 트랙으로 진행되고 있고, 인접한 월계동 미미삼은 공사비 상승에 따른 분담금 우려가 제목 차원에서 제기됐다. 노원구 상계주공 단지의 증여 거래 증가도 함께 포착돼, 재건축 기대감이 매매보다 자산 이전 쪽으로도 번지는 정황이 보인다. 다만 오늘 후보 중 상계주공9단지를 직접 다룬 기사나 구체적 공사비·분담금 수치를 담은 기사는 없었다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] 대림·수락산역 도심복합 3207가구 예정지구 지정..당초보다 899가구 확...\n\n4th.kr · 2026-10-01 · [원문](http://4th.kr/news/articleView.html?idxno=2119055)\n\nLH가 노원구 상계동 1105-75번지 일원(2만7921㎡) 수락산역 인근과 구로구 대림역 인근을 도심 공공주택 복합사업 예정지구로 지정·공고했다. 수락산역 인근에는 1191가구가 들어서며, 2022년 후보지 선정 당시 698가구에서 493가구(약 39%) 늘어난 규모다. LH는 지정일로부터 1년 이내 토지등소유자 3분의 2 이상, 토지면적 2분의 1 이상의 동의를 확보해야 본지구 지정 절차로 넘어간다.\n\n**정책 포인트**\n\n- 예정지구 지정은 최종 확정이 아니며, 1년 내 토지등소유자 3분의 2 이상·토지면적 2분의 1 이상 동의를 확보해야 본지구 지정 및 중앙토지수용위원회 심의로 이어진다.\n\n*왜 골랐나*: 노원구 상계동 내에서 공공주도 역세권 복합개발이 예정지구 단계로 공식 진입한 구체적 진행 상황이라 우선 반영했다.\n\n### 2. 🔴 [노원구] 서울 재개발·재건축, 정비구역 지정·조합설립 '속도전'\n\n파이낸셜뉴스 · 2026-10-01 · [원문](https://fnnews.com/news/202610011835055926)\n\n노원구 상계한신3차가 정비계획 입안제안 이후 11개월 만에 정비구역 지정 및 정비계획 결정을 서울시에 요청했다. 용적률 299.93%를 적용해 최고 35층, 464가구 규모로 재건축하는 내용이며, 상계권역에서 신속통합기획 자문을 통해 정비구역 지정 요청까지 진행된 첫 사례로 소개됐다. 인근 상계한신1·2차도 정비계획 입안 절차를 밟고 있다.\n\n**정책 포인트**\n\n- 신속통합기획을 활용해 정비구역 지정까지 걸리는 기간이 단축되는 사례가 늘고 있으며, 상계한신3차가 상계권역 첫 사례로 소개됐다.\n\n*왜 골랐나*: 노원구 상계권역 재건축 사업지의 정비구역 지정 절차가 구체적 수치(용적률·층수·가구수)와 함께 진척됐음을 보여줘 우선 반영했다.\n\n### 3. 🔴 [노원구] 강북 재건축 대장 월계 '미미삼', 59㎡ 12억…5억대 분담금 더 뛰나\n\n땅집고 · 2026-10-01 · [원문](https://realty.chosun.com/site/data/html_dir/2026/10/01/2026100101574.html)\n\n노원구 월계동 '미미삼'(미성·미륭·삼호3차) 재건축이 사업시행인가 단계에서 최고 50층, 6103가구 규모로 추진되며 용적률 500%가 적용된다. 국토부 실거래가 기준 전용 59㎡는 지난해 2월 7억8000만원에서 올해 8월 12억원으로 올라 신고가를 기록했다. 제목에서는 공사비 상승에 따라 분담금이 5억대까지 늘어날 수 있다는 우려가 제기됐지만, 본문에서 이 금액의 종전 면적·신청 평형 등 산출 기준은 확인되지 않는다.\n\n> ⚠️ 제목의 '5억대 분담금'은 본문에서 종전 보유 면적과 신청 평형이 확인되지 않아 누구 기준인지 알 수 없습니다. 같은 단지라도 보유 면적에 따라 분담금은 달라집니다.\n> ⚠️ 59㎡ 실거래가 12억원은 매매 시세이지 분담금 산출의 근거가 되는 종전자산 감정평가액이 아닙니다. 두 수치를 같은 선상에서 보지 않아야 합니다.\n> ⚠️ 현재 사업시행인가 단계이므로 분담금은 아직 추정 단계의 수치입니다. 관리처분인가에서 종전자산 평가와 비례율이 확정되면 바뀔 수 있습니다.\n\n*왜 골랐나*: 노원구 대규모 재건축 단지에서 공사비 상승에 따른 분담금 증가 우려가 제기된 사업 진척 보도라 선정했다.\n\n### 4. 🔴 [노원구] 매매는 주춤·물려주기는 급증…서울 아파트 증여 2배 늘었다\n\n데일리안 · 2026-10-02 · [원문](https://dailian.co.kr/news/view/1696908?sc=Naver)\n\n8월 서울 아파트 증여 거래가 1036건으로 전년 동월 대비 126.7% 늘어난 가운데, 노원구 증여는 130건으로 441.7% 급증해 자치구 중 가장 가파른 증가세를 보였다. 올해 1~6월 집계에서는 노원구 상계주공이 95건의 증여로 서울 단지 중 두 번째로 많았다(1위는 목동신시가지 102건). 재건축 추진 단지를 중심으로 향후 자산가치 상승을 기대한 사전 증여 수요가 반영된 것으로 풀이된다.\n\n*왜 골랐나*: 상계주공 단지의 증여 거래가 서울 내 2위를 차지했다는 구체적 수치가 담긴 노원구 우선 기사라 선정했다.\n\n### 5. 🔴 [광운대역세권] 집이 건강 챙기고 로봇이 쓰레기 수거…아이파크 'AI 주거' 확대\n\n뉴스1 · 2026-09-30 · [원문](https://news1.kr/realestate/general/6306227)\n\nIPARK현대산업개발이 노원구 광운대역세권 서울원 복합단지에 2개 동, 768가구 규모의 'AI 주거' 단지를 직접 보유·운영 방식으로 공급한다. 의료·커뮤니티·스마트 서비스를 연계한 라이프 케어 모델이 적용된다고 소개됐다. 본문이 확보되지 않아 분양가·운영비 등 비용 수치는 확인되지 않는다.\n\n*왜 골랐나*: 상계주공9단지 인접 생활거점인 광운대역세권에서 새로운 주거 서비스 모델이 공급되는 소식으로, 생활권 변화 추적 차원에서 선정했다.\n\n## 인사이트\n\n- 상계한신3차가 노원구 상계권역 첫 신속통합기획 기반 정비구역 지정 요청 사례로 소개됐다. 최근 90일 정비구역지정 단계 조합원분양가 벤치마크(중앙값 8억1400만원·세대 총액, 표본 3건)는 모두 상계한신3차 사례로 구성돼 있어, 향후 공식 분양가 발표 시 이 범위와 비교할 수 있는 기준점이 된다.[1]\n- 9월 서울 토지거래허가 신청 건수는 노원구가 479건으로 자치구 중 가장 많아, 외곽 지역으로의 매수세 쏠림이 노원 전역의 재건축 단지 거래심리에도 영향을 줄 수 있는 배경으로 읽힌다.[2]\n- 노원구 증여 거래 증가율(441.7%)은 서울 25개 자치구 중 가장 가팔랐고, 상계주공은 올 상반기 단지별 증여 건수 서울 2위를 기록했다. 매매 위축 국면에서 재건축 기대 자산을 자녀에게 사전 이전하려는 수요가 노원구에서 특히 두드러진다.[3]\n- LH의 수락산역 예정지구 지정은 민간 재건축과 별개로 노원구 상계동 생활권에 공공주도 주택공급(1191가구)이 추가되는 트랙이다. 같은 생활권에서 민간 정비사업(상계한신3차)과 공공복합사업이 동시에 진행되는 구도가 만들어지고 있다.[1][4]\n\n## 오늘의 개념\n\n### 도심 공공주택 복합사업\n\n민간 정비사업만으로는 개발이 어려운 역세권·노후 저층주거지를 LH 등 공공이 주도해 수용·현물보상 방식으로 개발하는 사업이다. 예정지구 지정 이후 1년 내 토지등소유자 3분의 2 이상과 토지면적 2분의 1 이상의 동의를 확보해야 본지구 지정으로 넘어간다.\n\n*오늘*: 노원구 상계동 수락산역 인근이 이 사업의 예정지구로 지정되면서, 민간 재건축과는 별개로 공공주도 주택공급이 같은 생활권에서 동시에 진행된다.[4]\n\n### 신속통합기획\n\n서울시가 정비사업 초기 단계인 정비계획 수립을 지원해 정비구역 지정까지 걸리는 기간을 단축하는 제도다. 후보지 선정 이후 자문 절차를 거쳐 정비계획안을 마련하고 정비구역 지정으로 이어진다.\n\n*오늘*: 노원구 상계한신3차가 상계권역에서 신속통합기획 자문을 통해 정비구역 지정을 요청한 첫 사례로 소개됐다.[1]\n\n## 참고 원문\n\n1. 서울 재개발·재건축, 정비구역 지정·조합설립 '속도전' — 파이낸셜뉴스 · [원문](https://fnnews.com/news/202610011835055926)\n2. 깊어지는 서울 아파트 거래절벽…두 달째 거래량 ‘반토막’[집슐랭] — 서울경제 · [원문](https://sedaily.com/article/20096270)\n3. 매매는 주춤·물려주기는 급증…서울 아파트 증여 2배 늘었다 — 데일리안 · [원문](https://dailian.co.kr/news/view/1696908?sc=Naver)\n4. 대림·수락산역 도심복합 3207가구 예정지구 지정..당초보다 899가구 확... — 4th.kr · [원문](http://4th.kr/news/articleView.html?idxno=2119055)\n\n## 오늘 흘려보낸 것\n\n중복 91건 · 후속보도 신규정보 없음 0건 · 기준 미달 758건\n"}, {"date": "2026-10-01", "markdown": "# 2026-10-01 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 상계주공9단지·6단지의 공사비·분담금 관련 새 수치는 나오지 않았고, 서울 전체 거래절벽 속에서도 노원구가 토지거래허가 신청과 10억원 이하 거래 양쪽에서 1위를 지키는 흐름이 두드러졌다. 상계주공6·7단지는 실거래 최고가 경신이 이어지며 매수세가 꺾이지 않고 있음을 보여준다. 동시에 광운대역세권 '서울원'을 중심으로 노원구 인접 생활권에서 의료시설 결합형 복합개발과 월계시영 재건축 연계 구상이 잇따라 제시돼, 9단지 주변 생활환경의 중장기 변화 요인으로 지켜볼 지점이다. 공공재개발 이차보전 확대는 창동 등 인접 지역에 적용되지만 민간 재건축인 9단지에는 해당하지 않는다는 점은 구분해 읽을 필요가 있다.\n\n## 선별 5건\n\n### 1. 🔴 [상계주공6·7단지] 서울 ‘10억 이하’ 거래 활발… ‘10월 공급’에 실수요 숨통 트일까\n\n서울신문 · 2026-09-29 · [원문](https://seoul.co.kr/news/economy/estate/2026/09/29/20260929030003?wlog_tag3=naver)\n\n국토부 실거래가 기준 올해 들어 9월 28일까지 서울 아파트 매매 중 10억원 이하 거래 비중이 55.9%로 늘었고, 노원구가 5557건(19.2%)으로 자치구 중 1위를 지켰다. 노원구 상계주공7단지 전용 49.94㎡가 9월 17일 7억8000만원에, 상계주공6단지 전용 58.01㎡가 9월 12일 8억4500만원에 각각 최고가로 거래됐다. 구로구 역시 재건축 추진 단지를 중심으로 거래가 활발했다.\n\n**이번에 새로 나온 것**: 상계주공7단지 49.94㎡ 7억8000만원, 상계주공6단지 58.01㎡ 8억4500만원의 구체적 최고가 거래가 새로 확인됐다.\n\n*왜 골랐나*: 상계주공6·7단지의 실거래 최고가가 새로 확인돼 기존 거래량 집계(9월28일 보도)에 가격 정보를 더한 후속 사실이다.\n\n### 2. 🔴 [노원구] 세금 압박에 고금리도 부담…9월 토허신청 4000건 밑돌아\n\n서울경제 · 2026-09-29 · [원문](https://sedaily.com/article/20096233)\n\n8월 서울 아파트 거래량이 3466건으로 전월 대비 36.6% 줄었고, 9월 토지거래허가 신청도 3853건에 그쳐 거래절벽이 이어지고 있다. 이런 가운데 노원구는 9월 토허가 신청이 479건으로 서울 자치구 중 가장 많았다. 노원구 상계동 상계주공11단지 인근 중개업소는 '5억원 하던 물건이 7억원을 호가한다'며 5개월 새 30% 이상 오른 가격에 매수세가 주춤하고 있다고 전했다.\n\n*왜 골랐나*: 노원구가 거래절벽 속에서도 토허가 신청 1위를 지켰다는 점과 상계주공11단지의 단기 호가 상승을 구체적으로 짚은 기사다.\n\n### 3. 🔴 [창동] 3억 대출받으면 이자 600만원은 정부가 낸다…공공재개발 이주비 지원\n\n헤럴드경제 · 2026-10-01 · [원문](https://biz.heraldcorp.com/article/10890052)\n\n국토부가 HUG·LH·SH·GH와 함께 공공재개발사업 이차보전 협약을 개정해 이주비 대출까지 지원을 확대했다. 1주택 실거주자가 3억원 한도로 이주비 대출을 받으면 금리 1.8% 초과분 중 2%포인트까지 지원돼 연간 약 600만원의 이자 부담을 덜 수 있다. 2024~2025년 공공재개발 후보지로 추가된 도봉구 창동470 등도 사업비 이차보전 대상에 포함된다.\n\n**정책 포인트**\n\n- 공공재개발 이주비 대출 이차보전 확대: 1주택 실거주자 3억원 한도, 금리 1.8% 초과분 중 2%p 지원\n- 도봉구 창동470 등 2024~2025년 신규 후보지도 사업비 이차보전 대상에 포함\n- 이 제도는 공공재개발에 한정되며 민간 재건축 방식인 상계주공9단지에는 적용되지 않음\n\n*왜 골랐나*: 창동470이 이차보전 대상에 새로 포함돼 노원구와 맞닿은 창동 생활권 정비사업의 자금조달 여건에 영향을 줄 수 있는 정책 변화다.\n\n### 4. 🔴 [노원구] “강북 국평 전세 10억 시대”…최대 10년 안정거주 주거단지 보니\n\n매일경제 · 2026-09-29 · [원문](https://mk.co.kr/article/12163839)\n\n강북권 전용 84㎡ 전세가가 10억원대에 근접하는 가운데, 노원구 광운대역세권 복합개발사업 '서울원' 내 민간임대주택 '파크로쉬 서울원'이 대안으로 거론됐다. 보증금은 10억원대부터 책정되며 최대 10년간 동결, HUG 임대보증금 보증이 적용된다. 단지 내에는 서울아산병원 건강검진센터가 들어서고 노원을지대학교병원과 진료 연계 협약도 맺어졌다.\n\n*왜 골랐나*: 노원구 광운대역세권 복합개발에 의료 인프라가 결합되는 구체적 내용이 확인돼 노원구 생활권 변화로 포함했다.\n\n### 5. 🔴 [노원구] [IPARK현대산업개발, 창립 50주년 재도약] ① 서울원ㆍ미미삼 ‘아이파...\n\n대한경제 · 2026-09-29 · [원문](https://dnews.co.kr/uhtml/view.jsp?idxno=202609281119520210533)\n\nIPARK현대산업개발이 광운대역세권 복합개발 '서울원'에 이어 인접한 월계시영 '미미삼'(미성·미륭·삼호3차) 재건축까지 연계해 노원구 일대에 1만 가구 규모 '아이파크타운'을 구축하겠다는 구상을 밝혔다. 본문이 확보되지 않아 구체적 사업 방식과 시기는 확인되지 않는다.\n\n*왜 골랐나*: 노원구 인접 대규모 복합개발 구상이 처음 보도돼, 9단지가 속한 상계 생활권의 향후 개발축 변화 가능성을 짚을 수 있는 기사다.\n\n## 인사이트\n\n- 노원구는 9월 토지거래허가 신청이 479건으로 서울 자치구 중 가장 많아, 전체 거래량이 급감하는 와중에도 매수 문의가 몰리는 지역으로 나타났다.[1][2]\n- 상계주공7단지·6단지는 각각 전용 49.94㎡가 7억8000만원, 전용 58.01㎡가 8억4500만원에 최고가로 거래되며 9월에도 신고가 흐름이 이어졌다.[3]\n- 이번에 확대된 공공재개발 이주비 이차보전은 창동470 등 공공재개발 후보지에 적용되는 제도로, 민간 재건축 방식인 상계주공9단지에는 직접 적용되지 않는다.[4]\n- 광운대역세권 복합개발 '서울원' 내 민간임대주택에 서울아산병원 건강검진센터가 들어서는 등 의료 인프라가 결합되는 점은 노원구 생활권 전반의 인프라 수준과 맞물려 지켜볼 요소다.[5]\n- IPARK현대산업개발은 서울원과 인접한 월계시영 '미미삼' 재건축을 연계해 노원구 일대에 1만 가구 규모 '아이파크타운'을 구상하고 있다고 밝혔으나, 이는 사업자 측 구상 단계로 확정된 계획은 아니다.[6]\n\n## 오늘의 개념\n\n### 이차보전\n\n이차보전은 정부가 대출 이자의 일정 구간을 지원해 차주의 실질 부담을 낮춰주는 제도다. 오늘 기사에서는 공공재개발 이주비 대출에 대해 금리 1.8% 초과분 중 2%포인트까지 지원한다는 내용이 확인됐다. 3억원을 연 4.8% 금리로 빌리면 연간 약 600만원의 이자를 정부가 대신 부담하는 구조다.\n\n*오늘*: 국토부가 이 지원을 창동470 등 신규 공공재개발 후보지까지 넓히기로 했는데, 상계주공9단지 같은 민간 재건축 사업장에는 적용되지 않는 제도라는 점을 구분해야 한다.[4]\n\n### 실거주 의무 유예\n\n토지거래허가구역에서 주택을 매수하면 원칙적으로 일정 기간 실거주해야 하는데, 세입자가 거주 중인 주택을 매수하는 경우에는 세입자의 계약 기간이 끝날 때까지 이 의무를 미뤄주는 조치다. 오늘 기사에서는 이 유예 기한이 내년 말까지 연장된다고 확인됐다.\n\n*오늘*: 노원구가 9월 토지거래허가 신청 건수 1위를 기록한 지역인 만큼, 이 유예 연장이 노원구 매수 심리에 직접 영향을 줄 수 있는 변수로 언급됐다.[1]\n\n## 참고 원문\n\n1. 세금 압박에 고금리도 부담…9월 토허신청 4000건 밑돌아 — 서울경제 · [원문](https://sedaily.com/article/20096233)\n2. 깊어지는 서울 아파트 거래절벽…두 달째 거래량 ‘반토막’[집슐랭] — 서울경제 · [원문](https://sedaily.com/article/20096270)\n3. 서울 ‘10억 이하’ 거래 활발… ‘10월 공급’에 실수요 숨통 트일까 — 서울신문 · [원문](https://seoul.co.kr/news/economy/estate/2026/09/29/20260929030003?wlog_tag3=naver)\n4. 3억 대출받으면 이자 600만원은 정부가 낸다…공공재개발 이주비 지원 — 헤럴드경제 · [원문](https://biz.heraldcorp.com/article/10890052)\n5. “강북 국평 전세 10억 시대”…최대 10년 안정거주 주거단지 보니 — 매일경제 · [원문](https://mk.co.kr/article/12163839)\n6. [IPARK현대산업개발, 창립 50주년 재도약] ① 서울원ㆍ미미삼 ‘아이파... — 대한경제 · [원문](https://dnews.co.kr/uhtml/view.jsp?idxno=202609281119520210533)\n\n## 오늘 흘려보낸 것\n\n중복 56건 · 후속보도 신규정보 없음 1건 · 기준 미달 757건\n"}, {"date": "2026-09-30", "markdown": "# 2026-09-30 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 새로운 분담금·공사비 수치보다 노원구 재건축 사업의 절차적 진전과 제도 환경 변화가 두드러졌다. 상계주공7단지를 포함해 노원구 여러 단지가 최근 석 달 새 잇따라 추진위원회 승인을 받았고, 서울시는 높이 규제 단지의 공공기여 부담을 낮추는 방향으로 기본계획 변경을 추진 중이다. 창동차량기지 인근 S-DBC 구상은 노원 생활권의 일자리 기반 변화를 예고하지만 아직 초기 단계다. 반면 노원구 거래량·가격 상승을 다루는 시황성 기사가 다수 반복 보도됐는데, 상당수가 이미 알려진 순위·건수 데이터를 재확인하는 수준이라 새 정보로 보기 어려웠다.\n\n## 선별 4건\n\n### 1. 🔴 [노원구] 노원구 일대 재건축 추진위원회 승인 잇따라\n\n한국주택경제신문 · 2026-09-30 · [원문](https://arunews.com/news/articleView.html?idxno=67505)\n\n노원구가 최근 석 달 새 5개 단지에서 재건축 조합설립추진위원회 승인을 잇달아 고시했다. 이번 달에는 하계미성(3일), 상계주공7단지(10일), 중계주공4단지(17일), 상계마들대림(23일)이 매주 승인을 받았다. 상계주공7단지는 토지등소유자 2,596명 중 1,729명이 동의해 동의율 66.6%를, 중계주공4단지는 71.59%를 기록했다. 노원구는 '재건축쾌속추진TF'를 통해 인허가 지원과 행정절차 병행을 이어가고 있다고 밝혔다.\n\n**정책 포인트**\n\n- 조합설립추진위원회 승인을 위한 토지등소유자 과반수 동의 기준을 크게 웃도는 사례가 잇따름\n- 노원구 '재건축쾌속추진TF'가 인허가 지원 및 행정절차 병행으로 사업기간 단축을 지원\n- 10월부터 '노원 재건축·재개발 NOW ON'을 통해 사업 진행 상황을 실시간 공개할 예정\n\n*왜 골랐나*: 노원구 관내 여러 단지의 재건축 절차가 실제로 진전되고 있음을 보여주는 직접 소식이라서 최우선으로 선정했다.\n\n### 2. 🔴 [노원구] 문화재 옆 강북 재건축 탄력 … 용적률·공공기여 규제 푼다\n\n매일경제 · 2026-09-29 · [원문](https://mk.co.kr/article/12163961)\n\n서울시가 2030 도시·주거환경정비기본계획 변경을 통해 높이 규제를 받는 재건축 단지의 공공기여 부담을 낮추는 방안을 추진한다. 종상향으로 법적상한용적률이 늘어도 고도·경관지구나 국가유산 주변처럼 높이 제한으로 이를 다 쓰지 못하면 공공기여율을 절반 수준으로 낮추는 방식이다. 노원구는 월계삼호4차와 중계그린을 수혜 단지로 꼽았으며, 시뮬레이션 결과 월계삼호4차는 용적률이 약 10%포인트, 중계그린은 약 5%포인트 높아질 것으로 추산됐다.\n\n**정책 포인트**\n\n- 서울시가 높이규제 지역의 공공기여율을 낮추는 방향으로 기본계획 변경 추진\n- 공원·녹지 등 기부채납 시설에 대해 법적상한용적률까지 용적률 인센티브 인정 확대\n- 노원구가 시뮬레이션한 결과 월계삼호4차·중계그린이 수혜 단지로 거론됨\n\n*왜 골랐나*: 노원구 관내 단지의 사업성에 직접 영향을 줄 수 있는 서울시 제도 변경이고, 조합 수입 증가를 통한 분담금 경감 가능성이 명시적으로 제시돼서 선정했다.\n\n### 3. 🔴 [창동] 30일 ‘S-DBC 노원포럼’ 열린다\n\nsiminilbo.co.kr · 2026-09-28 · [원문](https://siminilbo.co.kr/news/newsview.php?ncode=1160281078082464)\n\n노원구가 서울테크노파크와 함께 30일 '제1회 S-DBC 노원포럼'을 열고 창동차량기지 일대에 조성되는 디지털바이오시티(S-DBC) 관련 산학연 생태계 구축 방안을 논의했다. S-DBC는 창동차량기지와 도봉면허시험장 부지 약 25만㎡에 조성되는 강북권 최대 규모의 디지털바이오 산업단지로, 2027년 창동차량기지 철거 착수와 함께 사업이 본격화될 전망이다. 포럼 논의 결과는 10월 중 보고서로 발간될 예정이다.\n\n**정책 포인트**\n\n- 창동차량기지·도봉면허시험장 부지(약 25만㎡)에 강북권 최대 디지털바이오 산업단지 조성 추진\n- 2027년 창동차량기지 철거 착수와 함께 사업 본격화 예정\n\n*왜 골랐나*: 창동차량기지 일대 산업단지 조성이 노원 생활권의 일자리 기반을 바꿀 수 있는 사업이고, 철거 착수 시점(2027년)까지 구체적으로 제시돼 검토 대상 이상의 진행 단계라서 선정했다.\n\n### 4. 🔴 [노원구] 서울 아파트 '신축 불패' 깨졌나…20년 넘은 구축이 더 올랐다\n\nppss.kr · 2026-09-28 · [원문](https://ppss.kr/news/articleView.html?idxno=312442)\n\n8월 기준 서울 20년 초과 노후 아파트 매매가격지수 상승률(1.21%)이 5년 이하 신축(0.88%)을 웃돌았다. 노원·도봉·강북·성북이 포함된 동북권 노후 아파트는 전월 대비 1.78% 올라 서울 권역 중 가장 높은 상승폭을 기록했다. 기사는 노원구 상계동 등을 중심으로 한 정비사업 추진 활발화를 노후 아파트 가격 상승의 배경으로 지목했다.\n\n*왜 골랐나*: 노원구 상계동의 재건축 추진 활성화가 노후 아파트 가격 상승의 동인으로 직접 지목된 기사라서 선정했다. 다만 비용 수치는 없다.\n\n## 인사이트\n\n- 노원구는 8월 상계보람을 시작으로 하계미성·상계주공7단지·중계주공4단지·상계마들대림까지 석 달 새 5개 단지가 추진위원회 승인을 받아, 구가 운영하는 '재건축쾌속추진TF'의 행정 지원이 실제 절차 속도로 이어지고 있다.[1]\n- 서울시의 공공기여 완화는 높이 규제로 법적상한용적률을 다 쓰지 못하는 단지를 겨냥한 조치로, 노원구는 월계삼호4차·중계그린을 수혜 단지로 시뮬레이션했다. 상계주공9단지가 유사한 높이 규제 대상인지는 기사에 언급되지 않아 적용 여부는 확인되지 않는다.[2]\n- 노원구 10억원 미만 거래 데이터에서는 상계주공9단지(151건)·6단지(149건)·7단지(137건) 순으로 거래가 집중돼 재건축 기대에 따른 '몸테크' 수요가 이어지고 있음을 보여주지만, 이는 거래량 지표일 뿐 분담금이나 공사비 산정과는 무관하다.[3][4]\n- S-DBC(창동차량기지 디지털바이오시티)는 2027년 철거 착수를 목표로 하는 초기 단계 사업으로, 아직 노원·상계 생활권에 대한 구체적 수혜 범위는 확인되지 않는다.[5]\n\n## 오늘의 개념\n\n### 공공기여(용적률 인센티브 연계)\n\n재건축·재개발에서 용도지역 종상향이나 용적률 확대를 받는 대가로 조합이 공원·도로 등 기반시설을 지방자치단체에 제공하거나 그 가치를 기부채납하는 것을 말한다. 통상 종상향으로 늘어난 용적률의 일정 비율을 공공기여율로 설정해 부담한다.\n\n*오늘*: 오늘 서울시가 높이 규제로 법적상한용적률을 다 쓰지 못하는 단지의 공공기여율을 낮추고, 기부채납 시설에 대한 용적률 인센티브를 확대하는 기본계획 변경을 추진한다고 보도됐다.[2]\n\n### S-DBC(서울디지털바이오시티)\n\n창동차량기지와 도봉면허시험장 부지 약 25만㎡에 조성되는 강북권 최대 규모의 디지털바이오 산업단지 구상이다. 대학·연구기관·기업이 함께하는 산학연 생태계 조성을 목표로 한다.\n\n*오늘*: 노원구가 오늘 서울테크노파크와 함께 '제1회 S-DBC 노원포럼'을 열어 산학연 협력 방안을 논의했다고 보도됐다.[5]\n\n## 참고 원문\n\n1. 노원구 일대 재건축 추진위원회 승인 잇따라 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=67505)\n2. 문화재 옆 강북 재건축 탄력 … 용적률·공공기여 규제 푼다 — 매일경제 · [원문](https://mk.co.kr/article/12163961)\n3. 서울서 10억 이하 아파트 어딨나... 5건 중 1건 '노원구' — insight.co.kr · [원문](https://insight.co.kr/news/575464)\n4. “10억 쥐고 서울 아파트 찾기”…5건 중 1건은 ‘이 동네’로 몰렸다 — 매일경제 · [원문](https://mk.co.kr/article/12163425)\n5. 30일 ‘S-DBC 노원포럼’ 열린다 — siminilbo.co.kr · [원문](https://siminilbo.co.kr/news/newsview.php?ncode=1160281078082464)\n\n## 오늘 흘려보낸 것\n\n중복 72건 · 후속보도 신규정보 없음 4건 · 기준 미달 644건\n"}, {"date": "2026-09-29", "markdown": "# 2026-09-29 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원구 내 개별 정비사업의 실질적 진척(상계2구역 관리처분인가 임박, 창동주공4·19단지 추진위 승인)이 두드러졌고, 여기에 창동차량기지 부지의 산업단지 조성 논의와 노원구 전세시장 압박이 겹치며 '재건축 이후의 노원'을 그리는 재료들이 함께 나왔다. 시장 전반은 강남권 재건축이 세제개편 여파로 조정받는 사이 노원구가 서울에서 가장 가파른 상승률을 기록했다는 보도가 여러 매체에서 반복됐지만, 이는 이미 알려진 흐름의 재확인에 가까워 이번 다이제스트에서는 비중을 낮췄다. 대신 실제 계약금액이 확인된 상계2구역과, 절차 간소화라는 제도적 변화가 확인된 창동주공 사례를 우선 다뤘다.\n\n## 선별 5건\n\n### 1. 🔴 [상계2구역] 상계2구역, 관리처분인가 임박…내년 4월 이주 시작\n\nMTN 머니투데이방송 · 2026-09-28 · [원문](https://news.mtn.co.kr/news-detail/2026092815493737512)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계2구역 | 총공사비 | 6,890억 4,523만원 | — |\n\n노원구 상계2재정비촉진구역이 관리처분계획 타당성 검증을 마치고 10월 8~20일 사이 관리처분인가를 받을 것으로 예상된다. 조합은 내년 4월 이주를 시작해 2028년 상반기 착공을 목표로 하며, 관리처분인가 이후에는 조합원 지위 양도에도 제한이 생긴다. 앞서 이달 8일 시공사인 대우건설·동부건설 컨소시엄과 체결한 공사도급계약 총액은 6890억원(대우건설 60%, 동부건설 40%)으로 확인됐다.\n\n> ⚠️ 이 6890억원은 시공사 도급계약 총액으로, 조합 전체 사업비 축의 숫자입니다. 조합원 개인이 부담하는 분담금과는 다른 축의 수치이니 이 금액을 세대 수로 나눠 자기 몫을 가늠하지 않으시길 바랍니다.\n> ⚠️ 기사에는 종전 자산 평가액이나 비례율, 조합원별 분담금이 나오지 않습니다. 관리처분인가 이후 확정되는 개별 분담금은 이 총공사비와 별도로 산정되는 값입니다.\n\n*왜 골랐나*: 노원구 상계2구역 사업이 최우선 지역 대상이고, 시공사 공사도급계약 총액이라는 실제 수치가 확인돼 선정.\n\n### 2. 🔴 [창동주공4단지] 도봉구, 창동주공4단지·19단지 재건축 추진위 승인\n\n아시아경제 · 2026-09-29 · [원문](https://view.asiae.co.kr/article/2026092907500244530)\n\n같은 사건 보도: jeonmae.co.kr\n\n도봉구 창동주공4단지(동의율 58%)와 19단지(동의율 56%)가 각각 신청 14일, 7일 만에 재건축 조합설립추진위원회 승인을 받았다. 구의 '동의서 사전검토' 제도와, 정비구역 지정과 조합설립 절차를 동시에 추진할 수 있게 한 법 개정이 속도를 높인 요인으로 꼽힌다. 두 단지는 서울시 신속통합기획 자문 절차를 밟으며 연내 정비계획 입안을 목표로 한다.\n\n**정책 포인트**\n\n- 구의 '동의서 사전검토' 제도로 추진위 승인 기간이 7~14일로 단축됨\n- 법 개정으로 정비구역 지정과 조합설립 절차를 동시에 추진할 수 있게 됨\n\n*왜 골랐나*: 창동은 노원구와 맞닿은 인접 생활권으로, 절차 간소화라는 제도 변화가 상계 사업장의 진행 속도에도 참고가 될 수 있어 선정.\n\n### 3. 🔴 [노원구] 노원구, S-DBC 중심 산학연 협력 논의…'제1회 S-DBC 노원포럼' 개최\n\nshinailbo.co.kr · 2026-09-28 · [원문](https://shinailbo.co.kr/news/articleView.html?idxno=5066166)\n\n노원구가 서울테크노파크와 함께 9월30일 '제1회 S-DBC 노원포럼'을 열고 창동차량기지 일대에 조성될 서울디지털바이오시티(S-DBC) 관련 산학연 협력 방안을 논의한다. S-DBC는 창동차량기지와 도봉면허시험장 부지 약 25만㎡에 들어서는 강북권 최대 규모 디지털바이오 산업단지로, 2027년 창동차량기지 철거 착수와 함께 사업이 본격화될 전망이다. 포럼 논의 결과는 10월 중 보고서로 발간된다.\n\n*왜 골랐나*: 창동차량기지 부지에 노원구 최대 규모 산업단지가 예정된 도시계획·일자리 이슈로, 상계 생활권의 수요 기반 변화 가능성이 있어 선정.\n\n### 4. 🔴 [노원구] “신축은 못 사겠고”… 몸테크 수요에 노후 아파트·빌라 고공행진\n\ndt.co.kr · 2026-09-28 · [원문](https://dt.co.kr/article/12086181)\n\n서울 준공 20년 초과 아파트 매매가격지수 상승률(7.29%)이 신축(4.45%)을 웃돌며 강북권 재건축 기대 매수세가 두드러졌다. 노원구 월계동 '미미삼(미륭·미성·삼호3차)' 전용 59㎡는 지난달 12억원에 신고가를 기록했으며, 올해 누적 거래량 155건으로 노원구 내 최다였다. 최근 정비계획이 통과된 강북구 번동주공1단지 전용 79.07㎡도 1년 새 1억5000만원가량 올랐다.\n\n*왜 골랐나*: 노원구 재건축 대어로 꼽히는 미미삼의 실거래 흐름과 인접 강북구 정비계획 통과 사례가 상계주공 몸테크 수요 판단에 참고가 돼 선정.\n\n### 5. 🔴 [노원구] [단독] 노도강도 '전세 10억' 시대 … '이재명표 평탄화'가 몰고온 서민...\n\nbiz.newdaily.co.kr · 2026-09-28 · [원문](https://biz.newdaily.co.kr/site/data/html/2026/09/28/2026092800065.html)\n\n노원구 중계동 '한화꿈에그린더퍼스트' 전용 121㎡가 전세보증금 10억원에 계약되며 신고가를 기록했고, '동진신안아파트'(11억원), '청구아파트'(10억원) 등도 잇따라 10억원대 전세 계약을 체결했다. 올해 노원구 내 전세보증금 10억원 이상 거래는 총 5건이며 이 중 4건이 8~9월에 집중됐다. 부동산 플랫폼 아실 기준 노도강 아파트 매물은 693건으로 1년 전 1358건 대비 49.0% 줄었다.\n\n**정책 포인트**\n\n- 다주택자 1주택 실거주 정책 이후 임대차 매물이 매매로 전환되며 노도강 전세 매물이 줄어듦\n\n*왜 골랐나*: 노원구 임대차 매물 급감과 전세가 급등이라는 생활비용 변화가 실수요·소유주 판단에 직접 영향을 미쳐 선정.\n\n## 인사이트\n\n- 상계2구역의 총공사비 6890억원은 조합 전체가 부담하는 사업비이며, 개별 조합원이 부담하는 분담금과는 다른 축의 수치라는 점을 구분해서 읽을 필요가 있다.[1]\n- 도봉구는 동의서 사전검토와 정비구역·조합설립 동시 추진을 허용한 법 개정 덕분에 창동주공4·19단지의 추진위 승인을 7~14일 만에 마쳤다. 같은 절차가 상계 사업장에도 적용되면 초기 단계 속도가 빨라질 여지가 있다.[2]\n- 노원구는 KB부동산 9월 통계에서 매매가격 상승률 2.32%로 서울 전 지역 중 가장 높았고, 상계주공7단지 전용 49㎡는 반년 새 1억3000만원 올라 7억8000만원에 거래됐다.[3][4]\n- 노원구 아파트 매물이 1년 새 49% 줄며 전세보증금이 10억원대까지 오르는 사례가 나타났다. 매물 잠김은 향후 이주·전세 계획을 세우는 소유주의 부담으로 이어질 수 있다.[5]\n- 창동차량기지 부지 약 25만㎡에 조성되는 S-DBC는 2027년 철거 착수를 목표로 하며, 노원 동북권 일자리·수요 기반 확충 계획의 일환으로 추진되고 있다.[6][7]\n\n## 오늘의 개념\n\n### 관리처분인가\n\n관리처분인가는 조합원 분양신청을 마친 뒤 확정되는 단계로, 이 인가를 기점으로 조합원별 권리가액·분담금 산정 기준이 구체화된다. 인가 이후에는 조합원 지위 양도에도 제한이 생기며, 이주와 철거 절차가 본격화된다.\n\n*오늘*: 상계2구역이 10월 관리처분인가를 앞두고 있고, 인가 이후 조합원 지위 양도 제한이 적용된다는 점이 기사에서 언급됐다.[1]\n\n### 정비구역 지정·조합설립 동시 추진\n\n종전에는 정비구역이 지정된 뒤에야 추진위원회 승인 등 조합설립 절차를 밟을 수 있었으나, 법 개정으로 두 절차를 동시에 진행할 수 있게 됐다. 이는 안전진단 통과 이후 사업 초기 단계의 소요 기간을 줄이는 효과를 낸다.\n\n*오늘*: 도봉구 창동주공4·19단지가 이 개정 덕분에 안전진단 통과 후 빠르게 추진위 승인을 받은 사례로 소개됐다.[2]\n\n## 참고 원문\n\n1. 상계2구역, 관리처분인가 임박…내년 4월 이주 시작 — MTN 머니투데이방송 · [원문](https://news.mtn.co.kr/news-detail/2026092815493737512)\n2. 도봉구, 창동주공4단지·19단지 재건축 추진위 승인 — 아시아경제 · [원문](https://view.asiae.co.kr/article/2026092907500244530)\n3. 노원 2.3% 뛸 때, 강남은 떨어졌다…서울 집값, ‘강남불패’ 뒤집나 [부... — 헤럴드경제 · [원문](https://biz.heraldcorp.com/article/10885896)\n4. '강남 하락·외곽 급등' 서울 집값 양극화…고가 단지 지수 4개월 만에 ... — 더구루 · [원문](https://theguru.co.kr/news/article.html?no=107606)\n5. [단독] 노도강도 '전세 10억' 시대 … '이재명표 평탄화'가 몰고온 서민... — biz.newdaily.co.kr · [원문](https://biz.newdaily.co.kr/site/data/html/2026/09/28/2026092800065.html)\n6. 노원구, S-DBC 중심 산학연 협력 논의…'제1회 S-DBC 노원포럼' 개최 — shinailbo.co.kr · [원문](https://shinailbo.co.kr/news/articleView.html?idxno=5066166)\n7. 30일 ‘S-DBC 노원포럼’ 열린다 — siminilbo.co.kr · [원문](https://siminilbo.co.kr/news/newsview.php?ncode=1160281078082464)\n\n## 오늘 흘려보낸 것\n\n중복 87건 · 후속보도 신규정보 없음 4건 · 기준 미달 455건\n"}, {"date": "2026-09-28", "markdown": "# 2026-09-28 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 후보군은 강남 재건축 하락과 서울 외곽 신고가를 대비시키는 시황성 기사, 그리고 동일한 부동산원 통계를 재탕한 '노후아파트 상승률 역전' 기사들이 다수를 차지했다. 정작 조합원이 참고할 만한 구체적 공사비·분담금 수치를 담은 기사는 드물었다. 그나마 상계주공6단지 기사가 전용 32㎡→84㎡ 분담금 7억6500만원을 종전 면적·신청 평형 전제와 함께 제시해 눈에 띄었다. 나머지 노원구 관련 보도는 거래량·실거래가 위주였고, 본문이 확보되지 않았거나 홍보·시황성에 그친 기사는 선별에서 제외했다.\n\n## 선별 2건\n\n### 1. 🔴 [상계주공6단지] 노원 상계동 재건축 속도…‘집값 웃도는 분담금’ 사업성 복병\n\n이투데이 · 2026-09-28 · [원문](https://etoday.co.kr/news/view/2629135)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계주공6단지 | 분담금 | 7억 6,500만원 | 32㎡ → 84㎡ · 조합원 |\n| 상계주공5단지 | 평당공사비 | 650만원/3.3㎡ | — |\n| 상계주공5단지 | 분담금 | 5억 | 전제 불명 — 참고용 |\n\n노원구 상계동에서 재건축·재개발 등 10개 정비사업이 진행 중인 가운데, 상계주공6단지 전용 32㎡ 소유자가 전용 84㎡를 신청할 경우 추가 분담금이 약 7억6500만원으로 추산됐다. 이는 같은 면적(32㎡)의 7월 평균 실거래가 5억250만원보다 약 2억6000만원 많은 금액이다. 상계주공5단지에서도 과거 3.3㎡당 약 650만원의 공사비를 기준으로 전용 84㎡ 분담금이 5억원을 웃돌 수 있다는 추산이 나온 바 있다.\n\n**이번에 새로 나온 것**: 기존 스레드는 '분담금 6억~7억원 거론' 수준이었으나, 이번 기사는 32㎡→84㎡ 기준 7억6500만원이라는 구체적 수치와 종전 실거래가 비교, 상계한신3차·상계보람아파트 등 인근 단지의 정비구역 지정 추진 현황까지 제시했다.\n\n> ⚠️ 7억6500만원은 상계주공6단지 전용 32㎡ 소유자가 84㎡를 신청할 경우의 분담금입니다. 보유 면적이나 신청 평형이 다르면 이 금액은 그대로 적용되지 않습니다.\n> ⚠️ 이 분담금이 어느 사업 단계(추진위원회 단계) 추정치인지, 어떤 비례율을 전제로 산출됐는지 기사에 나와 있지 않습니다. 관리처분인가 단계로 가면서 바뀔 수 있는 수치입니다.\n> ⚠️ 실거래가(5억250만원)와 분담금을 비교했지만 실거래가는 시세이고 분담금은 종전자산 감정평가액에 비례율을 적용한 권리가액을 기준으로 산출됩니다. 두 수치를 단순 비교해 '더 많이 낸다'고 단정하기 어렵습니다.\n> ⚠️ 상계주공5단지 분담금 5억원은 '과거' 3.3㎡당 650만원 공사비를 기준으로 한 추산이라고 명시돼 있습니다. 현재 공사비 기준이 아니므로 최신 수치로 오인하지 않아야 합니다. 이 추산 역시 종전 면적·신청 평형 전제가 기사에 없습니다.\n\n*왜 골랐나*: 상계주공6단지(노원구) 기사이며, 평형별 분담금 실수치가 종전 면적·신청 평형 전제와 함께 제시된 몇 안 되는 기사다.\n\n### 2. 🔴 [노원구] 서울서 10억 이하 아파트 어딨나…5건 중 1건 '노원구'\n\n뉴스1 · 2026-09-28 · [원문](https://news1.kr/realestate/general/6299276)\n\n같은 사건 보도: insight.co.kr\n\n서울에서 10억원 이하로 거래된 아파트 5건 중 1건이 노원구에서 나온 것으로 집계됐다. 개별 단지 기준으로는 상계주공9단지(151건), 상계주공6단지(149건), 상계주공7단지(137건) 순으로 거래가 많았다. 상계주공9단지는 전용 79㎡가 지난달 8억6500만원, 전용 58㎡가 지난달 7억1000만원에 거래됐다. 다만 본문이 확보되지 않아 세부 내용은 매체 요약에 근거했다.\n\n**이번에 새로 나온 것**: 기존 스레드는 상계주공7·10·3단지가 서울 전체 거래량 상위 10곳에 포함됐다는 내용이었으나, 이번 기사는 노원구 내 개별 단지별 거래 건수 순위(9·6·7단지)와 상계주공9단지의 실거래가를 추가로 제시했다.\n\n*왜 골랐나*: 노원구·상계주공 관련 기사로 최우선 편성 대상이며, 상계주공 개별 단지의 거래 건수와 실거래가가 구체적으로 제시됐다.\n\n## 인사이트\n\n- 상계주공6단지 84㎡ 신청 시 분담금이 7억6500만원으로 추산되며, 기사는 이 금액이 32㎡ 보유자의 7월 평균 실거래가(5억250만원)보다 약 2억6000만원 많다고 직접 명시했다.[1]\n- 상계주공5단지는 과거 3.3㎡당 약 650만원의 공사비를 기준으로 84㎡ 분담금이 5억원을 웃돌 수 있다는 추산이 나온 바 있어, 상계 일대에서도 단지별로 분담금 부담 수준이 이미 갈린다.[1]\n- 정비구역 지정을 신청한 상계한신3차는 최근 90일 벤치마크(조합원분양가·정비구역지정 단계) 표본에 포함돼 있으며, 해당 중앙값은 8억1400만원(세대 총액)이다 — 상계 일대 후속 사업장의 분양가 눈높이를 가늠할 참고선이 될 수 있다.[1]\n- 노원구가 포함된 동북권은 8월 20년 초과 노후 아파트 매매가격 지수가 전월 대비 1.78% 올라 서울 권역 중 가장 큰 상승폭을 기록했고, 이는 재건축 기대감이 매매가에 선반영된 결과로 분석된다.[2]\n\n## 오늘의 개념\n\n### 권리가액\n\n종전 소유 주택의 감정평가액(종전자산평가액)에 비례율을 적용해 산출하는 금액으로, 조합원 분양가에서 이 권리가액을 뺀 차액이 추가 분담금이 된다. 총사업비가 늘어 비례율이 낮아지면 권리가액이 줄어 분담금 부담이 커지는 구조다.\n\n*오늘*: 상계주공6단지의 84㎡ 분담금 7억6500만원이 어떻게 산정되는지 설명하는 맥락에서 언급됐다.[1]\n\n### 대지지분\n\n아파트나 빌라 소유자가 보유한 대지(토지) 지분으로, 정비사업에서 종전자산 평가와 권리가액 산정에 영향을 미친다. 같은 전용면적이라도 대지지분이 클수록 정비사업 수익성 측면에서 유리하게 평가되는 경향이 있다.\n\n*오늘*: 성산동 재개발구역 사례에서 대지지분 8.57평이 '평균 이상의 양호한 조건'으로 언급되며 조합원 추가분담금 부담을 낮출 수 있는 요인으로 소개됐다.[3]\n\n## 참고 원문\n\n1. 노원 상계동 재건축 속도…‘집값 웃도는 분담금’ 사업성 복병 — 이투데이 · [원문](https://etoday.co.kr/news/view/2629135)\n2. 강북 재건축이 끌어올린 노후아파트 집값…신축보다 더 올랐다 — 동아일보 · [원문](https://donga.com/news/Economy/article/all/20260927/134737003/1)\n3. \"양현석 보고 배웠다\"…미키광수, 밥 한 끼 사고 산 2.5억 빌라, 20억 아... — 파이낸셜뉴스 · [원문](https://fnnews.com/news/202609280912452087)\n\n## 오늘 흘려보낸 것\n\n중복 11건 · 후속보도 신규정보 없음 2건 · 기준 미달 144건\n"}, {"date": "2026-09-27", "markdown": "# 2026-09-27 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 상계주공·목동에서 평당공사비나 분담금 같은 세대 단위 비용 수치가 새로 나온 기사가 없었다. 대신 두 지역의 증여 등기가 서울에서 가장 많이 늘었다는 통계와, 노원구가 포함된 동북권이 재건축 기대감을 타고 서울 전 권역 중 가장 큰 매매가 상승폭을 기록했다는 소식이 두드러졌다. 증여로 소유권을 넘기면 투기과열지구 내 조합원 지위를 잃을 수 있다는 법적 리스크도 같은 흐름에서 확인된다. 다만 오늘 후보 기사 중 실제 공사비·분담금 수치를 담은 기사는 확인되지 않아, 다음 보도를 기다려야 한다.\n\n## 선별 2건\n\n### 1. 🔴 [상계주공, 노원구] 재건축 앞둔 '목동·상계' 증여 급증…서울 증여 15% 늘어\n\n뉴시스 · 2026-09-27 · [원문](https://newsis.com/view/NISX20260923_0003802520)\n\n올해 상반기 서울 아파트 증여 등기가 3548건으로 전년 동기(3083건) 대비 15.1% 늘었고, 같은 기간 매매 거래는 5.9% 줄었다. 단지별로는 목동신시가지아파트가 102건으로 서울에서 가장 많았고, 노원구 상계주공아파트가 95건으로 뒤를 이었다. 전문가들은 재건축에 따른 가치 상승 기대와 양도세 대비 증여의 세제상 유리함을 배경으로 꼽았다.\n\n*왜 골랐나*: 상계주공과 노원구가 언급된 우선순위 지역 기사로, 구체적 비용 수치는 없지만 최우선 원칙에 따라 선정했다.\n\n### 2. 🔴 [노원구] 서울 아파트는 신축보다 재건축…20년 초과, 매매가 상승폭 압도\n\n연합뉴스 · 2026-09-25 · [원문](https://yna.co.kr/view/AKR20260924031200003?input=1195m)\n\n같은 사건 보도: news.sbs.co.kr, getnews.co.kr\n\n8월 서울 20년 초과 아파트 매매가격 지수는 102.6으로 5년 이하 신축(101.9)보다 높았다. 노원·도봉·강북·성북구가 속한 동북권 지수는 7월 101.7에서 8월 103.6으로 1.78% 올라 서울 전 권역 중 상승폭이 가장 컸으며, 노원구 상계동 정비사업 본격화가 배경으로 지목됐다. 반대로 강남3구·강동구가 속한 동남권은 8·3 세제개편안 이후 압구정 현대·대치 은마 등 고가 재건축 단지에서 5억~10억원 낮춘 급매물이 등장하며 지수가 소폭 하락했다.\n\n*왜 골랐나*: 노원구 상계동이 서울 전 권역 중 가장 큰 매매가 상승폭을 기록한 최우선 지역 기사다.\n\n## 인사이트\n\n- 목동·상계 증여 급증의 이면에는 법적 리스크가 있다. 투기과열지구에서는 재건축 조합설립인가 이후 증여로 소유권을 넘기면 양수인이 조합원 지위를 취득하지 못할 수 있어, 증여 시점을 사업 단계와 맞춰봐야 한다.[1][2]\n- 같은 재건축 이슈라도 지역별 반응은 엇갈린다. 노원구를 포함한 동북권은 정비사업 기대감으로 매매가가 서울에서 가장 크게 올랐지만, 강남권 고가 재건축 단지는 8·3 세제개편안 이후 급매물이 늘며 가격이 눌렸다.[3]\n- 오늘 선별된 기사에는 평당공사비·분담금·조합원분양가 등 세대 단위 비용 수치가 하나도 없어, 최근 90일 벤치마크(예: 시공사선정공고 기준 평당공사비 중앙값 962만원)와 비교할 근거가 없다.[1][3]\n\n## 오늘의 개념\n\n### 조합원 지위 양도 제한\n\n투기과열지구에서는 재건축 조합설립인가 이후, 재개발은 관리처분인가 이후부터 새 아파트 소유권 이전 전까지 조합원 지위를 양도할 수 없다. 매매뿐 아니라 증여 같은 무상 거래도 '양도'에 포함돼, 이 기간에 지분을 넘기면 양수인은 조합원 지위를 얻지 못한다. 이혼·상속 등 부득이한 사유는 예외로 인정되지만, 상속인이 유사 단계의 다른 정비구역 주택을 이미 보유하면 재당첨 제한에 걸릴 수 있다.\n\n*오늘*: 목동·상계 등에서 증여가 급증한 오늘 기사와 맞물려, 증여 시점을 잘못 잡으면 조합원 지위 자체를 잃을 수 있다는 실질적 리스크를 짚어준다.[1][2]\n\n## 참고 원문\n\n1. 재건축 앞둔 '목동·상계' 증여 급증…서울 증여 15% 늘어 — 뉴시스 · [원문](https://newsis.com/view/NISX20260923_0003802520)\n2. “증여하다 물딱지”…투기과열지구 내 소유권 변동 신중해야[똑똑한부... — 이데일리 · [원문](https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=01928646645584056)\n3. 서울 아파트는 신축보다 재건축…20년 초과, 매매가 상승폭 압도 — 연합뉴스 · [원문](https://yna.co.kr/view/AKR20260924031200003?input=1195m)\n\n## 오늘 흘려보낸 것\n\n중복 7건 · 후속보도 신규정보 없음 2건 · 기준 미달 81건\n"}, {"date": "2026-09-26", "markdown": "# 2026-09-26 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 수집된 20건 중 상당수(14건)는 한국부동산원 연령별 매매가격지수를 인용한 동일한 '구축 아파트 반등' 기사로, 노원구 상계동을 재건축 기대감의 배경으로 언급했을 뿐 개별 사업장의 공사비·분담금·조합원분양가 같은 비용 수치는 담고 있지 않았다. 나머지는 주택연금, 전세난, 장기전세주택 청약, 신축 재개발 단지 실거래가, 건설사 서울 진출 전략 등으로 재건축 비용 판단과 직접 관련이 없었다. 상계주공·목동 기존 스레드에 대해서도 종전 사실 대비 새로운 공사비·분담금 정보를 제시한 기사가 없어 후속 보도로 올릴 만한 건이 없었다. 결과적으로 오늘은 '내 분담금이 얼마나 될지'를 가늠할 실제 수치 기사가 사실상 없는 날이었다.\n\n## 선별 0건\n\n오늘은 기준을 넘는 기사가 없었습니다 (수집 128건, 전부 기준 미달)\n\n## 인사이트\n\n- 노원구 상계동 등 강북권 재건축 추진 단지에 대한 기대감으로 동북권 20년 초과 아파트 매매가격지수가 한 달 새 1.78% 올라 서울 권역 중 가장 큰 상승폭을 기록했지만, 이는 매매가 동향일 뿐 개별 사업장의 공사비·분담금 수치는 오늘 보도에 없었다.[1][2][3]\n- 8·3 세제개편안 발표 이후 압구정동 현대아파트·대치동 은마아파트 등 초고가 재건축 단지에서 시세보다 5억~10억원 낮춘 급매물이 나오고 있다. 세제 변화가 사업 진행 상황과 무관하게 매도 심리를 흔든다는 신호다.[2]\n- 최근 90일 누적 통계에서 시공사선정공고 단계 평당공사비 중앙값은 962만원/3.3㎡(표본 14건)로 집계돼 있으나, 오늘 기사 중에는 이 수치와 비교할 만한 개별 사업장의 신규 평당공사비 보도가 없었다.\n\n## 참고 원문\n\n1. 신축보다 더 뛴 구축…서울 집값, 강북 재건축 ‘키 맞추기’ — 데일리안 · [원문](https://dailian.co.kr/news/view/1694537?sc=Naver)\n2. 서울 아파트는 신축보다 재건축…20년 초과, 매매가 상승폭 압도 — 연합뉴스 · [원문](https://yna.co.kr/view/AKR20260924031200003?input=1195m)\n3. “얼죽신 끝났나”…서울 20년 넘은 구축 상승률, 신축 추월 — 매일경제 · [원문](https://mk.co.kr/article/12161421)\n\n## 오늘 흘려보낸 것\n\n중복 8건 · 후속보도 신규정보 없음 1건 · 기준 미달 100건\n"}, {"date": "2026-09-25", "markdown": "# 2026-09-25 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원구 재건축 추진위 승인 소식과 공사비 검증제도 개선 논의를 빼면, 대부분 '20년 초과 노후아파트 상승률이 신축을 웃돌았다'는 한국부동산원 통계를 거의 동일하게 받아쓴 시황 기사들이 후보의 절반 가까이를 차지했다. 이런 기사들은 노원구·상계동을 상승 배경으로 지목하긴 하지만 분담금·공사비 같은 실제 수치가 없어 제외했다. 대신 상계주공7단지·중계주공4단지 등 노원구 개별 단지의 추진위 승인 절차 진전과, 공사비 검증을 받지 않은 사업장이 3년간 56곳에 달한다는 제도적 허점을 다뤘다. 조합원 관점에서 당장 분담금을 가늠할 새 수치는 오늘 없었지만, 검증제도 실효성 논쟁은 향후 공사비 증액 분쟁의 방향을 가늠하는 데 참고할 만하다.\n\n## 선별 2건\n\n### 1. 🔴 [노원구] [서울&amp;] 노원구, 높은 동의율 바탕 재건축 추진위 승인 잇따라\n\nseouland.com · 2026-09-24 · [원문](http://seouland.com/arti/economy/biznews/24379.html)\n\n노원구에서 토지등소유자 71.59% 동의를 얻은 중계주공4단지 추진위원회 구성이 승인·고시됐고, 상계마들대림도 승인 고시를 앞두고 있다. 앞서 상계주공7단지는 66.6% 동의율로 추진위 승인을 마쳤다. 구는 '재건축쾌속추진TF'를 통해 인허가 절차를 단축하고 있으며, 10월부터는 '노원 재건축·재개발 NOW ON'으로 정비사업 진행 현황을 실시간 공개할 예정이다.\n\n**정책 포인트**\n\n- 노원구가 '재건축쾌속추진TF'를 통해 인허가와 제도 개선을 지원해 사업 기간을 단축하고 있다.\n- 10월부터 '노원 재건축·재개발 NOW ON'을 통해 구청장과 주민이 정비사업 진행 현황을 실시간 확인할 수 있게 된다.\n\n*왜 골랐나*: 노원구·상계주공7단지 관련 소식으로 비용 수치는 없지만 우선순위 지역 기준에 따라 선정했다.\n\n### 2. 정비사업 공사비 검증 \"자율화보다 검증제도 대수술이 우선돼야\"\n\n하우징헤럴드 · 2026-09-23 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62981)\n\n서울시의 공사비 검증 자율화 조치를 두고, 현행 검증제도가 공사비 억제와 분쟁 종결에 실효성이 없었다는 지적이 나온다. 국회에서는 검증 의무를 이행하지 않은 사업시행자에게 500만원 이하 과태료를 부과하는 도시정비법 개정안이 발의됐다. 2022~2024년 법정 검증 대상인데도 검증을 받지 않은 사업장이 총 56곳으로 집계됐고, 한국부동산원이 검증한 공사비 23조원 중 실제 계약 반영 여부가 확인된 사례는 없는 것으로 알려졌다.\n\n**정책 포인트**\n\n- 허영 의원이 공사비 검증 의무 미이행 시 500만원 이하 과태료를 부과하는 도시정비법 개정안을 지난 3일 발의했다.\n- 2022~2024년 3년간 법정 검증 대상이면서도 검증을 받지 않은 사업장이 56곳으로 집계됐다.\n- 2022년부터 올해 8월까지 한국부동산원이 검증한 공사비는 23조원을 넘었지만, 검증 결과의 실제 계약 반영 여부를 사후 확인한 사례는 없다.\n\n*왜 골랐나*: 공사비 검증 의무화 관련 법 개정 논의로, 수치가 약해도 모든 재건축 사업장에 영향을 주는 제도 변화라 선정했다.\n\n## 인사이트\n\n- 한국부동산원이 2022~2024년 23조원 규모의 공사비를 검증했지만 그 결과가 실제 계약에 반영됐는지 사후 확인한 사례가 없다는 점은, 검증을 통과해도 조합원 분담금이 검증 금액과 다르게 확정될 여지가 있다는 뜻이다.[1]\n- 노원구에서는 상계주공7단지에 이어 중계주공4단지·상계마들대림이 잇따라 추진위 승인을 받으며 절차가 빨라지고 있지만, 이 단계에서는 아직 평당공사비나 분담금 같은 구체적 비용이 제시되지 않는다.[2]\n- 여러 매체가 8월 서울 20년 초과 노후아파트값 상승률(1.21%)이 신축(0.88%)을 웃돌았고 노원·도봉·강북구가 속한 동북권 상승폭이 서울 권역 중 가장 컸다고 전했는데, 이는 정비사업 기대감이 가격에 반영된 결과일 뿐 분담금 규모를 알려주는 수치는 아니다.[3]\n\n## 참고 원문\n\n1. 정비사업 공사비 검증 \"자율화보다 검증제도 대수술이 우선돼야\" — 하우징헤럴드 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62981)\n2. [서울&amp;] 노원구, 높은 동의율 바탕 재건축 추진위 승인 잇따라 — seouland.com · [원문](http://seouland.com/arti/economy/biznews/24379.html)\n3. 서울 아파트는 신축보다 재건축…20년 초과, 매매가 상승폭 압도 — 연합뉴스 · [원문](https://yna.co.kr/view/AKR20260924031200003?input=1195m)\n\n## 오늘 흘려보낸 것\n\n중복 29건 · 후속보도 신규정보 없음 0건 · 기준 미달 214건\n"}, {"date": "2026-09-24", "markdown": "# 2026-09-24 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 다이제스트는 두 갈래로 갈린다. 하나는 노원구가 상계주공7단지·중계주공4단지 등 추진위원회 승인을 매주 이어가며 인허가 절차를 앞당기는 흐름이고, 다른 하나는 오금동·목동·창동 등 서울 곳곳에서 평당공사비가 900만~1000만원대로 굳어지는 흐름이다. 강남권 하이엔드 단지에 국한됐던 '평당 1000만원'이 송파·양천·도봉 등 외곽 재건축 사업장으로 확산되는 모습이 수치로 확인된다. 여기에 서울시가 소규모주택정비사업 조합운영비 지원 방식을 손보고, 국토부가 노후 공공임대 재건축 계획을 구체화하면서 제도 측면의 변화도 함께 나타났다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] 노원구, 잇따른 재건축 추진위원회 승인…쾌속 추진 성과\n\n서울신문 · 2026-09-22 · [원문](https://seoul.co.kr/news/publicnews/local_govern/news_local/2026/09/22/20260922500075?wlog_tag3=naver)\n\n노원구가 중계주공4단지와 상계주공7단지의 재건축 조합설립추진위원회 구성을 잇달아 승인했다. 중계주공4단지는 토지등소유자 690명 중 494명이 동의해 71.59%, 상계주공7단지는 2,596명 중 1,729명이 동의해 66.6%의 동의율을 기록했다. 민선9기 출범 이후 상계보람·하계미성·상계주공7단지·중계주공4단지·상계마들대림까지 석 달 새 5개 단지가 추진위 승인을 받았다. 구는 '재건축쾌속추진TF'를 통해 인허가 지원과 행정절차 병행으로 사업기간 단축을 지원한다고 밝혔다.\n\n**정책 포인트**\n\n- 노원구 '재건축쾌속추진TF' 운영으로 추진위원회 승인이 매주 한 곳꼴로 이뤄지는 중\n- 10월부터 '노원 재건축·재개발 NOW ON' 홈페이지에서 사업 진행상황을 실시간 공개할 예정\n\n*왜 골랐나*: 노원구·상계주공7단지 관련 기사로 최우선 편입 대상이며, 인허가 속도가 향후 분담금 확정 시점에 영향을 준다.\n\n### 2. 강남 넘어 오금동도 공사비 3.3㎡당 1000만원 육박\n\n헤럴드경제 · 2026-09-23 · [원문](https://biz.heraldcorp.com/article/10883224)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 오금현대 | 평당공사비 | 962만원/3.3㎡ | — |\n| 오금현대 | 총공사비 | 1조 6,642억 | — |\n| 목동13단지 | 평당공사비 | 980만원/3.3㎡ | — |\n| 목동6단지 | 평당공사비 | 950만원/3.3㎡ | — |\n| 목동8단지 | 평당공사비 | 965만원/3.3㎡ | — |\n| 목동10단지 | 평당공사비 | 990만원/3.3㎡ | — |\n| 목동신시가지4단지 | 평당공사비 | 1,010만원/3.3㎡ | — |\n| 마천1구역 | 평당공사비 | 931만원/3.3㎡ | — |\n| 숙대입구역세권 | 평당공사비 | 930만원/3.3㎡ | — |\n\n송파구 오금동 '오금현대' 재건축조합이 평당 962만원, 총공사비 1조6642억원 규모로 시공사 선정 입찰공고를 냈다. 같은 시기 목동13단지 980만원, 목동6·8·10단지는 각각 950만원·965만원·990만원, 목동4단지는 1010만원을 제시해 목동 신시가지 중 처음으로 1000만원을 넘겼다. 용산구 숙대입구역세권과 송파구 마천1구역도 각각 930만원, 931만원을 내걸며 서울 곳곳에서 평당 공사비가 1000만원에 근접하고 있다.\n\n> ⚠️ 각 단지가 제시한 평당 공사비는 시공사 선정 입찰공고 단계에서 조합이 내건 금액으로, 실제 계약 체결이나 착공 시점에는 자재비·인건비 변동에 따라 달라질 수 있습니다.\n> ⚠️ 이 수치는 평당 공사비와 사업 전체 총공사비이지 조합원 한 명이 부담하는 분담금이 아닙니다. 오금현대의 총공사비 1조6642억원을 조합원 수로 나눠 개별 부담액을 짐작하지 마시기 바랍니다.\n\n*왜 골랐나*: 여러 사업장의 평당공사비 실수치를 한 기사에서 비교할 수 있어 분담금 가늠에 직접 참고할 수 있다.\n\n### 3. [단독] 창동주공19단지, 재건축 추진위 승인... 내년 상반기 조합 설립 ...\n\n매일경제 · 2026-09-23 · [원문](https://mk.co.kr/article/12160555)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 창동주공19단지 | 평당공사비 | 800만원/3.3㎡ | — |\n| 창동주공19단지 | 일반분양가 | 4,500만원/3.3㎡ | — |\n\n도봉구 창동주공19단지가 재건축 추진위원회 승인을 받아 지상 최고 49층, 2,933가구 규모로 재건축을 추진한다. 추진위는 공사비를 평당 800만원 안팎, 일반분양가는 평당 4500만원대로 예상하고 일반분양 비율을 44.1%까지 끌어올려 사업성을 확보하겠다는 계획을 세웠다. 내년 초 정비계획 확정, 내년 상반기 조합 설립을 목표로 한다.\n\n> ⚠️ 공사비 평당 800만원 안팎, 일반분양가 평당 4500만원대는 추진위원회 승인 단계에서 나온 예상치이며, 정비계획 확정과 조합 설립 이후 사업시행인가·관리처분 단계를 거치며 바뀔 수 있는 수치입니다.\n> ⚠️ 기사에는 종전 보유 면적이나 신청 평형에 대한 정보가 없어 이 수치로 개별 조합원의 분담금을 계산할 근거가 없습니다.\n> ⚠️ 일반분양가 4500만원은 평당 기준이며 세대 총액이 아닙니다.\n\n*왜 골랐나*: 추진위 단계부터 평당공사비와 일반분양가 추정치가 함께 제시된 사례라 분담금 가늠에 참고할 수 있다.\n\n### 4. 박이강 의원, 소규모주택 정비사업 지원 조례 발의…구청장 지원 근거 ...\n\n뉴스핌 · 2026-09-22 · [원문](https://newspim.com/news/view/20260922000324)\n\n서울시의회가 모아타운 등 소규모주택정비사업의 조합운영경비 지원 방식을 항목별 상한에서 총액 50% 범위 내 탄력 지원으로 바꾸는 조례 개정안을 통과시켰다. 구청장이 조합설립을 지원하는 데 드는 비용을 서울시가 자치구에 보조할 수 있는 근거도 새로 마련됐다. 서울시내 소규모주택정비사업은 977개소, 이 중 558개소가 조합 설립을 준비 중이다.\n\n**정책 포인트**\n\n- 조합운영경비 지원을 항목별 개별 상한 방식에서 총액 50% 범위 내 탄력 지원으로 개편\n- 구청장의 조합설립 지원 비용에 대한 서울시 보조 근거 신설\n- 서울시내 소규모주택정비사업 977개소 중 558개소가 조합설립 준비 중\n\n*왜 골랐나*: 조합운영비 지원 방식 변경은 소규모 정비사업장의 초기 비용 부담에 직접 영향을 주는 제도 변화다.\n\n### 5. 🔴 [노원구] [주거안정플랜, 다시 읽다] 31㎡가 36㎡ 되는 마법?…노후 공공임대, 허...\n\ndailypop.kr · 2026-09-23 · [원문](http://dailypop.kr/news/articleView.html?idxno=102824)\n\n국토교통부 주거안정플랜에 따라 준공 30년이 넘은 영구임대 1만3000호가 2030년까지 전면 재건축되며, 재건축 후에는 통합공공임대나 신설되는 보편형 임대로 유형이 바뀐다. 노원구에서는 상계마들이 2027년, 중계1단지가 2028년 착공 예정이며 세대수도 중계1단지 882→1370세대, 하계5단지 640→1336세대로 늘어난다. 기존 입주민의 임대료·입주자격 조정 폭 등 세부안은 아직 공개되지 않았다.\n\n**정책 포인트**\n\n- 준공 30년 초과 영구임대 1만3000호를 2030년까지 전면 재건축, 유형을 통합공공임대·보편형 임대로 전환\n- 노원구 상계마들(2027년 착공)·중계1단지(2028년 착공) 순차 진행 예정\n\n*왜 골랐나*: 노원구 상계마들·중계1단지가 포함된 정책 변화라 최우선 검토 대상이다.\n\n## 인사이트\n\n- 오금현대가 제시한 평당 962만원은 최근 90일 시공사선정공고 단계 평당공사비 중앙값(946.5만원/3.3㎡)보다 높다.[1]\n- 목동4단지의 평당 1010만원은 같은 벤치마크 범위의 상단(1,010만원/3.3㎡)과 일치한다.[1]\n- 오금현대 총공사비 1조6642억원은 최근 90일 시공사선정공고 단계 총공사비 중앙값(1조4,095억6,500만원)보다 높고, 범위 상단(2조137억원)에는 못 미친다.[1]\n- 노원구는 8월 이후 매주 한 단지꼴로 추진위원회를 승인하며 상계주공7단지·중계주공4단지 등의 인허가 절차를 앞당기고 있다.[2][3]\n- 서울시가 소규모주택정비사업 조합운영경비 지원을 총액 50% 범위의 탄력 지원으로 바꾸면서 모아타운 등 초기 사업장의 비용 부담 완화 여지가 생겼다.[4]\n\n## 오늘의 개념\n\n### 건설공사비지수\n\n한국건설기술연구원이 산출하는 건설 공사비 변동 추적 지수다. 지수가 오르면 시멘트·철근 등 자재비와 인건비 상승이 반영돼 실제 시공사 선정 협상에서 제시되는 평당공사비에 영향을 준다.\n\n*오늘*: 지난 7월 건설공사비지수가 138.59(잠정치)로 사상 최고치를 기록했다는 사실이 오금동·목동 등 여러 사업장의 평당공사비가 1000만원에 근접한 배경으로 함께 제시됐다.[1]\n\n## 참고 원문\n\n1. 강남 넘어 오금동도 공사비 3.3㎡당 1000만원 육박 — 헤럴드경제 · [원문](https://biz.heraldcorp.com/article/10883224)\n2. 노원구, 잇따른 재건축 추진위원회 승인…쾌속 추진 성과 — 서울신문 · [원문](https://seoul.co.kr/news/publicnews/local_govern/news_local/2026/09/22/20260922500075?wlog_tag3=naver)\n3. 노원구, 재건축 추진위 잇단 승인…주민 동의로 추진력 확보 — gukjenews.com · [원문](https://gukjenews.com/news/articleView.html?idxno=3702958)\n4. 박이강 의원, 소규모주택 정비사업 지원 조례 발의…구청장 지원 근거 ... — 뉴스핌 · [원문](https://newspim.com/news/view/20260922000324)\n\n## 오늘 흘려보낸 것\n\n중복 50건 · 후속보도 신규정보 없음 0건 · 기준 미달 455건\n"}, {"date": "2026-09-23", "markdown": "# 2026-09-23 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 노원구 뉴스는 두 갈래로 갈린다. 하나는 추진위원회 승인이 한 달 새 다섯 곳에서 이어지는 '속도전'이고, 다른 하나는 상계주공5·6단지 사례처럼 속도가 빨라도 분담금 부담이 줄지 않는다는 반론이다. 서울 전역에서는 오금현대·목동4단지 등 3.3㎡당 900만~1000만원대 공사비가 잇따라 제시되며 공사비 상승이 한강변 정비사업에 국한된 흐름이 아님을 보여준다. 모아타운 조례 개정은 재건축과는 결이 다르지만 소규모정비사업의 초기 자금난을 완화하는 방향의 제도 변화다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구·상계주공7단지] 노원 재건축 매주 승인… 중계주공4·상계마들대림도 시동\n\n서울신문 · 2026-09-23 · [원문](https://seoul.co.kr/news/publicnews/seoul_local/news_seoul/2026/09/23/20260923021005?wlog_tag3=naver)\n\n노원구가 8월 상계보람을 시작으로 9월 들어 하계미성(3일)·상계주공7단지(10일)·중계주공4단지(17일)·상계마들대림(23일 예정) 순으로 매주 조합설립추진위원회를 승인했다. 중계주공4단지는 토지등소유자 690명 중 494명이 동의해 71.59%, 상계주공7단지는 2596명 중 1729명이 동의해 66.6%의 동의율을 기록했다. 노원구는 '재건축쾌속추진TF'와 '스마트비전 시스템'을 통해 인허가 지원과 규제 개선을 병행하고 있으며 10월부터 진행 상황을 실시간 공개할 예정이다.\n\n**정책 포인트**\n\n- 노원구가 '재건축쾌속추진TF'를 통해 인허가 지원 및 규제 개선을 병행하며 추진위 승인 속도를 높이고 있다.\n- 10월부터 '노원 재건축·재개발 NOW ON' 홈페이지에서 각 사업장 진행 상황이 실시간 공개된다.\n\n*왜 골랐나*: 노원구·상계주공7단지 관련 소식으로, 비용 수치는 약하지만 최우선 지역 원칙에 따라 선정했다.\n\n### 2. 🔴 [상계주공5단지·상계주공6단지] \"빠르다고 능사 아니다\"…공사비 급등에 다시 짜는 상계동 재건축 지도\n\nnews2day.co.kr · 2026-09-22 · [원문](https://news2day.co.kr/article/20260921500283)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계주공5단지 | 분담금 | 5억 | 31㎡ → 84㎡ · 조합원 |\n\n상계동 일대 재건축 공사비가 3.3㎡당 700만~800만원대로 오르면서, 단순 인허가 속도보다 '초기 매수가+추가분담금'을 더한 총취득비용이 매수 판단 기준으로 부각되고 있다. 상계주공5단지는 기존 전용 31㎡ 단일 평형 조합원이 전용 84㎡를 배정받을 경우 5억원대 이상의 추가분담금이 책정돼 시공사 계약 해지 등 진통을 겪었다. 상계주공6단지는 노원역 초역세권으로 조합설립 단계에 들어섰지만 전용 59㎡ 매매가가 8억원 이상으로 형성돼 초기 진입 장벽이 높다고 전해졌다.\n\n> ⚠️ 5억원대 추가분담금은 전용 31㎡를 보유한 조합원이 전용 84㎡를 배정받는 경우를 전제로 한 금액입니다. 보유 면적이나 신청 평형이 다르면 분담금도 달라집니다.\n> ⚠️ 이 수치는 시공사 계약 해지와 사업계획 변경을 거치며 나온 값인데 기사에 현재 사업 단계가 명시돼 있지 않습니다. 조합설립 단계의 추정치인지 관리처분 단계의 확정치인지 확인이 필요합니다.\n\n*왜 골랐나*: 상계주공5단지 사례는 종전 면적(31㎡)과 신청 평형(84㎡)이 함께 제시된 드문 분담금 수치를 담고 있어 노원구 최우선 원칙과 수치 기준을 동시에 충족한다.\n\n### 3. “분양가 오를 수 밖에” 반포·압구정 아닌데 재건축 평당 공사비 1000...\n\n헤럴드경제 · 2026-09-23 · [원문](https://biz.heraldcorp.com/article/10883039)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 오금현대 | 평당공사비 | 962만원/3.3㎡ | — |\n| 오금현대 | 총공사비 | 1조 6,642억 | — |\n| 가락상아1차 | 평당공사비 | 705만원/3.3㎡ | — |\n| 방이대림 | 평당공사비 | 840만원/3.3㎡ | — |\n| 숙대입구역세권 | 평당공사비 | 930만원/3.3㎡ | — |\n| 마천1구역 | 평당공사비 | 931만원/3.3㎡ | — |\n| 목동13단지 | 평당공사비 | 980만원/3.3㎡ | — |\n\n송파구 오금동 '오금현대' 재건축조합이 시공사 선정 입찰 공고에서 3.3㎡당 962만원, 총공사비 1조6642억원을 제시했다. 인근 가락상아1차(2022년 705만원)·방이대림(지난해 초 840만원)과 비교하면 수년 새 공사비가 크게 뛴 것으로 나타났다. 용산 숙대입구역세권(930만원), 송파 마천1구역(931만원), 목동13단지(980만원) 등 서울 곳곳에서 3.3㎡당 900만~1000만원대 공사비가 잇따라 제시되고 있다.\n\n> ⚠️ 오금현대의 962만원은 시공사 선정 '입찰 공고' 단계에서 조합이 제시한 금액이고, 가락상아1차(705만원)·방이대림(840만원)은 시공사 선정이 이미 끝난 계약 금액입니다. 공고 단계 제시가와 선정 완료 가격은 성격이 달라 단순 비교로 '수년 새 크게 뛰었다'고 단정하기는 이릅니다.\n> ⚠️ 평당 공사비는 면적당 단가이고 총공사비 1조6642억원은 사업 전체 금액입니다. 두 수치 모두 개별 조합원이 내는 분담금과는 다른 축의 숫자이니 이걸로 내 분담금을 짐작하지 않으시는 게 좋습니다.\n\n*왜 골랐나*: 오금현대·가락상아1차·방이대림·숙대입구역세권·마천1구역 등 다수 단지의 평당공사비 실수치가 한 기사에 담겨 정보 밀도가 높다.\n\n### 4. '모아타운' 돈맥경화 풀린다… 서울시, 조합운영비 탄력 지원·공공지원...\n\nindustrynews.co.kr · 2026-09-21 · [원문](https://industrynews.co.kr/news/articleView.html?idxno=86370)\n\n서울시의회가 소규모주택정비사업 조례를 개정해 전자서명 동의서·온라인 총회 등 개별 항목별 50% 한도로 나뉘어 있던 자금 지원 규정을 '조합운영경비' 단일 항목으로 통합해 총액 50% 범위에서 탄력적으로 집행할 수 있게 했다. 구청장이 조합설립을 지원하는 비용을 서울시가 자치구에 보조할 수 있는 법적 근거도 신설됐다. 시내 소규모주택정비사업지 977개소 중 558개소(57%)가 조합설립을 준비 중이어서 초기 자금난을 겪는 사업장이 다수 수혜를 받을 전망이다.\n\n**정책 포인트**\n\n- 조합운영경비 지원을 개별 항목별 50% 한도에서 통합 항목 총액 50% 한도로 완화해 자금 집행 유연성을 높였다.\n- 구청장의 조합설립 지원비용에 대한 서울시 보조 근거가 신설돼 초기 자금난 사업장의 문턱이 낮아질 전망이다.\n\n*왜 골랐나*: 조합 초기 운영자금 지원 방식 변경은 수치는 없지만 모든 소규모 정비사업장의 자금 조달 여건에 영향을 주는 제도 변화다.\n\n### 5. 🔴 [노원구] 전국서 2030년까지 공적주택 119만가구 공급…생애주기별 주거 지원도 확...\n\n데일리안 · 2026-09-21 · [원문](https://dailian.co.kr/news/view/1693019?sc=Naver)\n\n같은 사건 보도: news.kbs.co.kr, 한국경제, imaeil.com 외 9곳\n\n국토교통부가 2030년까지 공적주택 119만가구(수도권 92만가구)를 공급하는 '주거안정플랜'을 발표했다. 노후 공공임대주택은 재건축·리모델링으로 개선되며, 노원구 중계1단지는 882가구에서 1370가구로, 하계5단지는 640가구에서 1336가구로 늘어난다. 역세권 등에 공급되는 '보편형 공공임대' 19만가구도 새로 도입된다.\n\n**정책 포인트**\n\n- 노후 공공임대주택(중계1단지·하계5단지 등)을 재건축·리모델링으로 개선해 가구수를 늘리는 계획이 포함됐다.\n- 역세권 등 선호입지에 넓은 면적의 '보편형 공공임대' 19만가구가 신설된다.\n\n*왜 골랐나*: 노원구 소재 노후 공공임대 재건축 계획이 구체적 가구수 변화와 함께 제시돼 최우선 지역 원칙에 따라 선정했다.\n\n## 인사이트\n\n- 오금현대 총공사비 1조6642억원은 최근 90일 시공사선정공고 단계 총공사비 범위(5,400억~2조137억) 안에 있고 중앙값(1조1549억3000만원)보다 높다.[1]\n- 상계주공5단지처럼 종전 면적과 신청 평형이 함께 제시된 분담금 사례는 드물어, 벤치마크 통계도 전제가 확인된 건만 남기고 2건을 제외했다.[2]\n- 노원구가 추진위원회 승인을 매주 이어가며 속도전을 벌이고 있지만, 같은 지역을 다룬 다른 기사는 속도보다 분담금 방어력이 매수 판단의 핵심이라고 지적해 상반된 시각을 보인다.[2][3]\n- 모아타운 조례 개정은 재건축 조합이 아닌 소규모주택정비사업 조합의 초기 자금 조달 문턱을 낮추는 방향이어서, 대단지 재건축의 분담금 문제와는 별개의 자금 지원 이슈다.[4]\n\n## 오늘의 개념\n\n### 재건축쾌속추진TF\n\n노원구가 재건축·재개발 인허가 절차를 신속히 처리하기 위해 운영하는 전담 조직이다. 인허가 지원, 규제 개선, 행정절차 병행 등을 통해 사업기간 단축을 지원한다.\n\n*오늘*: 노원구가 이 TF를 앞세워 한 달 새 상계주공7단지·중계주공4단지·상계마들대림 등 5개 단지의 추진위원회 승인을 연달아 처리했다.[3]\n\n### 모아타운\n\n노후 저층 주거지를 하나의 정비구역으로 묶어 가로주택정비사업 등 소규모 정비사업을 통합적으로 진행하는 서울시의 사업 모델이다.\n\n*오늘*: 서울시의회가 모아타운 등 소규모주택정비사업의 조합운영경비 지원을 확대하는 조례 개정안을 통과시켰다.[4]\n\n## 참고 원문\n\n1. “분양가 오를 수 밖에” 반포·압구정 아닌데 재건축 평당 공사비 1000... — 헤럴드경제 · [원문](https://biz.heraldcorp.com/article/10883039)\n2. \"빠르다고 능사 아니다\"…공사비 급등에 다시 짜는 상계동 재건축 지도 — news2day.co.kr · [원문](https://news2day.co.kr/article/20260921500283)\n3. 노원 재건축 매주 승인… 중계주공4·상계마들대림도 시동 — 서울신문 · [원문](https://seoul.co.kr/news/publicnews/seoul_local/news_seoul/2026/09/23/20260923021005?wlog_tag3=naver)\n4. '모아타운' 돈맥경화 풀린다… 서울시, 조합운영비 탄력 지원·공공지원... — industrynews.co.kr · [원문](https://industrynews.co.kr/news/articleView.html?idxno=86370)\n\n## 오늘 흘려보낸 것\n\n중복 76건 · 후속보도 신규정보 없음 0건 · 기준 미달 525건\n"}, {"date": "2026-09-22", "markdown": "# 2026-09-22 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원구 일대 재건축 추진위원회 승인이 잇따라 보도되며 사업 초기 단계 진행 상황이 두드러졌다. 상계주공7단지·중계주공4단지 등이 법정 동의율을 넘겨 추진위 구성을 마쳤고, 노원구는 10월부터 진행 상황 공개 시스템을 가동한다. 비용 수치가 뚜렷한 기사는 대전 지역 공사비 검증 보도 한 건으로, 검증 후 공사비가 최대 3.8배까지 늘어난 사례가 확인됐다. 목동 관련 신규 진전은 없어 기존 스레드 갱신은 없었고, 서울 아파트 증여·전세 관련 기사들은 시황성 정보로 판단해 제외했다.\n\n## 선별 4건\n\n### 1. 🔴 [상계주공7단지] 상계주공7단지 재건축사업, 추진위 승인\n\n하우징헤럴드 · 2026-09-21 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62971)\n\n노원구 상계주공7단지가 조합설립추진위원회 승인을 받아 정비계획 수립과 조합설립 준비에 속도를 내게 됐다. 지난 6월 정밀안전진단 D등급 판정 이후 약 3개월 만에 추진위 승인까지 마쳤으며, 토지등소유자 68.2%의 동의를 확보했다. 현재 검토 중인 정비계획안은 용적률 약 300%를 적용해 기존 21개동 2,634가구를 지상 최고 49층, 3,386가구로 재건축하는 내용을 담고 있다. 추진위는 2027년 초 정비구역 지정, 내년 상반기 조합설립인가를 목표로 한다.\n\n**정책 포인트**\n\n- 지난해 도시 및 주거환경정비법 개정으로 정비구역 지정 전에도 추진위원회 구성이 가능해져, 정비계획 수립과 추진위 운영을 동시에 진행할 수 있게 됐다.\n\n*왜 골랐나*: 노원구 상계주공7단지 소식은 최우선 지역 기준에 해당하며, 세대수·용적률·일정 등 사업 진행 상황이 구체적으로 제시돼 있다.\n\n### 2. 대전 정비사업 공사비, 검증 결과 평균 52.8%↑…검증 실효성 논란\n\ndaejonilbo.com · 2026-09-21 · [원문](https://daejonilbo.com/news/articleView.html?idxno=2302698)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 대전 중구 재개발 사업장 | 총공사비 | 375억 | — |\n| 대전 중구 재개발 사업장 | 총공사비 | 1,440억 | — |\n| 대전 중구 재개발 사업장 | 공사비증액률 | 284.6% | — |\n| 비수도권 정비사업 76곳 | 공사비증액률 | 46.6% | — |\n\n대전지역 정비사업장의 공사비가 한국부동산원 적정성 검증을 거친 뒤 평균 52.8% 높은 수준으로 산정됐다. 대전 중구의 한 재개발 사업장은 검증 전 375억원에서 검증 후 1,440억원으로 늘어 증가율이 284.6%에 달했다. 전국 비수도권 76곳 사업장의 사업장별 평균 인상률은 46.6%로 집계됐다. 검증 결과에 법적 구속력이 없어 조합원 추가 분담금 전가 우려가 커지고 있다는 지적이 나온다.\n\n**정책 포인트**\n\n- 공사비 검증 결과는 법적 구속력이 없고 사후 이행관리 절차도 없어, 조합이 수수료를 내고도 결과를 따르지 않을 수 있다.\n\n> ⚠️ 여기 나온 375억원·1,440억원은 사업장 전체의 총공사비이며, 개별 조합원이 부담하는 분담금이 아닙니다. 총공사비가 늘었다고 해서 조합원 1인당 분담금이 같은 비율로 늘어나는 것은 아닙니다.\n> ⚠️ 284.6% 증가율은 대전 중구의 특정 사업장 한 곳의 수치이고, 46.6%는 비수도권 76곳의 사업장별 평균입니다. 서로 다른 대상이니 같은 선상에서 비교하지 않아야 합니다.\n> ⚠️ 부동산원 검증 결과는 법적 구속력이 없다고 기사에 나와 있습니다. 즉 이 수치들은 최종 확정된 공사비가 아니라 검증 단계의 값입니다.\n\n*왜 골랐나*: 검증 전후 공사비 실수치가 명확히 제시돼 있고, 공사비 검증 제도의 실효성이라는 모든 정비사업장에 영향을 미치는 정책 이슈를 다뤘다.\n\n### 3. 🔴 [노원구] 노원구, 재건축 추진위 승인 잇따라…5개 단지 추진 속도 탄력\n\n아시아경제 · 2026-09-22 · [원문](https://view.asiae.co.kr/article/2026092209083218341)\n\n노원구에서 중계주공4단지(동의율 71.59%), 상계주공7단지(66.6%) 등 재건축 추진위원회 승인이 잇따르고 있다. 민선 9기 출범 이후 상계보람·하계미성·상계주공7단지·중계주공4단지·상계마들대림 등 5개 단지가 추진위 구성 절차를 밟았다. 구는 10월부터 '노원 재건축·재개발 NOW ON' 시스템을 통해 주민이 진행 상황을 실시간으로 확인할 수 있게 할 계획이다.\n\n**정책 포인트**\n\n- 노원구가 10월부터 정비사업 진행 상황을 실시간 공개하는 '노원 재건축·재개발 NOW ON' 시스템을 운영한다.\n\n*왜 골랐나*: 노원구 다수 단지의 추진위 동의율과 승인 일정이 구체적으로 제시된 최우선 지역 기사다.\n\n### 4. 🔴 [노원구] ‘좁고 낡은 임대’ 깬다…바닥 1등급·중형 40% 확대한 보편형 공공임...\n\nsegye.com · 2026-09-21 · [원문](https://segye.com/newsView/20260921513899?OutUrl=naver)\n\n국토부의 '주거안정플랜'에 따라 준공 30년이 지난 노후 영구임대 1만3,000호가 중대형 단지로 전면 재건축된다. 노원구 하계5단지 착공을 시작으로 2027년 상계마들, 2028년 중계1단지 순으로 재건축이 이어질 예정이다. 이는 공공임대 물량의 재건축으로, 조합원 분담금이 발생하는 민간 재건축 사업과는 별개 트랙이다.\n\n**정책 포인트**\n\n- 노후 영구임대 재건축은 공공주택 물량 확대 정책의 일환으로, 민간 재건축 조합의 분담금 구조와는 별도로 진행된다.\n\n> ⚠️ 이 재건축은 공공임대 물량을 대상으로 하며, 기사에도 조합원 분담금이 발생하는 민간 재건축과는 별개 트랙이라고 명시돼 있습니다. 하계5단지·상계마들·중계1단지 소유주라도 여기서 분담금을 유추할 수 없습니다.\n\n*왜 골랐나*: 노원구 소재 공공임대 단지의 재건축 일정이 구체적으로 제시돼 있어 지역 정비 흐름을 파악하는 데 참고가 된다.\n\n## 인사이트\n\n- 대전 중구 재개발 사업장의 공사비 증액률 284.6%는 최근 90일 벤치마크 공사비증액률 범위(46.6%~284.6%)의 상단에 해당한다.[1]\n- 비수도권 76곳 사업장의 평균 인상률 46.6%는 같은 벤치마크 범위의 하단에 위치해, 지역·사업장별 공사비 증액 폭 편차가 크다는 점을 보여준다.[1]\n- 노원구에서는 민선 9기 출범 이후 상계보람·하계미성·상계주공7단지·중계주공4단지·상계마들대림 등 5개 단지가 잇따라 추진위원회 승인을 받으며 재건축 초기 단계 속도가 빨라지고 있다.[2][3][4]\n- 노원구 내 노후 영구임대 재건축(하계5단지→상계마들→중계1단지)과 민간 재건축 추진위 승인이 같은 시기 동시에 진행되면서, 지역 정비사업 전반의 행정 절차가 겹쳐 진행되고 있다.[2][5][6]\n\n## 오늘의 개념\n\n### 조합설립추진위원회\n\n재건축 조합을 설립하기에 앞서 거치는 절차로, 도시 및 주거환경정비법에 따라 토지등소유자 과반수의 동의를 확보해야 구성할 수 있다. 승인 이후에는 주민공람과 설명회 등 후속 절차를 거쳐 조합설립인가로 이어진다.\n\n*오늘*: 노원구에서 상계주공7단지(66.6%)·중계주공4단지(71.59%) 등 5개 단지가 법정 동의율을 웃도는 동의로 잇따라 추진위 승인을 받으며 사업 초기 단계가 빨라지고 있다.[2][3][4]\n\n## 참고 원문\n\n1. 대전 정비사업 공사비, 검증 결과 평균 52.8%↑…검증 실효성 논란 — daejonilbo.com · [원문](https://daejonilbo.com/news/articleView.html?idxno=2302698)\n2. 노원구, 재건축 추진위 승인 잇따라…5개 단지 추진 속도 탄력 — 아시아경제 · [원문](https://view.asiae.co.kr/article/2026092209083218341)\n3. 상계주공7단지 재건축사업, 추진위 승인 — 하우징헤럴드 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62971)\n4. 노원구 재건축 추진위 승인 잇따라…정비사업 속도 낸다 — jeonmae.co.kr · [원문](https://jeonmae.co.kr/news/articleView.html?idxno=1295720)\n5. ‘좁고 낡은 임대’ 깬다…바닥 1등급·중형 40% 확대한 보편형 공공임... — segye.com · [원문](https://segye.com/newsView/20260921513899?OutUrl=naver)\n6. 전국서 2030년까지 공적주택 119만가구 공급…생애주기별 주거 지원도 확... — 데일리안 · [원문](https://dailian.co.kr/news/view/1693019?sc=Naver)\n\n## 오늘 흘려보낸 것\n\n중복 106건 · 후속보도 신규정보 없음 0건 · 기준 미달 428건\n"}, {"date": "2026-09-21", "markdown": "# 2026-09-21 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 다이제스트는 서울 대형 신규 재건축 사업지의 공사비 공개와, 지방 정비사업 공사비 검증 제도의 실효성 문제가 두 축을 이룬다. 신월시영·성산시영은 총공사비가 1조원을 넘는 규모로 구체화됐고, 노원구 월계시영도 재건축 검토 단계에 들어섰지만 아직 비용은 제시되지 않았다. 지방에서는 부동산원 검증을 거쳐도 공사비가 평균 46.6% 증액되고 그 결과에 법적 구속력조차 없다는 점이 확인됐다. 노원구·상계주공을 다룬 다수 보도는 증여·전세 시장 동향에 머물러 분담금 추정에 쓸 수 있는 수치는 나오지 않았다.\n\n## 선별 4건\n\n### 1. 🔴 [노원구] 신월·성산·월계 ‘삼 시영’ 재건축 속도⋯대형 건설사 물밑 경쟁\n\n이투데이 · 2026-09-21 · [원문](https://etoday.co.kr/news/view/2627485)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 신월시영 | 총공사비 | 1조 2,565억 | — |\n| 성산시영 | 총공사비 | 1조 6,000억 | — |\n\n양천구 신월시영과 마포구 성산시영이 각각 총공사비 1조2565억원, 약 1조6000억원 규모로 재건축을 추진하며 대형 건설사 수주 경쟁이 벌어지고 있다. 신월시영은 대우건설 단독 입찰 가능성이 커졌다. 노원구 월계시영(미미삼)도 3930가구에서 약 6000가구 규모로 재건축을 검토하는 단계로 IPARK현대산업개발이 관심을 보이지만 구체적인 공사비는 아직 제시되지 않았다.\n\n> ⚠️ 제시된 총공사비는 신월시영·성산시영 사업 전체 금액이며, 조합원 개인이 부담하는 분담금이 아닙니다.\n> ⚠️ 분담금은 이 총공사비에서 종전자산 평가액, 비례율, 일반분양 수입 등을 반영해 별도로 산정되며, 기사에는 그 수치가 나와 있지 않습니다.\n> ⚠️ 월계시영(미미삼)은 아직 구체적 공사비가 제시되지 않은 검토 단계이므로, 신월·성산의 공사비 규모와 나란히 놓고 비교할 단계가 아닙니다.\n\n*왜 골랐나*: 신월·성산시영의 총공사비 실수치가 있고, 노원구 월계시영 재건축 움직임도 함께 다뤄 우선 지역과 맞물린다.\n\n### 2. 지방 정비사업 공사비 검증해도 6조4천억 급증…대구 78% '최고'\n\nimaeil.com · 2026-09-21 · [원문](https://imaeil.com/page/view/2026092109025861439)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 비수도권 정비사업 76곳 | 공사비증액률 | 46.6% | — |\n| 대구 정비사업장 | 공사비증액률 | 78.1% | — |\n| 대전 중구 재개발 사업장 | 공사비증액률 | 284.6% | — |\n| 대구 남구 재건축 사업장 | 공사비증액률 | 244.3% | — |\n\n비수도권 정비사업 76곳이 부동산원 공사비 검증을 받았지만 검증 후에도 총 6조4393억원, 평균 46.6% 증액됐다. 대구가 평균 78.1% 올라 상승폭이 가장 컸고, 대전 중구의 한 재개발 사업장은 375억원에서 1440억원으로 284.6% 늘었다. 검증 결과에 법적 구속력이 없어 조합과 시공사가 이를 반드시 따를 필요는 없다.\n\n**정책 포인트**\n\n- 공사비 검증은 시공사가 요구한 증액안의 적정성을 부동산원이 심사하는 제도이지만 결과에 법적 구속력이 없어 조합·시공사가 반드시 따를 의무는 없다.\n\n> ⚠️ 여기 나온 증액률은 지역별·사업장별 공사비 검증 결과 통계이며, 조합원 분담금과는 다른 축의 수치입니다.\n> ⚠️ 검증 결과는 법적 구속력이 없어 조합과 시공사가 실제로 이 인상률대로 계약을 확정한다는 뜻은 아닙니다.\n> ⚠️ 대구 78.1%, 대전 중구 284.6% 등은 특정 사업장·지역의 사례이므로, 본인 단지의 공사비 증액률이 이와 같을 것이라고 볼 근거는 없습니다.\n\n*왜 골랐나*: 공사비 검증을 거쳐도 평균 46.6% 증액된다는 구체적 수치와, 검증에 법적 구속력이 없다는 제도적 한계를 함께 보여준다.\n\n### 3. “건설사 이익추구 탓만 아니라” 건축교수가 MBC서 한 말\n\n문화일보 · 2026-09-20 · [원문](https://munhwa.com/article/11618293)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 고급화 전환 재개발 현장 | 평당공사비 | 592만원/3.3㎡ | — |\n| 고급화 전환 재개발 현장 | 평당공사비 | 882만원/3.3㎡ | — |\n\n건축공학 교수는 최근 아파트 공사비가 평당 700만~800만원대까지 오른 배경에 자재비 상승뿐 아니라 노동생산성 저하와 인건비 증가, 고급화 경쟁이 겹쳤다고 설명했다. 한 재개발 현장에서는 일반 브랜드 평당공사비 592만원이 고급 브랜드로 전환된 뒤 882만원으로 뛴 사례가 소개됐다. 건설 현장의 시간당 노동생산성은 2017년과 비교해 27.6% 낮아진 것으로 언급됐다.\n\n> ⚠️ 592만원→882만원 사례는 브랜드 등급 전환에 따른 특정 재개발 현장의 평당공사비이며, 다른 단지에 그대로 적용되는 수치가 아닙니다.\n> ⚠️ 이 수치는 평당공사비이지 분담금이나 조합원분양가가 아니므로, 세대 단위 부담액으로 환산해 읽지 않아야 합니다.\n\n*왜 골랐나*: 평당공사비가 오르는 구조적 요인을 구체적 사례 수치(592만원→882만원)로 짚은 드문 기사라서 골랐다.\n\n### 4. 서울 자치구, 리모델링 사업에도 행정 지원 확대\n\n조선일보 · 2026-09-21 · [원문](https://chosun.com/special/special_section/2026/09/21/TURV2VHIMVGW5CADFAJN2HKUOI)\n\n서울 자치구들이 재건축·재개발에 이어 리모델링 추진 단지에도 행정 지원을 확대하고 있다. 리모델링은 기존 구조체를 활용하는 방식이라 안전진단과 분담금 산정 등 단지별 검토가 필요하다는 지적이 나온다. 본문이 확보되지 않아 구체적 지원 내용과 수치는 확인되지 않았다.\n\n**정책 포인트**\n\n- 자치구가 재건축·재개발 외에 리모델링 추진 단지까지 행정 지원 대상을 넓히고 있다.\n- 리모델링은 기존 구조체를 활용해 안전진단·분담금 산정 방식이 재건축과 달라 단지별 검토가 필요하다는 지적이 나온다.\n\n*왜 골랐나*: 재건축뿐 아니라 리모델링까지 행정 지원이 확대되는 제도 변화라서 수치가 없어도 포함했다.\n\n## 인사이트\n\n- 지방 정비사업 76곳은 공사비 검증을 거쳐도 평균 46.6% 증액됐고, 검증 결과에 법적 구속력이 없어 조합이 그대로 받아들일 의무가 없다는 점이 지적됐다.[1][2]\n- 노원구·상계주공을 다룬 오늘 보도 다수는 증여 건수·전세가율 등 시장 동향에 머물러 있어 분담금 추정에 쓸 수 있는 수치는 확인되지 않았다.[3][4][5][6]\n- 신월시영(1조2565억원)과 성산시영(약 1조6000억원) 모두 총공사비 1조원을 넘는 대형 사업으로 분류되며, 대형 건설사들이 수주 경쟁을 벌이고 있다.[7]\n- 전문가는 평당공사비가 코로나19 이전 500만원대에서 현재 700만~800만원대로 오른 배경으로 자재비 외에 노동생산성 저하와 고급화 경쟁을 지목했다.[8]\n\n## 오늘의 개념\n\n### 공사비 검증\n\n정비사업 공사비 검증은 시공사가 요구한 증액 공사비의 적정성을 전문기관(한국부동산원)이 검토하는 제도다. 다만 검증 결과에는 법적 구속력이 없어 조합과 시공사가 이를 반드시 이행해야 하는 것은 아니다.\n\n*오늘*: 오늘 지방 정비사업 76곳의 검증 결과가 나왔는데, 검증을 거쳐도 평균 46.6% 증액됐고 별도의 사후관리 절차도 없다는 점이 확인됐다.[1][2]\n\n## 참고 원문\n\n1. 지방 정비사업 공사비 검증해도 6조4천억 급증…대구 78% '최고' — imaeil.com · [원문](https://imaeil.com/page/view/2026092109025861439)\n2. [단독] 지방 정비사업 공사비, 부동산원 검증 후에도 46.6% 뛰었다 — 조선비즈 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/09/21/UJFVCPXQJNBXFFMD4SIZA6LVPI)\n3. 강남 제치고 목동·상계가 1·2위…증여 몰리는 재건축 대단지 — 동아일보 · [원문](https://donga.com/news/Economy/article/all/20260920/134703516/1)\n4. 재건축 앞둔 목동·상계 ‘증여’ 급증한 사연 — 매일경제 · [원문](https://mk.co.kr/article/12157349)\n5. 서울 아파트 증여 목동-상계가 1, 2위… ‘재건축 쏠림’ 뚜렷 — 동아일보 · [원문](https://donga.com/news/Economy/article/all/20260920/134705388/2)\n6. 강남 제치고 목동·상계가 1·2위…서울 아파트 증여 '재건축 쏠림' — 뉴스1 · [원문](https://news1.kr/realestate/general/6296031)\n7. 신월·성산·월계 ‘삼 시영’ 재건축 속도⋯대형 건설사 물밑 경쟁 — 이투데이 · [원문](https://etoday.co.kr/news/view/2627485)\n8. “건설사 이익추구 탓만 아니라” 건축교수가 MBC서 한 말 — 문화일보 · [원문](https://munhwa.com/article/11618293)\n\n## 오늘 흘려보낸 것\n\n중복 104건 · 후속보도 신규정보 없음 2건 · 기준 미달 182건\n"}, {"date": "2026-09-20", "markdown": "# 2026-09-20 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 상계주공·목동 재건축 단지들이 증여 건수 1·2위에 오르며 비강남권 재건축 기대감이 자산 이전 수요로 이어지고 있다는 점이 확인됐다. 노원구 태릉지구 현장 점검에서는 총리가 재개발 동의율 완화 방침을 언급해 조합 설립 절차 전반에 영향을 줄 수 있는 제도 변화가 예고됐다. 건설 전문가는 아파트 평당 공사비가 코로나19 이전 대비 약 30% 올라 700만~800만원대에 이르렀다고 분석했지만, 특정 사업장의 분담금이나 조합원분양가를 구체적으로 제시한 보도는 오늘 눈에 띄지 않았다. 전반적으로 시황·증여 통계 위주의 기사가 많았고, 사업장 단위의 실제 비용 수치는 상대적으로 드문 하루였다.\n\n## 선별 3건\n\n### 1. 🔴 [상계주공] 서울 아파트 증여 재건축 쏠려…목동·상계 1·2위\n\nhansbiz.co.kr · 2026-09-20 · [원문](http://hansbiz.co.kr/news/articleView.html?idxno=866843)\n\n국민의힘 김종양 의원실이 대법원에서 받은 국정감사 자료에 따르면 올해 1~6월 서울 아파트 증여 건수 1위는 양천구 목동신시가지(102건), 2위는 노원구 상계주공(95건)으로 강남권 주요 단지를 제쳤다. 노원구 중계주공5단지도 11건으로 상위 20위에 포함됐다. 재건축 기대감과 세제 강화 기조가 증여를 서두르게 한 배경으로 거론됐다.\n\n*왜 골랐나*: 상계주공·노원구가 국정감사 자료를 근거로 강남권을 제치고 증여 건수 1·2위에 올랐다는 구체적 데이터가 있어 최우선 기준에 부합한다.\n\n### 2. 🔴 [노원구] 한성숙 총리, ‘태릉지구 주택공급 정책 실행력 가늠자 될 것’ 2029년 착...\n\n브릿지경제 · 2026-09-19 · [원문](https://viva100.com/article/20260919500006)\n\n한성숙 국무총리가 노원구 태릉지구 사업 현장을 점검하며 2029년 착공 일정 준수를 강조했다. 총리는 인허가 간소화로 조성 기간을 68개월에서 37개월로 단축했고, 재개발 동의율도 낮췄다고 밝혔다. 태릉지구는 세계유산 보존 문제로 유네스코 협의를 마무리한 뒤 착공 일정을 진행할 계획이다.\n\n**정책 포인트**\n\n- 재개발 동의율 완화 및 인허가 간소화로 조성 기간을 68개월에서 37개월로 단축한다는 방침이 언급됨\n\n*왜 골랐나*: 노원구 소재 사업 현장 소식이면서, 재개발 동의율 완화라는 제도 변화가 언급돼 다른 조합 설립 절차에도 영향을 줄 수 있는 정책 정보다.\n\n### 3. \"단순 자재값 문제 아니다\"…아파트 공사비 폭등 뒤에 숨은 복합 원인\n\n뉴시스 · 2026-09-20 · [원문](https://newsis.com/view/NISX20260915_0003790609)\n\n최도영 고려사이버대 교수는 최근 아파트 공사비가 코로나19 이전 500만원대 초반에서 평당 700만~800만원대까지 약 30% 올랐다고 분석했다. 유가 상승, 노동생산성 저하(2017년 대비 27.6% 감소), 안전관리 강화, 브랜드 고급화 경쟁이 복합적으로 작용했다고 설명했다. 한 재개발 현장에서는 일반 브랜드 대비 고급 브랜드 전환만으로 평당 공사비가 592만원에서 882만원으로 오른 사례도 소개됐다.\n\n*왜 골랐나*: 특정 단지명은 없지만 평당공사비의 구체적 범위와 브랜드 고급화에 따른 실제 인상 사례(592만원→882만원)가 담긴 몇 안 되는 수치 기사다.\n\n## 인사이트\n\n- 증여 데이터에서 목동신시가지(102건)와 상계주공(95건)이 강남권 주요 단지들을 제치고 1·2위에 올라, 비강남권 재건축 기대감이 자산 이전 수요로 이어지고 있음을 보여준다.[1]\n- 노원구 태릉지구 사업에서 정부가 재개발 동의율을 낮추는 방안을 언급한 것은 태릉지구뿐 아니라 다른 재건축·재개발 조합의 설립 절차 문턱에도 영향을 줄 수 있는 제도 변화다.[2]\n- 전문가 분석에 따르면 최근 아파트 평당 공사비는 700만~800만원대로 코로나19 이전(500만원대 초반) 대비 크게 올랐고, 한 재개발 현장에서는 브랜드 고급화만으로 평당 공사비가 592만원에서 882만원으로 뛴 사례도 확인된다.[3][4]\n\n## 오늘의 개념\n\n### 재개발 동의율\n\n재개발·재건축 사업을 진행하려면 토지등소유자 중 일정 비율 이상의 동의를 얻어야 조합 설립이나 사업시행 등 각 단계로 넘어갈 수 있다. 이 동의율 요건이 낮아지면 사업 추진 속도가 빨라질 수 있지만, 반대 의견을 가진 소유주의 목소리가 반영되기 어려워질 수 있다.\n\n*오늘*: 국무총리가 노원구 태릉지구 점검에서 재개발 동의율을 낮추는 방안을 언급하며, 향후 다른 재건축·재개발 조합의 설립 절차 문턱도 낮아질 가능성을 시사했다.[2]\n\n## 참고 원문\n\n1. 서울 아파트 증여 재건축 쏠려…목동·상계 1·2위 — hansbiz.co.kr · [원문](http://hansbiz.co.kr/news/articleView.html?idxno=866843)\n2. 한성숙 총리, ‘태릉지구 주택공급 정책 실행력 가늠자 될 것’ 2029년 착... — 브릿지경제 · [원문](https://viva100.com/article/20260919500006)\n3. \"단순 자재값 문제 아니다\"…아파트 공사비 폭등 뒤에 숨은 복합 원인 — 뉴시스 · [원문](https://newsis.com/view/NISX20260915_0003790609)\n4. “건설사 이익추구 탓만 아니라” 건축교수가 MBC서 한 말 — 문화일보 · [원문](https://munhwa.com/article/11618293)\n\n## 오늘 흘려보낸 것\n\n중복 36건 · 후속보도 신규정보 없음 0건 · 기준 미달 235건\n"}, {"date": "2026-09-19", "markdown": "# 2026-09-19 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원구에서 두 건의 정비사업 절차 소식이 나왔지만 둘 다 조합원 분담금이나 공사비 수치는 제시하지 않았다. 반면 서초구 반포주공1·2·4주구, 광명 하안주공6·7단지, 용산 숙대입구역세권에서는 일반분양가·총공사비·평당공사비 등 실제 수치가 담긴 기사가 나왔다. 다수의 후보 기사는 토허제 1년 후폭풍, 84주 연속 집값 상승, 전세난 등 시황·정책 논란에 집중돼 있어 분담금 판단에 직접 쓸 수 있는 정보는 제한적이었다. 상계주공7단지는 거래량 상위권에 다시 이름을 올렸지만 새로운 비용 정보는 없어 반영하지 않았다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] [단독] ‘보편형 임대’ 재건축 전국 첫 적용… 서울 중계1에 514가구\n\n조선비즈 · 2026-09-17 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/09/17/T32N3BVIRVBYJPDRHZBLMF2ICQ)\n\n서울 노원구 중계1 재건축 단지에 정부의 '보편형 공공임대주택'이 전국 노후 공공임대 재건축 사업 중 처음으로 적용된다. 기존 488가구였던 공공분양 계획이 통합임대를 포함해 최고 49층·1398가구 규모로 전면 변경되고, 이 중 514가구가 보편형 임대로 공급될 예정이다. 2028년 착공을 목표로 한다. 본문이 확보되지 않아 조합원 분담금이나 공사비 수치는 확인되지 않았다.\n\n**정책 포인트**\n\n- 보편형 공공임대주택이 노후 공공임대 재건축 사업에 전국 최초로 적용돼, 향후 다른 사업장의 공공분양·임대 비중 조정에 선례로 작용할 수 있다.\n\n*왜 골랐나*: 노원구 재건축 사업장에 적용되는 전국 첫 제도 변화라 우선순위 규정에 따라 반영했다.\n\n### 2. 🔴 [노원구] 광운대역세권 장기전세주택 건립 본격화… 건축심의 통과\n\n한국주택경제신문 · 2026-09-17 · [원문](https://arunews.com/news/articleView.html?idxno=67323)\n\n서울 노원구 월계동 광운대역세권 장기전세주택 건립사업이 서울시 건축위원회 심의를 통과했다. 30년 이상 노후화된 성북맨션 구분소유자들의 재건축 결의를 바탕으로 추진되며, 지하6~지상28층에 공공임대 75세대와 분양주택 188세대 등 총 263세대가 조성된다. 사업자는 올해 하반기 건축허가를 신청해 2028년 3월 착공, 2030년 3월 준공을 목표로 한다.\n\n*왜 골랐나*: 노원구 소재 재건축 사업의 절차 진행 소식이라 우선순위 규정에 따라 반영했다.\n\n### 3. IPARK현대산업개발, 하안주공6·7단지 무혈입성하나…단독입찰\n\ndaily.hankooki.com · 2026-09-18 · [원문](https://daily.hankooki.com/news/articleView.html?idxno=1407975)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 하안주공6·7단지 | 총공사비 | 1조 1,549억 3,000만원 | — |\n| 하안주공6·7단지 | 평당공사비 | 780만원/3.3㎡ | — |\n\n광명 하안주공6·7단지 통합재건축 시공사 선정 입찰에 IPARK현대산업개발이 단독 응찰해 유찰됐다. 예정 공사비는 1조1549억3000만원, 3.3㎡당 780만원 수준으로 제시됐다. 사업은 3240가구 규모로 조성되며, 한국토지신탁은 2차 입찰 공고를 준비 중이다.\n\n> ⚠️ 제시된 공사비와 평당가는 시공사선정 입찰 단계의 예정 금액이며, 단독응찰로 유찰된 상태라 확정된 수치가 아닙니다.\n> ⚠️ 총공사비 1조1549억원은 사업 전체 금액이고 조합원 개인이 부담하는 분담금과는 다른 축의 숫자입니다. 이 총액을 가구 수로 나눠 개인 부담금을 짐작하지 않으시길 바랍니다.\n\n*왜 골랐나*: 총공사비와 평당공사비가 모두 본문에 명시된 시공사선정 관련 기사라서 선정했다.\n\n### 4. '디에이치'는 그대로…'반디클' 새 단지명 10월 총회서 결정\n\n뉴시스 · 2026-09-19 · [원문](https://newsis.com/view/NISX20260918_0003795382)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 반포주공1·2·4주구(디에이치 클래스트) | 일반분양가 | 9,000만원/3.3㎡ | — |\n| 반포주공1·2·4주구(디에이치 클래스트) | 일반분양가 | 10,000만원/3.3㎡ | — |\n\n서초구 반포주공1·2·4주구 재건축(현 '반포 디에이치 클래스트') 조합이 10월 9일 총회에서 새 단지명을 결정할 예정이다. 오는 11월 일반분양을 앞두고 있으며, 일반분양가는 3.3㎡당 9000만원~1억원 수준이 거론된다고 기사에 명시됐다. 다만 구체적인 분양 일정과 분양가는 아직 확정되지 않았다.\n\n> ⚠️ 일반분양가 3.3㎡당 9000만~1억원은 아직 확정되지 않은 거론 수준의 수치이며, 조합원분양가나 종전자산 평가액과는 다른 개념입니다.\n> ⚠️ 이 평당가로 특정 평형의 분양가 총액이나 분담금을 환산하지 않으시길 바랍니다. 확정 여부는 향후 분양 일정에서 다시 확인이 필요합니다.\n\n*왜 골랐나*: 서울 최대 재건축 사업장의 일반분양가 예상치가 평당 기준으로 본문에 명시돼 있어 선정했다.\n\n### 5. IPARK현산, 용산 서부권 '브랜드 타운화' 속도…리뉴얼 '아이파크' 통할...\n\nKPI뉴스 · 2026-09-18 · [원문](https://kpinews.kr/newsView/1065594184884265)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 숙대입구역세권 | 총공사비 | 5,400억 | — |\n\nIPARK현대산업개발이 용산구 갈월동 숙대입구역세권 장기전세주택 도시정비형 재개발 사업 수주에 나섰다. 공사비 규모는 약 5400억원이며, 지하6층~지상39층 5개동 총 992가구 규모 주상복합으로 계획됐다. 지난달 1차 현장설명회에는 현대건설·대우건설·롯데건설·금호건설 등이 참석했다.\n\n> ⚠️ 공사비 약 5400억원은 시공사 선정 절차 초기(현장설명회) 단계에서 제시된 규모로, 확정 공사비가 아닙니다.\n> ⚠️ 이는 사업 전체 공사비이며 개별 조합원의 분담금과는 다른 축의 숫자이니 혼동하지 않으시길 바랍니다.\n\n*왜 골랐나*: 본문에 총공사비 수치가 명시된 정비사업 수주 관련 기사라서 선정했다.\n\n## 인사이트\n\n- 노원구에서는 이번 주 정비사업 절차 소식이 두 건(보편형 공공임대 적용, 광운대역세권 건축심의 통과) 나왔지만 두 기사 모두 조합원 분담금이나 공사비 수치는 제시하지 않아, 비용을 가늠할 정보는 아직 부족하다.[1][2]\n- 하안주공6·7단지(총공사비 1조1549억원, 3.3㎡당 780만원)와 숙대입구역세권(약 5400억원)은 모두 아직 시공사가 확정되지 않은 단계로, 제시된 공사비는 최종 계약에서 달라질 수 있다.[3][4]\n- 반포주공1·2·4주구의 3.3㎡당 9000만~1억원 일반분양가는 기사에도 '거론된다'는 표현으로 소개돼, 확정치가 아니라 시장에서 도는 예상치임을 유의해야 한다.[5]\n- 평당공사비 시공사선정공고 단계의 누적 표본이 아직 1건에 불과해, 하안주공6·7단지의 3.3㎡당 780만원이 다른 사업장과 비교해 높은지 낮은지는 판단할 기준선이 없다.[3]\n- 상계주공7단지는 토허제 확대 1년 관련 보도에서도 다시 거래 상위권에 이름을 올렸지만, 기존에 거론된 재건축 추가 분담금 6억~7억원 수준 외에 새로운 비용 정보는 확인되지 않았다.[6][7]\n\n## 오늘의 개념\n\n### 통합재건축\n\n인접한 두 개 이상의 정비구역을 하나의 사업으로 묶어 함께 진행하는 재건축 방식이다. 사업 규모가 커지는 만큼 시공사 선정과 공사비 산정이 개별 구역보다 복잡해질 수 있다.\n\n*오늘*: 하안주공6·7단지가 통합재건축 방식으로 시공사 선정 입찰을 진행하며 총공사비 1조1549억원이 제시됐다.[3]\n\n### 유찰·수의계약\n\n시공사 선정 입찰에 단독으로 응찰하면 경쟁 입찰 요건을 충족하지 못해 '유찰' 처리되고, 이후 재공고를 거쳐 단독 응찰이 유지되면 수의계약으로 전환되는 절차를 밟는다. 경쟁이 없는 수의계약은 공사비 협상에서 조합의 협상력이 상대적으로 낮아질 수 있다는 우려가 제기되기도 한다.\n\n*오늘*: 하안주공6·7단지 입찰에 IPARK현대산업개발이 단독 응찰해 유찰됐고, 2차 공고에서도 단독 참여 시 수의계약 절차로 넘어갈 예정이다.[3]\n\n### 장기전세주택\n\n시세보다 낮은 보증금으로 장기간 거주할 수 있도록 공급하는 공공임대주택 유형이다. 재건축·재개발 과정에서 일부 물량을 장기전세주택으로 배정하는 사업이 있다.\n\n*오늘*: 노원구 월계동 광운대역세권 사업이 노후 성북맨션의 재건축 결의를 기반으로 장기전세주택으로 건립될 예정이며 건축심의를 통과했다.[2]\n\n## 참고 원문\n\n1. [단독] ‘보편형 임대’ 재건축 전국 첫 적용… 서울 중계1에 514가구 — 조선비즈 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/09/17/T32N3BVIRVBYJPDRHZBLMF2ICQ)\n2. 광운대역세권 장기전세주택 건립 본격화… 건축심의 통과 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=67323)\n3. IPARK현대산업개발, 하안주공6·7단지 무혈입성하나…단독입찰 — daily.hankooki.com · [원문](https://daily.hankooki.com/news/articleView.html?idxno=1407975)\n4. IPARK현산, 용산 서부권 '브랜드 타운화' 속도…리뉴얼 '아이파크' 통할... — KPI뉴스 · [원문](https://kpinews.kr/newsView/1065594184884265)\n5. '디에이치'는 그대로…'반디클' 새 단지명 10월 총회서 결정 — 뉴시스 · [원문](https://newsis.com/view/NISX20260918_0003795382)\n6. ‘토허제 확대 1년’ 후폭풍…거래 마르고 매매·전월세 다 뛰었다 — 중앙일보 · [원문](https://joongang.co.kr/article/25463221)\n7. 토허제 확대 1년…수도권 거래 마르고 값은 트리플 상승 — 중앙일보 · [원문](https://joongang.co.kr/article/25463200)\n\n## 오늘 흘려보낸 것\n\n중복 28건 · 후속보도 신규정보 없음 2건 · 기준 미달 407건\n"}, {"date": "2026-09-18", "markdown": "# 2026-09-18 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원구에서 민간 재건축(상계한신3차)과 공공 재정비(중계1단지 보편형 공공임대)가 같은 날 나란히 보도됐다. 구체적인 조합원 분양가·비례율 수치가 담긴 기사는 상계한신3차가 사실상 유일했고, 나머지 후보 다수는 실거래가 상승이나 청약 경쟁률, 금리 동향 등 시황성 기사여서 분담금 판단에 직접 쓸 수 있는 수치가 부족해 제외했다. 성수2지구처럼 서울 동북권 밖 대형 정비사업의 총공사비 수치도 확인됐지만 노원·상계와는 직접 관련이 없다. 벤치마크로 삼을 만한 누적 통계는 아직 표본이 부족해 이번 회차에서는 비교 문장을 넣지 않았다.\n\n## 선별 3건\n\n### 1. 🔴 [노원구] 상계한신3차, 정비구역 지정… 연내 사업시행자 지정 추진\n\n한국주택경제신문 · 2026-09-17 · [원문](https://arunews.com/news/articleView.html?idxno=67358)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계한신3차 | 비례율 | 97.58% | — |\n| 상계한신3차 | 조합원분양가 | 69,800만원(세대 총액) | — |\n| 상계한신3차 | 조합원분양가 | 81,400만원(세대 총액) | — |\n| 상계한신3차 | 조합원분양가 | 96,700만원(세대 총액) | — |\n\n노원구 상계한신3차가 재건축 정비구역 지정을 마치고 연내 사업시행자 지정을 추진한다. 추정비례율 97.58%가 산출됐고, 토지등소유자(조합원) 분양가 추정액은 전용 49㎡ 6억9800만원, 59㎡ 8억1400만원, 74㎡ 9억6700만원으로 제시됐다. 상계한신1·2차와 '단일화 재건축' 협약을 맺고 함께 사업을 진행 중이다.\n\n> ⚠️ 제시된 조합원분양가는 49㎡·59㎡·74㎡ 세 가지 평형별 추정 금액으로, 본인이 신청할 평형과 종전 보유 면적이 다르면 이 금액과 다릅니다.\n> ⚠️ 비례율 97.58%는 정비구역 지정 단계의 추정치입니다. 사업시행자 지정, 관리처분 단계를 거치며 일반분양가·공사비에 따라 바뀔 수 있는 수치입니다.\n> ⚠️ 여기 제시된 금액은 조합원분양가이며, 실제 분담금은 여기서 본인의 권리가액(종전자산 평가액×비례율)을 뺀 값입니다. 기사에는 권리가액이 나와 있지 않습니다.\n\n*왜 골랐나*: 노원구 상계동 최우선 지역 기사이면서 비례율과 조합원 분양가 추정액이 구체적으로 제시된, 오늘 후보 중 가장 수치가 명확한 기사다.\n\n### 2. 🔴 [노원구] 노원 중계1단지에 전국 첫 보편형 공공임대 514가구\n\n서울경제 · 2026-09-17 · [원문](https://sedaily.com/article/20092229)\n\n노원구 중계1단지(기존 공공임대 882가구)에 정부의 '보편형 공공임대'가 전국 최초로 적용된다. 당초 공공분양 488가구로 계획됐던 물량이 보편형 공공임대 514가구로 바뀌고, 통합공공임대는 884가구로 조정됐다. 스카이라운지·청년라운지 등 상품성을 높인 설계가 적용될 예정이다.\n\n**정책 포인트**\n\n- 당초 공공분양 488가구 계획이 보편형 공공임대 514가구로 변경됐고, 통합공공임대는 884가구로 조정됐다.\n- 정부는 건설형·매입형·전세형을 합쳐 내년 보편형 공공임대 3만6000가구를 공급하고 약 6조2000억원을 투입할 계획이다.\n\n*왜 골랐나*: 노원구 최우선 지역 기사이며, 공공분양 물량이 보편형 공공임대로 바뀌는 정책 변화가 확인돼 수치 없이도 선정 기준(정책·제도 변화)에 해당한다.\n\n### 3. DL이앤씨, ‘2조 성수2지구’ 품고 ‘상대원2구역’ 정상화... 대형 정비...\n\nthevaluenews.co.kr · 2026-09-17 · [원문](http://thevaluenews.co.kr/news/view.php?idx=201682)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 성수2지구 | 총공사비 | 2조 137억 | — |\n\nDL이앤씨가 서울 성동구 성수2지구 재개발 수의계약 가능성을 높이며 대형 수주 확보에 나섰다. 성수2지구는 예상 공사비 2조137억원 규모로, 1차 입찰 단독 응찰과 2차 현장설명회 단독 참여를 거쳐 DL이앤씨가 우선협상대상자로 지정됐다. 조합은 오는 12월까지 시공사 선정을 마무리할 예정이다.\n\n> ⚠️ 2조137억원은 성수2지구 사업 전체의 예상 공사비이며, 조합원 개인이 부담하는 분담금과는 다른 축의 수치입니다.\n> ⚠️ 이 금액은 아직 시공사 선정이 마무리되지 않은 단계(우선협상대상자 지정)의 예상치로, 최종 계약 시 달라질 수 있습니다.\n\n*왜 골랐나*: 총공사비 2조137억원이라는 구체적 수치가 확인된 정비사업 기사로, 노원구 편중을 조정하기 위해 선정했다.\n\n## 인사이트\n\n- 상계한신3차는 상계한신1·2차와 '단일화 재건축' 협약을 맺고 동일 사업시행자·시공자·설계자를 선정해 약 1,600세대 규모 브랜드타운을 조성할 계획이며, 규모의 경제를 통한 분담금 절감을 사업 목표로 내세우고 있다.[1]\n- 노원구에서는 상계한신3차의 민간 재건축 정비구역 지정과 중계1단지의 공공 재정비(보편형 공공임대 전환)가 비슷한 시기에 발표되며, 민간·공공 양쪽에서 노후 주거지 정비가 동시에 진행되고 있다.[1][2]\n- DL이앤씨는 상반기 도시정비사업에서 신규수주의 74%인 2조6830억원을 확보했고, 예상 공사비 2조137억원 규모의 성수2지구까지 더해지면 하반기 외형 회복의 발판이 될 수 있다.[3]\n\n## 오늘의 개념\n\n### 단일화 재건축\n\n인접한 여러 단지가 동일한 사업시행자·시공자·정비사업전문관리업자·설계자를 지정해 사실상 하나의 사업으로 재건축을 추진하는 방식이다. 규모가 커지면서 협상력과 규모의 경제 효과를 기대할 수 있다.\n\n*오늘*: 상계한신1·2·3차 세 단지가 이 방식으로 재건축을 추진 중이며, 3차가 먼저 정비구역 지정을 마치면서 나머지 단지도 속도를 낼 것으로 보인다.[1]\n\n### 보편형 공공임대\n\n기존 공공임대가 취약계층 위주였다면, 보편형 공공임대는 지원 대상을 중산층까지 넓히고 민간주택 수준의 설계·마감을 적용해 상품성을 높인 임대주택 유형이다.\n\n*오늘*: 정부가 이 유형을 노원구 중계1단지 재정비 사업에 전국 최초로 적용하면서, 기존 공공분양 계획 물량이 보편형 공공임대로 대체됐다.[2]\n\n## 참고 원문\n\n1. 상계한신3차, 정비구역 지정… 연내 사업시행자 지정 추진 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=67358)\n2. 노원 중계1단지에 전국 첫 보편형 공공임대 514가구 — 서울경제 · [원문](https://sedaily.com/article/20092229)\n3. DL이앤씨, ‘2조 성수2지구’ 품고 ‘상대원2구역’ 정상화... 대형 정비... — thevaluenews.co.kr · [원문](http://thevaluenews.co.kr/news/view.php?idx=201682)\n\n## 오늘 흘려보낸 것\n\n중복 59건 · 후속보도 신규정보 없음 0건 · 기준 미달 473건\n"}, {"date": "2026-09-17", "markdown": "# 2026-09-17 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 개별 단지의 새 공사비·분담금 수치보다 제도 변화가 두드러진 하루다. 노원구는 사업성 보정계수 상한 확대와 임대주택 비율 완화를 서울시에 공식 건의했고, 동시에 전문자문단을 출범시켜 정비사업 지원 체계를 정비했다. 국토부의 기본형건축비 인상과 국회에 계류 중인 용적률 완화 법안은 노원구를 포함한 전국 재건축 단지의 사업성 계산식 자체를 흔드는 사안이다. 반면 상계주공·목동4단지 등 기존 스레드에서는 어제 이후 새로 확인된 사실이 없어 이번 호에는 오르지 않았다.\n\n## 선별 4건\n\n### 1. 🔴 [노원구] 노원구, 서울시의 '2030 서울특별시 도시·주거환경정비기본계획(주거환...\n\ncnbizm.com · 2026-09-15 · [원문](https://cnbizm.com/news/articleView.html?idxno=315234)\n\n노원구가 서울시의 2030 정비기본계획 변경안을 환영했다. 정비기반시설 기부채납 시 상한용적률을 넘는 부분에도 용적률 인센티브를 인정받게 돼 월계삼호4차·중계그린 등 그동안 혜택을 못 받던 단지의 사업성이 개선될 전망이다. 구는 추가로 재건축 임대주택 비율을 현행 50%에서 30%로 낮추고 사업성 보정계수 상한을 2.0에서 3.0으로 올려달라고 서울시에 건의했다.\n\n**정책 포인트**\n\n- 정비기반시설 기부채납 시 상한용적률 초과분도 용적률 인센티브 인정하도록 기본계획 변경\n- 재건축 임대주택 비율을 현행 50%에서 30%로 완화 건의\n- 사업성 보정계수 상한을 현행 2.0에서 3.0으로 확대 건의, '분양가격 보정계수' 신설도 요청\n\n*왜 골랐나*: 노원구가 사업성 보정계수와 임대주택 비율 완화를 공식 건의한 정책 기사라서, 저사업성 노원 단지들의 분담금 부담을 좌우할 사안이다.\n\n### 2. 🔴 [노원구] 노원구, 광운대역세권 263가구 건립 본격화…정비사업 자문단도 가동 [...\n\nsegye.com · 2026-09-16 · [원문](https://segye.com/newsView/20260916519917?OutUrl=naver)\n\n월계동 성북맨션 재건축을 통한 '광운대역세권 장기전세주택 건립사업'이 서울시 건축위원회 심의를 통과했다. 지상 28층 총 263세대(공공임대 75·분양 188) 규모로 2028년 3월 착공, 2030년 3월 준공이 목표다. 같은 날 노원구는 한국도시정비학회와 협약을 맺고 정비계획부터 준공까지 단계별로 지원하는 '재건축·재개발 전문자문단'을 출범시켰다.\n\n**정책 포인트**\n\n- 한국도시정비학회와 협약, 도시계획·법무·세무회계·감정평가 전문가 약 30명이 참여하는 '재건축·재개발 전문자문단' 가동\n- 개별 사업장에서 풀기 어려운 법령·제도 문제는 '재건축·재개발 규제혁신 100'과 연계해 서울시·정부에 건의\n\n*왜 골랐나*: 노원구 관련 기사라 우선 배치했으며, 성북맨션 재건축 진행 상황과 노원구의 신규 정비사업 지원 체계 출범이 함께 보도됐다.\n\n### 3. 국토부, 분양가상한제 기본형건축비 4.07% 인상… 평당 232만8000원\n\n조선비즈 · 2026-09-15 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/09/15/EVC7LZRH4BHCREIHIQBRHKDALI)\n\n국토교통부가 분양가상한제 적용 단지의 공사비 산정 기준인 기본형건축비를 4.07% 인상해 3.3㎡당 232만8000원으로 고시했다. 매체 제공 요약에 따르면 공사 현장 안전대책 강화를 위한 재원 투입이 늘면서 간접공사비 상승폭이 컸다. 다만 이 기사는 본문이 확보되지 않아 세부 수치를 추가로 인용하지 않는다.\n\n**정책 포인트**\n\n- 분양가상한제 기본형건축비 4.07% 인상, 3.3㎡당 232만8000원으로 고시\n- 간접노무비율(14.6%→18.1%) 등 간접공사비 적용기준 변경이 인상 배경으로 거론됨\n\n*왜 골랐나*: 분양가상한제를 적용받는 재건축 단지 전체의 공사비 산정 기준이 바뀐 정책 변화라서, 개별 단지 수치가 없어도 모든 사업장에 영향을 준다.\n\n### 4. [아유경제_헤드라인] 도시정비사업 용적률 완화 두고 '입법 진통' 계속...\n\nareyou.co.kr · 2026-09-16 · [원문](http://areyou.co.kr/news/articleView.html?idxno=95398)\n\n공공재개발·재건축의 용적률을 법적 상한의 1.3배까지 높이는 법안이 국회 본회의 문턱에서 멈춰 섰다. 현재는 공공재개발이 법적 상한의 1.2배, 공공재건축은 법적 상한까지만 용적률을 적용받을 수 있다. 여야 모두 정비사업 활성화 필요성에는 공감하지만 민간 사업 적용 여부와 완화 폭, 주택 규모 조건을 두고 이견을 좁히지 못하고 있다.\n\n**정책 포인트**\n\n- 공공재개발·재건축 용적률을 법적 상한의 1.3배까지 확대하는 법안이 국회 본회의 문턱에서 계류 중\n- 현행은 공공재개발 1.2배, 공공재건축은 법적 상한까지만 적용 가능\n- 민간 사업 적용 여부·완화 폭·주택 규모 조건을 두고 여야 이견 지속\n\n*왜 골랐나*: 용적률 완화 폭이 확정되면 사업성 개선을 통해 분담금이 낮아지는 방향의 전국 단위 제도 변화라서 포함했다.\n\n## 인사이트\n\n- 노원구는 사업성 보정계수 상한을 2.0에서 3.0으로 올려달라고 건의했다. 상한이 올라가면 일반분양 비율을 더 늘릴 수 있어 저사업성 노원 단지의 분담금 부담이 줄어드는 방향이다.[1]\n- 노원구는 사업성 보정계수 건의와 별개로 전문자문단·규제혁신 100 등 행정 지원 체계를 동시에 가동해, 제도 개선과 현장 지원을 병행하는 흐름을 보이고 있다.[2]\n- 기본형건축비 인상은 분양가상한제가 적용되는 관리처분 이후 단계 재건축 단지의 공사비 산정 기준을 끌어올리는 요인이다.[3]\n- 용적률 완화 법안이 통과되면 공공재건축도 현재보다 최대 1.3배까지 용적률을 적용받을 수 있지만, 아직 국회에 계류 중이라 당장 분담금 계산에 반영하기는 이르다.[4]\n\n## 참고 원문\n\n1. 노원구, 서울시의 '2030 서울특별시 도시·주거환경정비기본계획(주거환... — cnbizm.com · [원문](https://cnbizm.com/news/articleView.html?idxno=315234)\n2. 노원구, 광운대역세권 263가구 건립 본격화…정비사업 자문단도 가동 [... — segye.com · [원문](https://segye.com/newsView/20260916519917?OutUrl=naver)\n3. 국토부, 분양가상한제 기본형건축비 4.07% 인상… 평당 232만8000원 — 조선비즈 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/09/15/EVC7LZRH4BHCREIHIQBRHKDALI)\n4. [아유경제_헤드라인] 도시정비사업 용적률 완화 두고 '입법 진통' 계속... — areyou.co.kr · [원문](http://areyou.co.kr/news/articleView.html?idxno=95398)\n\n## 오늘 흘려보낸 것\n\n중복 81건 · 후속보도 신규정보 없음 0건 · 기준 미달 512건\n"}, {"date": "2026-09-16", "markdown": "# 2026-09-16 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n노원구는 제도 개선(정비기본계획 변경, 사업성 보정계수 확대 건의)과 실제 사업 진행(상계2구역 공사도급계약)이 같은 주에 겹치며 사업성 개선 움직임이 뚜렷하게 나타났다. 반면 목동4단지의 '평당 1010만원' 이슈는 어제자 보도와 동일한 내용이라 오늘은 새로운 진전이 확인되지 않았다. 부산 온천4구역처럼 이미 준공·해산 단계에 이른 사업장에서는 비례율과 분양가 협상 성과가 구체적으로 확인됐고, 국토부의 기본형건축비 인상은 분양가상한제 적용 사업장 전반의 비용 산정 기준을 끌어올리는 배경으로 작용했다. 서울 고가 아파트 경매 약세, 강남·서초 집값 조정 등은 재건축 비용 판단과 직접 관련이 없어 이번 다이제스트에서는 제외했다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] 동부건설, 13.7조 일감 '수익 전환' 본격화…2756억 정비사업·플랜트 54...\n\nupkoreanews.kr · 2026-09-14 · [원문](https://upkoreanews.kr/news/articleView.html?idxno=100218)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계2구역 | 총공사비 | 6,890억 | — |\n\n노원구 상계2구역 주택재개발정비사업에서 동부건설이 2756억1809만원 규모의 공사계약을 체결했다. 전체 공사비는 약 6890억원이며 동부건설이 40%, 대우건설이 60%의 시공지분을 맡는다. 이 사업은 2021년 이미 시공사가 선정된 곳으로, 이번 계약은 사업이 실제 도급계약 단계로 넘어갔음을 보여준다.\n\n> ⚠️ 총공사비 6890억원은 사업 전체 금액이며 조합원 개인이 부담하는 분담금이 아닙니다. 개별 분담금은 보유 면적·동·층·향에 따른 종전자산 평가액과 비례율이 정해져야 산출됩니다.\n> ⚠️ 이 기사는 2021년 시공사 선정이 끝난 뒤 도급계약 체결 단계를 다룬 것으로, 착공 이후 42개월 공사기간 중 물가 변동에 따라 공사비가 조정될 수 있는 단계입니다.\n\n*왜 골랐나*: 노원구 상계2구역 사업으로 우선순위 지역에 해당하고, 전체 공사비와 시공지분 비율이 구체적 금액으로 명시돼 있어서.\n\n### 2. 🔴 [노원구] 노원구, 재건축 기부채납 용적률 인센티브 확대 환영…추가 제도개선 건...\n\nnewstnt.com · 2026-09-15 · [원문](https://newstnt.com/news/articleView.html?idxno=718390)\n\n노원구가 서울시의 2030 도시·주거환경정비기본계획 변경안을 환영했다. 상한용적률을 초과하는 기부채납에도 용적률 인센티브를 인정받게 됐고, 월계삼호4차·중계그린아파트가 대표 수혜 사례로 꼽힌다. 구는 재건축 임대주택 비율을 현행 50%에서 30%로 낮추고, 사업성 보정계수 상한을 2.0에서 3.0으로 올려달라고 서울시에 추가 건의했다.\n\n**정책 포인트**\n\n- 상한용적률을 초과하는 기부채납분도 용적률 인센티브로 인정\n- 재건축 임대주택 의무비율을 현행 50%에서 30%로 완화 건의\n- 사업성 보정계수 산정체계에 '분양가격 보정계수' 추가, 상한 2.0→3.0 확대 건의\n\n*왜 골랐나*: 노원구 우선지역이며, 임대주택 비율·사업성 보정계수 상한 조정 등 실제 제도 변경 내용이 구체적으로 담긴 정책 기사라서.\n\n### 3. 온천4구역, 비례율 162%로 조합 해산\n\n한국주택경제신문 · 2026-09-15 · [원문](https://arunews.com/news/articleView.html?idxno=67213)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 온천4구역 | 비례율 | 162% | — |\n| 온천4구역 | 일반분양가 | 1,959만원/3.3㎡ | — |\n\n부산 동래구 온천4구역이 비례율 162%를 기록하며 11월 중 조합 해산총회를 연다. 2018년 관리처분 당시 109.25%였던 비례율은 이후 변경과 입주를 거쳐 162%까지 올랐다. 조합은 2021년 HUG와 약 9개월간 협상 끝에 일반분양가를 3.3㎡당 1959만원으로 관철시켰다.\n\n> ⚠️ 비례율 162%는 온천4구역의 관리처분 이후 입주까지 거치며 확정된 값으로, 2018년 관리처분 당시 109.25%에서 변경된 수치입니다. 사업 초기 단계에서 제시되는 추정 비례율과는 성격이 다릅니다.\n> ⚠️ 일반분양가 3.3㎡당 1959만원은 HUG와 협상한 분양 수입 기준 수치이며, 조합원 개별 분담금이나 권리가액과는 별개의 숫자입니다.\n\n*왜 골랐나*: 비례율과 일반분양가가 협상 전후 수치까지 구체적으로 제시된, 사업 종료 단계의 드문 실사례라서.\n\n### 4. 신대방역세권 재개발, 한화·대우건설과 5,817억원 규모 도급계약 체결\n\n하우징헤럴드 · 2026-09-15 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62932)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 신대방역세권 | 총공사비 | 5,816억 9,900만원 | — |\n\n동작구 신대방역세권 재개발조합이 한화·대우건설 컨소시엄과 5,816억9,900만원 규모의 공사도급계약을 체결했다. 계약금·중도금 없이 입주 시점에 분담금 100%를 납부하도록 조건을 바꿨고, 착공 전 물가변동에 따른 공사비 인상분은 시공자가 일부 흡수하기로 했다.\n\n> ⚠️ 총공사비 5,817억원은 사업 전체 도급계약 금액으로, 조합원 개인의 분담금과는 다른 축의 수치입니다.\n> ⚠️ 계약금·중도금 없이 입주 시점에 분담금 100%를 납부하도록 조건이 바뀌었다는 점은 자금 납부 시기의 변화이지, 분담금 총액 자체가 확정됐다는 의미는 아닙니다.\n\n*왜 골랐나*: 총공사비 실수치와 함께 분담금 납부 방식 변경이라는 구체적 계약 조건이 드러난 기사라서.\n\n### 5. 분양가상한제 기본형건축비 오른다...평당 232만8000원\n\n파이낸셜뉴스 · 2026-09-14 · [원문](https://fnnews.com/news/202609141036201441)\n\n같은 사건 보도: metroseoul.co.kr, 조선비즈\n\n국토부가 분양가상한제 기본형건축비를 16~25층·전용 60~85㎡ 기준 ㎡당 223만7000원에서 232만8000원으로 4.07% 인상해 9월 15일 고시했다. 간접공사비가 60만4000원에서 66만3000원으로 9.77% 오른 것이 인상폭 확대의 주요 요인이다. 개정 고시는 9월15일 이후 입주자모집 승인을 신청하는 단지부터 적용된다.\n\n**정책 포인트**\n\n- 분양가상한제 기본형건축비 정기고시, ㎡당 223만7000원→232만8000원(4.07% 인상)\n- 간접공사비 요율 상승(간접노무비 14.6%→18.1%, 기타경비 6.0%→6.9%)이 인상폭 확대 원인\n- 개정 고시는 9월15일 이후 입주자모집 승인 신청 단지부터 적용\n\n*왜 골랐나*: 특정 단지 수치는 아니지만, 분양가상한제 적용 사업장 전체의 분양가 산정 기준을 바꾸는 제도 변화라서.\n\n## 인사이트\n\n- 노원구는 정비기본계획 변경(용적률 인센티브 확대)과 상계2구역 공사도급계약이 같은 주에 겹치며, 제도 건의와 실제 사업 진행이 동시에 나타나고 있다.[1][2]\n- 국토부의 기본형건축비 4.07% 인상은 분양가상한제 적용 지역의 분양가 산정 기준선을 끌어올리는 요인으로, 목동4단지처럼 평당 1000만원대 공사비를 제시하는 사업장이 늘어날 가능성과 맞물린다.[3][4]\n- 온천4구역 사례는 조정지역 내 HUG와의 분양가 협상에서 조합의 협상력이 최종 비례율(사업 수익성)에 크게 영향을 줄 수 있음을 보여준다.[5]\n- 신대방역세권처럼 분담금을 계약금·중도금 없이 입주 시점 일괄 납부로 조정하는 계약 조건이 최근 등장하고 있어, 공사비 규모 못지않게 납부 방식 협상이 조합원 자금 부담에 영향을 준다.[6]\n\n## 오늘의 개념\n\n### 비례율\n\n비례율은 재건축·재개발 사업에서 종전 자산평가액 대비 사업 종료 시점의 개발이익을 나타내는 지표다. 100%를 넘으면 조합원이 종전 자산가치보다 더 많은 이익을 얻는다는 뜻으로 통상 해석된다.\n\n*오늘*: 온천4구역이 2018년 관리처분 당시 109.25%였던 비례율을 조합 해산 시점 162%까지 끌어올린 사례가 오늘 보도됐다.[5]\n\n### 사업성 보정계수\n\n사업성 보정계수는 정비사업의 사업성을 평가해 일반분양 물량 등 인센티브를 조정하는 데 쓰이는 계수다. 상한이 높을수록 사업성이 낮은 지역에서도 일반분양 비율을 더 늘릴 여지가 생긴다.\n\n*오늘*: 노원구가 이 상한을 현행 2.0에서 3.0으로 올려달라고 서울시에 건의했다. 상한이 올라가면 상계주공처럼 사업성이 낮은 노원구 단지의 일반분양 물량을 늘려 분담금 부담을 줄이는 방향으로 작동한다.[1]\n\n### 기본형건축비\n\n기본형건축비는 분양가상한제가 적용되는 아파트의 분양가 상한을 구성하는 기준 항목 중 하나다. 국토부가 매년 3월과 9월 정기적으로 고시하며, 건설자재 가격이 급등할 경우 비정기로도 조정한다.\n\n*오늘*: 국토부가 이번 정기고시에서 기본형건축비를 ㎡당 232만8000원으로 4.07% 인상했다. 이는 분양가상한제 적용 지역 정비사업의 분양가 산정 기준선이 올라간다는 의미다.[3]\n\n## 참고 원문\n\n1. 노원구, 재건축 기부채납 용적률 인센티브 확대 환영…추가 제도개선 건... — newstnt.com · [원문](https://newstnt.com/news/articleView.html?idxno=718390)\n2. 동부건설, 13.7조 일감 '수익 전환' 본격화…2756억 정비사업·플랜트 54... — upkoreanews.kr · [원문](https://upkoreanews.kr/news/articleView.html?idxno=100218)\n3. 분양가상한제 기본형건축비 오른다...평당 232만8000원 — 파이낸셜뉴스 · [원문](https://fnnews.com/news/202609141036201441)\n4. [단독]목동 재건축 공사비 첫 ‘1000만원대’…4단지, 다음주 시공사 공... — MTN 머니투데이방송 · [원문](https://news.mtn.co.kr/news-detail/2026091411565811671)\n5. 온천4구역, 비례율 162%로 조합 해산 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=67213)\n6. 신대방역세권 재개발, 한화·대우건설과 5,817억원 규모 도급계약 체결 — 하우징헤럴드 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62932)\n\n## 오늘 흘려보낸 것\n\n중복 51건 · 후속보도 신규정보 없음 1건 · 기준 미달 487건\n"}], "facts": [{"date": "2026-09-16", "complex": "상계주공", "region": "노원구", "metric": "분담금", "value": 6.0, "unit": "억원", "stage": null, "quote": "상계주공의 경우 추가 분담금이 6억~7억으로 거론되고 있음에도 노원역 일대의 뛰어난 교통과 상권, 병원 등 우수한 인프라를 갖추고 있어 실수요자들의 진입이 이어지고 있다", "url": "https://newsis.com/view/NISX20260915_0003790667", "thread_id": "sanggye-6", "ambiguous": true}, {"date": "2026-09-16", "complex": "상계주공", "region": "노원구", "metric": "분담금", "value": 7.0, "unit": "억원", "stage": null, "quote": "상계주공의 경우 추가 분담금이 6억~7억으로 거론되고 있음에도 노원역 일대의 뛰어난 교통과 상권, 병원 등 우수한 인프라를 갖추고 있어 실수요자들의 진입이 이어지고 있다", "url": "https://newsis.com/view/NISX20260915_0003790667", "thread_id": "sanggye-6", "ambiguous": true}, {"date": "2026-09-23", "complex": "상계주공5단지", "region": "노원구", "metric": "분담금", "value": 50000.0, "unit": "만원", "stage": null, "quote": "신축 전용 84㎡ 배정 시 5억 원대 이상의 추가분담금이 책정되며 시공사 계약 해지와 사업계획 변경 등 적잖은 진통을 겪었다.", "url": "https://news2day.co.kr/article/20260921500283", "thread_id": "sanggye-5", "ambiguous": false}, {"date": "2026-09-28", "complex": "상계주공6단지", "region": "노원구", "metric": "분담금", "value": 76500.0, "unit": "만원", "stage": "추진위원회승인", "quote": "상계주공 6단지 전용 32㎡ 소유자가 재건축 후 전용 84㎡를 선택할 경우 추가 분담금은 약 7억6500만원으로 추산된다.", "url": "https://etoday.co.kr/news/view/2629135", "thread_id": "sanggye-6", "ambiguous": false}, {"date": "2026-09-28", "complex": "상계주공5단지", "region": "노원구", "metric": "분담금", "value": 50000.0, "unit": "만원", "stage": null, "quote": "상계주공 5단지에서도 과거 공사비를 둘러싼
