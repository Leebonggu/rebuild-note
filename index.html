<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재건축 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --ground:#F5F7FA; --surface:#FFFFFF; --ink:#12233A; --body:#2C3B4E;
    --muted:#5C6B7F; --rule:#DBE2EB; --rail:#C6D2E0;
    --accent:#1E5F9E; --accent-soft:#E8F0F8;
    --warn:#9A5B00; --warn-soft:#FBF1E0; --warn-rule:#E4C99A;
    --serif:"Noto Serif KR",Georgia,serif;
    --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0E1620; --surface:#151F2C; --ink:#E6EDF5; --body:#C3CEDB;
    --muted:#8798AB; --rule:#26323F; --rail:#33445A;
    --accent:#6FB0E8; --accent-soft:#16283A;
    --warn:#E0A75B; --warn-soft:#2A2114; --warn-rule:#5A4726; }}
  :root[data-theme="dark"]{
    --ground:#0E1620; --surface:#151F2C; --ink:#E6EDF5; --body:#C3CEDB;
    --muted:#8798AB; --rule:#26323F; --rail:#33445A;
    --accent:#6FB0E8; --accent-soft:#16283A;
    --warn:#E0A75B; --warn-soft:#2A2114; --warn-rule:#5A4726; }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--body);font-family:var(--sans);
       font-size:17px;line-height:1.85;margin:0;padding:0 22px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding-block:0 88px}
  h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
  a{color:var(--accent);text-underline-offset:3px}
  .num{font-variant-numeric:tabular-nums}

  header{border-bottom:2px solid var(--ink);padding-block:44px 16px}
  .kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,42px);line-height:1.22;margin-top:10px}
  .sub{font-size:15px;color:var(--muted);margin-top:12px}

  nav{display:flex;flex-wrap:wrap;gap:4px;margin:26px 0 8px;
      border-bottom:1px solid var(--rule);padding-bottom:0}
  nav button{font-family:var(--sans);font-size:15.5px;font-weight:500;color:var(--muted);
    background:none;border:0;border-bottom:2px solid transparent;
    padding:10px 14px;cursor:pointer;margin-bottom:-1px}
  nav button:hover{color:var(--ink)}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  .panel{padding-top:26px}
  .empty{color:var(--muted);font-size:15.5px;background:var(--surface);
         border:1px dashed var(--rule);border-radius:4px;padding:22px}

  /* 추이 */
  .metric-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
  .metric-pick button{font-size:14px;font-family:var(--sans);color:var(--muted);
    background:var(--surface);border:1px solid var(--rule);border-radius:999px;
    padding:5px 14px;cursor:pointer}
  .metric-pick button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);
    background:var(--accent-soft);font-weight:600}
  .chart-box{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
             padding:18px 14px 10px;overflow-x:auto}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:14px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .pts{margin-top:24px;display:flex;flex-direction:column;gap:14px}
  .pt{border-left:3px solid var(--rail);padding-left:14px;font-size:15px}
  .pt b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pt .q{display:block;color:var(--muted);font-size:14px;margin-top:4px}
  .chip{font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);
        border:1px solid var(--warn-rule);border-radius:3px;padding:1px 7px;margin-left:6px}

  /* 단지 */
  .thread{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
          padding:20px;margin-bottom:16px}
  .thread h3{font-family:var(--serif);font-size:19px;font-weight:700}
  .thread .meta{font-size:14px;color:var(--muted);margin-top:6px}
  .thread ol{margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:15px}

  /* 용어 */
  .term{padding:14px 0;border-bottom:1px solid var(--rule);display:flex;
        justify-content:space-between;gap:14px;align-items:baseline}
  .term b{font-family:var(--serif);font-size:17px;color:var(--ink)}
  .term span{font-size:14px;color:var(--muted);white-space:nowrap}

  /* 지난 글 */
  .archive{display:flex;flex-direction:column;gap:2px}
  .archive button{text-align:left;font-family:var(--sans);font-size:16px;color:var(--accent);
    background:none;border:0;border-bottom:1px solid var(--rule);padding:13px 2px;cursor:pointer}
  .archive button[aria-pressed="true"]{color:var(--ink);font-weight:600}

  /* 마크다운 본문 */
  .md h1{display:none}
  .md h2{font-family:var(--serif);font-size:15px;letter-spacing:.06em;color:var(--ink);
         border-bottom:1px solid var(--rule);padding-bottom:9px;margin:44px 0 22px}
  .md h3{font-family:var(--serif);font-size:21px;line-height:1.45;font-weight:500;margin:30px 0 0}
  .md p{margin:14px 0 0}
  .md blockquote{margin:16px 0 0;background:var(--warn-soft);border:1px solid var(--warn-rule);
    border-left-width:4px;border-radius:3px;padding:13px 16px;font-size:15.5px;color:var(--body)}
  .md blockquote p{margin:0}
  .md table{border-collapse:collapse;width:100%;margin:16px 0 0;font-size:15px}
  .md th,.md td{border:1px solid var(--rule);padding:8px 11px;text-align:left}
  .md th{background:var(--accent-soft);color:var(--ink);font-weight:600}
  .md td{font-variant-numeric:tabular-nums}
  .md ol,.md ul{margin:14px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:9px}
  .md em{color:var(--muted);font-style:normal;font-size:15px}
  .md hr{border:0;border-top:1px solid var(--rule);margin:34px 0}
  .md > *:first-child{margin-top:0}

  footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);
         font-size:14px;line-height:1.8;color:var(--muted)}
  @media (max-width:430px){ nav button{padding:9px 10px;font-size:14.5px} }
</style>
</head><body>
<div class="wrap">
<header>
  <div class="kicker">노원 · 상계주공 우선</div>
  <h1>재건축 노트</h1>
  <div class="sub" id="sub"></div>
</header>

<nav role="tablist" id="tabs"></nav>
<div id="panel" class="panel" role="tabpanel"></div>

  이 페이지는 <code>python3 -m pipeline.site</code> 로 매일 다시 구워진다.
</footer>
</div>

/3.3㎡ | — |\n\n부산 동래구 온천4구역이 비례율 162%를 기록하며 11월 중 조합 해산총회를 연다. 2018년 관리처분 당시 109.25%였던 비례율은 이후 변경과 입주를 거쳐 162%까지 올랐다. 조합은 2021년 HUG와 약 9개월간 협상 끝에 일반분양가를 3.3㎡당 1959만원으로 관철시켰다.\n\n> ⚠️ 비례율 162%는 온천4구역의 관리처분 이후 입주까지 거치며 확정된 값으로, 2018년 관리처분 당시 109.25%에서 변경된 수치입니다. 사업 초기 단계에서 제시되는 추정 비례율과는 성격이 다릅니다.\n> ⚠️ 일반분양가 3.3㎡당 1959만원은 HUG와 협상한 분양 수입 기준 수치이며, 조합원 개별 분담금이나 권리가액과는 별개의 숫자입니다.\n\n*왜 골랐나*: 비례율과 일반분양가가 협상 전후 수치까지 구체적으로 제시된, 사업 종료 단계의 드문 실사례라서.\n\n### 4. 신대방역세권 재개발, 한화·대우건설과 5,817억원 규모 도급계약 체결\n\n하우징헤럴드 · 2026-09-15 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62932)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 신대방역세권 | 총공사비 | 5,816억 9,900만원 | — |\n\n동작구 신대방역세권 재개발조합이 한화·대우건설 컨소시엄과 5,816억9,900만원 규모의 공사도급계약을 체결했다. 계약금·중도금 없이 입주 시점에 분담금 100%를 납부하도록 조건을 바꿨고, 착공 전 물가변동에 따른 공사비 인상분은 시공자가 일부 흡수하기로 했다.\n\n> ⚠️ 총공사비 5,817억원은 사업 전체 도급계약 금액으로, 조합원 개인의 분담금과는 다른 축의 수치입니다.\n> ⚠️ 계약금·중도금 없이 입주 시점에 분담금 100%를 납부하도록 조건이 바뀌었다는 점은 자금 납부 시기의 변화이지, 분담금 총액 자체가 확정됐다는 의미는 아닙니다.\n\n*왜 골랐나*: 총공사비 실수치와 함께 분담금 납부 방식 변경이라는 구체적 계약 조건이 드러난 기사라서.\n\n### 5. 분양가상한제 기본형건축비 오른다...평당 232만8000원\n\n파이낸셜뉴스 · 2026-09-14 · [원문](https://fnnews.com/news/202609141036201441)\n\n같은 사건 보도: metroseoul.co.kr, 조선비즈\n\n국토부가 분양가상한제 기본형건축비를 16~25층·전용 60~85㎡ 기준 ㎡당 223만7000원에서 232만8000원으로 4.07% 인상해 9월 15일 고시했다. 간접공사비가 60만4000원에서 66만3000원으로 9.77% 오른 것이 인상폭 확대의 주요 요인이다. 개정 고시는 9월15일 이후 입주자모집 승인을 신청하는 단지부터 적용된다.\n\n**정책 포인트**\n\n- 분양가상한제 기본형건축비 정기고시, ㎡당 223만7000원→232만8000원(4.07% 인상)\n- 간접공사비 요율 상승(간접노무비 14.6%→18.1%, 기타경비 6.0%→6.9%)이 인상폭 확대 원인\n- 개정 고시는 9월15일 이후 입주자모집 승인 신청 단지부터 적용\n\n*왜 골랐나*: 특정 단지 수치는 아니지만, 분양가상한제 적용 사업장 전체의 분양가 산정 기준을 바꾸는 제도 변화라서.\n\n## 인사이트\n\n- 노원구는 정비기본계획 변경(용적률 인센티브 확대)과 상계2구역 공사도급계약이 같은 주에 겹치며, 제도 건의와 실제 사업 진행이 동시에 나타나고 있다.[1][2]\n- 국토부의 기본형건축비 4.07% 인상은 분양가상한제 적용 지역의 분양가 산정 기준선을 끌어올리는 요인으로, 목동4단지처럼 평당 1000만원대 공사비를 제시하는 사업장이 늘어날 가능성과 맞물린다.[3][4]\n- 온천4구역 사례는 조정지역 내 HUG와의 분양가 협상에서 조합의 협상력이 최종 비례율(사업 수익성)에 크게 영향을 줄 수 있음을 보여준다.[5]\n- 신대방역세권처럼 분담금을 계약금·중도금 없이 입주 시점 일괄 납부로 조정하는 계약 조건이 최근 등장하고 있어, 공사비 규모 못지않게 납부 방식 협상이 조합원 자금 부담에 영향을 준다.[6]\n\n## 오늘의 개념\n\n### 비례율\n\n비례율은 재건축·재개발 사업에서 종전 자산평가액 대비 사업 종료 시점의 개발이익을 나타내는 지표다. 100%를 넘으면 조합원이 종전 자산가치보다 더 많은 이익을 얻는다는 뜻으로 통상 해석된다.\n\n*오늘*: 온천4구역이 2018년 관리처분 당시 109.25%였던 비례율을 조합 해산 시점 162%까지 끌어올린 사례가 오늘 보도됐다.[5]\n\n### 사업성 보정계수\n\n사업성 보정계수는 정비사업의 사업성을 평가해 일반분양 물량 등 인센티브를 조정하는 데 쓰이는 계수다. 상한이 높을수록 사업성이 낮은 지역에서도 일반분양 비율을 더 늘릴 여지가 생긴다.\n\n*오늘*: 노원구가 이 상한을 현행 2.0에서 3.0으로 올려달라고 서울시에 건의했다. 상한이 올라가면 상계주공처럼 사업성이 낮은 노원구 단지의 일반분양 물량을 늘려 분담금 부담을 줄이는 방향으로 작동한다.[1]\n\n### 기본형건축비\n\n기본형건축비는 분양가상한제가 적용되는 아파트의 분양가 상한을 구성하는 기준 항목 중 하나다. 국토부가 매년 3월과 9월 정기적으로 고시하며, 건설자재 가격이 급등할 경우 비정기로도 조정한다.\n\n*오늘*: 국토부가 이번 정기고시에서 기본형건축비를 ㎡당 232만8000원으로 4.07% 인상했다. 이는 분양가상한제 적용 지역 정비사업의 분양가 산정 기준선이 올라간다는 의미다.[3]\n\n## 참고 원문\n\n1. 노원구, 재건축 기부채납 용적률 인센티브 확대 환영…추가 제도개선 건... — newstnt.com · [원문](https://newstnt.com/news/articleView.html?idxno=718390)\n2. 동부건설, 13.7조 일감 '수익 전환' 본격화…2756억 정비사업·플랜트 54... — upkoreanews.kr · [원문](https://upkoreanews.kr/news/articleView.html?idxno=100218)\n3. 분양가상한제 기본형건축비 오른다...평당 232만8000원 — 파이낸셜뉴스 · [원문](https://fnnews.com/news/202609141036201441)\n4. [단독]목동 재건축 공사비 첫 ‘1000만원대’…4단지, 다음주 시공사 공... — MTN 머니투데이방송 · [원문](https://news.mtn.co.kr/news-detail/2026091411565811671)\n5. 온천4구역, 비례율 162%로 조합 해산 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=67213)\n6. 신대방역세권 재개발, 한화·대우건설과 5,817억원 규모 도급계약 체결 — 하우징헤럴드 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62932)\n\n## 오늘 흘려보낸 것\n\n중복 51건 · 후속보도 신규정보 없음 1건 · 기준 미달 487건\n"}], "facts": [{"date": "2026-09-16", "complex": "상계주공", "region": "노원구", "metric": "분담금", "value": 6.0, "unit": "억원", "stage": null, "quote": "상계주공의 경우 추가 분담금이 6억~7억으로 거론되고 있음에도 노원역 일대의 뛰어난 교통과 상권, 병원 등 우수한 인프라를 갖추고 있어 실수요자들의 진입이 이어지고 있다", "url": "https://newsis.com/view/NISX20260915_0003790667", "thread_id": "sanggye-6", "ambiguous": true}, {"date": "2026-09-16", "complex": "상계주공", "region": "노원구", "metric": "분담금", "value": 7.0, "unit": "억원", "stage": null, "quote   if(!pickedMetric || !metrics.includes(pickedMetric)) pickedMetric = metrics[0];
  const rows = facts.filter(f=>f.metric===pickedMetric);

  const picker = `<div class="metric-pick">${metrics.map(m=>
    `<button type="button" data-metric="${esc(m)}" aria-pressed="${m===pickedMetric}">${esc(m)}</button>`
  ).join("")}</div>`;

  const groups = {};
  rows.forEach(f=>{ (groups[seriesKey(f)] ||= []).push(f); });
  const keys = Object.keys(groups);
  const dates = [...new Set(rows.map(f=>f.date))].sort();
  const vals = rows.map(f=>f.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(lo===hi){ lo = lo*0.9 || 0; hi = hi*1.1 || 1; }
  const pad = (hi-lo)*0.12; lo -= pad; hi += pad;

  const W=660,H=280,L=78,R=18,T=18,B=44;
  const px = d => dates.length<2 ? L+(W-L-R)/2
            : L + (dates.indexOf(d)/(dates.length-1))*(W-L-R);
  const py = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);

  const ticks = [0,.25,.5,.75,1].map(t=>{
    const v = lo+(hi-lo)*t, y = py(v);
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--rule)" stroke-width="1"/>
      <text x="${L-9}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(Math.round(v))}</text>`;
  }).join("");

  const lines = keys.map((k,i)=>{
    const c = PALETTE[i%PALETTE.length];
    const pts = groups[k].slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const path = pts.map((f,j)=>`${j?"L":"M"}${px(f.date).toFixed(1)},${py(f.value).toFixed(1)}`).join(" ");
    const dots = pts.map(f=>`<circle cx="${px(f.date).toFixed(1)}" cy="${py(f.value).toFixed(1)}" r="4.5"
      fill="${c}"><title>${esc(f.complex)} ${fmt(f.value)}${esc(f.unit)} (${esc(f.date)})</title></circle>`).join("");
    return `<path d="${path}" fill="none" stroke="${c}" stroke-width="2"
      ${pts.some(p=>p.ambiguous)?'stroke-dasharray="5 4"':""}/>${dots}`;
  }).join("");

  const xlab = dates.map(d=>`<text x="${px(d).toFixed(1)}" y="${H-16}" text-anchor="middle"
    font-size="12" fill="var(--muted)">${esc(d.slice(5))}</text>`).join("");

  const legend = keys.map((k,i)=>
    `<span><i style="background:${PALETTE[i%PALETTE.length]}"></i>${esc(k)}</span>`).join("");

  const pts = rows.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(f=>`
    <div class="pt"><b>${fmt(f.value)}${esc(f.unit)}</b> · ${esc(f.complex)}
      ${f.stage?` · ${esc(f.stage)}`:""}${f.ambiguous?'<span class="chip">전제 불명</span>':""}
      <span class="q">${esc(f.date)} · ${esc((f.quote||"").slice(0,110))}${(f.quote||"").length>110?"…":""}
      ${f.url?` <a href="${esc(f.url)}">원문</a>`:""}</span></div>`).join("");

  return picker + `<div class="chart-box">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
         aria-label="${esc(pickedMetric)} 추이">${ticks}${lines}${xlab}</svg>
    </div><div class="legend">${legend}</div><div class="pts">${pts}</div>`;
}

/* ── 단지 ── */
function renderThreads(){
  if(!DATA.threads.length) return `<div class="empty">아직 추적 중인 단지가 없습니다.</div>`;
  return DATA.threads.map(t=>`<div class="thread">
    <h3>${esc(t.title)}</h3>
    <div class="meta">${esc(t.id)} · 기사 ${t.count}건 · 최근 ${esc(t.last_seen||"-")}</div>
    <ol>${t.known_facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ol></div>`).join("");
}

/* ── 용어 ── */
function renderTerms(){
  if(!DATA.terms.length) return `<div class="empty">아직 정리된 개념이 없습니다.
    다이제스트의 <b>오늘의 개념</b> 에서 설명한 용어가 여기 쌓입니다.</div>`;
  return DATA.terms.map(t=>`<div class="term"><b>${esc(t.term)}</b>
    <span>${esc(t.first||"")}${t.count>1?` · ${t.count}회`:""}</span></div>`).join("");
}

/* ── 다이제스트 ── */
let pickedDate = null;
function md(src){ return marked.parse(src, {gfm:true, breaks:false}); }
function renderToday(){
  if(!DATA.digests.length) return `<div class="empty">아직 발행된 다이제스트가 없습니다.</div>`;
  return `<div class="md">${md(DATA.digests[0].markdown)}</div>`;
}
function renderArchive(){
  if(!DATA.digests.length) return `<div class="empty">아직 발행된 다이제스트가 없습니다.</div>`;
  if(!pickedDate) pickedDate = DATA.digests[0].date;
  const list = `<div class="archive">${DATA.digests.map(d=>
    `<button type="button" data-date="${d.date}" aria-pressed="${d.date===pickedDate}">${d.date}</button>`
  ).join("")}</div>`;
  const doc = DATA.digests.find(d=>d.date===pickedDate);
  return list + `<div class="md" style="margin-top:32px">${md(doc.markdown)}</div>`;
}

const TABS = [
  ["오늘",  renderToday],
  ["추이",  renderTrend],
  ["단지",  renderThreads],
  ["용어",  renderTerms],
  ["지난 글", renderArchive],
];
let active = 0;

function draw(){
  $("#tabs").innerHTML = TABS.map(([name],i)=>
    `<button type="button" role="tab" data-i="${i}" aria-selected="${i===active}">${name}</button>`).join("");
  $("#panel").innerHTML = TABS[active][1]();
}

document.addEventListener("click", e=>{
  const tab = e.target.closest("#tabs button");
  if(tab){ active = +tab.dataset.i; draw(); return; }
  const m = e.target.closest("[data-metric]");
  if(m){ pickedMetric = m.dataset.metric; draw(); return; }
  const d = e.target.closest("[data-date]");
  if(d){ pickedDate = d.dataset.date; draw(); }
});

$("#sub").textContent =
  `${DATA.generated} 기준 · 다이제스트 ${DATA.digests.length}건 · 누적 수치 ${DATA.facts.length}건 · 추적 단지 ${DATA.threads.length}곳`;
draw();
</script>
</body></html>
