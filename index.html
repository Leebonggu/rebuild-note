<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재건축 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --ground:#F5F7FA; --surface:#FFFFFF; --ink:#12233A; --body:#2C3B4E;
    --muted:#5C6B7F; --rule:#DBE2EB; --rail:#C6D2E0;
    --accent:#1E5F9E; --accent-soft:#E8F0F8;
    --warn:#9A5B00; --warn-soft:#FBF1E0; --warn-rule:#E4C99A;
    --serif:"Noto Serif KR",Georgia,serif;
    --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0E1620; --surface:#151F2C; --ink:#E6EDF5; --body:#C3CEDB;
    --muted:#8798AB; --rule:#26323F; --rail:#33445A;
    --accent:#6FB0E8; --accent-soft:#16283A;
    --warn:#E0A75B; --warn-soft:#2A2114; --warn-rule:#5A4726; }}
  :root[data-theme="dark"]{
    --ground:#0E1620; --surface:#151F2C; --ink:#E6EDF5; --body:#C3CEDB;
    --muted:#8798AB; --rule:#26323F; --rail:#33445A;
    --accent:#6FB0E8; --accent-soft:#16283A;
    --warn:#E0A75B; --warn-soft:#2A2114; --warn-rule:#5A4726; }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--body);font-family:var(--sans);
       font-size:17px;line-height:1.85;margin:0;padding:0 22px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding-block:0 88px}
  h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
  a{color:var(--accent);text-underline-offset:3px}
  .num{font-variant-numeric:tabular-nums}

  header{border-bottom:2px solid var(--ink);padding-block:44px 16px}
  .kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,42px);line-height:1.22;margin-top:10px}
  .sub{font-size:15px;color:var(--muted);margin-top:12px}

  nav{display:flex;flex-wrap:wrap;gap:4px;margin:26px 0 8px;
      border-bottom:1px solid var(--rule);padding-bottom:0}
  nav button{font-family:var(--sans);font-size:15.5px;font-weight:500;color:var(--muted);
    background:none;border:0;border-bottom:2px solid transparent;
    padding:10px 14px;cursor:pointer;margin-bottom:-1px}
  nav button:hover{color:var(--ink)}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  .panel{padding-top:26px}
  .empty{color:var(--muted);font-size:15.5px;background:var(--surface);
         border:1px dashed var(--rule);border-radius:4px;padding:22px}

  /* 추이 */
  .metric-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
  .metric-pick button{font-size:14px;font-family:var(--sans);color:var(--muted);
    background:var(--surface);border:1px solid var(--rule);border-radius:999px;
    padding:5px 14px;cursor:pointer}
  .metric-pick button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);
    background:var(--accent-soft);font-weight:600}
  .chart-box{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
             padding:18px 14px 10px;overflow-x:auto}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:14px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .pts{margin-top:24px;display:flex;flex-direction:column;gap:14px}
  .pt{border-left:3px solid var(--rail);padding-left:14px;font-size:15px}
  .pt b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pt .q{display:block;color:var(--muted);font-size:14px;margin-top:4px}
  .chip{font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);
        border:1px solid var(--warn-rule);border-radius:3px;padding:1px 7px;margin-left:6px}

  /* 단지 */
  .thread{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
          padding:20px;margin-bottom:16px}
  .thread h3{font-family:var(--serif);font-size:19px;font-weight:700}
  .thread .meta{font-size:14px;color:var(--muted);margin-top:6px}
  .thread ol{margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:15px}

  /* 용어 */
  .term{padding:14px 0;border-bottom:1px solid var(--rule);display:flex;
        justify-content:space-between;gap:14px;align-items:baseline}
  .term b{font-family:var(--serif);font-size:17px;color:var(--ink)}
  .term span{font-size:14px;color:var(--muted);white-space:nowrap}

  /* 지난 글 */
  .archive{display:flex;flex-direction:column;gap:2px}
  .archive button{text-align:left;font-family:var(--sans);font-size:16px;color:var(--accent);
    background:none;border:0;border-bottom:1px solid var(--rule);padding:13px 2px;cursor:pointer}
  .archive button[aria-pressed="true"]{color:var(--ink);font-weight:600}

  /* 마크다운 본문 */
  .md h1{display:none}
  .md h2{font-family:var(--serif);font-size:15px;letter-spacing:.06em;color:var(--ink);
         border-bottom:1px solid var(--rule);padding-bottom:9px;margin:44px 0 22px}
  .md h3{font-family:var(--serif);font-size:21px;line-height:1.45;font-weight:500;margin:30px 0 0}
  .md p{margin:14px 0 0}
  .md blockquote{margin:16px 0 0;background:var(--warn-soft);border:1px solid var(--warn-rule);
    border-left-width:4px;border-radius:3px;padding:13px 16px;font-size:15.5px;color:var(--body)}
  .md blockquote p{margin:0}
  .md table{border-collapse:collapse;width:100%;margin:16px 0 0;font-size:15px}
  .md th,.md td{border:1px solid var(--rule);padding:8px 11px;text-align:left}
  .md th{background:var(--accent-soft);color:var(--ink);font-weight:600}
  .md td{font-variant-numeric:tabular-nums}
  .md ol,.md ul{margin:14px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:9px}
  .md em{color:var(--muted);font-style:normal;font-size:15px}
  .md hr{border:0;border-top:1px solid var(--rule);margin:34px 0}
  .md > *:first-child{margin-top:0}

  footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);
         font-size:14px;line-height:1.8;color:var(--muted)}
  @media (max-width:430px){ nav button{padding:9px 10px;font-size:14.5px} }
</style>
</head><body>
<div class="wrap">
<header>
  <div class="kicker">노원 · 상계주공 우선</div>
  <h1>재건축 노트</h1>
  <div class="sub" id="sub"></div>
</header>

<nav role="tablist" id="tabs"></nav>
<div id="panel" class="panel" role="tabpanel"></div>

<footer>
  수치는 모두 기사 원문에 실린 값이다. <span class="chip">전제 불명</span> 은 종전 면적·신청 평형이
  기사에 없다는 뜻으로, 같은 단지라도 보유 면적에 따라 분담금은 크게 달라진다.<br>
  이 페이지는 <code>python3 -m pipeline.site</code> 로 매일 다시 구워진다.
</footer>
</div>

const DATA = {"generated": "2026-09-20", "digests": [{"date": "2026-09-20", "markdown": "# 2026-09-20 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 상계주공·목동 재건축 단지들이 증여 건수 1·2위에 오르며 비강남권 재건축 기대감이 자산 이전 수요로 이어지고 있다는 점이 확인됐다. 노원구 태릉지구 현장 점검에서는 총리가 재개발 동의율 완화 방침을 언급해 조합 설립 절차 전반에 영향을 줄 수 있는 제도 변화가 예고됐다. 건설 전문가는 아파트 평당 공사비가 코로나19 이전 대비 약 30% 올라 700만~800만원대에 이르렀다고 분석했지만, 특정 사업장의 분담금이나 조합원분양가를 구체적으로 제시한 보도는 오늘 눈에 띄지 않았다. 전반적으로 시황·증여 통계 위주의 기사가 많았고, 사업장 단위의 실제 비용 수치는 상대적으로 드문 하루였다.\n\n## 선별 3건\n\n### 1. 🔴 [상계주공] 서울 아파트 증여 재건축 쏠려…목동·상계 1·2위\n\nhansbiz.co.kr · 2026-09-20 · [원문](http://hansbiz.co.kr/news/articleView.html?idxno=866843)\n\n국민의힘 김종양 의원실이 대법원에서 받은 국정감사 자료에 따르면 올해 1~6월 서울 아파트 증여 건수 1위는 양천구 목동신시가지(102건), 2위는 노원구 상계주공(95건)으로 강남권 주요 단지를 제쳤다. 노원구 중계주공5단지도 11건으로 상위 20위에 포함됐다. 재건축 기대감과 세제 강화 기조가 증여를 서두르게 한 배경으로 거론됐다.\n\n*왜 골랐나*: 상계주공·노원구가 국정감사 자료를 근거로 강남권을 제치고 증여 건수 1·2위에 올랐다는 구체적 데이터가 있어 최우선 기준에 부합한다.\n\n### 2. 🔴 [노원구] 한성숙 총리, ‘태릉지구 주택공급 정책 실행력 가늠자 될 것’ 2029년 착...\n\n브릿지경제 · 2026-09-19 · [원문](https://viva100.com/article/20260919500006)\n\n한성숙 국무총리가 노원구 태릉지구 사업 현장을 점검하며 2029년 착공 일정 준수를 강조했다. 총리는 인허가 간소화로 조성 기간을 68개월에서 37개월로 단축했고, 재개발 동의율도 낮췄다고 밝혔다. 태릉지구는 세계유산 보존 문제로 유네스코 협의를 마무리한 뒤 착공 일정을 진행할 계획이다.\n\n**정책 포인트**\n\n- 재개발 동의율 완화 및 인허가 간소화로 조성 기간을 68개월에서 37개월로 단축한다는 방침이 언급됨\n\n*왜 골랐나*: 노원구 소재 사업 현장 소식이면서, 재개발 동의율 완화라는 제도 변화가 언급돼 다른 조합 설립 절차에도 영향을 줄 수 있는 정책 정보다.\n\n### 3. \"단순 자재값 문제 아니다\"…아파트 공사비 폭등 뒤에 숨은 복합 원인\n\n뉴시스 · 2026-09-20 · [원문](https://newsis.com/view/NISX20260915_0003790609)\n\n최도영 고려사이버대 교수는 최근 아파트 공사비가 코로나19 이전 500만원대 초반에서 평당 700만~800만원대까지 약 30% 올랐다고 분석했다. 유가 상승, 노동생산성 저하(2017년 대비 27.6% 감소), 안전관리 강화, 브랜드 고급화 경쟁이 복합적으로 작용했다고 설명했다. 한 재개발 현장에서는 일반 브랜드 대비 고급 브랜드 전환만으로 평당 공사비가 592만원에서 882만원으로 오른 사례도 소개됐다.\n\n*왜 골랐나*: 특정 단지명은 없지만 평당공사비의 구체적 범위와 브랜드 고급화에 따른 실제 인상 사례(592만원→882만원)가 담긴 몇 안 되는 수치 기사다.\n\n## 인사이트\n\n- 증여 데이터에서 목동신시가지(102건)와 상계주공(95건)이 강남권 주요 단지들을 제치고 1·2위에 올라, 비강남권 재건축 기대감이 자산 이전 수요로 이어지고 있음을 보여준다.[1]\n- 노원구 태릉지구 사업에서 정부가 재개발 동의율을 낮추는 방안을 언급한 것은 태릉지구뿐 아니라 다른 재건축·재개발 조합의 설립 절차 문턱에도 영향을 줄 수 있는 제도 변화다.[2]\n- 전문가 분석에 따르면 최근 아파트 평당 공사비는 700만~800만원대로 코로나19 이전(500만원대 초반) 대비 크게 올랐고, 한 재개발 현장에서는 브랜드 고급화만으로 평당 공사비가 592만원에서 882만원으로 뛴 사례도 확인된다.[3][4]\n\n## 오늘의 개념\n\n### 재개발 동의율\n\n재개발·재건축 사업을 진행하려면 토지등소유자 중 일정 비율 이상의 동의를 얻어야 조합 설립이나 사업시행 등 각 단계로 넘어갈 수 있다. 이 동의율 요건이 낮아지면 사업 추진 속도가 빨라질 수 있지만, 반대 의견을 가진 소유주의 목소리가 반영되기 어려워질 수 있다.\n\n*오늘*: 국무총리가 노원구 태릉지구 점검에서 재개발 동의율을 낮추는 방안을 언급하며, 향후 다른 재건축·재개발 조합의 설립 절차 문턱도 낮아질 가능성을 시사했다.[2]\n\n## 참고 원문\n\n1. 서울 아파트 증여 재건축 쏠려…목동·상계 1·2위 — hansbiz.co.kr · [원문](http://hansbiz.co.kr/news/articleView.html?idxno=866843)\n2. 한성숙 총리, ‘태릉지구 주택공급 정책 실행력 가늠자 될 것’ 2029년 착... — 브릿지경제 · [원문](https://viva100.com/article/20260919500006)\n3. \"단순 자재값 문제 아니다\"…아파트 공사비 폭등 뒤에 숨은 복합 원인 — 뉴시스 · [원문](https://newsis.com/view/NISX20260915_0003790609)\n4. “건설사 이익추구 탓만 아니라” 건축교수가 MBC서 한 말 — 문화일보 · [원문](https://munhwa.com/article/11618293)\n\n## 오늘 흘려보낸 것\n\n중복 36건 · 후속보도 신규정보 없음 0건 · 기준 미달 235건\n"}, {"date": "2026-09-19", "markdown": "# 2026-09-19 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원구에서 두 건의 정비사업 절차 소식이 나왔지만 둘 다 조합원 분담금이나 공사비 수치는 제시하지 않았다. 반면 서초구 반포주공1·2·4주구, 광명 하안주공6·7단지, 용산 숙대입구역세권에서는 일반분양가·총공사비·평당공사비 등 실제 수치가 담긴 기사가 나왔다. 다수의 후보 기사는 토허제 1년 후폭풍, 84주 연속 집값 상승, 전세난 등 시황·정책 논란에 집중돼 있어 분담금 판단에 직접 쓸 수 있는 정보는 제한적이었다. 상계주공7단지는 거래량 상위권에 다시 이름을 올렸지만 새로운 비용 정보는 없어 반영하지 않았다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] [단독] ‘보편형 임대’ 재건축 전국 첫 적용… 서울 중계1에 514가구\n\n조선비즈 · 2026-09-17 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/09/17/T32N3BVIRVBYJPDRHZBLMF2ICQ)\n\n서울 노원구 중계1 재건축 단지에 정부의 '보편형 공공임대주택'이 전국 노후 공공임대 재건축 사업 중 처음으로 적용된다. 기존 488가구였던 공공분양 계획이 통합임대를 포함해 최고 49층·1398가구 규모로 전면 변경되고, 이 중 514가구가 보편형 임대로 공급될 예정이다. 2028년 착공을 목표로 한다. 본문이 확보되지 않아 조합원 분담금이나 공사비 수치는 확인되지 않았다.\n\n**정책 포인트**\n\n- 보편형 공공임대주택이 노후 공공임대 재건축 사업에 전국 최초로 적용돼, 향후 다른 사업장의 공공분양·임대 비중 조정에 선례로 작용할 수 있다.\n\n*왜 골랐나*: 노원구 재건축 사업장에 적용되는 전국 첫 제도 변화라 우선순위 규정에 따라 반영했다.\n\n### 2. 🔴 [노원구] 광운대역세권 장기전세주택 건립 본격화… 건축심의 통과\n\n한국주택경제신문 · 2026-09-17 · [원문](https://arunews.com/news/articleView.html?idxno=67323)\n\n서울 노원구 월계동 광운대역세권 장기전세주택 건립사업이 서울시 건축위원회 심의를 통과했다. 30년 이상 노후화된 성북맨션 구분소유자들의 재건축 결의를 바탕으로 추진되며, 지하6~지상28층에 공공임대 75세대와 분양주택 188세대 등 총 263세대가 조성된다. 사업자는 올해 하반기 건축허가를 신청해 2028년 3월 착공, 2030년 3월 준공을 목표로 한다.\n\n*왜 골랐나*: 노원구 소재 재건축 사업의 절차 진행 소식이라 우선순위 규정에 따라 반영했다.\n\n### 3. IPARK현대산업개발, 하안주공6·7단지 무혈입성하나…단독입찰\n\ndaily.hankooki.com · 2026-09-18 · [원문](https://daily.hankooki.com/news/articleView.html?idxno=1407975)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 하안주공6·7단지 | 총공사비 | 1조 1,549억 3,000만원 | — |\n| 하안주공6·7단지 | 평당공사비 | 780만원/3.3㎡ | — |\n\n광명 하안주공6·7단지 통합재건축 시공사 선정 입찰에 IPARK현대산업개발이 단독 응찰해 유찰됐다. 예정 공사비는 1조1549억3000만원, 3.3㎡당 780만원 수준으로 제시됐다. 사업은 3240가구 규모로 조성되며, 한국토지신탁은 2차 입찰 공고를 준비 중이다.\n\n> ⚠️ 제시된 공사비와 평당가는 시공사선정 입찰 단계의 예정 금액이며, 단독응찰로 유찰된 상태라 확정된 수치가 아닙니다.\n> ⚠️ 총공사비 1조1549억원은 사업 전체 금액이고 조합원 개인이 부담하는 분담금과는 다른 축의 숫자입니다. 이 총액을 가구 수로 나눠 개인 부담금을 짐작하지 않으시길 바랍니다.\n\n*왜 골랐나*: 총공사비와 평당공사비가 모두 본문에 명시된 시공사선정 관련 기사라서 선정했다.\n\n### 4. '디에이치'는 그대로…'반디클' 새 단지명 10월 총회서 결정\n\n뉴시스 · 2026-09-19 · [원문](https://newsis.com/view/NISX20260918_0003795382)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 반포주공1·2·4주구(디에이치 클래스트) | 일반분양가 | 9,000만원/3.3㎡ | — |\n| 반포주공1·2·4주구(디에이치 클래스트) | 일반분양가 | 10,000만원/3.3㎡ | — |\n\n서초구 반포주공1·2·4주구 재건축(현 '반포 디에이치 클래스트') 조합이 10월 9일 총회에서 새 단지명을 결정할 예정이다. 오는 11월 일반분양을 앞두고 있으며, 일반분양가는 3.3㎡당 9000만원~1억원 수준이 거론된다고 기사에 명시됐다. 다만 구체적인 분양 일정과 분양가는 아직 확정되지 않았다.\n\n> ⚠️ 일반분양가 3.3㎡당 9000만~1억원은 아직 확정되지 않은 거론 수준의 수치이며, 조합원분양가나 종전자산 평가액과는 다른 개념입니다.\n> ⚠️ 이 평당가로 특정 평형의 분양가 총액이나 분담금을 환산하지 않으시길 바랍니다. 확정 여부는 향후 분양 일정에서 다시 확인이 필요합니다.\n\n*왜 골랐나*: 서울 최대 재건축 사업장의 일반분양가 예상치가 평당 기준으로 본문에 명시돼 있어 선정했다.\n\n### 5. IPARK현산, 용산 서부권 '브랜드 타운화' 속도…리뉴얼 '아이파크' 통할...\n\nKPI뉴스 · 2026-09-18 · [원문](https://kpinews.kr/newsView/1065594184884265)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 숙대입구역세권 | 총공사비 | 5,400억 | — |\n\nIPARK현대산업개발이 용산구 갈월동 숙대입구역세권 장기전세주택 도시정비형 재개발 사업 수주에 나섰다. 공사비 규모는 약 5400억원이며, 지하6층~지상39층 5개동 총 992가구 규모 주상복합으로 계획됐다. 지난달 1차 현장설명회에는 현대건설·대우건설·롯데건설·금호건설 등이 참석했다.\n\n> ⚠️ 공사비 약 5400억원은 시공사 선정 절차 초기(현장설명회) 단계에서 제시된 규모로, 확정 공사비가 아닙니다.\n> ⚠️ 이는 사업 전체 공사비이며 개별 조합원의 분담금과는 다른 축의 숫자이니 혼동하지 않으시길 바랍니다.\n\n*왜 골랐나*: 본문에 총공사비 수치가 명시된 정비사업 수주 관련 기사라서 선정했다.\n\n## 인사이트\n\n- 노원구에서는 이번 주 정비사업 절차 소식이 두 건(보편형 공공임대 적용, 광운대역세권 건축심의 통과) 나왔지만 두 기사 모두 조합원 분담금이나 공사비 수치는 제시하지 않아, 비용을 가늠할 정보는 아직 부족하다.[1][2]\n- 하안주공6·7단지(총공사비 1조1549억원, 3.3㎡당 780만원)와 숙대입구역세권(약 5400억원)은 모두 아직 시공사가 확정되지 않은 단계로, 제시된 공사비는 최종 계약에서 달라질 수 있다.[3][4]\n- 반포주공1·2·4주구의 3.3㎡당 9000만~1억원 일반분양가는 기사에도 '거론된다'는 표현으로 소개돼, 확정치가 아니라 시장에서 도는 예상치임을 유의해야 한다.[5]\n- 평당공사비 시공사선정공고 단계의 누적 표본이 아직 1건에 불과해, 하안주공6·7단지의 3.3㎡당 780만원이 다른 사업장과 비교해 높은지 낮은지는 판단할 기준선이 없다.[3]\n- 상계주공7단지는 토허제 확대 1년 관련 보도에서도 다시 거래 상위권에 이름을 올렸지만, 기존에 거론된 재건축 추가 분담금 6억~7억원 수준 외에 새로운 비용 정보는 확인되지 않았다.[6][7]\n\n## 오늘의 개념\n\n### 통합재건축\n\n인접한 두 개 이상의 정비구역을 하나의 사업으로 묶어 함께 진행하는 재건축 방식이다. 사업 규모가 커지는 만큼 시공사 선정과 공사비 산정이 개별 구역보다 복잡해질 수 있다.\n\n*오늘*: 하안주공6·7단지가 통합재건축 방식으로 시공사 선정 입찰을 진행하며 총공사비 1조1549억원이 제시됐다.[3]\n\n### 유찰·수의계약\n\n시공사 선정 입찰에 단독으로 응찰하면 경쟁 입찰 요건을 충족하지 못해 '유찰' 처리되고, 이후 재공고를 거쳐 단독 응찰이 유지되면 수의계약으로 전환되는 절차를 밟는다. 경쟁이 없는 수의계약은 공사비 협상에서 조합의 협상력이 상대적으로 낮아질 수 있다는 우려가 제기되기도 한다.\n\n*오늘*: 하안주공6·7단지 입찰에 IPARK현대산업개발이 단독 응찰해 유찰됐고, 2차 공고에서도 단독 참여 시 수의계약 절차로 넘어갈 예정이다.[3]\n\n### 장기전세주택\n\n시세보다 낮은 보증금으로 장기간 거주할 수 있도록 공급하는 공공임대주택 유형이다. 재건축·재개발 과정에서 일부 물량을 장기전세주택으로 배정하는 사업이 있다.\n\n*오늘*: 노원구 월계동 광운대역세권 사업이 노후 성북맨션의 재건축 결의를 기반으로 장기전세주택으로 건립될 예정이며 건축심의를 통과했다.[2]\n\n## 참고 원문\n\n1. [단독] ‘보편형 임대’ 재건축 전국 첫 적용… 서울 중계1에 514가구 — 조선비즈 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/09/17/T32N3BVIRVBYJPDRHZBLMF2ICQ)\n2. 광운대역세권 장기전세주택 건립 본격화… 건축심의 통과 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=67323)\n3. IPARK현대산업개발, 하안주공6·7단지 무혈입성하나…단독입찰 — daily.hankooki.com · [원문](https://daily.hankooki.com/news/articleView.html?idxno=1407975)\n4. IPARK현산, 용산 서부권 '브랜드 타운화' 속도…리뉴얼 '아이파크' 통할... — KPI뉴스 · [원문](https://kpinews.kr/newsView/1065594184884265)\n5. '디에이치'는 그대로…'반디클' 새 단지명 10월 총회서 결정 — 뉴시스 · [원문](https://newsis.com/view/NISX20260918_0003795382)\n6. ‘토허제 확대 1년’ 후폭풍…거래 마르고 매매·전월세 다 뛰었다 — 중앙일보 · [원문](https://joongang.co.kr/article/25463221)\n7. 토허제 확대 1년…수도권 거래 마르고 값은 트리플 상승 — 중앙일보 · [원문](https://joongang.co.kr/article/25463200)\n\n## 오늘 흘려보낸 것\n\n중복 28건 · 후속보도 신규정보 없음 2건 · 기준 미달 407건\n"}, {"date": "2026-09-18", "markdown": "# 2026-09-18 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원구에서 민간 재건축(상계한신3차)과 공공 재정비(중계1단지 보편형 공공임대)가 같은 날 나란히 보도됐다. 구체적인 조합원 분양가·비례율 수치가 담긴 기사는 상계한신3차가 사실상 유일했고, 나머지 후보 다수는 실거래가 상승이나 청약 경쟁률, 금리 동향 등 시황성 기사여서 분담금 판단에 직접 쓸 수 있는 수치가 부족해 제외했다. 성수2지구처럼 서울 동북권 밖 대형 정비사업의 총공사비 수치도 확인됐지만 노원·상계와는 직접 관련이 없다. 벤치마크로 삼을 만한 누적 통계는 아직 표본이 부족해 이번 회차에서는 비교 문장을 넣지 않았다.\n\n## 선별 3건\n\n### 1. 🔴 [노원구] 상계한신3차, 정비구역 지정… 연내 사업시행자 지정 추진\n\n한국주택경제신문 · 2026-09-17 · [원문](https://arunews.com/news/articleView.html?idxno=67358)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계한신3차 | 비례율 | 97.58% | — |\n| 상계한신3차 | 조합원분양가 | 69,800만원(세대 총액) | — |\n| 상계한신3차 | 조합원분양가 | 81,400만원(세대 총액) | — |\n| 상계한신3차 | 조합원분양가 | 96,700만원(세대 총액) | — |\n\n노원구 상계한신3차가 재건축 정비구역 지정을 마치고 연내 사업시행자 지정을 추진한다. 추정비례율 97.58%가 산출됐고, 토지등소유자(조합원) 분양가 추정액은 전용 49㎡ 6억9800만원, 59㎡ 8억1400만원, 74㎡ 9억6700만원으로 제시됐다. 상계한신1·2차와 '단일화 재건축' 협약을 맺고 함께 사업을 진행 중이다.\n\n> ⚠️ 제시된 조합원분양가는 49㎡·59㎡·74㎡ 세 가지 평형별 추정 금액으로, 본인이 신청할 평형과 종전 보유 면적이 다르면 이 금액과 다릅니다.\n> ⚠️ 비례율 97.58%는 정비구역 지정 단계의 추정치입니다. 사업시행자 지정, 관리처분 단계를 거치며 일반분양가·공사비에 따라 바뀔 수 있는 수치입니다.\n> ⚠️ 여기 제시된 금액은 조합원분양가이며, 실제 분담금은 여기서 본인의 권리가액(종전자산 평가액×비례율)을 뺀 값입니다. 기사에는 권리가액이 나와 있지 않습니다.\n\n*왜 골랐나*: 노원구 상계동 최우선 지역 기사이면서 비례율과 조합원 분양가 추정액이 구체적으로 제시된, 오늘 후보 중 가장 수치가 명확한 기사다.\n\n### 2. 🔴 [노원구] 노원 중계1단지에 전국 첫 보편형 공공임대 514가구\n\n서울경제 · 2026-09-17 · [원문](https://sedaily.com/article/20092229)\n\n노원구 중계1단지(기존 공공임대 882가구)에 정부의 '보편형 공공임대'가 전국 최초로 적용된다. 당초 공공분양 488가구로 계획됐던 물량이 보편형 공공임대 514가구로 바뀌고, 통합공공임대는 884가구로 조정됐다. 스카이라운지·청년라운지 등 상품성을 높인 설계가 적용될 예정이다.\n\n**정책 포인트**\n\n- 당초 공공분양 488가구 계획이 보편형 공공임대 514가구로 변경됐고, 통합공공임대는 884가구로 조정됐다.\n- 정부는 건설형·매입형·전세형을 합쳐 내년 보편형 공공임대 3만6000가구를 공급하고 약 6조2000억원을 투입할 계획이다.\n\n*왜 골랐나*: 노원구 최우선 지역 기사이며, 공공분양 물량이 보편형 공공임대로 바뀌는 정책 변화가 확인돼 수치 없이도 선정 기준(정책·제도 변화)에 해당한다.\n\n### 3. DL이앤씨, ‘2조 성수2지구’ 품고 ‘상대원2구역’ 정상화... 대형 정비...\n\nthevaluenews.co.kr · 2026-09-17 · [원문](http://thevaluenews.co.kr/news/view.php?idx=201682)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 성수2지구 | 총공사비 | 2조 137억 | — |\n\nDL이앤씨가 서울 성동구 성수2지구 재개발 수의계약 가능성을 높이며 대형 수주 확보에 나섰다. 성수2지구는 예상 공사비 2조137억원 규모로, 1차 입찰 단독 응찰과 2차 현장설명회 단독 참여를 거쳐 DL이앤씨가 우선협상대상자로 지정됐다. 조합은 오는 12월까지 시공사 선정을 마무리할 예정이다.\n\n> ⚠️ 2조137억원은 성수2지구 사업 전체의 예상 공사비이며, 조합원 개인이 부담하는 분담금과는 다른 축의 수치입니다.\n> ⚠️ 이 금액은 아직 시공사 선정이 마무리되지 않은 단계(우선협상대상자 지정)의 예상치로, 최종 계약 시 달라질 수 있습니다.\n\n*왜 골랐나*: 총공사비 2조137억원이라는 구체적 수치가 확인된 정비사업 기사로, 노원구 편중을 조정하기 위해 선정했다.\n\n## 인사이트\n\n- 상계한신3차는 상계한신1·2차와 '단일화 재건축' 협약을 맺고 동일 사업시행자·시공자·설계자를 선정해 약 1,600세대 규모 브랜드타운을 조성할 계획이며, 규모의 경제를 통한 분담금 절감을 사업 목표로 내세우고 있다.[1]\n- 노원구에서는 상계한신3차의 민간 재건축 정비구역 지정과 중계1단지의 공공 재정비(보편형 공공임대 전환)가 비슷한 시기에 발표되며, 민간·공공 양쪽에서 노후 주거지 정비가 동시에 진행되고 있다.[1][2]\n- DL이앤씨는 상반기 도시정비사업에서 신규수주의 74%인 2조6830억원을 확보했고, 예상 공사비 2조137억원 규모의 성수2지구까지 더해지면 하반기 외형 회복의 발판이 될 수 있다.[3]\n\n## 오늘의 개념\n\n### 단일화 재건축\n\n인접한 여러 단지가 동일한 사업시행자·시공자·정비사업전문관리업자·설계자를 지정해 사실상 하나의 사업으로 재건축을 추진하는 방식이다. 규모가 커지면서 협상력과 규모의 경제 효과를 기대할 수 있다.\n\n*오늘*: 상계한신1·2·3차 세 단지가 이 방식으로 재건축을 추진 중이며, 3차가 먼저 정비구역 지정을 마치면서 나머지 단지도 속도를 낼 것으로 보인다.[1]\n\n### 보편형 공공임대\n\n기존 공공임대가 취약계층 위주였다면, 보편형 공공임대는 지원 대상을 중산층까지 넓히고 민간주택 수준의 설계·마감을 적용해 상품성을 높인 임대주택 유형이다.\n\n*오늘*: 정부가 이 유형을 노원구 중계1단지 재정비 사업에 전국 최초로 적용하면서, 기존 공공분양 계획 물량이 보편형 공공임대로 대체됐다.[2]\n\n## 참고 원문\n\n1. 상계한신3차, 정비구역 지정… 연내 사업시행자 지정 추진 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=67358)\n2. 노원 중계1단지에 전국 첫 보편형 공공임대 514가구 — 서울경제 · [원문](https://sedaily.com/article/20092229)\n3. DL이앤씨, ‘2조 성수2지구’ 품고 ‘상대원2구역’ 정상화... 대형 정비... — thevaluenews.co.kr · [원문](http://thevaluenews.co.kr/news/view.php?idx=201682)\n\n## 오늘 흘려보낸 것\n\n중복 59건 · 후속보도 신규정보 없음 0건 · 기준 미달 473건\n"}, {"date": "2026-09-17", "markdown": "# 2026-09-17 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 개별 단지의 새 공사비·분담금 수치보다 제도 변화가 두드러진 하루다. 노원구는 사업성 보정계수 상한 확대와 임대주택 비율 완화를 서울시에 공식 건의했고, 동시에 전문자문단을 출범시켜 정비사업 지원 체계를 정비했다. 국토부의 기본형건축비 인상과 국회에 계류 중인 용적률 완화 법안은 노원구를 포함한 전국 재건축 단지의 사업성 계산식 자체를 흔드는 사안이다. 반면 상계주공·목동4단지 등 기존 스레드에서는 어제 이후 새로 확인된 사실이 없어 이번 호에는 오르지 않았다.\n\n## 선별 4건\n\n### 1. 🔴 [노원구] 노원구, 서울시의 '2030 서울특별시 도시·주거환경정비기본계획(주거환...\n\ncnbizm.com · 2026-09-15 · [원문](https://cnbizm.com/news/articleView.html?idxno=315234)\n\n노원구가 서울시의 2030 정비기본계획 변경안을 환영했다. 정비기반시설 기부채납 시 상한용적률을 넘는 부분에도 용적률 인센티브를 인정받게 돼 월계삼호4차·중계그린 등 그동안 혜택을 못 받던 단지의 사업성이 개선될 전망이다. 구는 추가로 재건축 임대주택 비율을 현행 50%에서 30%로 낮추고 사업성 보정계수 상한을 2.0에서 3.0으로 올려달라고 서울시에 건의했다.\n\n**정책 포인트**\n\n- 정비기반시설 기부채납 시 상한용적률 초과분도 용적률 인센티브 인정하도록 기본계획 변경\n- 재건축 임대주택 비율을 현행 50%에서 30%로 완화 건의\n- 사업성 보정계수 상한을 현행 2.0에서 3.0으로 확대 건의, '분양가격 보정계수' 신설도 요청\n\n*왜 골랐나*: 노원구가 사업성 보정계수와 임대주택 비율 완화를 공식 건의한 정책 기사라서, 저사업성 노원 단지들의 분담금 부담을 좌우할 사안이다.\n\n### 2. 🔴 [노원구] 노원구, 광운대역세권 263가구 건립 본격화…정비사업 자문단도 가동 [...\n\nsegye.com · 2026-09-16 · [원문](https://segye.com/newsView/20260916519917?OutUrl=naver)\n\n월계동 성북맨션 재건축을 통한 '광운대역세권 장기전세주택 건립사업'이 서울시 건축위원회 심의를 통과했다. 지상 28층 총 263세대(공공임대 75·분양 188) 규모로 2028년 3월 착공, 2030년 3월 준공이 목표다. 같은 날 노원구는 한국도시정비학회와 협약을 맺고 정비계획부터 준공까지 단계별로 지원하는 '재건축·재개발 전문자문단'을 출범시켰다.\n\n**정책 포인트**\n\n- 한국도시정비학회와 협약, 도시계획·법무·세무회계·감정평가 전문가 약 30명이 참여하는 '재건축·재개발 전문자문단' 가동\n- 개별 사업장에서 풀기 어려운 법령·제도 문제는 '재건축·재개발 규제혁신 100'과 연계해 서울시·정부에 건의\n\n*왜 골랐나*: 노원구 관련 기사라 우선 배치했으며, 성북맨션 재건축 진행 상황과 노원구의 신규 정비사업 지원 체계 출범이 함께 보도됐다.\n\n### 3. 국토부, 분양가상한제 기본형건축비 4.07% 인상… 평당 232만8000원\n\n조선비즈 · 2026-09-15 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/09/15/EVC7LZRH4BHCREIHIQBRHKDALI)\n\n국토교통부가 분양가상한제 적용 단지의 공사비 산정 기준인 기본형건축비를 4.07% 인상해 3.3㎡당 232만8000원으로 고시했다. 매체 제공 요약에 따르면 공사 현장 안전대책 강화를 위한 재원 투입이 늘면서 간접공사비 상승폭이 컸다. 다만 이 기사는 본문이 확보되지 않아 세부 수치를 추가로 인용하지 않는다.\n\n**정책 포인트**\n\n- 분양가상한제 기본형건축비 4.07% 인상, 3.3㎡당 232만8000원으로 고시\n- 간접노무비율(14.6%→18.1%) 등 간접공사비 적용기준 변경이 인상 배경으로 거론됨\n\n*왜 골랐나*: 분양가상한제를 적용받는 재건축 단지 전체의 공사비 산정 기준이 바뀐 정책 변화라서, 개별 단지 수치가 없어도 모든 사업장에 영향을 준다.\n\n### 4. [아유경제_헤드라인] 도시정비사업 용적률 완화 두고 '입법 진통' 계속...\n\nareyou.co.kr · 2026-09-16 · [원문](http://areyou.co.kr/news/articleView.html?idxno=95398)\n\n공공재개발·재건축의 용적률을 법적 상한의 1.3배까지 높이는 법안이 국회 본회의 문턱에서 멈춰 섰다. 현재는 공공재개발이 법적 상한의 1.2배, 공공재건축은 법적 상한까지만 용적률을 적용받을 수 있다. 여야 모두 정비사업 활성화 필요성에는 공감하지만 민간 사업 적용 여부와 완화 폭, 주택 규모 조건을 두고 이견을 좁히지 못하고 있다.\n\n**정책 포인트**\n\n- 공공재개발·재건축 용적률을 법적 상한의 1.3배까지 확대하는 법안이 국회 본회의 문턱에서 계류 중\n- 현행은 공공재개발 1.2배, 공공재건축은 법적 상한까지만 적용 가능\n- 민간 사업 적용 여부·완화 폭·주택 규모 조건을 두고 여야 이견 지속\n\n*왜 골랐나*: 용적률 완화 폭이 확정되면 사업성 개선을 통해 분담금이 낮아지는 방향의 전국 단위 제도 변화라서 포함했다.\n\n## 인사이트\n\n- 노원구는 사업성 보정계수 상한을 2.0에서 3.0으로 올려달라고 건의했다. 상한이 올라가면 일반분양 비율을 더 늘릴 수 있어 저사업성 노원 단지의 분담금 부담이 줄어드는 방향이다.[1]\n- 노원구는 사업성 보정계수 건의와 별개로 전문자문단·규제혁신 100 등 행정 지원 체계를 동시에 가동해, 제도 개선과 현장 지원을 병행하는 흐름을 보이고 있다.[2]\n- 기본형건축비 인상은 분양가상한제가 적용되는 관리처분 이후 단계 재건축 단지의 공사비 산정 기준을 끌어올리는 요인이다.[3]\n- 용적률 완화 법안이 통과되면 공공재건축도 현재보다 최대 1.3배까지 용적률을 적용받을 수 있지만, 아직 국회에 계류 중이라 당장 분담금 계산에 반영하기는 이르다.[4]\n\n## 참고 원문\n\n1. 노원구, 서울시의 '2030 서울특별시 도시·주거환경정비기본계획(주거환... — cnbizm.com · [원문](https://cnbizm.com/news/articleView.html?idxno=315234)\n2. 노원구, 광운대역세권 263가구 건립 본격화…정비사업 자문단도 가동 [... — segye.com · [원문](https://segye.com/newsView/20260916519917?OutUrl=naver)\n3. 국토부, 분양가상한제 기본형건축비 4.07% 인상… 평당 232만8000원 — 조선비즈 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/09/15/EVC7LZRH4BHCREIHIQBRHKDALI)\n4. [아유경제_헤드라인] 도시정비사업 용적률 완화 두고 '입법 진통' 계속... — areyou.co.kr · [원문](http://areyou.co.kr/news/articleView.html?idxno=95398)\n\n## 오늘 흘려보낸 것\n\n중복 81건 · 후속보도 신규정보 없음 0건 · 기준 미달 512건\n"}, {"date": "2026-09-16", "markdown": "# 2026-09-16 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n노원구는 제도 개선(정비기본계획 변경, 사업성 보정계수 확대 건의)과 실제 사업 진행(상계2구역 공사도급계약)이 같은 주에 겹치며 사업성 개선 움직임이 뚜렷하게 나타났다. 반면 목동4단지의 '평당 1010만원' 이슈는 어제자 보도와 동일한 내용이라 오늘은 새로운 진전이 확인되지 않았다. 부산 온천4구역처럼 이미 준공·해산 단계에 이른 사업장에서는 비례율과 분양가 협상 성과가 구체적으로 확인됐고, 국토부의 기본형건축비 인상은 분양가상한제 적용 사업장 전반의 비용 산정 기준을 끌어올리는 배경으로 작용했다. 서울 고가 아파트 경매 약세, 강남·서초 집값 조정 등은 재건축 비용 판단과 직접 관련이 없어 이번 다이제스트에서는 제외했다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] 동부건설, 13.7조 일감 '수익 전환' 본격화…2756억 정비사업·플랜트 54...\n\nupkoreanews.kr · 2026-09-14 · [원문](https://upkoreanews.kr/news/articleView.html?idxno=100218)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계2구역 | 총공사비 | 6,890억 | — |\n\n노원구 상계2구역 주택재개발정비사업에서 동부건설이 2756억1809만원 규모의 공사계약을 체결했다. 전체 공사비는 약 6890억원이며 동부건설이 40%, 대우건설이 60%의 시공지분을 맡는다. 이 사업은 2021년 이미 시공사가 선정된 곳으로, 이번 계약은 사업이 실제 도급계약 단계로 넘어갔음을 보여준다.\n\n> ⚠️ 총공사비 6890억원은 사업 전체 금액이며 조합원 개인이 부담하는 분담금이 아닙니다. 개별 분담금은 보유 면적·동·층·향에 따른 종전자산 평가액과 비례율이 정해져야 산출됩니다.\n> ⚠️ 이 기사는 2021년 시공사 선정이 끝난 뒤 도급계약 체결 단계를 다룬 것으로, 착공 이후 42개월 공사기간 중 물가 변동에 따라 공사비가 조정될 수 있는 단계입니다.\n\n*왜 골랐나*: 노원구 상계2구역 사업으로 우선순위 지역에 해당하고, 전체 공사비와 시공지분 비율이 구체적 금액으로 명시돼 있어서.\n\n### 2. 🔴 [노원구] 노원구, 재건축 기부채납 용적률 인센티브 확대 환영…추가 제도개선 건...\n\nnewstnt.com · 2026-09-15 · [원문](https://newstnt.com/news/articleView.html?idxno=718390)\n\n노원구가 서울시의 2030 도시·주거환경정비기본계획 변경안을 환영했다. 상한용적률을 초과하는 기부채납에도 용적률 인센티브를 인정받게 됐고, 월계삼호4차·중계그린아파트가 대표 수혜 사례로 꼽힌다. 구는 재건축 임대주택 비율을 현행 50%에서 30%로 낮추고, 사업성 보정계수 상한을 2.0에서 3.0으로 올려달라고 서울시에 추가 건의했다.\n\n**정책 포인트**\n\n- 상한용적률을 초과하는 기부채납분도 용적률 인센티브로 인정\n- 재건축 임대주택 의무비율을 현행 50%에서 30%로 완화 건의\n- 사업성 보정계수 산정체계에 '분양가격 보정계수' 추가, 상한 2.0→3.0 확대 건의\n\n*왜 골랐나*: 노원구 우선지역이며, 임대주택 비율·사업성 보정계수 상한 조정 등 실제 제도 변경 내용이 구체적으로 담긴 정책 기사라서.\n\n### 3. 온천4구역, 비례율 162%로 조합 해산\n\n한국주택경제신문 · 2026-09-15 · [원문](https://arunews.com/news/articleView.html?idxno=67213)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 온천4구역 | 비례율 | 162% | — |\n| 온천4구역 | 일반분양가 | 1,959만원/3.3㎡ | — |\n\n부산 동래구 온천4구역이 비례율 162%를 기록하며 11월 중 조합 해산총회를 연다. 2018년 관리처분 당시 109.25%였던 비례율은 이후 변경과 입주를 거쳐 162%까지 올랐다. 조합은 2021년 HUG와 약 9개월간 협상 끝에 일반분양가를 3.3㎡당 1959만원으로 관철시켰다.\n\n> ⚠️ 비례율 162%는 온천4구역의 관리처분 이후 입주까지 거치며 확정된 값으로, 2018년 관리처분 당시 109.25%에서 변경된 수치입니다. 사업 초기 단계에서 제시되는 추정 비례율과는 성격이 다릅니다.\n> ⚠️ 일반분양가 3.3㎡당 1959만원은 HUG와 협상한 분양 수입 기준 수치이며, 조합원 개별 분담금이나 권리가액과는 별개의 숫자입니다.\n\n*왜 골랐나*: 비례율과 일반분양가가 협상 전후 수치까지 구체적으로 제시된, 사업 종료 단계의 드문 실사례라서.\n\n### 4. 신대방역세권 재개발, 한화·대우건설과 5,817억원 규모 도급계약 체결\n\n하우징헤럴드 · 2026-09-15 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62932)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 신대방역세권 | 총공사비 | 5,816억 9,900만원 | — |\n\n동작구 신대방역세권 재개발조합이 한화·대우건설 컨소시엄과 5,816억9,900만원 규모의 공사도급계약을 체결했다. 계약금·중도금 없이 입주 시점에 분담금 100%를 납부하도록 조건을 바꿨고, 착공 전 물가변동에 따른 공사비 인상분은 시공자가 일부 흡수하기로 했다.\n\n> ⚠️ 총공사비 5,817억원은 사업 전체 도급계약 금액으로, 조합원 개인의 분담금과는 다른 축의 수치입니다.\n> ⚠️ 계약금·중도금 없이 입주 시점에 분담금 100%를 납부하도록 조건이 바뀌었다는 점은 자금 납부 시기의 변화이지, 분담금 총액 자체가 확정됐다는 의미는 아닙니다.\n\n*왜 골랐나*: 총공사비 실수치와 함께 분담금 납부 방식 변경이라는 구체적 계약 조건이 드러난 기사라서.\n\n### 5. 분양가상한제 기본형건축비 오른다...평당 232만8000원\n\n파이낸셜뉴스 · 2026-09-14 · [원문](https://fnnews.com/news/202609141036201441)\n\n같은 사건 보도: metroseoul.co.kr, 조선비즈\n\n국토부가 분양가상한제 기본형건축비를 16~25층·전용 60~85㎡ 기준 ㎡당 223만7000원에서 232만8000원으로 4.07% 인상해 9월 15일 고시했다. 간접공사비가 60만4000원에서 66만3000원으로 9.77% 오른 것이 인상폭 확대의 주요 요인이다. 개정 고시는 9월15일 이후 입주자모집 승인을 신청하는 단지부터 적용된다.\n\n**정책 포인트**\n\n- 분양가상한제 기본형건축비 정기고시, ㎡당 223만7000원→232만8000원(4.07% 인상)\n- 간접공사비 요율 상승(간접노무비 14.6%→18.1%, 기타경비 6.0%→6.9%)이 인상폭 확대 원인\n- 개정 고시는 9월15일 이후 입주자모집 승인 신청 단지부터 적용\n\n*왜 골랐나*: 특정 단지 수치는 아니지만, 분양가상한제 적용 사업장 전체의 분양가 산정 기준을 바꾸는 제도 변화라서.\n\n## 인사이트\n\n- 노원구는 정비기본계획 변경(용적률 인센티브 확대)과 상계2구역 공사도급계약이 같은 주에 겹치며, 제도 건의와 실제 사업 진행이 동시에 나타나고 있다.[1][2]\n- 국토부의 기본형건축비 4.07% 인상은 분양가상한제 적용 지역의 분양가 산정 기준선을 끌어올리는 요인으로, 목동4단지처럼 평당 1000만원대 공사비를 제시하는 사업장이 늘어날 가능성과 맞물린다.[3][4]\n- 온천4구역 사례는 조정지역 내 HUG와의 분양가 협상에서 조합의 협상력이 최종 비례율(사업 수익성)에 크게 영향을 줄 수 있음을 보여준다.[5]\n- 신대방역세권처럼 분담금을 계약금·중도금 없이 입주 시점 일괄 납부로 조정하는 계약 조건이 최근 등장하고 있어, 공사비 규모 못지않게 납부 방식 협상이 조합원 자금 부담에 영향을 준다.[6]\n\n## 오늘의 개념\n\n### 비례율\n\n비례율은 재건축·재개발 사업에서 종전 자산평가액 대비 사업 종료 시점의 개발이익을 나타내는 지표다. 100%를 넘으면 조합원이 종전 자산가치보다 더 많은 이익을 얻는다는 뜻으로 통상 해석된다.\n\n*오늘*: 온천4구역이 2018년 관리처분 당시 109.25%였던 비례율을 조합 해산 시점 162%까지 끌어올린 사례가 오늘 보도됐다.[5]\n\n### 사업성 보정계수\n\n사업성 보정계수는 정비사업의 사업성을 평가해 일반분양 물량 등 인센티브를 조정하는 데 쓰이는 계수다. 상한이 높을수록 사업성이 낮은 지역에서도 일반분양 비율을 더 늘릴 여지가 생긴다.\n\n*오늘*: 노원구가 이 상한을 현행 2.0에서 3.0으로 올려달라고 서울시에 건의했다. 상한이 올라가면 상계주공처럼 사업성이 낮은 노원구 단지의 일반분양 물량을 늘려 분담금 부담을 줄이는 방향으로 작동한다.[1]\n\n### 기본형건축비\n\n기본형건축비는 분양가상한제가 적용되는 아파트의 분양가 상한을 구성하는 기준 항목 중 하나다. 국토부가 매년 3월과 9월 정기적으로 고시하며, 건설자재 가격이 급등할 경우 비정기로도 조정한다.\n\n*오늘*: 국토부가 이번 정기고시에서 기본형건축비를 ㎡당 232만8000원으로 4.07% 인상했다. 이는 분양가상한제 적용 지역 정비사업의 분양가 산정 기준선이 올라간다는 의미다.[3]\n\n## 참고 원문\n\n1. 노원구, 재건축 기부채납 용적률 인센티브 확대 환영…추가 제도개선 건... — newstnt.com · [원문](https://newstnt.com/news/articleView.html?idxno=718390)\n2. 동부건설, 13.7조 일감 '수익 전환' 본격화…2756억 정비사업·플랜트 54... — upkoreanews.kr · [원문](https://upkoreanews.kr/news/articleView.html?idxno=100218)\n3. 분양가상한제 기본형건축비 오른다...평당 232만8000원 — 파이낸셜뉴스 · [원문](https://fnnews.com/news/202609141036201441)\n4. [단독]목동 재건축 공사비 첫 ‘1000만원대’…4단지, 다음주 시공사 공... — MTN 머니투데이방송 · [원문](https://news.mtn.co.kr/news-detail/2026091411565811671)\n5. 온천4구역, 비례율 162%로 조합 해산 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=67213)\n6. 신대방역세권 재개발, 한화·대우건설과 5,817억원 규모 도급계약 체결 — 하우징헤럴드 · [원문](https://housingherald.co.kr/news/articleView.html?idxno=62932)\n\n## 오늘 흘려보낸 것\n\n중복 51건 · 후속보도 신규정보 없음 1건 · 기준 미달 487건\n"}], "facts": [{"date": "2026-09-16", "complex": "상계주공", "region": "노원구", "metric": "분담금", "value": 6.0, "unit": "억원", "stage": null, "quote": "상계주공의 경우 추가 분담금이 6억~7억으로 거론되고 있음에도 노원역 일대의 뛰어난 교통과 상권, 병원 등 우수한 인프라를 갖추고 있어 실수요자들의 진입이 이어지고 있다", "url": "https://newsis.com/view/NISX20260915_0003790667", "thread_id": "sanggye-6", "ambiguous": true}, {"date": "2026-09-16", "complex": "상계주공", "region": "노원구", "metric": "분담금", "value": 7.0, "unit": "억원", "stage": null, "quote": "상계주공의 경우 추가 분담금이 6억~7억으로 거론되고 있음에도 노원역 일대의 뛰어난 교통과 상권, 병원 등 우수한 인프라를 갖추고 있어 실수요자들의 진입이 이어지고 있다", "url": "https://newsis.com/view/NISX20260915_0003790667", "thread_id": "sanggye-6", "ambiguous": true}, {"date": "2026-09-16", "complex": "목동신시가지4단지", "region": "양천구", "metric": "일반분양가", "value": 7000.0, "unit": "만원", "stage": "조합설립인가", "quote": "조합 설립 당시 추정 분담금은 3.3㎡당 공사비 950만원, 일반분양가 7000만원을 기준으로 산출됐다", "url": "https://theguru.co.kr/news/article.html?no=107099", "thread_id": "mokdong-4", "a m": "기본형건축비", "first": "2026-09-16", "count": 1}]};
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* 금액 단위가 섞이면 선이 의미를 잃는다. metric+unit 을 하나의 계열로 본다. */
const seriesKey = f => `${f.metric} (${f.unit})`;
const PALETTE = ["#1E5F9E","#8C2F39","#2E7D5B","#9A5B00","#5B4B8A","#2A6F7A"];

function fmt(n){
  return Number.isInteger(n) ? n.toLocaleString("ko-KR")
                             : n.toLocaleString("ko-KR",{maximumFractionDigits:2});
}

/* ── 추이 ── */
let pickedMetric = null;
function renderTrend(){
  const facts = DATA.facts;
  if(!facts.length) return `<div class="empty">아직 쌓인 수치가 없습니다.
    다이제스트가 며칠 발행되면 여기에 평당공사비·분담금 추이가 그려집니다.</div>`;

  const metrics = [...new Set(facts.map(f=>f.metric))];
  if(!pickedMetric || !metrics.includes(pickedMetric)) pickedMetric = metrics[0];
  const rows = facts.filter(f=>f.metric===pickedMetric);

  const picker = `<div class="metric-pick">${metrics.map(m=>
    `<button type="button" data-metric="${esc(m)}" aria-pressed="${m===pickedMetric}">${esc(m)}</button>`
  ).join("")}</div>`;

  const groups = {};
  rows.forEach(f=>{ (groups[seriesKey(f)] ||= []).push(f); });
  const keys = Object.keys(groups);
  const dates = [...new Set(rows.map(f=>f.date))].sort();
  const vals = rows.map(f=>f.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(lo===hi){ lo = lo*0.9 || 0; hi = hi*1.1 || 1; }
  const pad = (hi-lo)*0.12; lo -= pad; hi += pad;

  const W=660,H=280,L=78,R=18,T=18,B=44;
  const px = d => dates.length<2 ? L+(W-L-R)/2
            : L + (dates.indexOf(d)/(dates.length-1))*(W-L-R);
  const py = v => T + (1-(v-lo)/(hi-lo))*(H-T-B);

  const ticks = [0,.25,.5,.75,1].map(t=>{
    const v = lo+(hi-lo)*t, y = py(v);
    return `<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="var(--rule)" stroke-width="1"/>
      <text x="${L-9}" y="${y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(Math.round(v))}</text>`;
  }).join("");

  const lines = keys.map((k,i)=>{
    const c = PALETTE[i%PALETTE.length];
    const pts = groups[k].slice().sort((a,b)=>(a.date||"").localeCompare(b.date||""));
    const path = pts.map((f,j)=>`${j?"L":"M"}${px(f.date).toFixed(1)},${py(f.value).toFixed(1)}`).join(" ");
    const dots = pts.map(f=>`<circle cx="${px(f.date).toFixed(1)}" cy="${py(f.value).toFixed(1)}" r="4.5"
      fill="${c}"><title>${esc(f.complex)} ${fmt(f.value)}${esc(f.unit)} (${esc(f.date)})</title></circle>`).join("");
    return `<path d="${path}" fill="none" stroke="${c}" stroke-width="2"
      ${pts.some(p=>p.ambiguous)?'stroke-dasharray="5 4"':""}/>${dots}`;
  }).join("");

  const xlab = dates.map(d=>`<text x="${px(d).toFixed(1)}" y="${H-16}" text-anchor="middle"
    font-size="12" fill="var(--muted)">${esc(d.slice(5))}</text>`).join("");

  const legend = keys.map((k,i)=>
    `<span><i style="background:${PALETTE[i%PALETTE.length]}"></i>${esc(k)}</span>`).join("");

  const pts = rows.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(f=>`
    <div class="pt"><b>${fmt(f.value)}${esc(f.unit)}</b> · ${esc(f.complex)}
      ${f.stage?` · ${esc(f.stage)}`:""}${f.ambiguous?'<span class="chip">전제 불명</span>':""}
      <span class="q">${esc(f.date)} · ${esc((f.quote||"").slice(0,110))}${(f.quote||"").length>110?"…":""}
      ${f.url?` <a href="${esc(f.url)}">원문</a>`:""}</span></div>`).join("");

  return picker + `<div class="chart-box">
    <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
         aria-label="${esc(pickedMetric)} 추이">${ticks}${lines}${xlab}</svg>
    </div><div class="legend">${legend}</div><div class="pts">${pts}</div>`;
}

/* ── 단지 ── */
function renderThreads(){
  if(!DATA.threads.length) return `<div class="empty">아직 추적 중인 단지가 없습니다.</div>`;
  return DATA.threads.map(t=>`<div class="thread">
    <h3>${esc(t.title)}</h3>
    <div class="meta">${esc(t.id)} · 기사 ${t.count}건 · 최근 ${esc(t.last_seen||"-")}</div>
    <ol>${t.known_facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ol></div>`).join("");
}

/* ── 용어 ── */
function renderTerms(){
  if(!DATA.terms.length) return `<div class="empty">아직 정리된 개념이 없습니다.
    다이제스트의 <b>오늘의 개념</b> 에서 설명한 용어가 여기 쌓입니다.</div>`;
  return DATA.terms.map(t=>`<div class="term"><b>${esc(t.term)}</b>
    <span>${esc(t.first||"")}${t.count>1?` · ${t.count}회`:""}</span></div>`).join("");
}

/* ── 다이제스트 ── */
let pickedDate = null;
function md(src){ return marked.parse(src, {gfm:true, breaks:false}); }
function renderToday(){
  if(!DATA.digests.length) return `<div class="empty">아직 발행된 다이제스트가 없습니다.</div>`;
  return `<div class="md">${md(DATA.digests[0].markdown)}</div>`;
}
function renderArchive(){
  if(!DATA.digests.length) return `<div class="empty">아직 발행된 다이제스트가 없습니다.</div>`;
  if(!pickedDate) pickedDate = DATA.digests[0].date;
  const list = `<div class="archive">${DATA.digests.map(d=>
    `<button type="button" data-date="${d.date}" aria-pressed="${d.date===pickedDate}">${d.date}</button>`
  ).join("")}</div>`;
  const doc = DATA.digests.find(d=>d.date===pickedDate);
  return list + `<div class="md" style="margin-top:32px">${md(doc.markdown)}</div>`;
}

const TABS = [
  ["오늘",  renderToday],
  ["추이",  renderTrend],
  ["단지",  renderThreads],
  ["용어",  renderTerms],
  ["지난 글", renderArchive],
];
let active = 0;

function draw(){
  $("#tabs").innerHTML = TABS.map(([name],i)=>
    `<button type="button" role="tab" data-i="${i}" aria-selected="${i===active}">${name}</button>`).join("");
  $("#panel").innerHTML = TABS[active][1]();
}

document.addEventListener("click", e=>{
  const tab = e.target.closest("#tabs button");
  if(tab){ active = +tab.dataset.i; draw(); return; }
  const m = e.target.closest("[data-metric]");
  if(m){ pickedMetric = m.dataset.metric; draw(); return; }
  const d = e.target.closest("[data-date]");
  if(d){ pickedDate = d.dataset.date; draw(); }
});

$("#sub").textContent =
  `${DATA.generated} 기준 · 다이제스트 ${DATA.digests.length}건 · 누적 수치 ${DATA.facts.length}건 · 추적 단지 ${DATA.threads.length}곳`;
draw();
</script>
