<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>재건축 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
  :root{
    --ground:#F5F7FA; --surface:#FFFFFF; --ink:#12233A; --body:#2C3B4E;
    --muted:#5C6B7F; --rule:#DBE2EB; --rail:#C6D2E0;
    --accent:#1E5F9E; --accent-soft:#E8F0F8;
    --warn:#9A5B00; --warn-soft:#FBF1E0; --warn-rule:#E4C99A;
    --serif:"Noto Serif KR",Georgia,serif;
    --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --ground:#0E1620; --surface:#151F2C; --ink:#E6EDF5; --body:#C3CEDB;
    --muted:#8798AB; --rule:#26323F; --rail:#33445A;
    --accent:#6FB0E8; --accent-soft:#16283A;
    --warn:#E0A75B; --warn-soft:#2A2114; --warn-rule:#5A4726; }}
  :root[data-theme="dark"]{
    --ground:#0E1620; --surface:#151F2C; --ink:#E6EDF5; --body:#C3CEDB;
    --muted:#8798AB; --rule:#26323F; --rail:#33445A;
    --accent:#6FB0E8; --accent-soft:#16283A;
    --warn:#E0A75B; --warn-soft:#2A2114; --warn-rule:#5A4726; }
  *{box-sizing:border-box}
  body{background:var(--ground);color:var(--body);font-family:var(--sans);
       font-size:17px;line-height:1.85;margin:0;padding:0 22px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding-block:0 88px}
  h1,h2,h3{color:var(--ink);text-wrap:balance;margin:0}
  a{color:var(--accent);text-underline-offset:3px}
  .num{font-variant-numeric:tabular-nums}

  header{border-bottom:2px solid var(--ink);padding-block:44px 16px}
  .kicker{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(30px,7vw,42px);line-height:1.22;margin-top:10px}
  .sub{font-size:15px;color:var(--muted);margin-top:12px}

  nav{display:flex;flex-wrap:wrap;gap:4px;margin:26px 0 8px;
      border-bottom:1px solid var(--rule);padding-bottom:0}
  nav button{font-family:var(--sans);font-size:15.5px;font-weight:500;color:var(--muted);
    background:none;border:0;border-bottom:2px solid transparent;
    padding:10px 14px;cursor:pointer;margin-bottom:-1px}
  nav button:hover{color:var(--ink)}
  nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
  nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  .panel{padding-top:26px}
  .empty{color:var(--muted);font-size:15.5px;background:var(--surface);
         border:1px dashed var(--rule);border-radius:4px;padding:22px}

  /* 추이 */
  .metric-pick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
  .metric-pick button{font-size:14px;font-family:var(--sans);color:var(--muted);
    background:var(--surface);border:1px solid var(--rule);border-radius:999px;
    padding:5px 14px;cursor:pointer}
  .metric-pick button[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);
    background:var(--accent-soft);font-weight:600}
  .chart-box{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
             padding:18px 14px 10px;overflow-x:auto}
  .legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;font-size:14px;color:var(--muted)}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .pts{margin-top:24px;display:flex;flex-direction:column;gap:14px}
  .pt{border-left:3px solid var(--rail);padding-left:14px;font-size:15px}
  .pt b{color:var(--ink);font-variant-numeric:tabular-nums}
  .pt .q{display:block;color:var(--muted);font-size:14px;margin-top:4px}
  .chip{font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);
        border:1px solid var(--warn-rule);border-radius:3px;padding:1px 7px;margin-left:6px}

  /* 단지 */
  .thread{background:var(--surface);border:1px solid var(--rule);border-radius:4px;
          padding:20px;margin-bottom:16px}
  .thread h3{font-family:var(--serif);font-size:19px;font-weight:700}
  .thread .meta{font-size:14px;color:var(--muted);margin-top:6px}
  .thread ol{margin:14px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:15px}

  /* 용어 */
  .term{padding:14px 0;border-bottom:1px solid var(--rule);display:flex;
        justify-content:space-between;gap:14px;align-items:baseline}
  .term b{font-family:var(--serif);font-size:17px;color:var(--ink)}
  .term span{font-size:14px;color:var(--muted);white-space:nowrap}

  /* 지난 글 */
  .archive{display:flex;flex-direction:column;gap:2px}
  .archive button{text-align:left;font-family:var(--sans);font-size:16px;color:var(--accent);
    background:none;border:0;border-bottom:1px solid var(--rule);padding:13px 2px;cursor:pointer}
  .archive button[aria-pressed="true"]{color:var(--ink);font-weight:600}

  /* 마크다운 본문 */
  .md h1{display:none}
  .md h2{font-family:var(--serif);font-size:15px;letter-spacing:.06em;color:var(--ink);
         border-bottom:1px solid var(--rule);padding-bottom:9px;margin:44px 0 22px}
  .md h3{font-family:var(--serif);font-size:21px;line-height:1.45;font-weight:500;margin:30px 0 0}
  .md p{margin:14px 0 0}
  .md blockquote{margin:16px 0 0;background:var(--warn-soft);border:1px solid var(--warn-rule);
    border-left-width:4px;border-radius:3px;padding:13px 16px;font-size:15.5px;color:var(--body)}
  .md blockquote p{margin:0}
  .md table{border-collapse:collapse;width:100%;margin:16px 0 0;font-size:15px}
  .md th,.md td{border:1px solid var(--rule);padding:8px 11px;text-align:left}
  .md th{background:var(--accent-soft);color:var(--ink);font-weight:600}
  .md td{font-variant-numeric:tabular-nums}
  .md ol,.md ul{margin:14px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:9px}
  .md em{color:var(--muted);font-style:normal;font-size:15px}
  .md hr{border:0;border-top:1px solid var(--rule);margin:34px 0}
  .md > *:first-child{margin-top:0}

  footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);
         font-size:14px;line-height:1.8;color:var(--muted)}
  @media (max-width:430px){ nav button{padding:9px 10px;font-size:14.5px} }
</style>
</head><body>
<div class="wrap">
<header>
  <div class="kicker">노원 · 상계주공 우선</div>
  <h1>재건축 노트</h1>
  <div class="sub" id="sub"></div>
</header>

<nav role="tablist" id="tabs"></nav>
<div id="panel" class="panel" role="tabpanel"></div>

<footer>

  이 페이지는 <code>python3 -m pipeline.site</code> 로 매일 다시 구워진다.
</footer>
</div>

const DATA = {"generated": "2026-10-22", "digests": [{"date": "2026-10-22", "markdown": "# 2026-10-22 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 분담금·공사비 수치가 담긴 기사가 후보에 없었다. 대신 노원·상계 생활권의 도시계획과 교통 사업이 진척됐다. 상계한신 1·2차 정비계획이 서울시 수권분과위에서 수정가결됐고, 노원구는 경원선 지하화 종합계획 반영을 촉구했다. 창동 서울아레나 개관을 앞둔 도봉구 행정 개편과 창동·상계택지개발지구 지구단위계획 건의도 나왔다. 6억원 미만 거래 쏠림 기사는 이미 스레드에 쌓인 내용과 겹쳐 제외했다.\n\n## 선별 4건\n\n### 1. 🔴 [노원구] 강북권 4000세대 공급 속도…미아사거리역 앞에 45층 랜드마크 들어선다...\n\n헤럴드경제 · 2026-10-22 · [원문](https://biz.heraldcorp.com/article/10910796)\n\n서울시 도시계획위원회 수권분과위가 노원구 상계한신 1·2차 재건축 정비구역 지정 및 정비계획 결정안을 수정가결했다. 13개동, 최고 35층, 총 1140세대(1차 560세대, 2차 580세대) 규모다. 사업성 보정계수 2.0이 적용됐다. 서울시는 상계5동 재개발, 상계보람아파트 재건축과 연계한 경관 조성을 주문했다. 같은 회의에서 강북구 미아동 75번지는 보정계수 1.8이 적용됐다.\n\n**정책 포인트**\n\n- 상계한신 1·2차에 사업성 보정계수 2.0이 적용됐다. 기사에는 상계주공9단지 적용 여부가 나오지 않는다.\n- 수정가결 단계이며 이후 절차는 기사에 나와 있지 않다.\n\n> ⚠️ 이 기사에는 분담금·비례율·감정평가액이 나오지 않습니다. 사업성 보정계수 2.0(강북구 미아동 75번지는 1.8)은 정비계획 수립 단계의 용적률 산정 보정값이고, 소유주 개인의 분담금이나 비례율을 뜻하지 않습니다.\n> ⚠️ 정비구역 지정 및 정비계획 결정안이 수정가결된 단계입니다. 이 시점에는 종전자산 평가와 권리가액이 확정되지 않았으므로, 이후 단계에서 나오는 분담금 수치와는 성격이 다릅니다.\n\n*왜 골랐나*: 노원구 상계동 재건축의 정비계획 결정과 사업성 보정계수 적용 사례가 나온 기사다.\n\n### 2. 🔴 [노원구] 노원구, 경원선 지하화 정부 종합계획 반영 총력전\n\njeonmae.co.kr · 2026-10-22 · [원문](https://jeonmae.co.kr/news/articleView.html?idxno=1303945)\n\n노원구 등 경원선이 지나는 7개 자치구가 철도지하화 통합개발 종합계획에 경원선(용산역~도봉산역)을 최우선 반영하라는 공동건의문을 냈다. 종합계획은 당초 2025년 말 발표 예정이었으나 계속 지연되고 있다. 노원구는 석계역~창동역 약 4.6km 구간이 광운대역세권, 창동차량기지, 석계역 주변 개발과 겹친다고 설명했다.\n\n**정책 포인트**\n\n- 건의 단계이며 노선 지정이나 사업 확정은 아니다.\n- 상계주공9단지와의 직접 연관은 기사에 없다. 석계~창동 구간 생활권 변화는 간접 영향으로 해석해야 한다.\n\n*왜 골랐나*: 노원 생활권 교통·도시 단절 해소와 직결되는 철도 지하화 사업의 진척이다.\n\n### 3. 🔴 [창동] 도봉구, 서울아레나 개관 앞두고 '핀셋회의' 도입…창동 개발사업 속도\n\njob-post.co.kr · 2026-10-21 · [원문](https://job-post.co.kr/news/articleView.html?idxno=233563)\n\n도봉구가 서울아레나 개관을 앞두고 창동경제엔진추진단 운영을 프로젝트별 '핀셋회의'로 바꿨다. 지금까지 3차례 열렸고 안건은 창동역~서울아레나 보행환경 개선, 숙박 활성화, 창동역 인근 주민 생활 보호다. 개관 시점이나 사업비는 나오지 않는다.\n\n**정책 포인트**\n\n- 행정 협의 방식의 변경이며 도시관리계획 결정이 아니다.\n\n*왜 골랐나*: 노원과 인접한 창동의 문화시설 개관 준비와 보행·생활환경 대응 소식이다.\n\n### 4. 🔴 [창동] 도봉 재건축·재개발 15곳 한자리…“규제 풀어달라”\n\n이데일리 · 2026-10-22 · [원문](https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=02735526645615544)\n\n도봉구 재건축·재개발 15개 구역 대표가 창동·상계택지개발지구 지구단위계획의 신속한 추진과 군 대공방어진지 조건 완화를 요청했다. 도봉구는 주민소통 협의체, 전문가 자문단, 정비사업 아카데미 운영 계획을 설명했다.\n\n**정책 포인트**\n\n- 건의 사항이며 지구단위계획 변경이 결정된 것은 아니다.\n- 도봉구 사업장 건의이므로 상계주공9단지에 적용된다고 볼 근거는 기사에 없다.\n\n*왜 골랐나*: 창동·상계택지개발지구 지구단위계획이 거론돼 상계 생활권 규제 환경과 이어진다.\n\n## 인사이트\n\n- 상계한신 1·2차에는 사업성 보정계수 2.0이 적용됐다. 보정계수가 단지별로 달라질 수 있다는 점이 확인된 사례이며, 상계주공 단지의 적용 여부는 기사에서 확인되지 않는다.[1]\n- 노원구의 경원선 지하화 건의와 도봉구의 창동·상계택지개발지구 지구단위계획 건의는 모두 건의 단계다. 확정된 계획이 아니다.[2][3]\n- 오늘 후보에는 평당공사비·분담금 수치가 담긴 기사가 없었다. 비용 비교 기준선을 새로 추가할 근거가 없다.\n\n## 참고 원문\n\n1. 강북권 4000세대 공급 속도…미아사거리역 앞에 45층 랜드마크 들어선다... — 헤럴드경제 · [원문](https://biz.heraldcorp.com/article/10910796)\n2. 노원구, 경원선 지하화 정부 종합계획 반영 총력전 — jeonmae.co.kr · [원문](https://jeonmae.co.kr/news/articleView.html?idxno=1303945)\n3. 도봉 재건축·재개발 15곳 한자리…“규제 풀어달라” — 이데일리 · [원문](https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=02735526645615544)\n\n## 오늘 흘려보낸 것\n\n중복 75건 · 후속보도 신규정보 없음 8건 · 기준 미달 703건\n"}, {"date": "2026-10-21", "markdown": "# 2026-10-21 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 상계주공5단지 시공 착수 단계의 현실적 장애물이 가장 직접적인 소식이다. 한화건설이 요구하는 공사 차량 게이트 4곳과 교육환경평가서상 가능한 2곳의 간극이 공기·최종 공사비 확정, 관리처분계획 수립에 영향을 줄 수 있다는 내용이다. 나머지는 노원구 중저가 구축 거래 쏠림, 전세난, 창동 서울아레나 문화거점 계획 등 생활권 환경을 다룬 기사다. 분담금·평당공사비 같은 새 비용 수치는 오늘 기사에 없다. 6억 미만 거래 기사는 십수 건이 같은 다방 자료를 반복해 한 건만 골랐다.\n\n## 선별 5건\n\n### 1. 🔴 [상계주공5단지] [단독] '25억 배상' 턴 상계주공5단지, 이번엔 한화건설과 '게이트 이견...\n\n뉴시안 · 2026-10-21 · [원문](http://newsian.co.kr/news/articleView.html?idxno=97418)\n\n상계주공5단지 교육환경평가서상 공사 차량 출입구는 검토 대상 4곳 중 남측 동일로216길 방면 2곳만 개설이 가능하다. 학교 출입문 반경 50m 절대보호구역과 6단지 내 도로 폭(6.4m) 때문에 나머지 2곳은 불가 판정을 받았다. 한화건설은 최고 35층, 5개 동, 996가구 공사를 위해 최소 4개 게이트가 필요하다는 입장이며, 게이트 확보가 불투명해 공기와 최종 공사비 확정에 난색을 보인다고 한다. 이 때문에 관리처분계획 수립과 조합원 최종 추가 분담금 산정이 지연될 수 있다는 우려가 나온다. 기사에 공사비·분담금 금액은 없다.\n\n**이번에 새로 나온 것**: 한화건설의 게이트 4곳 요구와 평가서상 2곳만 가능하다는 판정이 충돌해 공사비 확정과 분담금 산정이 불투명해졌다.\n\n**정책 포인트**\n\n- 교육환경 보호에 관한 법률상 학교 출입문 반경 50m 이내는 공사 차량 진출입로 설치가 금지되며, 교육환경평가는 사업시행인가를 위한 필수 법정 심의로 기재 조건을 임의로 완화할 수 없다고 기사는 전한다.\n\n> ⚠️ 이번 보도에는 공사비나 분담금 금액이 없습니다. 게이트 문제로 공사비 확정이 늦어진다는 우려는 나왔지만, 그것이 분담금에 얼마나 반영되는지는 기사에서 확인할 수 없습니다.\n> ⚠️ 기사가 언급한 '최종 추가 분담금'은 관리처분계획 단계에서 정해지는 값입니다. 지금 단계의 어떤 수치도 확정 분담금으로 읽으면 안 됩니다.\n> ⚠️ 분담금은 보유 면적, 동·층·향에 따른 개별 종전자산 평가액, 신청 평형에 따라 소유주마다 다릅니다. 공사 일정 지연 우려만으로 본인의 분담금 변화 방향이나 크기를 판단할 수 없습니다.\n\n*왜 골랐나*: 상계주공5단지 직접 기사이며, 게이트 문제가 공사비 확정과 추가 분담금 산정 일정으로 이어질 수 있다는 점이 새로 나왔다.\n\n### 2. 🔴 [노원구] 서울 6억 미만 거래 비중 21.9%로 늘어…노원·도봉 집중\n\n뉴시스 · 2026-10-20 · [원문](https://newsis.com/view/NISX20261020_0003832684)\n\n같은 사건 보도: bizwork.co.kr, seoulfn.com, 더팩트 외 15곳\n\n다방이 국토부 실거래가를 분석한 결과 올해 1~3분기 서울 아파트 거래 중 6억원 미만 비중은 21.9%로 전년 동기(16.9%)보다 5.0%p 올랐다. 서울 6억 미만 거래 중 노원구가 24.3%로 가장 높았고 도봉구 12.3%, 구로구 9.3%가 뒤를 이었다. 노원·도봉 합산 비중은 30.0%에서 36.6%로 올랐다. 기사는 전세난과 정책대출 활용 수요를 배경으로 풀이한다.\n\n> ⚠️ 이 기사는 시장 전체의 실거래 비중을 다룬 것으로, 재건축 단지의 종전자산 평가액이나 분담금과는 직접 관련이 없습니다. 실거래가는 개별 감정평가액이나 권리가액과도 다릅니다.\n\n*왜 골랐나*: 노원구 중저가 구축 거래 집중을 수치로 보여주며, 같은 다방 자료를 다룬 여러 기사 중 수치가 가장 온전한 기사다.\n\n### 3. 🔴 [창동] 오세훈 \"올해 1만5000가구 착공\"…주택공급 속도 높인다\n\nasiatime.co.kr · 2026-10-19 · [원문](https://asiatime.co.kr/article/20261019500211)\n\n오세훈 시장은 국감에서 올해 1만5000가구가 착공됐다며 신속통합기획으로 정비사업 속도를 높이겠다고 밝혔다. 지역균형발전 차원에서 창동 서울아레나를 중심으로 동북권에 문화산업 거점을 조성할 계획이라고 했다. 서울 달빛야장과 문화시설 야간 개방도 확대한다는 구상이다. 구체적 일정이나 예산은 기사에 없다.\n\n**정책 포인트**\n\n- 신속통합기획 중심의 정비사업 속도 제고 기조가 재확인됐다. 상계주공 단지 일부가 이 방식으로 추진 중이나 이 기사가 개별 단지를 다루지는 않는다.\n\n*왜 골랐나*: 창동 서울아레나 중심 문화산업 거점 계획은 노원 인접 생활권 변화로, 상계주공이 속한 동북권 여건과 연결 근거가 있다.\n\n### 4. 🔴 [노원구] 서울 전월세 매물 12.8% 줄었다… 보증금 3억 올린 갱신 계약도\n\n조선비즈 · 2026-10-20 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/10/20/JUGXZ2K7S5AELMGYFIFVEJ6ARQ)\n\n서울 아파트 전월세 매물은 1년 새 12.8% 줄었고 노원구는 37.5% 감소했다. 전셋값은 노원구와 영등포구가 주간 0.31% 올라 25개 구 중 가장 높았다. 노원구 주공10단지 전용 58㎡는 보증금을 3억1500만원에서 6억원으로 올린 갱신 계약이 신고됐다.\n\n> ⚠️ 노원구 주공10단지 갱신 계약의 보증금은 전월세 시장의 거래 사례입니다. 이 단지 소유주의 종전자산 평가액이나 분담금을 알려주는 수치가 아닙니다.\n\n*왜 골랐나*: 노원구 전월세 매물 감소와 전셋값 상승률 1위로, 재건축 이주 시 임대 시장 여건을 가늠할 수 있다.\n\n### 5. 🔴 [노원구] 정부는 “안정 흐름”이라는데…서울 외곽은 ‘10억 문턱’도 넘었다\n\nkmib.co.kr · 2026-10-20 · [원문](https://kmib.co.kr/article/20261019502225)\n\n서울 아파트값 상승률은 7월 1.27%를 정점으로 9월 0.74%까지 내렸지만 외곽은 다른 흐름이다. 노원구 월계동신아파트 전용 70.81㎡ 거래 중윗값은 7월 9억5000만원에서 9월 10억2750만원으로 올랐다. 전문가는 수급 불균형으로 최소 올해까지 외곽 집값이 오를 것으로 봤다.\n\n> ⚠️ 월계동신아파트 거래 중윗값은 시장 호가·거래 흐름을 보여주는 수치입니다. 정비사업의 종전자산 감정평가액과는 산정 방식이 다르고, 권리가액은 여기에 비례율을 곱해 정해지므로 같은 값으로 읽으면 안 됩니다.\n\n*왜 골랐나*: 노원구 월계동 단지의 월별 거래 중윗값 상승을 수치로 제시해 정부의 안정화 메시지와 노원 현장의 괴리를 보여준다.\n\n## 인사이트\n\n- 상계주공5단지는 시공사가 선정된 뒤에도 공사 차량 동선 같은 입지 제약이 공기와 최종 공사비 확정을 흔들 수 있음이 드러났다. 이 문제가 관리처분계획과 추가 분담금 산정으로 번질 수 있다는 것이 기사의 우려다.[1]\n- 노원구는 6억 미만 거래 비중(24.3%)과 전세 매물 감소율(37.5%), 전셋값 상승률(0.31%)에서 모두 상위권이어서 소형 구축 중심의 실수요 압박이 겹쳐 있다.[2][3]\n- 동북권 문화산업 거점(창동 서울아레나)은 계획 발표 단계이며, 노원 단지의 용도지역이나 분담금에 미치는 영향은 기사로 확인되지 않는다.[4]\n\n## 오늘의 개념\n\n### 교육환경평가\n\n도시정비법상 사업시행인가를 받기 위한 필수 법정 심의로, 학교 인근 공사의 교육환경 영향을 따진다. 기사에 따르면 학교 출입문 반경 50m 이내는 절대보호구역이라 공사 차량 진출입로를 둘 수 없다.\n\n*오늘*: 상계주공5단지는 이 평가서 때문에 공사 차량 게이트가 4곳 중 2곳만 가능해져, 시공사가 공기와 최종 공사비 확정에 난색을 보이고 있다.[1]\n\n## 참고 원문\n\n1. [단독] '25억 배상' 턴 상계주공5단지, 이번엔 한화건설과 '게이트 이견... — 뉴시안 · [원문](http://newsian.co.kr/news/articleView.html?idxno=97418)\n2. 서울 6억 미만 거래 비중 21.9%로 늘어…노원·도봉 집중 — 뉴시스 · [원문](https://newsis.com/view/NISX20261020_0003832684)\n3. 서울 전월세 매물 12.8% 줄었다… 보증금 3억 올린 갱신 계약도 — 조선비즈 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/10/20/JUGXZ2K7S5AELMGYFIFVEJ6ARQ)\n4. 오세훈 \"올해 1만5000가구 착공\"…주택공급 속도 높인다 — asiatime.co.kr · [원문](https://asiatime.co.kr/article/20261019500211)\n\n## 오늘 흘려보낸 것\n\n중복 107건 · 후속보도 신규정보 없음 0건 · 기준 미달 658건\n"}, {"date": "2026-10-20", "markdown": "# 2026-10-20 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원·상계 생활권에서 비용 수치가 나온 기사와 인접 도봉·창동 도시계획 변화가 함께 나왔다. 상계보람아파트는 정비구역 지정 고시와 함께 추정비례율과 권리자 분양가가 공개됐고, 도봉구는 창동역 일대를 포함한 쌍문생활권중심 지구단위계획 변경안이 수정가결됐다. 서울시장 국감 발언에는 창동 서울아레나 문화산업 거점 계획이 짧게 언급됐다. 노원의 6억 미만 거래 집중과 전월세 매물 감소는 수요 환경을 보여주지만 재건축 비용 정보는 아니다. 상계주공9단지와 직접 연결되는 새 기사는 없다.\n\n## 선별 4건\n\n### 1. 🔴 [노원구] 상계보람, 재건축 추정비례율 110.28%로 추산\n\n한국주택경제신문 · 2026-10-20 · [원문](https://arunews.com/news/articleView.html?idxno=68236)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계보람아파트 | 비례율 | 110.28% | — |\n| 상계보람아파트 | 조합원분양가 | 62,640만원(세대 총액) | — |\n| 상계보람아파트 | 조합원분양가 | 104,230만원(세대 총액) | — |\n\n노원구 상계보람아파트의 정비구역 지정과 정비계획 결정, 지구단위계획이 지난 15일 고시됐다. 최고 45층 4,483세대(공공 323세대 포함)를 짓고, 현재 3,315세대에서 1,168세대가 늘어난다. 추정비례율은 110.28%로 추산됐고, 총수입 추정액 3조9,354억9,000만원, 총지출 추정액 1조8,930억5,000만원, 종전자산 추정총액 1조8,521억3,000만원이다. 권리자 분양가 추정액은 전용 42.95㎡ 6억2,640만원부터 84.99㎡ 10억4,230만원까지 제시됐다.\n\n> ⚠️ 110.28%는 정비구역 지정 단계의 추정비례율입니다. 확정값이 아니며, 일반분양가와 공사비가 바뀌면 함께 바뀌고 관리처분 단계에서 달라집니다.\n> ⚠️ 기사에는 종전자산 추정총액만 있고 개별 소유주의 감정평가액은 없습니다. 권리가액은 개별 종전자산 감정평가액에 비례율을 곱해 정해지므로, 이 비례율이 곧 본인의 권리가액이나 분담금을 뜻하지 않습니다.\n> ⚠️ 권리자 분양가 추정액은 전용면적별로 제시된 신청 평형 기준 금액입니다. 보유 면적, 동·층·향에 따른 개별 평가액에 따라 분담금이 달라지므로 본인이 낼 금액으로 읽으시면 안 됩니다. 이 기사에는 분담금 수치가 없습니다.\n> ⚠️ 6억2,640만원과 10억4,230만원은 각각 최소·최대 평형의 분양가 추정액이며 분담금이 아닙니다. 종전자산 평가액을 반영하기 전의 금액이니 놀라지 마시고 참고용으로 보시기 바랍니다.\n\n*왜 골랐나*: 노원구 재건축 사업장의 비례율과 평형별 권리자 분양가 추정액이 본문에 실려 있어서다.\n\n### 2. 🔴 [창동] 쌍문생활권중심 지구단위계획 재정비\n\n한국주택경제신문 · 2026-10-19 · [원문](https://arunews.com/news/articleView.html?idxno=68249)\n\n도봉구 쌍문생활권중심 지구단위계획 변경안이 지난 14일 서울시 도시·건축공동위원회에서 수정가결됐다. 창동역 일대가 대상 구역에 새로 포함돼 총 면적은 22만6,876㎡가 된다. 허용 용적률은 제2종일반 200%→220%, 제3종일반 250%→275%, 준주거 360%→440%로 오르고, 도봉로변 최고 높이는 50m에서 100m 이하로 완화된다. 서울아레나 등과 연계한 관광숙박시설·가로 활성화 용도에는 인센티브가 도입된다.\n\n**정책 포인트**\n\n- 수정가결 단계이며 이후 주민 재열람과 서울시 계획 결정·고시 절차가 남아 있다(시민일보 보도).\n- 지구단위계획 구역 변경으로, 상계주공9단지 등 노원 단지의 용적률과는 직접 관련이 확인되지 않는다.\n\n*왜 골랐나*: 노원과 인접한 창동역 일대의 용적률·높이 완화와 서울아레나·GTX-C 연계 계획이 나온 도시계획 변화여서다.\n\n### 3. 🔴 [창동] 오세훈 서울시장 \"공급 확대·전월세 안정으로 주거 불안 낮출 것\" [2026...\n\nnewsway.co.kr · 2026-10-19 · [원문](https://newsway.co.kr/news/view?ud=2026101911160722516)\n\n오세훈 시장이 국감에서 신속통합기획으로 정비사업 속도를 높이겠다고 밝혔다. 올해 1만5000호가 착공됐고 민간 임대주택 공급 기반을 넓히겠다는 방침이다. 창동 서울아레나를 중심으로 동북권에 문화산업 거점을 조성하겠다는 계획도 언급됐다.\n\n**정책 포인트**\n\n- 창동 서울아레나 문화산업 거점은 시장의 계획 발언 수준이며 구체적 일정·규모는 본문에 없다.\n\n*왜 골랐나*: 창동 서울아레나 중심 동북권 문화산업 거점 조성 방침이 나와 노원 인접 생활권 변화로 연결되기 때문이다.\n\n### 4. 🔴 [광운대역세권] 쓰레기봉투 수거하고 택배 배달 척척... 아이파크 단지 누비는 '로봇 집...\n\n파이낸셜뉴스 · 2026-10-18 · [원문](https://fnnews.com/news/202610181811050284)\n\nIPARK현산이 AI 라이프 솔루션을 아이파크 단지로 확대한다. 노원구 광운대역세권 서울원의 민간임대 파크로쉬 서울원(768가구)에는 웨어러블 기기와 센서, 병원 연계 헬스케어가 적용된다. 노원을지대학교병원과 상시 모니터링·응급 이송을 지원받고, 입주는 2028년 7월 예정이다.\n\n*왜 골랐나*: 광운대역세권 서울원 민간임대의 입주 시기와 생활 서비스 구성이 확인돼 노원 인접 생활환경 변화로 볼 수 있어서다.\n\n## 인사이트\n\n- 상계보람의 추정 비례율은 110.28%이고 같은 정비구역지정 단계 누적 비례율 중앙값은 108.4%로, 크기 관계상 중앙값보다 높다. 다만 이 누적치에 상계보람 값이 이미 포함돼 있을 수 있다.[1]\n- 상계보람 권리자 분양가 59.99㎡ 8억3,400만원은 누적 조합원분양가 중앙값 83,400만원(세대 총액)과 같은 값이다. 누적 표본에 이 단지가 포함된 것으로 보이며 새 비교 근거는 아니다.[1]\n- 쌍문 지구단위계획은 창동역 일대를 묶어 용적률·높이를 완화하는 안으로, 노원 인접 생활권의 개발 압력을 보여준다. 노원 단지에 적용되는지는 확인되지 않는다.[2][3]\n- 서울 6억 미만 아파트 거래의 24.3%가 노원구에 집중됐고, 노원 전월세 매물도 1년 새 37.5% 줄었다. 재건축 비용 정보는 아니지만 노원 주거 수요 환경을 보여준다.[4][5]\n\n## 오늘의 개념\n\n### 추정비례율\n\n정비계획 단계에서 총수입 추정액과 총지출 추정액, 종전자산 추정총액으로 미리 계산해 보는 비례율이다. 확정 값이 아니라 추산이다.\n\n*오늘*: 상계보람이 정비구역 지정 고시와 함께 추정비례율 110.28%를 공개해, 이후 분담금 판단의 출발점이 생겼다.[1]\n\n## 참고 원문\n\n1. 상계보람, 재건축 추정비례율 110.28%로 추산 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=68236)\n2. 쌍문생활권중심 지구단위계획 재정비 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=68249)\n3. 도봉구, 쌍문생활권중심 지구단위계획 변경안 수정가결··· 창동역 일대... — siminilbo.co.kr · [원문](https://siminilbo.co.kr/news/newsview.php?ncode=1160285428318629)\n4. 서울 6억 미만 거래 비중 21.9%로 늘어…노원·도봉 집중 — 뉴시스 · [원문](https://newsis.com/view/NISX20261020_0003832684)\n5. 서울 전월세 매물 12.8% 줄었다… 보증금 3억 올린 갱신 계약도 — 조선비즈 · [원문](https://biz.chosun.com/real_estate/real_estate_general/2026/10/20/JUGXZ2K7S5AELMGYFIFVEJ6ARQ)\n\n## 오늘 흘려보낸 것\n\n중복 101건 · 후속보도 신규정보 없음 0건 · 기준 미달 572건\n"}, {"date": "2026-10-19", "markdown": "# 2026-10-19 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 후보에는 상계주공 단지의 직접 분담금 수치가 없다. 대신 노원·창동 생활권을 바꿀 수 있는 계획 변경(쌍문 지구단위계획)과 광운대역세권 서울원 공급 소식, 공사비 검증 제도의 한계, 노원 하락 거래 사례가 나왔다. 정비사업 비용 쪽에서는 성수3지구 평당공사비 수치와 공사비 검증 결과가 확인된다. 다만 이들 수치는 노원 단지에 바로 적용되는 값이 아니다.\n\n## 선별 5건\n\n### 1. 🔴 [창동] 도봉구, '쌍문생활권중심 지구단위계획구역 및 계획 변경안'수정가결.....\n\ncnbizm.com · 2026-10-17 · [원문](https://cnbizm.com/news/articleView.html?idxno=318327)\n\n같은 사건 보도: siminilbo.co.kr\n\n도봉구 쌍문생활권중심 지구단위계획 변경안이 14일 서울시 도시·건축공동위원회에서 수정가결됐다. 구역에 창동역 일대가 새로 포함돼 총 면적이 226,876㎡가 된다. 지구단위계획 용적률 체계 개정에 따라 허용 용적률이 제2종일반주거 200%→220%, 제3종일반주거 250%→275%, 준주거 360%→440%로 늘고, 도봉로변 최고 높이는 50m에서 100m 이하로 상향된다. 구는 주민 재열람 등 후속 절차 뒤 서울시에 최종 결정·고시를 요청할 예정이다.\n\n**정책 포인트**\n\n- 수정가결 단계이며 주민 재열람과 최종 결정·고시가 남아 있어 확정은 아니다.\n- 대상은 도봉구 쌍문·창동 지구단위계획구역이다. 상계주공9단지 등 노원 단지의 용적률 변화와는 직접 관련이 없다.\n\n*왜 골랐나*: 창동역 일대 도시관리계획이 수정가결된 인접 생활권 변화로, 서울아레나·GTX-C 개통 일정이 함께 언급돼 노원 생활권과 연결 경로를 따져볼 수 있다.\n\n### 2. 🔴 [노원구] 서울 아파트 전세 갱신계약 증가…‘파크로쉬 서울원’ 장기 임대 공급\n\nhankookilbo.com · 2026-10-19 · [원문](https://hankookilbo.com/news/article/A2026101614060002283?did=NA)\n\n올해 1~9월 서울 아파트 전세 갱신계약 비중은 51.09%였다. 전세가격지수 누적 상승률은 노원구가 13.53%로 서울 평균 8.35%를 웃돌았다. 광운대역세권 복합개발 '서울원' 안의 민간임대 '파크로쉬 서울원'은 지하 3층~지상 최고 49층, 2개 동, 768가구 규모로 2028년 7월 입주 예정이다. 공급 측 설명으로는 2026년 계약자에 10년 보증금 동결 조건이 적용된다.\n\n*왜 골랐나*: 노원구 광운대역세권 서울원의 공급 진척과 노원 전세시장 수치가 함께 담겨 있다.\n\n### 3. 재개발·재건축 공사비 검증했더니… 최근 5년간 부풀린 공사비 4조1,600...\n\n한국주택경제신문 · 2026-10-19 · [원문](https://arunews.com/news/articleView.html?idxno=68257)\n\n최근 5년간 공사비 검증을 받은 166개 사업장 중 164곳(98.8%)에서 공사비가 감액됐고, 감액 총액은 4조1,600억원이다. 증액 요구액의 절반 이상이 감액된 사업장도 10곳이다. 검증 결과는 법적 구속력이 없고, 의무 대상이 검증을 받지 않아도 제재할 수 없다. 복기왕 의원은 신청기한 명확화와 미신청 제재를 주문했다.\n\n**정책 포인트**\n\n- 공사비 검증 신청: 조합원 20% 이상 요구 또는 증액비율이 일정치를 넘으면 의무 신청.\n- 처리 기한은 증액 1,000억원 미만 60일, 1,000억원 이상 75일.\n- 검증 결과는 참고자료에 그치고 미신청 제재 수단이 없다.\n\n> ⚠️ 이 기사의 4조1,600억원은 166개 사업장 전체의 감액 합계이고, 소유주 한 명의 분담금이 줄어든 금액이 아닙니다.\n> ⚠️ 검증 결과는 법적 구속력이 없습니다. 감액 권고가 곧 관리처분 단계의 공사비나 비례율에 반영된다고 읽으시면 안 됩니다.\n\n*왜 골랐나*: 공사비 검증 제도의 구속력 한계가 드러나 모든 재건축 조합의 분담금 관리에 적용되는 정책 쟁점이다.\n\n### 4. 같은 성수 다른 선택…추가협상 나선 '2지구' 조건 보완 원한 '3지구'\n\n아시아투데이 · 2026-10-19 · [원문](https://asiatoday.co.kr/kn/view.php?key=20261018010005549)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 성수3지구 | 평당공사비 | 1,195만원/3.3㎡ | — |\n\n성수2구역 조합은 DL이앤씨 제안을 두고 추가 협상에 나서며 선정 총회는 11월 21일 예정이다. 성수3지구는 삼성물산이 시공사로 선정됐지만 계약 전 추가 보완을 계획한다. 일부 조합원은 공사비 상한선·유예 기간 부재, 지질 변동 시 추가 공사비, 미분양 보호장치를 문제 삼았다.\n\n> ⚠️ 성성수3지구의 3.3㎡당 공사비 1195만원은 시공사 선정 단계의 수치입니다. 계약 전 추가 보완이 예정돼 있어 확정된 금액이 아닙니다.\n> ⚠️ 이 기사에는 1195만원의 기준이 되는 종전 면적, 신청 평형, 비례율이 나와 있지 않습니다. 이 수치는 평당 단가이므로 분담금이나 총액으로 바로 옮겨 읽으시면 안 됩니다.\n> ⚠️ 성수4지구 공사비(1058만원)와의 비교는 두 단지의 사업 단계와 계약 조건이 같은지 기사만으로 확인되지 않습니다. 단순 비교는 조심하셔야 합니다.\n\n*왜 골랐나*: 3.3㎡당 공사비 실수치와 계약 전 협상 쟁점이 있어 공사비 조건을 읽는 참고가 된다.\n\n### 5. 🔴 [상계주공4단지] 서초구 '반포자이' 35평, 5억 내린 42억원에 거래 [일일 하락가]\n\n한국금융신문 · 2026-10-19 · [원문](https://fntimes.com/html/view.php?ud=20261019085027834b372994c95_18)\n\n17일 등록 기준 하락 거래 사례 가운데 노원구 상계동 '상계주공4(고층)' 전용 41.30㎡가 10월 2일 4억8000만원에 팔렸다. 직전 거래인 9월 2일 6억원보다 1억2000만원(20.0%) 낮다. 서울·경기·부산 등의 다른 하락 거래도 함께 소개됐다.\n\n*왜 골랐나*: 상계주공 단지의 실거래 하락 사례가 포함돼 있다.\n\n## 인사이트\n\n- 쌍문생활권 계획 변경은 수정가결 단계이며 최종 결정·고시가 남았다. 도봉구 사안이어서 노원 단지의 용적률 변화로 이어진다는 근거는 기사에 없다.[1]\n- 공사비 검증은 98.8% 사업장에서 감액이 나왔지만 구속력이 없어, 조합이 결과를 계약에 반영하도록 하는 장치는 제도 밖에 있다.[2]\n- 성수3지구 사례에서 조합원 불만은 평당 단가 자체보다 물가 연동 상한선·유예 기간 같은 계약 조건에 집중됐다.[3]\n\n## 참고 원문\n\n1. 도봉구, '쌍문생활권중심 지구단위계획구역 및 계획 변경안'수정가결..... — cnbizm.com · [원문](https://cnbizm.com/news/articleView.html?idxno=318327)\n2. 재개발·재건축 공사비 검증했더니… 최근 5년간 부풀린 공사비 4조1,600... — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=68257)\n3. 같은 성수 다른 선택…추가협상 나선 '2지구' 조건 보완 원한 '3지구' — 아시아투데이 · [원문](https://asiatoday.co.kr/kn/view.php?key=20261018010005549)\n\n## 오늘 흘려보낸 것\n\n중복 58건 · 후속보도 신규정보 없음 0건 · 기준 미달 352건\n"}, {"date": "2026-10-18", "markdown": "# 2026-10-18 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 비용 수치가 있는 기사가 거의 없고, 창동·상계 생활권의 도시계획과 개발 진척이 중심이다. 도봉구가 쌍문생활권 지구단위계획을 창동역까지 넓히며 용적률·높이 기준을 완화하는 안을 수정가결했고, 광운대역 서울원 아이파크는 공정이 30% 안팎까지 진행됐다. 공사비 쪽에서는 부동산원 검증에서 감액이 필요하다는 결과가 대부분이라는 점이 확인됐다. 이 변화들이 상계주공9단지에 직접 적용되는지는 어느 기사에도 나오지 않는다.\n\n## 선별 5건\n\n### 1. 🔴 [창동] 도봉로 건물 높이 50→100m…쌍문생활권, 창동역까지 확장\n\nthepowernews.co.kr · 2026-10-16 · [원문](https://thepowernews.co.kr/view.php?ud=202610161418427117de3f0aa1be_7)\n\n도봉구 쌍문생활권중심 지구단위계획 변경안이 서울시 도시·건축공동위원회에서 수정가결됐다. 구역에 창동역 일대가 포함돼 면적이 22만6876㎡로 늘어난다. 허용 용적률은 2종일반 200%→220%, 3종일반 250%→275%, 준주거 360%→440%로 오르고, 도봉로변 최고 높이는 50m에서 100m 이하로 완화된다. 주민 재열람 등 후속 절차를 거쳐 서울시에 최종 결정·고시를 요청할 예정이다.\n\n**정책 포인트**\n\n- 수정가결 단계이며 최종 결정·고시 전이다.\n- 용적률·높이 완화는 이 지구단위계획구역(도봉구)에 한정되며, 상계주공9단지에 적용된다는 내용은 기사에 없다.\n\n> ⚠️ 이번 보도에는 분담금·공사비·비례율 수치가 없습니다. 지구단위계획 변경안은 용적률과 높이 기준 완화이며, 개별 소유주의 분담금은 이 기사만으로 알 수 없습니다.\n> ⚠️ 변경안은 주민 재열람 등 후속 절차가 남아 있어 최종 결정·고시 전 단계입니다.\n\n*왜 골랐나*: 노원 인접 생활거점인 창동역 일대의 도시관리계획 변경이라는 점에서 상계 생활권 변화 근거로 선별했다.\n\n### 2. 🔴 [노원구] IPARK현대산업, '서울원' 업고 3Q 영업익 개선세 이어갈까\n\nnews.einfomax.co.kr · 2026-10-18 · [원문](https://news.einfomax.co.kr/news/articleView.html?idxno=4439774)\n\n서울원 아이파크는 노원구 화랑로 광운대역 일원에 총 3,032세대로 조성되는 단지다. 증권가는 3분기 누적 공정률이 약 30.0%이고 매출 정점은 2027년이라고 전했다. 후속 사업으로 내년 착공 예정인 공릉역세권도 거론됐다. 기사의 사업비·실적 수치는 시공사 실적 전망 맥락이다.\n\n> ⚠️ 이 기사의 사업비·실적 수치는 시공사 실적 전망 맥락입니다. 조합원 분담금이나 종전자산 평가와 무관하므로 소유주 개인의 부담으로 옮겨 읽으시면 안 됩니다.\n\n*왜 골랐나*: 광운대역 일원 노원 개발의 공정 진척과 공릉역세권 착공 일정이 나와 인접 생활권 변화로 연결된다.\n\n### 3. 복기왕 의원, 정비사업 공사비 검증서 4조1600억원 감액\n\nkmecnews.co.kr · 2026-10-16 · [원문](https://kmecnews.co.kr/news/articleView.html?idxno=52342)\n\n최근 5년간 한국부동산원 공사비 검증 대상 166개 사업장 중 164곳(98.8%)에서 총 4조1600억원의 감액이 산정됐다. 시공사 증액 요구의 절반 이상이 감액된 곳은 10곳이었다. 다만 검증 결과에 법적 구속력이 없고, 의무검증 대상이 신청하지 않아도 제재할 수 없다는 한계가 지적됐다.\n\n**정책 포인트**\n\n- 검증 결과에 법적 구속력이 없다.\n- 의무검증 대상의 신청기한 명확화와 미신청 시 제재 방안이 거론됐다.\n\n> ⚠️ 4조1600억원은 166개 사업장 전체의 감액 합계로, 사업 전체 금액입니다. 소유주 한 명의 분담금 감소액이 아닙니다.\n> ⚠️ 검증 결과는 법적 구속력이 없습니다. 감액 산정액이 그대로 계약 공사비나 분담금에 반영된다고 읽으면 어긋납니다.\n\n*왜 골랐나*: 공사비 검증 제도의 실효성 한계가 드러난 정책 기사로, 모든 사업장의 분담금 부담에 영향을 주는 사안이다.\n\n### 4. 🔴 [창동] \"역 하나로는 부족해\"…'트리플 역세권' 집값 가른다\n\n데일리안 · 2026-10-18 · [원문](https://dailian.co.kr/news/view/1702101?sc=Naver)\n\n지난 9월 15일 GTX-C 노선(예정)이 착공했다고 기사는 전한다. 창동역 일대는 1·4호선에 GTX-C가 더해지는 트리플 역세권으로 소개됐고, 창동 동아청솔 전용 84㎡는 6월 12억3700만원에 거래돼 1월 10억3000만원보다 올랐다. 이는 실거래가 사례이고 재건축 비용 수치는 아니다.\n\n> ⚠️ 창동 동아청솔 전용 84㎡의 12억3700만원은 실거래가 사례입니다. 재건축 분담금이나 종전자산 감정평가액과는 다른 수치입니다.\n> ⚠️ 실거래가는 종전자산 감정평가액이나 권리가액이 아닙니다. 분담금 계산의 기준으로 읽지 않으셔야 합니다.\n\n*왜 골랐나*: 창동역 GTX-C 착공이라는 노원 인접 교통 변화가 담겨 있어 선별했다.\n\n### 5. 🔴 [창동] 유기훈 시의원 “우이신설선 연장 더 늦출 수 없어…도봉구 교통격차 해...\n\nkukinews.com · 2026-10-16 · [원문](https://kukinews.com/article/view/kuk202610160120)\n\n본문은 확보되지 않았고 매체 제공 요약만 있다. 서울시의원이 우이신설선 연장의 실제 공사 진척을 촉구하고, 서울아레나 개관 등 창동 일대 개발에 따른 교통수요 증가에 선제 대책을 주문했다는 내용이다.\n\n> ⚠️ 본문이 확보되지 않아 매체 제공 요약만 참고했습니다. 교통 정책 촉구 내용이며 분담금 관련 수치는 없습니다.\n\n*왜 골랐나*: 창동 개발에 따른 교통수요와 우이신설선 연장 논의가 노원 인접 생활권 교통 변화와 맞닿아 있어 선별했다.\n\n## 인사이트\n\n- 창동역 일대는 지구단위계획 변경안 수정가결과 GTX-C 착공 보도가 같은 주에 나왔으나, 지구단위계획은 최종 결정·고시 전 단계다.[1][2]\n- 공사비 검증은 감액 산정이 대부분이어도 결과에 법적 구속력이 없어, 조합원 분담금에 실제로 반영되는지는 조합과 시공사의 합의에 달려 있다.[3]\n- 서울원 아이파크는 공정률이 약 30.0%로 보도돼 광운대역 일원 개발이 착공 이후 단계에 들어섰음을 보여주고, 내년 착공 예정으로 거론된 공릉역세권도 같은 기사에 나온다.[4]\n\n## 참고 원문\n\n1. 도봉로 건물 높이 50→100m…쌍문생활권, 창동역까지 확장 — thepowernews.co.kr · [원문](https://thepowernews.co.kr/view.php?ud=202610161418427117de3f0aa1be_7)\n2. \"역 하나로는 부족해\"…'트리플 역세권' 집값 가른다 — 데일리안 · [원문](https://dailian.co.kr/news/view/1702101?sc=Naver)\n3. 복기왕 의원, 정비사업 공사비 검증서 4조1600억원 감액 — kmecnews.co.kr · [원문](https://kmecnews.co.kr/news/articleView.html?idxno=52342)\n4. IPARK현대산업, '서울원' 업고 3Q 영업익 개선세 이어갈까 — news.einfomax.co.kr · [원문](https://news.einfomax.co.kr/news/articleView.html?idxno=4439774)\n\n## 오늘 흘려보낸 것\n\n중복 70건 · 후속보도 신규정보 없음 0건 · 기준 미달 470건\n"}, {"date": "2026-10-17", "markdown": "# 2026-10-17 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원·도봉 생활권의 도시계획 변화와 정비사업 비용 수치가 함께 나왔다. 도봉 쌍문생활권 지구단위계획은 용적률과 높이 상한을 올렸고, 노원 중계본동은 민간정비사업 착공 사례로 언급됐다. 상대원2구역의 평당공사비 제안은 노원 단지와 같은 비교 대상이 아니라 외부 벤치마크 정도로만 읽어야 한다. 상계주공 개별 단지의 새 분담금 수치는 없고, 상계주공10단지(고층) 실거래 하락 한 건이 눈에 띈다.\n\n## 선별 4건\n\n### 1. 🔴 [창동] 도봉 쌍문생활권 지구단위계획 재정비…용적률·최고높이 완화\n\n서울신문 · 2026-10-16 · [원문](https://seoul.co.kr/news/publicnews/2026/10/16/20261016500107?wlog_tag3=naver)\n\n도봉구가 제출한 쌍문생활권중심 지구단위계획 변경안이 14일 서울시 도시·건축공동위원회에서 수정 가결됐다. 구역에 창동역 일대가 새로 포함되어 총면적이 22만 6876㎡로 늘어난다. 허용 용적률은 제2종일반 200%→220%, 제3종일반 250%→275%, 준주거 360%→440%로 오르고, 도봉로변 최고 높이는 50m에서 100m 이하로 상향된다. 주민 재열람 등 후속 절차를 거쳐 최종 결정·고시를 요청할 예정이라 아직 확정 전이다.\n\n**정책 포인트**\n\n- 수정 가결 단계이며 최종 결정·고시는 주민 재열람 등 후속 절차 이후다.\n- 이 용적률 상향은 도봉 쌍문 지구단위계획구역에 대한 것이며 상계주공9단지의 용적률 완화와는 무관하다.\n\n> ⚠️ 이번 보도는 지구단위계획 변경안의 용적률·높이 완화를 다루며, 종전자산 평가액·비례율·분담금 수치는 나오지 않습니다.\n> ⚠️ 수정 가결 후 주민 재열람 등 후속 절차가 남아 있어 아직 확정 전입니다. 완화된 용적률이 사업별 비례율이나 분담금에 어떻게 반영되는지는 이 기사로 알 수 없습니다.\n\n*왜 골랐나*: 창동역 일대(서울아레나, GTX-C)를 포함한 인접 생활권의 도시관리계획 변경이라 노원·상계 생활권 변화로 연결된다.\n\n### 2. 🔴 [노원구] 정부, 주택공급 실적 격주 공개…“수도권 착공 37% 달성” 목표치 밑돌...\n\n헤럴드경제 · 2026-10-16 · [원문](https://biz.heraldcorp.com/article/10905300)\n\n정부가 월 2회 주택공급 정례브리핑을 시작했다. 올해 수도권 착공 목표 26만8000호 중 이달 둘째 주까지 9만9000호가 착공돼 목표의 약 37%다. 민간정비사업은 목표 7만2000호 중 1만7000호(23.6%)가 착공됐고, 서울에서는 동작구 흑석11구역과 노원구 중계본동 등이 포함됐다. 연말까지 최대 23만5000호 착공을 계획한다.\n\n**정책 포인트**\n\n- 공급 실적을 격주로 공개하고 4분기 내 디지털 상황판 시범운영을 계획한다.\n- 기사에는 상계주공 단지나 분담금 관련 내용이 없다.\n\n> ⚠️ 착공 실적과 목표는 수도권 공급 물량 통계입니다. 개별 단지의 분담금이나 비례율과는 관계가 없으니 소유주 본인의 부담 수준으로 읽지 마세요.\n> ⚠️ 기사에 언급된 개별 구역은 착공 실적에 포함된 사례로만 나옵니다. 이 구역들의 분담금이나 사업 조건은 기사에 없습니다.\n\n*왜 골랐나*: 노원구 중계본동이 민간정비사업 착공 사례로 언급됐고, 정비사업 착공 속도를 보여주는 정책 공개라서 선정했다.\n\n### 3. 🔴 [상계주공10단지] 강남구 '신현대12차' 59평, 12억 내린 88억원에 거래 [일일 하락가]\n\n한국금융신문 · 2026-10-16 · [원문](https://fntimes.com/html/view.php?ud=202610160808251113b372994c95_18)\n\n16일 등록 실거래 기준 하락액 상위 단지를 정리한 기사다. 노원구 상계동 상계주공10(고층) 전용 45.90㎡가 3억4500만원에 거래됐고, 직전 거래가 5억9000만원보다 2억4500만원(41.5%) 낮다. 기사는 직전 거래와의 차이 원인을 설명하지 않는다. 같은 날 중계동 롯데우성도 2억1000만원 내렸다.\n\n> ⚠️ 이 기사의 가격은 실거래 등록 기준 매매가입니다. 종전자산 감정평가액이나 권리가액과는 다른 값이며, 분담금 계산의 기준으로 쓸 수 없습니다.\n> ⚠️ 기사는 직전 거래와의 차이 원인을 설명하지 않습니다. 거래 시점의 동·층·향이 다를 수 있어 하락폭을 단지 전체의 가치 변화로 읽지 마세요.\n\n*왜 골랐나*: 상계주공10단지 실거래 하락 사례가 직접 나왔다. 다만 한 건의 거래라서 시세 추세로 해석하기는 어렵다.\n\n### 4. 🔴 [노원구] \"전세 매물 부족에 재계약 늘어\"...최대 10년 안정 거주 '파크로쉬 서울...\n\njoongangenews.com · 2026-10-16 · [원문](https://joongangenews.com/news/articleView.html?idxno=555552)\n\n올해 1~9월 서울 아파트 전세계약 중 갱신 비중은 51.09%다. 전세가격지수 누적 상승률은 노원구 13.53%로 성북구(14.08%) 다음으로 높았다. 광운대역세권 복합개발 '서울원' 내 민간임대 파크로쉬 서울원은 768가구로, 입주는 2028년 7월 예정이다. 기사 후반부는 임대 분양 홍보 성격이 강하다.\n\n*왜 골랐나*: 노원 전세 상승률과 광운대역세권 서울원 개발의 진행 상황이 함께 담겨 노원 생활권 변화와 연결된다.\n\n## 인사이트\n\n- 쌍문생활권 지구단위계획은 허용 용적률을 올렸지만 도봉구 대상 구역에 한정되고, 아직 최종 고시 전이다. 상계주공9단지에 적용된다고 볼 근거는 없다.[1]\n- 창동역 일대는 올 3월 민자역사 준공, 2027년 서울아레나 개관과 GTX-C 개통을 앞둔 곳으로 소개돼, 인접한 노원·상계 생활권의 교통·문화 환경과 맞닿아 있다. 다만 단지 가치나 분담금에 미치는 영향은 기사로 확인되지 않는다.[1]\n- 상대원2구역은 DL이앤씨가 3.3㎡당 699만원의 확정 공사비를 제시한 사례다. 최근 90일 평당공사비 단계 미상 통계(중앙값 699만원/3.3㎡, 표본 5건)에 이 구역이 포함돼 있어 상계 단지와 같은 단계의 비교 기준으로 쓰기는 어렵다.[2][3]\n- 서울 전세 갱신 비중이 51.09%로 올랐고 노원구 전세가격지수 누적 상승률도 13.53%다. 전세 부담이 커져 기존 거주를 유지하려는 수요가 늘고 있다.[4]\n\n## 오늘의 개념\n\n### 지구단위계획\n\n특정 구역의 건축물 용도·밀도·높이와 도로·보행 환경 등을 묶어 정하는 도시관리계획이다. 기사에서는 쌍문생활권중심 구역의 용적률과 최고 높이가 이 계획 변경안으로 조정됐다.\n\n*오늘*: 도봉 쌍문생활권 변경안은 수정 가결 단계이며, 창동역 일대를 포함해 인접한 노원 생활권의 개발 흐름을 보여준다.[1]\n\n## 참고 원문\n\n1. 도봉 쌍문생활권 지구단위계획 재정비…용적률·최고높이 완화 — 서울신문 · [원문](https://seoul.co.kr/news/publicnews/2026/10/16/20261016500107?wlog_tag3=naver)\n2. 성남 대표 랜드마크 '그라투스' 보러 오세요 — 파이낸셜뉴스 · [원문](https://fnnews.com/news/202610151818023930)\n3. 시공사 교체 파동 '상대원2구역' 홍보관 개관 — 한국경제 · [원문](https://hankyung.com/article/2026101546511)\n4. \"전세 매물 부족에 재계약 늘어\"...최대 10년 안정 거주 '파크로쉬 서울... — joongangenews.com · [원문](https://joongangenews.com/news/articleView.html?idxno=555552)\n\n## 오늘 흘려보낸 것\n\n중복 135건 · 후속보도 신규정보 없음 1건 · 기준 미달 764건\n"}, {"date": "2026-10-16", "markdown": "# 2026-10-16 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원·상계 생활권에 직접 닿는 도시계획 기사가 한 건 있고, 나머지는 노원 실거래·월계동신 비용 절감 사례·공사비 수치 기사다. 창동역 일대가 편입된 쌍문생활권 지구단위계획 변경안이 수정가결됐다. 월계동신은 사업성 보정계수 2.0 적용과 금융비용·총회비 절감 사례를 구체 금액으로 제시했다. 상대원2구역은 평당 699만원 확정 공사비 제안이 나왔지만 노원과 직접 연결되지 않는 타 지역 사례다. 상계주공 단지 실거래는 신고가 흐름과 하락 거래가 엇갈린다.\n\n## 선별 5건\n\n### 1. 🔴 [창동] 도봉 쌍문생활권 지구단위계획 변경안 수정가결…준주거 용적률 440%로\n\n아시아경제 · 2026-10-16 · [원문](https://view.asiae.co.kr/article/2026101608174124041)\n\n도봉구 쌍문생활권중심 지구단위계획 변경안이 서울시 도시·건축공동위원회에서 수정가결됐다. 창동역 일대가 새로 포함돼 구역은 22만6876㎡로 늘어난다. 준주거지역 허용 용적률은 360%에서 440%로, 도봉로변 최고 높이는 50m에서 100m 이하로 완화된다. 구는 주민 재열람 등 후속 절차를 거쳐 서울시에 최종 결정·고시를 요청할 예정이다.\n\n**정책 포인트**\n\n- 이 변경은 쌍문·창동 지구단위계획구역 대상이며 상계주공9단지 용적률 완화와는 무관하다. 최종 결정·고시 전 단계(수정가결)다.\n- 기사에 확인된 사실은 용적률·높이 완화와 창동역 편입이며, 노원 단지에 미치는 영향은 해석의 영역이다.\n\n*왜 골랐나*: 창동역 일대(서울아레나 개관, GTX-C 개통 예정)가 편입된 계획으로 인접 생활권 변화로 연결된다.\n\n### 2. 🔴 [노원구] ‘재건축 비용 절감 4가지 승부’…갈등 끝내고 이주 개시한 노원구 월...\n\n아시아경제 · 2026-10-16 · [원문](https://view.asiae.co.kr/article/2026101511191454845)\n\n노원구 월계동신 조합장이 분담금 관리 방법을 설명했다. 사업성 보정계수 2.0 적용으로 임대주택 부담을 없애고 일반분양 수익을 늘렸고, 조합은 300억~350억원, 조합원 1명당 평균 3000만원 이상의 개선 효과를 예상한다. 시공사로부터 100억원을 무이자 지원받고 HUG 보증 대출로 전환했으며, 총회 비용은 1억원에서 3000만원으로 줄였다.\n\n**정책 포인트**\n\n- 사업성 보정계수 2.0 적용은 월계동신 사례이며, 다른 노원 단지 적용 여부는 기사에서 확인되지 않는다.\n\n> ⚠️ 조합원 1명당 평균 3000만원 이상이라는 개선 효과는 조합이 예상한 평균치입니다. 종전자산 평가액과 보유 면적에 따라 소유주별 실제 체감액은 다르고, 이 평균이 어떤 평형 기준인지도 기사 요약에는 나와 있지 않습니다.\n> ⚠️ 이 수치는 분담금 자체가 아니라 비용 절감과 일반분양 수익 증가에 따른 예상 개선 효과입니다. 일반분양가와 공사비가 움직이면 비례율이 달라지고 이 효과도 달라지므로 확정 수치로 읽으면 안 됩니다.\n\n*왜 골랐나*: 노원구 사업장의 구체 절감 금액과 보정계수 적용 사례가 있다.\n\n### 3. 🔴 [상계주공6단지] \"17평이 7억 돌파\" 신고가 속출하는 '노·도·강'…강남·서초는 하락\n\n땅집고 · 2026-10-14 · [원문](https://realty.chosun.com/site/data/html_dir/2026/10/14/2026101402417.html)\n\n상계주공6단지 전용 41.3㎡가 7억원에 거래돼 종전 최고가 6억8000만원보다 2000만원 높았다. 노원구는 7월 정비계획에서 기존 2646가구를 최고 59층, 3573가구로 재건축하는 안을 공개했다. 상계주공2단지 31평형은 8억원에 거래돼 종전 최고가를 1500만원 넘겼다. 본문 일부가 깨져 읽히는 부분이 있다.\n\n**이번에 새로 나온 것**: 6단지 전용 41.3㎡ 7억원 신고가(종전 최고 6억8000만원)와 정비계획상 3573가구 규모가 확인됐다.\n\n> ⚠️ 이 기사의 금액은 아파트 매매 실거래가입니다. 재건축 분담금이나 종전자산 감정평가액이 아니므로, 거래가를 곧바로 내 권리가액이나 분담금 계산의 기준으로 읽으면 어긋납니다.\n> ⚠️ 기사가 소개한 상계주공6단지 정비계획안(최고 59층, 3573가구)은 정비계획 공개 단계의 안입니다. 이후 단계에서 바뀌는 전제이고, 분담금은 아직 정해지지 않았습니다.\n\n*왜 골랐나*: 상계주공6단지 신고가와 정비계획 규모가 직접 나온다.\n\n### 4. 🔴 [상계주공10단지] 서대문구 '두산' 24평, 4.4억 떨어진 10억원에 거래 [일일 하락가]\n\n한국금융신문 · 2026-10-15 · [원문](https://fntimes.com/html/view.php?ud=202610150900157947b372994c95_18)\n\n상계동 '상계주공10(고층)' 전용 45.90㎡가 3억4300만원에 거래됐다. 직전 거래가 5억9000만원보다 2억4700만원(41.9%) 낮다. 16일자 기사에서는 3억4500만원으로 같은 단지 하락 거래가 다시 등록됐다. 직전 거래 대비 하락 폭이 큰 점만 확인되고 원인은 기사에 없다.\n\n> ⚠️ 이 기사의 금액은 단일 거래의 실거래가입니다. 분담금이나 감정평가액이 아니며, 동·층·향에 따라 같은 단지 안에서도 거래가가 다르므로 내 종전자산 평가액으로 옮겨 읽으면 안 됩니다.\n> ⚠️ 기사에 하락 원인이 나와 있지 않습니다. 이 거래 하나로 단지 전체 시세 흐름이나 사업성을 판단할 수 없습니다.\n\n*왜 골랐나*: 상계주공 단지의 큰 폭 하락 거래가 기록돼 신고가 기사와 엇갈리는 신호이기 때문이다.\n\n### 5. DL이앤씨, 상대원2구역 홍보관 이례적 개관, '왜 지금?'\n\nkoreastocknews.com · 2026-10-16 · [원문](http://koreastocknews.com/news/articleView.html?idxno=121777)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상대원2구역 | 평당공사비 | 699만원/3.3㎡ | — |\n| 상대원2구역 | 총공사비 | 1조 8,479억 | — |\n\nDL이앤씨는 성남 상대원2구역 조합원 대상 홍보관을 열었다. 사업 조건으로 3.3㎡당 699만원 확정 공사비, 분담금 입주 1년 후 납부, 일반분양가 100% 수용 등을 제시했다. 예상 총 도급액은 1조8479억원이다. 시공사 교체 갈등 중 법원이 7월 가처분을 인용해 시공사 지위를 임시로 회복했다.\n\n> ⚠️ 3.3㎡당 699만원은 시공사가 홍보관에서 제시한 사업 조건입니다. 기사에 이 수치가 어느 사업 단계의 계약 조건인지는 나와 있지 않습니다.\n> ⚠️ 예상 총 도급액 1조8479억원은 사업 전체 금액이고 조합 전체의 공사비입니다. 소유주 한 명의 분담금과는 다른 축이므로 나눠서 읽거나 분담금과 견주면 안 됩니다.\n> ⚠️ 기사에는 조합원 분담금 금액이 없고, 입주 1년 후 납부라는 납부 시기 조건만 있습니다. 분담금은 종전 보유 면적과 신청 평형, 비례율에 따라 소유주마다 달라집니다.\n> ⚠️ 시공사 교체 갈등이 진행 중이고, 법원이 7월 가처분을 인용해 시공사 지위를 임시로 회복시킨 상태입니다. 제시된 조건이 최종 계약 조건으로 이어지는지는 기사만으로 확인할 수 없습니다.\n\n*왜 골랐나*: 평당 확정 공사비 실수치가 있는 기사이나, 노원 연결은 없고 비교 기준으로만 쓴다.\n\n## 인사이트\n\n- 쌍문생활권 계획은 창동역 일대를 서울아레나·GTX-C와 묶어 용적률·높이를 완화했으나, 도봉 지구단위계획 대상이며 상계주공9단지 용적률과는 별개다.[1]\n- 월계동신은 보정계수 2.0 적용 등 절감 항목을 금액으로 공개했지만, 이는 월계동신 한 곳의 사례다.[2]\n- 상계주공 단지에서 6단지 신고가와 10단지 하락 거래가 같은 주에 나왔다. 단지·면적별로 거래 방향이 갈린다.[3][4]\n- 상대원2구역의 평당 699만원은 단계가 불명확한 제안 수치라 시공사선정공고 기준 벤치마크와 직접 비교하지 않는다.[5]\n\n## 참고 원문\n\n1. 도봉 쌍문생활권 지구단위계획 변경안 수정가결…준주거 용적률 440%로 — 아시아경제 · [원문](https://view.asiae.co.kr/article/2026101608174124041)\n2. ‘재건축 비용 절감 4가지 승부’…갈등 끝내고 이주 개시한 노원구 월... — 아시아경제 · [원문](https://view.asiae.co.kr/article/2026101511191454845)\n3. \"17평이 7억 돌파\" 신고가 속출하는 '노·도·강'…강남·서초는 하락 — 땅집고 · [원문](https://realty.chosun.com/site/data/html_dir/2026/10/14/2026101402417.html)\n4. 서대문구 '두산' 24평, 4.4억 떨어진 10억원에 거래 [일일 하락가] — 한국금융신문 · [원문](https://fntimes.com/html/view.php?ud=202610150900157947b372994c95_18)\n5. DL이앤씨, 상대원2구역 홍보관 이례적 개관, '왜 지금?' — koreastocknews.com · [원문](http://koreastocknews.com/news/articleView.html?idxno=121777)\n\n## 오늘 흘려보낸 것\n\n중복 171건 · 후속보도 신규정보 없음 0건 · 기준 미달 767건\n"}, {"date": "2026-10-15", "markdown": "# 2026-10-15 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원구 정비사업의 제도·절차 소식이 중심이다. 상계보람아파트가 정비구역으로 지정되면서 용적률과 권리자 분양가 추정액이 처음 공개됐고, 노원구는 정비사업 현황 공개 서비스를 열었다. 분담금 보도에서는 상계주공6단지 49㎡ 기준 수치가 새로 나왔다. 전국적으로는 정부가 공사비 검증 미이행 사업장 점검에 들어간다. 노원구 행위제한 13곳 보도는 이미 알려진 내용이어서 제외했다.\n\n## 선별 4건\n\n### 1. 🔴 [상계보람아파트(노원구 상계동)] 상계 보람아파트, 재건축 정비구역 지정 고시...사업 본격화 수순\n\nnews2day.co.kr · 2026-10-15 · [원문](https://news2day.co.kr/article/20261015500079)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계보람아파트 | 비례율 | 110.28% | — |\n| 상계보람아파트 | 조합원분양가 | 83,400만원(세대 총액) | — |\n| 상계보람아파트 | 조합원분양가 | 104,230만원(세대 총액) | — |\n\n서울시가 15일 노원구 상계동 상계보람아파트의 정비구역 지정과 정비계획을 고시했다. 3315가구가 4483가구로 늘고, 사업성 보정계수 1.8이 적용돼 허용용적률 246%, 법적상한용적률 299.99%가 됐다. 추정비례율은 110.28%이고 조합원 분양가는 일반분양가의 90% 수준이다. 권리자 분양가 추정액은 전용 59.99㎡형 8억3400만원, 84.99㎡형 10억4230만원이며 인가 과정에서 달라질 수 있다.\n\n**정책 포인트**\n\n- 사업성 보정계수 1.8 적용으로 허용용적률 인센티브가 20%에서 36%로 늘었다.\n- 정비구역 지정 고시일부터 4년 안에 사업을 시행할 예정이다.\n- 이 분양가 추정액은 사업시행계획인가와 관리처분계획인가 과정에서 달라질 수 있다.\n\n> ⚠️ 이 비례율 110.28%는 정비구역 지정 단계의 추정치입니다. 기사 자체가 인가 과정에서 달라질 수 있다고 밝히고 있고, 관리처분 단계에서 확정되는 값과는 성격이 다릅니다.\n> ⚠️ 8억3400만원과 10억4230만원은 전용 59.99㎡형과 84.99㎡형의 권리자 분양가 추정액입니다. 분담금이 아니며, 본인의 종전자산 감정평가액이나 권리가액을 반영한 금액도 아닙니다.\n> ⚠️ 기사에는 이 분양가 추정액의 기준이 되는 종전 보유 면적이 나와 있지 않습니다. 보유 면적과 개별 감정평가액에 따라 본인이 부담할 금액은 달라집니다.\n> ⚠️ 권리가액은 종전자산 감정평가액에 비례율을 곱한 값입니다. 기사의 추정비례율은 개별 소유주의 권리가액을 알려주는 수치가 아닙니다.\n\n*왜 골랐나*: 노원구 상계동 재건축 단지의 정비구역 지정 고시로, 용적률 인센티브와 권리자 분양가 추정액이 함께 공개됐다.\n\n### 2. 🔴 [상계주공6단지] 서울 재건축 분담금 수억원대 '껑충'⋯주택공급 속도전 '장벽'\n\ninews24.com · 2026-10-14 · [원문](http://inews24.com/view/2014847)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 상계주공6단지 | 분담금 | 7,870만원 | 49㎡ → 49㎡ |\n| 월계시영 | 분담금 | 4억 2,000만원 | 50㎡ → 84㎡ |\n| 마천4구역 | 평당공사비 | 899만원/3.3㎡ | — |\n\n서울 주요 재건축 단지의 추가분담금이 수억원대로 불어나고 있다는 보도다. 노원구에서는 월계시영이 약 1700가구를 일반분양하는데도 전용 50㎡에서 84㎡로 옮기려면 약 4억2000만원을 내야 한다. 상계주공6단지는 전용 49㎡에서 같은 면적을 선택해도 약 7870만원이 예상된다. 마천4구역에서는 시공사와 조합이 3.3㎡당 공사비 899만원 조정에 잠정 합의했다.\n\n**이번에 새로 나온 것**: 상계주공6단지 전용 49㎡ 보유자가 같은 면적을 선택할 때 약 7870만원이라는 새 분담금 추정치와, 월계시영 50㎡→84㎡ 약 4억2000만원이 나왔다.\n\n> ⚠️ 상계주공6단지의 약 7870만원은 전용 49㎡를 보유하고 같은 면적을 선택한 소유주 기준입니다. 다른 면적을 보유했거나 다른 평형을 선택하면 분담금이 달라지므로 참고용으로만 보시기 바랍니다.\n> ⚠️ 월계시영의 약 4억2000만원은 전용 50㎡를 보유하고 84㎡로 옮기는 경우입니다. 보유 면적과 신청 평형이 다르면 분담금도 다릅니다.\n> ⚠️ 기사에는 두 단지 분담금이 어느 사업 단계의 비례율과 감정평가액을 전제로 하는지 나와 있습니다. 확인되지 않으므로 확정액으로 읽으시면 안 되고, 두 단지의 수치를 서로 비교하는 것도 맞지 않습니다.\n> ⚠️ 마천4구역의 3.3㎡당 공사비 899만원은 잠정 합의 수준이며 최종 계약금액은 추가 협의를 거쳐 확정됩니다. 이 보도에는 마천4구역의 조합원 분담금은 언급되지 않았습니다.\n\n*왜 골랐나*: 상계주공6단지의 전용 49㎡ 기준 분담금이 처음 나왔고, 면적 전제가 기사에 있어 기존 32㎡ 기준 수치와 구분해 읽을 수 있다.\n\n### 3. 🔴 [노원구] 구청장 보는 현황을 홈피에…노원구 ‘재건축·재개발 NOW ON’\n\n헤럴드경제 · 2026-10-15 · [원문](https://biz.heraldcorp.com/article/10903225)\n\n노원구가 16일 구 홈페이지에 지도 기반 정비사업 현황 서비스 '노원 재건축·재개발 NOW ON'을 연다. 사업지별 추진단계, 위치와 대지면적, 계획상 사업 규모, 담당 부서 연락처를 제공하고 조감도·정비계획도도 단계에 따라 공개한다. 민선 9기 출범 후 3개월여 만에 상계보람, 하계미성, 상계주공7단지, 중계주공4단지, 상계마들대림 5개 단지가 추진위원회 구성 절차를 밟고 있다고 밝혔다.\n\n**정책 포인트**\n\n- 정비사업 단계·규모·담당 부서 정보를 구 홈페이지에서 지도로 확인할 수 있게 된다.\n\n*왜 골랐나*: 노원구가 정비사업 진행 단계를 단지별로 공개하는 창구를 열었고, 상계주공7단지 등 추진위 구성 현황이 담겼다.\n\n### 4. 공사비 부르는 게 값?… 검증 칼날 꺼낸 정부\n\n매일경제 · 2026-10-14 · [원문](https://mk.co.kr/article/12175855)\n\n국토교통부가 지자체·한국부동산원과 19일부터 다음 달까지 전국 정비사업장 16곳을 현장점검한다. 사전 조사한 568곳 중 법정 공사비 검증을 받지 않은 곳이 138곳이라고 한다. 시공사가 요구한 공사비 증액의 타당성과 조합의 계약 절차 준수 여부를 보고, 위법 사항은 시정명령 등으로 대응할 방침이다.\n\n**정책 포인트**\n\n- 점검 대상은 전국 정비사업장 16곳이며, 19일부터 다음 달까지 진행된다.\n- 조사 대상 568곳 중 법정 공사비 검증을 받지 않은 곳이 138곳으로 나타났다.\n- 위법 사항은 시정명령 등으로 대응한다.\n\n*왜 골랐나*: 공사비 검증 미이행 사업장 점검은 노원 단지를 포함한 모든 사업장의 증액 협상에 영향을 줄 수 있는 정책 변화다.\n\n## 인사이트\n\n- 상계보람아파트는 사업성 보정계수 1.8을 적용받아 허용용적률 인센티브가 20%에서 36%로 늘었다. 다만 이는 이 단지의 정비계획 결과이고, 상계주공 단지에 같은 계수가 적용되는지는 오늘 기사로 확인되지 않는다.[1]\n- 상계주공6단지의 분담금 추정치는 32㎡ 보유자가 84㎡를 신청하는 경우(기존 스레드)와 49㎡ 보유자가 같은 면적을 선택하는 경우(오늘 기사)로 전제가 다르다. 두 금액은 직접 비교할 수 없다.[2]\n- 정부의 공사비 검증 점검은 증액 근거와 계약 절차를 따지는 것이어서, 시공사 선정 이후 공사비 협상이 있는 사업장의 부담 변수가 된다. 노원 단지에 적용되는지는 기사에 없다.[3]\n- 노원구는 행위제한 13곳 추진에 이어 정비사업 현황 공개 서비스까지 열었다. 초기 단계 권리관계 관리와 정보 공개를 함께 강화하는 흐름이다.[4][5]\n\n## 오늘의 개념\n\n### 법적상한용적률\n\n정비계획에서 허용용적률에 더해 국민주택규모 주택 공급에 따른 완화분 등을 반영했을 때 도달할 수 있는 최대 용적률이다. 기사에서는 정비계획 용적률과 별도로 제시됐다.\n\n*오늘*: 상계보람아파트는 정비계획 용적률 263.58%에 국민주택규모 완화분을 더한 법적상한용적률이 299.99%로 고시됐고, 상계 재건축 단지가 용적률을 가늠할 때 참고할 수 있는 사례다.[1]\n\n## 참고 원문\n\n1. 상계 보람아파트, 재건축 정비구역 지정 고시...사업 본격화 수순 — news2day.co.kr · [원문](https://news2day.co.kr/article/20261015500079)\n2. 서울 재건축 분담금 수억원대 '껑충'⋯주택공급 속도전 '장벽' — inews24.com · [원문](http://inews24.com/view/2014847)\n3. 공사비 부르는 게 값?… 검증 칼날 꺼낸 정부 — 매일경제 · [원문](https://mk.co.kr/article/12175855)\n4. 구청장 보는 현황을 홈피에…노원구 ‘재건축·재개발 NOW ON’ — 헤럴드경제 · [원문](https://biz.heraldcorp.com/article/10903225)\n5. 노원구, 상계주공등 재건축 예정지 13곳 정비구역 지정 前 행위제한 추... — siminilbo.co.kr · [원문](https://siminilbo.co.kr/news/newsview.php?ncode=1160286441298924)\n\n## 오늘 흘려보낸 것\n\n중복 108건 · 후속보도 신규정보 없음 9건 · 기준 미달 688건\n\n## 📜 관련 고시\n\n- 2026-10-08 · 도시관리계획(도봉생활권중심 지구단위계획) 결정(변경) 및 지형도면 고시 · 도봉구 · [원문](https://urban.seoul.go.kr/view/html/PMNU4030100001?noticeCode=11320NTC202610140006)\n"}, {"date": "2026-10-14", "markdown": "# 2026-10-14 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 후보에는 새 공사비·분담금 수치가 없다. 흐름은 두 갈래다. 하나는 노원구가 상계주공2·3·7·11단지 등 13곳에 정비구역 지정 전 행위제한(상가 쪼개기 차단)을 추진한다는 제도 변화이고, 다른 하나는 노원구 매매·전세 상승률이 서울 1위로 집계된 시장 지표다. 재건축 비용 정보는 없고, 입주권 거래에서 추가분담금을 따져봐야 한다는 일반론만 확인된다. 이 때문에 5건 중 수치 기사는 없고 정책과 지역 지표 기사로 채웠다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] 노원구, 재건축 예정지 13곳 '상가 쪼개기' 행위제한 추진\n\n아시아경제 · 2026-10-13 · [원문](https://view.asiae.co.kr/article/2026101308495330004)\n\n같은 사건 보도: segye.com, 뉴시스, newstnt.com 외 1곳\n\n노원구가 재건축 예정지 13곳에 정비구역 지정 전 행위제한을 추진한다. 대상에는 상계주공2·3·7·11단지가 포함된다. 제한 행위는 건축물 건축, 토지 분할, 집합건축물대장 전환, 전유부분 분할이다. 15~29일 주민공람 후 11월 중 도시계획위원회 심의와 지형도면 고시를 계획하고, 제한 기간은 고시일부터 3년 이내이며 1회 최대 1년 연장할 수 있다.\n\n**이번에 새로 나온 것**: 기존에는 13곳 추진 사실만 알려졌으나, 근거 법령, 심의·고시 일정(11월), 제한 기간(3년, 1회 최대 1년 연장), 정비구역 지정 시 해제 조건과 예외 허용이 확인됐다.\n\n**정책 포인트**\n\n- 행위제한은 신속통합기획 자문(입안 제안)을 신청한 주민 대표자 또는 추진위원회가 요청한 곳이 대상이며, 도시계획위원회 심의로 제한 여부가 결정된다.\n- 정당한 필요성이 인정되면 심의를 거쳐 예외가 허용된다.\n- 제한 기간 중 정비구역이 지정되면 고시일 다음 날 해제된다.\n- 상계주공9단지는 이번 13곳 명단에 없다.\n\n> ⚠️ 이 기사에는 분담금·비례율·감정평가액 수치가 없습니다. 행위제한은 정비구역 지정 전 단계의 조치라서 소유주별 분담금과는 직접 연결되지 않습니다.\n> ⚠️ 행위제한 대상이 된 단지라도 보유 면적과 동·층·향에 따라 종전자산 평가액이 다르므로 소유주마다 결과가 다릅니다.\n\n*왜 골랐나*: 노원구 상계주공 단지에 직접 적용되는 제도 변화이고, 공람 일정과 심의 시점이 구체적으로 나와 있어서다.\n\n### 2. 🔴 [노원구] “이 동네가 이럴 줄이야”…전세 상승률 ‘최고’에 곡소리난 서울 자...\n\n매일경제 · 2026-10-13 · [원문](https://mk.co.kr/article/12174573)\n\nKB부동산 기준 9월 노원구 아파트 매매가격은 전월 대비 2.32% 올라 서울 25개 구 중 가장 높았다. 서울 평균은 1.13%다. 전셋값도 2.04% 올라 서울 평균 1.00%를 웃돌았다. 상계주공16단지 전용 59㎡는 지난달 6억원에 거래돼 6월 대비 7000만원 올랐다. 10월 첫째 주 노원구 주간 상승률은 0.34%에서 0.31%로 둔화했다.\n\n> ⚠️ 기사의 가격은 상계주공16단지 전용 59㎡ 한 건의 거래가이며, 다른 평형이나 다른 단지에 그대로 적용되는 값이 아닙니다.\n> ⚠️ 매매가와 전세가 상승률은 시장 거래 지표입니다. 종전자산 감정평가액이나 권리가액과는 다른 수치이므로 분담금 계산의 기준으로 읽으면 어긋납니다.\n\n*왜 골랐나*: 노원구 매매·전세 상승률이 서울 1위라는 구체 수치와 상계주공16단지 거래 사례가 있어서다.\n\n### 3. 🔴 [노원구] \"1억 더 주세요\"…30년 넘은 노원 구축도 전셋값 '급등' [시장톡]\n\n한국경제 · 2026-10-13 · [원문](https://hankyung.com/article/2026101264746)\n\nKB부동산 통계로 9월 노원구 전세가격지수가 전월 대비 2.04% 올랐다. 2020년 11월 이후 약 5년 10개월 만의 2% 초과다. 중계무지개 전용 49㎡ 전세는 3억7000만원에 새 계약이 체결됐고 올해 초 2억원대 후반이었다. 전문가들은 매물 부족을 원인으로 꼽았다.\n\n> ⚠️ 기사의 전세 수치는 중계무지개 전용 49㎡ 한 건의 계약 사례입니다. 재건축 분담금이나 종전자산 평가와는 관계가 없는 시장 지표입니다.\n\n*왜 골랐나*: 노원 구축 단지의 전세 계약 사례가 있어 재건축 이주·거주 비용을 가늠할 참고가 되어서다.\n\n### 4. 🔴 [노원구] \"거래 줄었는데 신고가\"…입주절벽에 분양권·입주권 몸값 '껑충'\n\n뉴시스 · 2026-10-14 · [원문](https://newsis.com/view/NISX20261013_0003823939)\n\n올해 1~6월 서울 입주권·분양권 거래는 552건으로 전년 동기보다 26.1% 줄었지만 가격은 올랐다. 노원구가 95건으로 가장 많았고, 광운대역세권 개발로 공급되는 서울원 아이파크 거래가 영향을 준 것으로 풀이됐다. 서울원 아이파크 전용 84㎡ 분양권은 지난해 12월 14억803만원에서 올해 5월 18억1160만원으로 올랐다. 입주권은 매수 후 추가 분담금이나 옵션비가 생길 수 있어 실제 취득 비용을 따져봐야 한다고 짚었다.\n\n> ⚠️ 서울원 아이파크 분양권 가격은 광운대역세권 개발 사업의 수치로, 재건축 조합원 분담금과는 다른 성격입니다. 둘을 같은 기준선으로 비교할 수 없습니다.\n> ⚠️ 기사는 입주권을 매수하면 추가 분담금이나 옵션비가 생길 수 있다고 짚었지만 그 금액은 제시하지 않았습니다. 실제 부담은 해당 물건의 권리가액과 비례율, 사업 단계에 따라 달라지므로 개별 확인이 필요합니다.\n\n*왜 골랐나*: 광운대역세권 개발 단지인 서울원 아이파크의 노원 거래 사례이며, 입주권 매수 시 추가분담금을 따져야 한다는 점이 재건축 소유자와 관련돼서다.\n\n### 5. 🔴 [창동] 마포농수산시장·수서, K푸드·컬처 복합시설로\n\n한국경제 · 2026-10-12 · [원문](https://hankyung.com/article/2026101268481)\n\n서울시가 마포농수산물시장과 수서 특계17부지를 대상으로 연내 민관동행사업 기획 제안을 받는다. 기사에 따르면 지난달 발표된 G3 서울플랜에는 기존 3개 도심에 더해 창동·상계를 포함한 4개 광역도심을 추가 육성하는 내용이 담겼다. 이 기사의 개발 사업 자체는 마포와 수서 대상이며 창동·상계 사업이 아니다.\n\n**정책 포인트**\n\n- G3 서울플랜은 창동·상계를 광역도심으로 육성하는 방향이며, 이 기사만으로 상계주공9단지의 용도지역이나 용적률 변화는 확인되지 않는다.\n- 마포·수서 민관동행사업은 노원 사업이 아니므로 직접 영향은 확인되지 않는다.\n\n> ⚠️ 이 기사의 사업 대상은 마포농수산물시장과 수서 특계17부지이며, 창동·상계 재건축 사업이 아닙니다. 창동·상계는 광역도심 육성 계획으로 언급됐을 뿐이고 분담금 수치는 없습니다.\n\n*왜 골랐나*: 기사에 언급된 G3 서울플랜의 창동·상계 광역도심 육성 방향이 노원 생활권과 연결되는 정책 맥락이어서다.\n\n## 인사이트\n\n- 노원구 행위제한은 정비구역 지정 전 상가·토지 분할로 동의율 충족이 어려워지는 문제를 막으려는 조치이고, 상계주공9단지는 이번 13곳 명단에 없다.[1][2]\n- 9월 노원구 매매가격(2.32%)과 전세가격(2.04%) 상승률은 모두 서울 평균(각 1.13%, 1.00%)을 웃돌았다.[3][4]\n- 입주권은 매수 후 추가 분담금과 옵션비가 생길 수 있어 시세만으로 취득 비용을 판단하기 어렵다.[5]\n- 오늘 후보에는 새 평당공사비·분담금 수치가 없어 벤치마크와 비교할 대상이 없다.\n\n## 오늘의 개념\n\n### 행위제한\n\n정비구역 지정 전에 건축, 토지 분할, 집합건축물대장 전환, 전유부분 분할 같은 행위를 제한하는 조치다. 기사에 따르면 제한 기간은 고시일로부터 3년 이내이며 1회 최대 1년 연장할 수 있다. 정비구역이 지정되면 고시일 다음 날 해제된다.\n\n*오늘*: 노원구가 상계주공2·3·7·11단지 등 13곳에 이를 추진해, 해당 단지의 상가·토지 분할이 심의 후 막힐 수 있다.[1]\n\n## 참고 원문\n\n1. 노원구, 재건축 예정지 13곳 '상가 쪼개기' 행위제한 추진 — 아시아경제 · [원문](https://view.asiae.co.kr/article/2026101308495330004)\n2. 노원구, 상계주공등 재건축 예정지 13곳 정비구역 지정 前 행위제한 추... — siminilbo.co.kr · [원문](https://siminilbo.co.kr/news/newsview.php?ncode=1160286441298924)\n3. “이 동네가 이럴 줄이야”…전세 상승률 ‘최고’에 곡소리난 서울 자... — 매일경제 · [원문](https://mk.co.kr/article/12174573)\n4. \"1억 더 주세요\"…30년 넘은 노원 구축도 전셋값 '급등' [시장톡] — 한국경제 · [원문](https://hankyung.com/article/2026101264746)\n5. \"거래 줄었는데 신고가\"…입주절벽에 분양권·입주권 몸값 '껑충' — 뉴시스 · [원문](https://newsis.com/view/NISX20261013_0003823939)\n\n## 오늘 흘려보낸 것\n\n중복 112건 · 후속보도 신규정보 없음 6건 · 기준 미달 734건\n"}, {"date": "2026-10-13", "markdown": "# 2026-10-13 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원구가 상계주공2·3·7·11단지를 포함한 재건축 예정지 13곳에 정비구역 지정 전 행위제한(상가 쪼개기 차단)을 추진한다는 보도가 여러 매체에 동시에 나왔다. 분담금·공사비 같은 비용 수치는 후보 기사에 없었고, 나머지는 노도강 중저가 구축 쏠림과 전월세 불안을 다룬 시장 기사였다. 이 중 노원 단지가 직접 거론되고 구체적 수치가 있는 기사 일부를 골랐다. 근거가 약한 총론성 시황 기사는 제외했다.\n\n## 선별 4건\n\n### 1. 🔴 [노원구] 노원구 “재건축 예정지 13개소에 정비구역 지정 전 행위제한 추진”\n\n문화일보 · 2026-10-13 · [원문](https://munhwa.com/article/11622943)\n\n같은 사건 보도: 한강타임즈\n\n노원구가 '상가 쪼개기'로 인한 재건축 지연을 막기 위해 재건축 예정지 13곳에 정비구역 지정 전 행위제한을 추진한다. 월계시영고층에서는 최근 3년간 전유부분 분할 3건으로 상가가 33개 호 늘었다. 15~29일 주민공람, 11월 중 도시계획위원회 심의 후 고시를 계획하며, 제한 기간은 고시일부터 3년 이내이고 1회 1년 연장이 가능하다. 대상지에는 상계주공2·3·7·11단지가 포함됐고, 정비구역이 지정되면 다음 날 해제된다. 기사는 대상 13곳 중 상계주공9단지가 포함됐다고 밝히지 않는다.\n\n**이번에 새로 나온 것**: 노원구가 상계주공2·3·7·11단지 등 13곳에 정비구역 지정 전 행위제한(상가 쪼개기 차단)을 추진하고 15~29일 주민공람을 한다는 새 제도 추진이 나왔다.\n\n**정책 포인트**\n\n- 대상: 정비계획 수립 중이면서 신속통합기획 자문(입안 제안)을 신청한 주민 대표자 또는 추진위원회가 요청한 곳\n- 제한 행위: 건축물 건축, 토지 분할, 집합건축물대장 전환, 전유부분 분할 (정당한 필요 시 심의를 거쳐 예외 허용)\n- 일정: 10월 15~29일 주민공람, 11월 중 도시계획위원회 심의 후 지형도면 고시 계획. 아직 확정이 아니라 추진 단계\n\n> ⚠️ 이 기사에는 분담금·감정평가액·비례율 수치가 없습니다. 행위제한은 정비구역 지정 전 단계의 조치이므로, 이 기사만으로 개별 소유주의 분담금을 가늠할 수 없습니다.\n> ⚠️ 기사는 대상 13곳에 상계주공9단지가 포함됐다고 밝히지 않습니다. 해당 단지 소유주라면 대상 여부를 노원구 주민공람 자료에서 직접 확인해야 합니다.\n\n*왜 골랐나*: 노원구 상계주공 단지가 직접 대상인 제도 변화이며 조합설립 동의율에 영향을 주는 사안이라서.\n\n### 2. 🔴 [노원구] 노원 재건축 13곳 ‘상가 쪼개기’ 막는다…정비구역 지정 전 행위제한\n\n서울경제 · 2026-10-13 · [원문](https://sedaily.com/article/20100830)\n\n서울경제 보도로, 월계시영 등 13개 단지에서 전유부분 분할과 토지 분할을 제한하는 방안이다. 법정 동의율을 채워야 하는데 구분소유자가 늘면 요건 충족이 어려워질 수 있다는 점을 설명한다. 대상은 신속통합기획 자문을 신청했거나 추진위원회가 요청한 곳이며, 도시계획위원회 심의로 제한 여부가 결정된다. 11월 고시가 목표다.\n\n**정책 포인트**\n\n- 제한 기간 중 정비구역이 지정되면 지정 고시일 다음 날부터 행위제한이 해제된다\n- 도시계획위원회 심의에서 제한 여부가 결정되므로 13곳 전체 적용은 확정되지 않았다\n\n> ⚠️ 이 기사는 행위제한 추진 내용만 다루며 분담금이나 비례율은 나오지 않습니다. 도시계획위원회 심의로 제한 여부가 결정되는 단계이므로, 대상 단지에 포함되는지도 아직 확정된 것이 아닙니다.\n\n*왜 골랐나*: 상계주공 단지가 포함된 같은 정책을 가장 상세히 다룬 본문이 있어 보완 기사로 올렸다.\n\n### 3. 🔴 [상계주공7단지] 세금·대출에 '하향 매수'… 6억 저가만 쓸어담았다\n\ndt.co.kr · 2026-10-11 · [원문](https://dt.co.kr/article/12088366)\n\n최근 두 달(8월 10일~10월 10일) 서울에서 거래량 상위 단지가 대부분 6억원대였다. 상계주공7단지는 19건으로 도봉 신동아1단지, 금천 벽산5단지에 이어 거래됐다. 7단지 전용 45.90㎡의 실거래가는 5억8000만~6억6000만원이었다. 전문가들은 매수 수요가 저가 매물로 이동하며 가격대 전반이 상향 평준화될 수 있다고 진단했다.\n\n**이번에 새로 나온 것**: 8월 10일~10월 10일 기준 상계주공7단지 거래 19건과 전용 45.90㎡ 실거래가 범위(5억8000만~6억6000만원)가 새로 나왔다.\n\n> ⚠️ 기사의 실거래가 5억8000만~6억6000만원은 상계주공7단지 전용 45.90㎡ 거래 가격입니다. 종전자산 감정평가액이나 권리가액과는 다른 값이며, 분담금 계산의 기준이 되지 않습니다.\n> ⚠️ 보유 면적과 동·층·향에 따라 개별 감정평가액이 달라지므로, 이 가격대를 다른 평형 소유주의 자산가치로 옮겨 읽으시면 안 됩니다.\n\n*왜 골랐나*: 상계주공7단지의 최근 두 달 실거래 범위가 구체적으로 제시돼 노원 구축 거래 수준을 가늠할 수 있어서.\n\n### 4. 🔴 [노원구] 마포 1164세대 전세 달랑 ‘2’… 강남집값 꺾였지만 세입자 고통[부동...\n\n문화일보 · 2026-10-13 · [원문](https://munhwa.com/article/11623111)\n\n노원구 상계주공12단지(1739세대)는 전·월세 매물이 3건으로 집계됐다. 노원 수락파크빌 등 일부 중형 단지는 전·월세 매물이 0건이다. 상계동 중개업소 대표는 올봄에 비해 전세가 1억원, 월세가 40만원가량 올랐다고 말했다. 올해 1~8월 아파트 전세가격 누적 상승률은 7.35%로 보도됐다.\n\n> ⚠️ 이 기사는 전·월세 시장 상황을 다루며 재건축 분담금이나 비례율과는 관련이 없습니다. 전세 매물 수나 상승률을 사업성 판단의 근거로 읽지 않으시기 바랍니다.\n\n*왜 골랐나*: 상계주공 단지의 전월세 매물 부족 실태가 단지 단위로 확인돼 재건축 이주기 임대 여건을 가늠할 자료라서.\n\n## 인사이트\n\n- 노원구의 행위제한 추진은 비용 정책이 아니라 조합설립 동의율 관리 정책이며, 적용 여부와 시점은 11월 도시계획위원회 심의에 달려 있다.[1][2]\n- 이번 13곳 대상 명단에 상계주공9단지가 들어 있다고 확인되는 기사는 없다.[1][3]\n- 노원 구축 단지는 6억원대 거래 쏠림과 전월세 매물 감소가 겹치고 있어 거래·임대 시장은 빠듯하나, 이는 분담금 수치와는 별개의 정보다.[4][5]\n\n## 오늘의 개념\n\n### 상가 쪼개기\n\n정비구역 지정 전에 상가의 전유부분이나 토지를 분할해 구분소유자 수를 늘리는 행위다. 기사에 따르면 조합 설립에 필요한 법정 동의율을 채우기 어렵게 만들어 사업 지연의 원인으로 지적된다.\n\n*오늘*: 노원구가 상계주공2·3·7·11단지 등 13곳에 이를 막는 행위제한을 추진하면서, 월계시영고층에서 최근 3년간 상가가 33개 호 늘어난 사례가 제시됐다.[1][3]\n\n## 참고 원문\n\n1. 노원구 “재건축 예정지 13개소에 정비구역 지정 전 행위제한 추진” — 문화일보 · [원문](https://munhwa.com/article/11622943)\n2. 노원 재건축 13곳 ‘상가 쪼개기’ 막는다…정비구역 지정 전 행위제한 — 서울경제 · [원문](https://sedaily.com/article/20100830)\n3. 노원구, 재건축 예정지 13곳 '상가 쪼개기' 행위제한 추진 — 아시아경제 · [원문](https://view.asiae.co.kr/article/2026101308495330004)\n4. 세금·대출에 '하향 매수'… 6억 저가만 쓸어담았다 — dt.co.kr · [원문](https://dt.co.kr/article/12088366)\n5. 마포 1164세대 전세 달랑 ‘2’… 강남집값 꺾였지만 세입자 고통[부동... — 문화일보 · [원문](https://munhwa.com/article/11623111)\n\n## 오늘 흘려보낸 것\n\n중복 114건 · 후속보도 신규정보 없음 4건 · 기준 미달 586건\n"}, {"date": "2026-10-12", "markdown": "# 2026-10-12 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 후보는 대부분 서울 집값·전세 동향 기사이고, 분담금이나 공사비 수치가 나온 기사는 미아2구역 공사비 하나뿐이다. 노원·창동 생활권에서는 창동 서울아레나 주변 개발 계획과 롯데백화점 노원점 육성 방침이 확인됐다. 미아2구역 공사비와 창동주공 추진위 승인 소식은 강북권 정비사업이 단계별로 진행되는 흐름을 보여준다. 다만 어느 기사도 상계주공9단지의 분담금이나 용적률 변화를 직접 다루지는 않는다.\n\n## 선별 5건\n\n### 1. 🔴 [창동] 김동욱 도봉구청장 \"서울아레나, 지역경제 바꿀 큰 기회\"[인터뷰]\n\n뉴시스 · 2026-10-12 · [원문](https://newsis.com/view/NISX20260929_0003807759)\n\n도봉구청장이 창동역 일대 '창동 특정개발진흥지구' 지정을 추진한다고 밝혔다. 서울아레나, 창동민자역사, 농협 하나로마트 등의 영향권이 대상이며 문화산업 진흥·육성 종합계획과 지구 지정·관리전략을 마련 중이다. 창동역 상점가는 서울시 '달빛야장' 1기 상권으로 선정돼 2028년까지 최대 20억원 규모 사업비를 쓸 수 있다. 하나로마트 부지 복합개발 계획안에는 200실 규모 숙박시설이 검토되고 있다.\n\n**정책 포인트**\n\n- 특정개발진흥지구는 아직 지정 추진·전략 마련 단계이며 지정이 확정되지 않았다.\n- 하나로마트 부지 숙박시설은 검토 단계의 계획안이다.\n\n*왜 골랐나*: 창동 서울아레나 일대 개발이 진척되는 소식으로, 노원 생활권과 이어지는 인접 거점 변화이기 때문이다.\n\n### 2. 🔴 [노원구] \"강남·잠실점 새단장\"…롯데백화점, 상권 초격차 전략 본격화\n\n이데일리 · 2026-10-11 · [원문](https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=02656806645611936)\n\n롯데백화점 노원점이 올해 8월 개점 이후 최대 규모 리뉴얼을 마쳤다. 약 1만평을 새단장하는 데 17개월이 걸렸고 올해 상반기 매출은 전년 동기 대비 15% 늘었다. 롯데백화점은 창동·상계 일대 개발과 서울아레나 조성에 따른 상권 확대에 맞춰 노원점을 동북권과 경기 북부를 아우르는 거점 점포로 육성한다고 밝혔다.\n\n*왜 골랐나*: 노원구 내 상업시설 투자와 창동·상계 개발 연계 방침이 기사에 직접 나온다.\n\n### 3. 🔴 [창동] 강북권 집값 상승에 정비사업도 '꿈틀'…곳곳서 사업 속도\n\n데일리안 · 2026-10-12 · [원문](https://dailian.co.kr/news/view/1699622?sc=Naver)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 미아2구역 | 총공사비 | 1조 7,790억 | — |\n\n강북구 미아2구역 재개발 조합이 12일 시공사 입찰 현장설명회를 열고 내달 26일 입찰을 마감한다. 총 4003가구 규모이며 조합이 제시한 공사비는 1조7790억원이다. 창동주공18단지가 7월 창동·상계택지개발지구 재건축 단지 중 처음으로 추진위 승인을 받았고, 지난달 창동주공4단지와 19단지도 승인을 받았다.\n\n> ⚠️ 1조7790억원은 미아2구역 조합이 시공사 입찰에 제시한 사업 전체 공사비이며, 소유주 한 명이 내는 분담금이 아닙니다.\n> ⚠️ 기사에는 이 공사비의 기준이 되는 종전 면적이나 신청 평형이 없어 개별 분담금으로 옮겨 읽을 수 없습니다. 비례율 전제도 확인되지 않습니다.\n> ⚠️ 입찰 마감 전 단계의 조합 제시 금액이므로 시공사가 선정되고 계약이 이뤄지는 과정에서 달라질 수 있는 수치입니다.\n> ⚠️ 창동주공 단지들의 추진위 승인은 사업 초기 단계입니다. 미아2구역 공사비와 같은 단계의 수치가 아니므로 나란히 비교하지 마십시오.\n\n*왜 골랐나*: 공사비 실수치가 있고, 노원과 맞닿은 창동·상계택지지구 재건축 추진위 승인 진척을 담았다.\n\n### 4. 🔴 [노원구] 일반분양만 1700가구, 노원 '미미삼' 재건축 분담금 보니 '헉'\n\n땅집고 · 2026-10-12 · [원문](https://realty.chosun.com/site/data/html_dir/2026/10/09/2026100900420.html)\n\n본문이 깨져 있어 일부만 확인된다. 노원구 상계동 미미삼(미성·미륭·삼호3차) 통합재건축은 기존 약 3930가구를 6103가구로 늘리는 계획이다. 일반분양 물량은 약 1700가구로 알려졌다. 제목과 소제목에는 전용 50㎡에서 84㎡로 갈 때 추가 분담금 4억2000만원이라는 표현이 있으나, 본문 깨짐으로 정확한 전제를 확인할 수 없다.\n\n> ⚠️ 제목의 추가 분담금 4억2000만원은 본문이 깨져 있어 전제를 확인할 수 없습니다. 전용 50㎡에서 84㎡로 갈 때라는 표현만 보이고, 종전 보유 면적과 감정평가액, 비례율, 사업 단계는 확인되지 않습니다.\n> ⚠️ 이 금액은 특정 평형 조합 기준의 수치입니다. 보유 면적과 동·층·향에 따라 종전자산 평가액이 다르므로 분담금도 달라지며, 본인 금액으로 읽지 않으셔야 합니다.\n> ⚠️ 분담금은 권리가액과 신청 평형의 조합원분양가에 따라 정해집니다. 비례율이 바뀌면 같이 움직이므로, 앞 단계 추정치라면 확정 금액과 다를 수 있습니다.\n\n*왜 골랐나*: 노원구 재건축 사업의 가구 수 증가와 분담금이 거론돼 우선 지역 기준에 해당한다.\n\n### 5. 🔴 [노원구] 전세 뛰면 월세 안정? 공식 깨졌다...서울 아파트 평균 월세 164만원 '역...\n\njibs.co.kr · 2026-10-10 · [원문](https://jibs.co.kr/news/articles/articlesDetail/66365?feed=na)\n\n올해 1~8월 서울 노원구 월세 상승률은 10.2%로 수도권에서 가장 높았고 전세도 10.3% 올랐다. 노원과 도봉의 평균 월세는 6월부터 100만원을 넘었다. 서울 평균 월세는 8월 164만원이다. 전세대출 규제와 실거주 의무 강화로 전세 공급이 줄어든 점이 원인으로 꼽혔다.\n\n*왜 골랐나*: 노원구 임대차 가격이 수도권 최고 상승률이라는 수치가 있어, 이주·거주비 부담 판단에 참고할 수 있다.\n\n## 인사이트\n\n- 창동 서울아레나 주변 개발은 구청장 인터뷰와 롯데백화점 노원점 전략에서 모두 언급돼 노원·창동 생활권 변화로 이어지지만, 상계주공9단지 용적률이나 분담금 변화와의 연결은 기사에서 확인되지 않는다.[1][2]\n- 창동주공18단지에 이어 4단지·19단지도 추진위 승인을 받았다. 노원과 인접한 창동·상계택지지구에서 재건축이 초기 단계로 진입하고 있다.[3]\n- 미아2구역은 총공사비 1조7790억원을 제시했으나 현장설명회 이후 실제 입찰 참여 건설사는 없었다. 이 수치는 사업 전체 금액이어서 세대 단위 분담금과 비교할 수 없다.[3]\n- 노원구는 3분기 전고점 이상 거래 비중이 8.1%에서 24.9%로 올랐고 올해 월세·전세 상승률도 10%대여서, 매매와 임대차 모두에서 비용 부담이 커지는 흐름이다.[4][5]\n\n## 오늘의 개념\n\n### 특정개발진흥지구\n\n문화·산업 등 특정 기능을 육성하려는 지역을 지정해 자금 융자, 도시계획상 규제 완화, 세제 지원을 하는 제도다. 기사에서는 지정되면 문화·콘텐츠 기업이 들어와 성장할 여건을 마련할 수 있다고 설명했다.\n\n*오늘*: 도봉구가 창동역 일대 지정을 추진 중이며 아직 지정이 확정되지 않아, 노원 인접 생활권의 계획 단계로 읽어야 한다.[1]\n\n## 참고 원문\n\n1. 김동욱 도봉구청장 \"서울아레나, 지역경제 바꿀 큰 기회\"[인터뷰] — 뉴시스 · [원문](https://newsis.com/view/NISX20260929_0003807759)\n2. \"강남·잠실점 새단장\"…롯데백화점, 상권 초격차 전략 본격화 — 이데일리 · [원문](https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=02656806645611936)\n3. 강북권 집값 상승에 정비사업도 '꿈틀'…곳곳서 사업 속도 — 데일리안 · [원문](https://dailian.co.kr/news/view/1699622?sc=Naver)\n4. 서울 아파트 거래 절반 이상 ‘전고점’ 넘겨…강남보다 강북이 더 뛰었... — 서울경제 · [원문](https://sedaily.com/article/20100379)\n5. 전세 뛰면 월세 안정? 공식 깨졌다...서울 아파트 평균 월세 164만원 '역... — jibs.co.kr · [원문](https://jibs.co.kr/news/articles/articlesDetail/66365?feed=na)\n\n## 오늘 흘려보낸 것\n\n중복 56건 · 후속보도 신규정보 없음 0건 · 기준 미달 355건\n"}, {"date": "2026-10-11", "markdown": "# 2026-10-11 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 후보는 대부분 서울 집값의 강남 약세·외곽 강세 구도를 다룬 시황 기사이고, 분담금·평당공사비 같은 비용 수치가 있는 기사는 오금현대 1건뿐이다. 노원구는 10·15 대책 이후 누적 상승률, 월세 상승률, 경매 낙찰가율에서 반복적으로 이름이 올랐다. 다만 이는 매매·임대차 시장 지표이고 상계주공 재건축 비용 정보는 새로 나오지 않았다. 창동 서울아레나 연계 상권 활성화는 인접 생활권의 계획 단계 변화로 따로 짚는다.\n\n## 선별 5건\n\n### 1. [챗집피티] 40년 된 송파 '알짜' 오금현대…1.6조에 삼성·포스코 경쟁\n\n머니투데이 · 2026-10-10 · [원문](https://mt.co.kr/estate/2026/10/10/2026100813444152703)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 오금현대 | 총공사비 | 1조 6,642억 | — |\n| 오금현대 | 평당공사비 | 962만원/3.3㎡ | — |\n\n송파구 오금현대 재건축조합이 지난달 30일 시공사 선정 현장설명회를 열었고 삼성물산·포스코이앤씨·제일건설 등이 참석했다. 예정 총공사비는 1조6642억원, 3.3㎡당 공사비는 962만원으로 책정됐다. 기존 1316가구가 2436가구로 늘어 일반분양 물량이 많다는 점이 사업성 요소로 언급됐다. 조합원 분담금은 이번 보도에 나와 있지 않다.\n\n> ⚠️ 이번 보도에는 조합원 분담금이 나와 있지 않습니다. 총공사비 1조6642억원과 3.3㎡당 공사비 962만원은 사업 전체와 면적 단위 수치이므로 소유주 한 명이 부담하는 금액으로 읽으시면 안 됩니다.\n> ⚠️ 분담금은 종전자산 감정평가액에 비례율을 곱한 권리가액과 신청 평형에 따라 정해지며, 보유 면적·동·층·향에 따라 소유주마다 달라집니다.\n> ⚠️ 이 공사비는 시공사 선정 공고 단계의 예정 금액입니다. 기사에는 비례율이 나와 있지 않고, 이후 단계에서 공사비와 일반분양가가 바뀌면 비례율과 분담금도 함께 바뀝니다.\n\n*왜 골랐나*: 이날 후보 중 평당공사비와 총공사비 실수치가 본문에 있는 유일한 기사다.\n\n### 2. 🔴 [창동] 도봉구, 주민제안 담은 100대 과제 선정\n\njeonmae.co.kr · 2026-10-11 · [원문](https://jeonmae.co.kr/news/articleView.html?idxno=1299957)\n\n도봉구가 주민 제안 561건을 검토해 100대 과제를 선정했다. 창동경제엔진 분야에는 서울아레나와 연계한 지역상권 활성화 등 20개 과제가 담겼다. 미래 교통·주거혁신 분야에는 재개발·재건축 신속 추진 등 10개가 포함됐다. 구는 과제가 실제 생활 개선으로 이어지는지 점검하겠다고 밝혔다.\n\n**정책 포인트**\n\n- 구 차원의 과제 선정 단계로, 사업 확정이나 착공이 아니다.\n\n*왜 골랐나*: 노원 인접 생활권인 창동의 서울아레나 연계 상권 계획이 담긴 기사다.\n\n### 3. 🔴 [노원구] [10·15 대책 1년] 1년 새 서울 중하위권 뜨고 강남은 위축\n\n연합뉴스 · 2026-10-11 · [원문](https://yna.co.kr/view/AKR20261010045100003?input=1195m)\n\n한국부동산원에 따르면 10월 첫째 주 서울 아파트 매매가격은 10·15 대책 직후 대비 평균 10.42% 올랐다. 자치구별 누적 상승률은 성북구 16.52%에 이어 노원구가 12.52%로 7번째였다. 강남구는 1.40%, 서초구는 3.35%에 그쳤다. 대출 한도 차등 적용과 토허구역 지정이 배경으로 설명됐다.\n\n**정책 포인트**\n\n- 서울 전역이 규제지역·토지거래허가구역이고 주담대 한도가 주택 가액대별로 차등 적용되는 환경이다.\n\n*왜 골랐나*: 노원구의 10·15 대책 이후 누적 상승률 수치가 명시된 기사다.\n\n### 4. 🔴 [노원구] 전세도 오르고 월세도 뛰었다...'다 올랐다' 사상 초유 임대차 시장[부...\n\n파이낸셜뉴스 · 2026-10-10 · [원문](https://fnnews.com/news/202610090858489905)\n\n올 1~8월 노원구 아파트 월세 상승률은 10.2%로 수도권 1위였고 전세도 10.3% 올랐다. 노원구에서는 지난 3월 월세 700만원의 역대 최고 기록이 나왔다. 노원·도봉의 평균 월세는 지난 6월부터 100만원을 넘었다.\n\n*왜 골랐나*: 노원구 임대차 가격의 수도권 최고 상승률이 수치로 제시된 기사다.\n\n### 5. 🔴 [노원구] 초고가 힘 빠진 서울 경매…낙찰가율 1년 7개월 만에 '최저'\n\nshinailbo.co.kr · 2026-10-10 · [원문](https://shinailbo.co.kr/news/articleView.html?idxno=5069897)\n\n지난달 서울 아파트 경매 낙찰가율은 94.7%로 전월보다 2.3%p 하락했다. 노원구 낙찰가율은 107.4%로 감정가를 웃돌았다. 강북·구로·도봉 등 중저가 지역도 100%를 넘겼다. 전문가는 수요가 대출 가능한 15억원 이하 가격대로 몰린다고 분석했다.\n\n*왜 골랐나*: 노원구 경매 낙찰가율 수치가 있는 기사다.\n\n## 인사이트\n\n- 오금현대의 평당공사비 962만원은 시공사선정공고 단계 기준이며, 같은 단계 최근 90일 벤치마크 중앙값 962만원/3.3㎡과 같은 수준이다.[1]\n- 오금현대 기사에는 총공사비와 평당공사비만 있고 조합원 분담금은 없어, 세대 단위 부담은 이 기사로 가늠할 수 없다.[1]\n- 노원구는 매매 누적 상승률, 월세 상승률, 경매 낙찰가율 모두 상위권으로 나타났다. 이는 시장 지표이며 상계주공 재건축 분담금 변화를 뜻하지 않는다.[2][3][4]\n- 창동 서울아레나 연계 상권 활성화는 구 차원의 과제 선정 단계다. 노원 생활권과의 연결은 인접성에 따른 간접 해석이다.[5]\n\n## 참고 원문\n\n1. [챗집피티] 40년 된 송파 '알짜' 오금현대…1.6조에 삼성·포스코 경쟁 — 머니투데이 · [원문](https://mt.co.kr/estate/2026/10/10/2026100813444152703)\n2. [10·15 대책 1년] 1년 새 서울 중하위권 뜨고 강남은 위축 — 연합뉴스 · [원문](https://yna.co.kr/view/AKR20261010045100003?input=1195m)\n3. 전세도 오르고 월세도 뛰었다...'다 올랐다' 사상 초유 임대차 시장[부... — 파이낸셜뉴스 · [원문](https://fnnews.com/news/202610090858489905)\n4. 초고가 힘 빠진 서울 경매…낙찰가율 1년 7개월 만에 '최저' — shinailbo.co.kr · [원문](https://shinailbo.co.kr/news/articleView.html?idxno=5069897)\n5. 도봉구, 주민제안 담은 100대 과제 선정 — jeonmae.co.kr · [원문](https://jeonmae.co.kr/news/articleView.html?idxno=1299957)\n\n## 오늘 흘려보낸 것\n\n중복 14건 · 후속보도 신규정보 없음 0건 · 기준 미달 195건\n"}, {"date": "2026-10-10", "markdown": "# 2026-10-10 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 후보에는 평당공사비·분담금·분양가 같은 재건축 비용 실수치가 담긴 기사가 없다. 대부분이 서울 아파트값 87주 연속 상승, 강남 하락과 외곽 상승의 양극화, 대출 의존도 같은 시황 기사다. 그 안에서 노원구가 외곽 강세와 전세 매물 감소의 중심에 있고, 창동·상계 서울디지털바이오시티가 서울시의회 현장 방문에서 언급됐다. 다만 이 사업의 새 진척은 확인되지 않는다. 노원 관련 수치 기사와 재건축 일정이 소유자에게 미치는 제도 영향 기사를 골랐고, 비용 수치가 없는 날이라 facts는 모두 비웠다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] 87주 연속 오른 서울 아파트값…오름폭도 6주 만에 반등\n\n데일리안 · 2026-10-08 · [원문](https://dailian.co.kr/news/view/1699389?sc=Naver)\n\n한국부동산원 10월 1주(5일 기준) 통계에서 서울 아파트 매매가격은 0.12% 올라 87주 연속 상승했다. 노원구는 0.31%로 상계·월계동 위주로 올랐고, 도봉구(0.32%)는 창·쌍문동 위주로 올랐다. 노원구 전셋값은 0.30% 올라 상계·중계동 대단지가 상승을 이끌었다. 강남구(-0.34%)와 서초구(-0.27%)는 하락이 이어졌다. 재건축 비용 수치는 이 기사에 없다.\n\n**이번에 새로 나온 것**: 10월 1주 기준 노원구 매매 0.31%(상계·월계동), 전세 0.30%(상계·중계동 대단지) 주간 수치가 새로 확인됐다.\n\n> ⚠️ 이 기사는 한국부동산원 주간 매매가격 변동률 통계를 다룹니다. 재건축 분담금, 비례율, 감정평가액 같은 수치는 나오지 않으므로 분담금 판단의 근거로 읽으시면 안 됩니다.\n\n*왜 골랐나*: 노원구 상계·월계동과 상계·중계동 대단지의 매매·전세 주간 변동률이 직접 적혀 있어 노원 우선 기준에 해당한다.\n\n### 2. 🔴 [노원구] 서울 아파트, 전세 줄고 보증금은 오르고 …세입자 '이중고'\n\n더구루 · 2026-10-10 · [원문](https://theguru.co.kr/news/article.html?no=108050)\n\n아실 집계로 8일 기준 서울 아파트 전세 매물은 약 2만600건으로 1년 전보다 14% 줄었다. 노원구는 47% 줄었고 도봉구는 51% 감소했다. 올해 1~8월 서울 아파트 전셋값은 누적 7.4% 올랐고, 갱신 계약 비중은 약 51%로 나타났다. 기사는 입주 물량 감소와 토지거래허가구역, 실거주 의무 등을 원인으로 든다.\n\n> ⚠️ 전세 매물과 전셋값 통계를 다룬 기사입니다. 재건축 분담금이나 종전자산 평가와 직접 이어지는 수치는 없습니다.\n\n*왜 골랐나*: 노원구 전세 매물 감소율이라는 구체적 수치가 있어 노원 거주·임대 환경 변화를 가늠할 수 있다.\n\n### 3. 🔴 [노원구] “어, 강남 아니었네?”…대출 옥죄자 매입자금 의존 더 커진 지역은\n\n매일경제 · 2026-10-08 · [원문](https://mk.co.kr/article/12171263)\n\n올해 1~8월 강남3구와 용산구는 주택 매입 시 대출 비중이 일제히 하락했다. 반면 노원·도봉 등 외곽은 대출 비중이 각각 30%대 안팎으로 높아졌다. 업계는 15억원 이하 주택 대출 한도를 더 줄이면 자금 여력이 부족한 무주택 실수요자가 타격을 입을 수 있다고 우려한다. 본문 일부만 제공돼 세부 수치는 확인되지 않는다.\n\n**정책 포인트**\n\n- 15억원 이하 주택 대출 한도 추가 축소 주장이 제기돼 있으나 확정된 정책은 아니다.\n\n> ⚠️ 대출 비중 통계를 다룬 기사이고, 본문 일부만 제공되어 세부 수치는 확인되지 않았습니다. 재건축 분담금 수치는 없습니다.\n\n*왜 골랐나*: 노원구 매수자의 대출 의존도가 높아졌다는 내용이라 노원 단지 거래 환경과 자금 조달 조건을 보여준다.\n\n### 4. 稅부담·재건축 일정에 쫓겨 … 마음 급해진 집주인 '시한부 급매'\n\n매일경제 · 2026-10-08 · [원문](https://mk.co.kr/article/12171832)\n\n강남3구를 중심으로 재건축 단지 소유자들이 세금과 추가 분담금 부담 때문에 급매를 내놓고 있다고 전한다. 투기과열지구 재건축은 조합설립인가 이후 조합원 지위 양도가 원칙적으로 제한되지만, 3년 넘게 사업시행인가 신청이 지연되면 일정 요건을 충족한 소유자는 예외적으로 지위를 넘길 수 있다. 서울시에 따르면 6월 기준 강남3구에서 조합설립인가 후 3년이 지났으나 사업시행인가 신청 전인 사업장은 16곳이다. 분담금 금액은 제시되지 않았고, 노원 단지에 대한 언급도 없다.\n\n**정책 포인트**\n\n- 투기과열지구에서 조합설립인가 후 3년 넘게 사업시행인가 신청이 지연되면 일정 요건 충족 시 조합원 지위 양도가 예외적으로 허용된다.\n- 노원 단지에 적용되는지는 기사에서 확인되지 않는다.\n\n> ⚠️ 이 기사에는 분담금 금액이 제시되지 않았습니다. '추가 분담금 부담'은 소유주마다 종전자산 감정평가액과 보유 면적이 달라 사람마다 다르게 나타나는 값입니다.\n> ⚠️ 조합원 지위 양도 제한과 예외 요건은 조합설립인가 이후 단계에 해당하는 내용입니다. 해당 사업장이 지금 어느 단계인지에 따라 적용 여부가 달라지므로, 본인 단지의 인가 시점과 사업시행인가 신청 여부를 직접 확인하셔야 합니다.\n> ⚠️ 서울시가 밝힌 16곳은 강남3구 기준 수치입니다. 노원 등 다른 지역 단지에 그대로 적용되는 숫자가 아닙니다.\n\n*왜 골랐나*: 추가 분담금 감당 여력이 매도 시점을 가른다는 점과 조합원 지위 양도 예외 요건이 재건축 소유자 전반에 적용될 수 있는 제도 정보다.\n\n### 5. 🔴 [창동] 서울시의회 주택공간위원회, 한옥부터 AI·로봇까지 미래 주거공간 해법...\n\njeonmae.co.kr · 2026-10-08 · [원문](https://jeonmae.co.kr/news/articleView.html?idxno=1299758)\n\n서울시의회 주택공간위원회가 6일 스마트라이프위크 2026을 방문했다. 서울주택도시개발공사 부스에서 창동상계 서울디지털바이오시티 조성사업 설명을 들었다. 기사에는 사업의 일정, 규모, 비용 등 새로운 내용이 나오지 않고 위원회의 AI·로봇 활용 검토 의지가 중심이다.\n\n**정책 포인트**\n\n- 이번 방문은 설명 청취 단계이며 사업 진척이나 도시계획 결정이 아니다. 상계주공9단지에 대한 적용이나 영향은 기사에서 확인되지 않는다.\n\n> ⚠️ 창동상계 서울디지털바이오시티 조성사업은 이 기사에서 일정, 규모, 비용이 언급되지 않았습니다. 재건축 분담금과 관련해 읽을 수치가 없습니다.\n\n*왜 골랐나*: 창동·상계 일대 개발사업이 시의회 보고 대상에 올랐다는 사실이 확인돼 인접 생활권 변화 추적 대상으로 삼았다.\n\n## 인사이트\n\n- 오늘 노원구 수치는 매매 0.31%, 전세 0.30%, 전세 매물 47% 감소로, 외곽 강세와 전세 품귀가 동시에 나타난다.[1][2]\n- 노원·도봉은 매입자금 중 대출 비중이 30%대 안팎으로 높아졌다는 보도가 있어, 대출 한도가 줄면 외곽 실수요 거래가 직접 영향을 받는 구조다.[3]\n- 재건축 소유자에게는 추가 분담금 감당 능력과 조합원 지위 양도 가능 시점이 매도 결정에 영향을 준다는 점이 확인됐다. 다만 기사의 사례는 강남3구다.[4]\n- 창동·상계 서울디지털바이오시티는 시의회 설명 청취까지만 확인됐고 일정이나 규모 같은 진척은 없다. 상계주공9단지와의 연결은 간접적인 해석 수준이다.[5]\n\n## 참고 원문\n\n1. 87주 연속 오른 서울 아파트값…오름폭도 6주 만에 반등 — 데일리안 · [원문](https://dailian.co.kr/news/view/1699389?sc=Naver)\n2. 서울 아파트, 전세 줄고 보증금은 오르고 …세입자 '이중고' — 더구루 · [원문](https://theguru.co.kr/news/article.html?no=108050)\n3. “어, 강남 아니었네?”…대출 옥죄자 매입자금 의존 더 커진 지역은 — 매일경제 · [원문](https://mk.co.kr/article/12171263)\n4. 稅부담·재건축 일정에 쫓겨 … 마음 급해진 집주인 '시한부 급매' — 매일경제 · [원문](https://mk.co.kr/article/12171832)\n5. 서울시의회 주택공간위원회, 한옥부터 AI·로봇까지 미래 주거공간 해법... — jeonmae.co.kr · [원문](https://jeonmae.co.kr/news/articleView.html?idxno=1299758)\n\n## 오늘 흘려보낸 것\n\n중복 67건 · 후속보도 신규정보 없음 0건 · 기준 미달 465건\n"}, {"date": "2026-10-09", "markdown": "# 2026-10-09 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 분담금·공사비 실수치가 담긴 기사보다 창동·상계 생활권 변화 기사가 많았다. 창동차량기지 일대 S-DBC는 산단 지정이 내년 상반기로 밀릴 전망이고, 입주 수요 조사는 뷰티·엔터로 넓어졌다. GTX-C 착공 이후 창동·광운대 노선 영향과, 서울아레나를 축으로 한 도봉구의 관광특구 추진도 함께 나왔다. 반면 상계주공 단지 기준의 새 비용 수치는 후보 중에 없었다. 기존 스레드와 겹치는 상계주공 거래 기사는 본문이 없거나 새 사실이 없어 제외했다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] [이슈] \"강북을 일자리 경제도시로\"…SH, 'S-DBC' 청사진 공개, '산단 지...\n\npaxetv.com · 2026-10-08 · [원문](http://paxetv.com/news/articleView.html?idxno=283679)\n\nSH가 창동차량기지 이전 부지 일대 24만7000㎡에 조성하는 S-DBC 기업 유치에 나섰다. 산업시설용지는 필지당 1700~8000㎡로 나눠 조성원가 이하에 공급하고, 복합용지는 조성원가와 감정평가액을 절반씩 반영해 가격을 정한다. 4호선 차량 정비 기능은 8월 진접차량기지로 옮겨갔고 GTX-C는 지난달 착공했다. 서울시는 올해 하반기 산단 지정 고시를 목표로 했으나 SH는 수도권 규제 심의 때문에 내년 상반기로 밀릴 것으로 본다. SH는 아직 사업시행자로 지정되지 않았다.\n\n**정책 포인트**\n\n- 산단 지정 고시가 올해 하반기 목표에서 내년 상반기로 밀릴 것으로 SH가 전망한다.\n- SH는 산단 지정 전이라 아직 사업시행자로 지정되지 않았다.\n\n*왜 골랐나*: 노원구 상계동 창동차량기지 부지 개발의 일정 지연이 새로 확인된 기사라서 노원 생활권 우선 기준에 해당한다.\n\n### 2. 🔴 [창동] 바이오 이어 뷰티·K엔터까지 유치하고 나선 서울시…강북 대개조 시동\n\n아시아경제 · 2026-10-09 · [원문](https://view.asiae.co.kr/article/2026100815274089720)\n\n서울시가 S-DBC 입주 수요 조사 대상을 바이오·AI에서 화장품·K엔터까지 넓혔다. 지난달부터 협회를 통해 입주 의향 설문을 하고 있다. 창동역 인근 부지와 오래된 상업지에는 용적률 최대 1300%를 적용해 상업·관광·숙박·업무 공간을 유치한다는 구상이다. 서울시는 실제 수요나 계약이 2028년께 분양 공고 후에 윤곽이 나올 것이라고 했다.\n\n**정책 포인트**\n\n- 용적률 최대 1300%는 창동역 인근 부지와 오래된 상업지에 대한 구상으로 소개됐다. 상계주공 단지에 적용되는 내용은 아니다.\n\n*왜 골랐나*: 창동 일대 개발 방향과 일정을 보여 주는 기사로, 창동·상계 인접 생활권 변화에 해당한다.\n\n### 3. 🔴 [창동] 인덕원·금정역 1순위…창동·광운대도 주목 [감평사의 부동산 현장진단...\n\n매일경제 · 2026-10-08 · [원문](https://mk.co.kr/article/12167135)\n\n국토부가 GTX-C 민간투자사업 공사에 착수한다고 밝혔다. 덕정역에서 수원역까지 86.46㎞이고 총사업비는 4조6084억원이며, 노선은 창동과 광운대를 지난다. 개통 시 덕정역에서 삼성역까지 이동시간은 약 80분에서 30분으로 줄어든다. 제공된 본문은 인덕원 일대 설명이 중심이다.\n\n*왜 골랐나*: GTX-C 노선이 창동·광운대역을 지나 노원 인접 생활권의 교통 접근성을 바꿀 수 있어 선정했다.\n\n### 4. 🔴 [창동] 서울아레나 관광특구 추진…도봉구, 민선 9기 첫 당정협의회 개최\n\n문화일보 · 2026-10-07 · [원문](https://munhwa.com/article/11621783)\n\n같은 사건 보도: 헤럴드경제, 연합뉴스, 뉴시스\n\n도봉구가 민주당 지역위원회와 첫 당정협의회를 열고 서울아레나 중심의 문화·관광산업 육성을 핵심과제로 정했다. '서울아레나 관광특구' 지정을 공동 추진하고 숙박·교통·관광 안내 기반시설을 늘리기로 했다. 창동역과 서울아레나, 상권, 도봉산을 연계한 체류형 관광 환경도 논의했다. 지정은 추진 단계이며 확정된 것은 아니다.\n\n**정책 포인트**\n\n- 관광특구 지정은 공동 추진 단계로, 지정이 확정되지는 않았다.\n\n*왜 골랐나*: 창동역 일대 서울아레나 주변의 관광특구 추진은 노원과 맞닿은 생활권 변화여서 선정했다.\n\n### 5. 🔴 [노원구] 취임 100일 맞은 서준오 노원구청장...비전 제시 땀 흘려\n\n헤럴드경제 · 2026-10-08 · [원문](https://biz.heraldcorp.com/article/10896339)\n\n민선 9기 100일을 맞은 서준오 노원구청장의 활동을 정리한 기사다. 임기 초 월계동 우이천 동북선 공사장 땅 꺼짐 사고와 가로수 쓰러짐 사고가 있었고, 두 사고 모두 인명피해는 없었다. 창동차량기지 내 서울디지털바이오시티 건설 등 미래경제도시를 향한 행보도 언급됐다. 제공된 본문에 구체적인 사업 일정이나 비용 수치는 없다.\n\n*왜 골랐나*: 노원구 직접 기사이며, 동북선 공사장 사고와 S-DBC 추진 언급이 있어 후보 중 노원 구정 관련 내용이 가장 구체적이다.\n\n## 인사이트\n\n- S-DBC 산단 지정 고시는 올해 하반기 목표에서 내년 상반기로 밀릴 것으로 SH가 보고 있어, 사업시행자 지정과 착수 시점도 함께 늦어질 수 있다.[1]\n- S-DBC 입주 수요는 서울시 설명으로 바이오만으로도 이미 100% 이상이라고 한다. 다만 실제 수요와 계약은 2028년께 분양 공고 후에야 윤곽이 나온다.[2]\n- GTX-C 착공, 서울아레나 관광특구 추진, S-DBC가 모두 창동·상계 축에 걸쳐 있다. 다만 이 기사들에는 상계주공9단지의 용적률이나 분담금과 직접 연결되는 내용이 없다.[1][3][4]\n\n## 참고 원문\n\n1. [이슈] \"강북을 일자리 경제도시로\"…SH, 'S-DBC' 청사진 공개, '산단 지... — paxetv.com · [원문](http://paxetv.com/news/articleView.html?idxno=283679)\n2. 바이오 이어 뷰티·K엔터까지 유치하고 나선 서울시…강북 대개조 시동 — 아시아경제 · [원문](https://view.asiae.co.kr/article/2026100815274089720)\n3. 인덕원·금정역 1순위…창동·광운대도 주목 [감평사의 부동산 현장진단... — 매일경제 · [원문](https://mk.co.kr/article/12167135)\n4. 서울아레나 관광특구 추진…도봉구, 민선 9기 첫 당정협의회 개최 — 문화일보 · [원문](https://munhwa.com/article/11621783)\n\n## 오늘 흘려보낸 것\n\n중복 96건 · 후속보도 신규정보 없음 1건 · 기준 미달 658건\n"}, {"date": "2026-10-08", "markdown": "# 2026-10-08 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 노원·상계 생활권과 직접 연결되는 기사가 많았지만, 본문에 분담금·공사비 수치가 있는 기사는 한 건뿐이다. 그 한 건은 노원구 단지의 추정 분담금 약 5억 원을 전하는데, 단지명이 없고 면적 전제만 있다. 나머지는 상계주공9단지 거래 건수, 광운대역·창동 일대 개발과 같은 생활권 변화를 다룬다. 이 가운데 확정된 사업 진척은 서울원 조성과 창동상계 SDBC 설명 청취 정도이고, 서울아레나 관광특구는 지정을 공동 추진하기로 한 단계다.\n\n## 선별 5건\n\n### 1. 🔴 [노원구] 반포도 분담금 10억…재건축, 남는 게 없다\n\nwowtv.co.kr · 2026-10-07 · [원문](https://wowtv.co.kr/NewsCenter/News/Read?articleId=A202610070081&t=NNv)\n\n한 부동산 분석업체 추산으로 서초구 재건축 단지의 같은 평형 분담금이 10억 원에 달한다는 내용이다. 노원구의 한 재건축 단지는 전용 59㎡ 소유자가 전용 84㎡를 받을 때 약 5억 원 안팎의 추가 분담금이 예상됐으나 부담이 더 커질 것이라는 예상이 나온다. 새집고고 분석에서 사업성이 낮은 C·D 등급은 강북구·중랑구·금천구 등 외곽에 집중됐다. 국회에서는 민간 재건축 용적률 상한 상향이 논의 중이지만 상한폭과 적용 면적에서 합의에 이르지 못했다.\n\n**정책 포인트**\n\n- 민간 재건축 용적률 상한 상향 논의가 국회에서 진행 중이나 상한폭·적용 면적 합의는 이뤄지지 않았다.\n- 과도한 기부채납·공공기여의 현실화 필요성이 전문가 발언으로 제기됐다.\n\n> ⚠️ 서초구 단지의 분담금 10억 원은 한 부동산 분석업체의 추산입니다. 어느 단지·평형·종전 면적을 기준으로 했는지 요약만으로는 확인되지 않으니, 내 단지의 수치로 읽지 마시기 바랍니다.\n> ⚠️ 노원구 단지의 약 5억 원 안팎은 전용 59㎡ 소유자가 전용 84㎡를 받는 경우만의 추가 분담금입니다. 보유 면적과 신청 평형이 다르면 분담금도 달라집니다.\n> ⚠️ 기사는 이 5억 원 안팎이 어느 시점의 비례율과 사업 단계를 전제하는지 밝히지 않습니다. 사업 단계가 앞서 있다면 추정치이고 관리처분 단계에서 바뀝니다.\n> ⚠️ 분담금은 종전자산 감정평가액에 비례율을 곱한 권리가액을 기준으로 정해집니다. 기사의 추산액을 감정평가액이나 확정 금액으로 읽으시면 안 됩니다.\n\n*왜 골랐나*: 노원구 재건축 단지의 추정 분담금(전용 59㎡→84㎡ 기준)과 용적률 상향 논의 현황이 함께 담긴 기사다.\n\n### 2. 🔴 [광운대역] GTX 역세권, 집값 이어 오피스 판도 영향… '이오타 서울' 등 개발 박차\n\nMTN 머니투데이방송 · 2026-10-08 · [원문](https://news.mtn.co.kr/news-detail/2026100810245581313)\n\nGTX-C 정차 예정지인 광운대역 일대에서 노원구 월계동 약 15만제곱미터 옛 물류부지에 주거·호텔·업무·상업시설을 갖춘 복합개발 '서울원'이 조성되고 있다. HDC현대산업개발 본사 이전도 계획돼 있다고 전한다. 기사는 이 일대가 동북권의 새 업무거점이 될지 주목된다고 쓴다. 신도림·서울역 개발 사례도 함께 다룬다.\n\n*왜 골랐나*: 노원구 월계동 광운대역 일대의 업무 기능 확충이라는 인접 생활권 변화를 다룬다.\n\n### 3. 🔴 [창동·상계] 서울시의회 주택공간위원회, AI·로봇 기술로 더 편리한 서울 만든다\n\nenewstoday.co.kr · 2026-10-08 · [원문](http://enewstoday.co.kr/news/articleView.html?idxno=2478153)\n\n서울시의회 주택공간위원회가 6일 스마트라이프위크 2026을 방문했다. SH 부스에서 창동상계 서울디지털바이오시티 조성계획 설명을 듣고 첨단산업과 도시공간의 연계 가능성을 살폈다. 기사에는 사업 일정이나 비용 수치가 없고, 위원장은 사업계획·예산 검토 때 반영하겠다는 취지로 말했다.\n\n*왜 골랐나*: 창동·상계 SDBC 조성계획이 시의회 상임위에 설명됐다는 기사로, 인접 생활권의 일자리·산업 거점 사업이다.\n\n### 4. 🔴 [상계주공9단지] 신혼부부 보금자리론 완화하지만 … 서울 외곽 6억 이하 '소형·구축' 편...\n\nqueen.co.kr · 2026-10-08 · [원문](http://queen.co.kr/news/articleView.html?idxno=464411)\n\n19일 신청분부터 신혼부부 보금자리론 소득 기준이 완화된다. 올해 1~8월 서울 6억 원 이하 아파트 거래는 1만527건이며 노원구가 2832건으로 가장 많았다. 노원구에서는 상계주공14단지 108건, 상계주공9단지 97건, 상계주공16단지 96건 순이었다. 노원구 전체 거래 중 6억 원 이하 비중은 48.5%였다.\n\n**정책 포인트**\n\n- 19일 신규 신청분부터 부부 합산소득이 기존 기준을 넘어도 배우자 중 한 명의 연소득이 7000만 원 이하면 보금자리론을 이용할 수 있다.\n\n*왜 골랐나*: 상계주공9단지가 6억 원 이하 거래 단지로 직접 언급된 기사다.\n\n### 5. 🔴 [창동] 서울아레나 일대를 관광특구로\n\nnaeil.com · 2026-10-07 · [원문](https://naeil.com/news/read/604391)\n\n도봉구는 민선 9기 첫 당정협의회에서 서울아레나 관광특구 지정을 공동 추진하기로 했다. 아레나 개관에 대비해 숙박·교통·관광 기반시설을 확충하고 창동역·상권·도봉산을 연계한 체류형 관광 환경 조성도 논의했다. 지정이 결정된 것은 아니고 추진 합의 단계다.\n\n*왜 골랐나*: 노원 인접 창동의 문화·관광 거점 사업 추진 단계 기사다.\n\n## 인사이트\n\n- 노원구 단지 추정 분담금 약 5억 원은 전용 59㎡→84㎡ 기준이지만 단지명과 산출 시점이 없어 기존 상계주공6단지 추산과 같은 척도로 비교할 수 없다.[1]\n- 국회의 민간 재건축 용적률 상한 상향 논의는 상한폭과 적용 면적에서 합의되지 않았다. 확정 전에는 노원 단지의 분담금 변화로 이어질지 알 수 없다.[1]\n- 광운대역 서울원과 창동상계 SDBC, 서울아레나는 노원·창동 생활권의 일자리·문화 기능을 키우는 사업이다. 다만 기사에서 확인된 것은 진행·추진 상태까지이며 상계주공 단지의 용적률이나 분담금과의 관계는 확인되지 않는다.[2][3][4]\n- 상계주공9단지는 올해 6억 원 이하 거래 97건으로 노원구 상위 단지에 올랐다. 정책대출 가격대 거래가 이 단지에서 이어지고 있다는 사실만 확인된다.[5]\n\n## 오늘의 개념\n\n### 관광특구\n\n외국인 관광객 유치 촉진을 위해 지정하는 특별 구역을 가리킨다. 기사에서는 도봉구가 서울아레나 일대를 이 특구로 지정하도록 당과 공동 추진하기로 했다고 나온다.\n\n*오늘*: 창동 서울아레나 일대 관광특구 지정은 아직 추진 합의 단계이며, 노원 인접 생활권의 상권·체류 환경 변화 가능성을 가늠하는 단서다.[4][6]\n\n## 참고 원문\n\n1. 반포도 분담금 10억…재건축, 남는 게 없다 — wowtv.co.kr · [원문](https://wowtv.co.kr/NewsCenter/News/Read?articleId=A202610070081&t=NNv)\n2. GTX 역세권, 집값 이어 오피스 판도 영향… '이오타 서울' 등 개발 박차 — MTN 머니투데이방송 · [원문](https://news.mtn.co.kr/news-detail/2026100810245581313)\n3. 서울시의회 주택공간위원회, AI·로봇 기술로 더 편리한 서울 만든다 — enewstoday.co.kr · [원문](http://enewstoday.co.kr/news/articleView.html?idxno=2478153)\n4. 서울아레나 일대를 관광특구로 — naeil.com · [원문](https://naeil.com/news/read/604391)\n5. 신혼부부 보금자리론 완화하지만 … 서울 외곽 6억 이하 '소형·구축' 편... — queen.co.kr · [원문](http://queen.co.kr/news/articleView.html?idxno=464411)\n6. 서울아레나 관광특구 추진…도봉구, 민선 9기 첫 당정협의회 개최 — 문화일보 · [원문](https://munhwa.com/article/11621783)\n\n## 오늘 흘려보낸 것\n\n중복 83건 · 후속보도 신규정보 없음 0건 · 기준 미달 715건\n"}, {"date": "2026-10-07", "markdown": "# 2026-10-07 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘 후보는 8·3 세제개편안 이후 서울 거래가 15억 이하·9억 이하로 쏠린다는 기사가 대부분이다. 노원은 대출 의존도가 높은 지역으로 반복 언급되지만 상계주공 재건축 비용에 대한 새 수치는 없다. 새로 확인되는 노원 생활권 변화는 창동 서울아레나 관광특구 추진이다. 비용 수치가 있는 기사는 안암1구역 추정비례율이다. 제도 쪽에서는 생활권계획이 시행 2년간 한 건도 수립되지 않았다는 점이 확인됐다.\n\n## 선별 5건\n\n### 1. 🔴 [창동] 도봉구, 서울아레나 관광특구 지정 추진…창동 경제 활성화 '핵심과제'\n\njob-post.co.kr · 2026-10-07 · [원문](https://job-post.co.kr/news/articleView.html?idxno=230948)\n\n도봉구가 지난 2일 민선 9기 첫 당정협의회에서 서울아레나 관광특구 지정을 공동 추진하기로 했다. 서울아레나 개관에 맞춰 숙박시설·교통체계·관광 안내 등 인프라를 확충하고, 창동역과 서울아레나, 인근 상권, 도봉산을 잇는 체류형 관광 동선을 논의했다. 국·시비 확보가 필요한 사업과 제도 개선 사항을 구분해 실무협의를 이어갈 계획이다. 기사에 비용 수치는 없다.\n\n**정책 포인트**\n\n- 관광특구 지정은 추진 합의 단계이며 지정이 확정된 것은 아니다.\n- 기사에는 노원구나 상계주공 단지에 대한 언급이 없다. 창동 일대 변화가 상계 생활권에 미치는 영향은 간접적 해석이며 확인된 사실이 아니다.\n\n*왜 골랐나*: 노원 인접 생활거점인 창동의 문화·관광·일자리 관련 신규 추진 사업이라 우선 검토 대상이다.\n\n### 2. 안암1구역, 재건축 추정비례율 108.4%로 추산\n\n한국주택경제신문 · 2026-10-06 · [원문](https://arunews.com/news/articleView.html?idxno=67769)\n\n**핵심 수치**\n\n| 단지 | 항목 | 값 | 전제 |\n|---|---|---|---|\n| 안암1구역 | 비례율 | 108.4% | — |\n| 안암1구역 | 조합원분양가 | 3,500만원/3.3㎡ | — |\n\n성북구 안암1구역이 정비계획 공람 단계에서 추정비례율 108.4%로 추산됐다. 총수입 추정액은 3,732억원, 총지출 추정액은 1,955억원, 종전자산 추정총액은 1,640억원이다. 권리자 분양가 추정액은 전용 40㎡ 6억1,600만원부터 84㎡ 12억4,800만원까지 제시됐고, 조합원 분양가는 3.3㎡당 3,500만원으로 산정됐다. 기사에는 분담금 자체와 종전 면적은 나와 있지 않다.\n\n> ⚠️ 108.4%는 정비계획 공람 단계의 추정비례율입니다. 확정된 값이 아니며 관리처분 단계에서 일반분양가와 공사비 등이 바뀌면 함께 달라집니다.\n> ⚠️ 기사에는 종전 면적이 나와 있지 않아 이 비례율과 조합원 분양가가 어느 보유 면적과 평형을 전제로 한 수치인지 알 수 없습니다. 본인의 분담금으로 옮겨 읽으시면 안 됩니다.\n> ⚠️ 권리가액은 종전자산 감정평가액에 비례율을 곱해 정해지며, 감정평가액은 보유 면적과 동·층·향에 따라 소유주마다 다릅니다. 기사에 분담금은 제시되지 않았습니다.\n> ⚠️ 조합원 분양가 3,500만원은 3.3㎡당 단가이지 세대 총액이 아닙니다. 권리자 분양가 추정액으로 제시된 전용 40㎡ 6억1,600만원부터 84㎡ 12억4,800만원까지는 평형별 총액이며, 서로 다른 기준의 수치입니다.\n\n*왜 골랐나*: 비례율과 조합원분양가가 구체적 수치로 공개된 사례다.\n\n### 3. [단독]도시계획 혁신한다더니…‘생활권계획’ 시행 2년간 ‘0건’\n\n이데일리 · 2026-10-06 · [원문](https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=03634246645610296)\n\n국토계획법에 따른 생활권계획이 시행 2년여가 지나도록 별도로 수립된 사례가 지난달 기준 0건이다. 생활권계획으로 해당 지역의 도시·군기본계획을 수립·변경할 수 있는 법적 근거도 마련돼 있다. 국토부는 '제도 도입 초기'라고 설명했다. 기사에는 노원구나 상계동 관련 내용이 없다.\n\n**정책 포인트**\n\n- 생활권계획 수립 실적은 지난달 기준 0건이다.\n- 노원·상계에 이 제도가 적용되는지는 기사에서 확인되지 않는다.\n\n*왜 골랐나*: 도시계획 제도가 실제 작동하지 않는다는 정책 현황이라 수치가 없어도 포함한다.\n\n### 4. 🔴 [노원구] 노도강 매입자금 30%대가 대출…강남권은 11% 그쳐\n\n아주경제 · 2026-10-05 · [원문](https://ajunews.com/view/20261005105550363)\n\n올해 1~8월 노원구 주택 구매자의 매입자금 중 금융기관 대출 비중은 38.2%로 지난해 30.0%보다 8.2%포인트 높아졌다. 지난 8월 노원구 아파트 거래의 99.8%가 15억원 이하였다. 15억원 이하 주담대 한도 6억원을 추가로 낮추면 서울 외곽 구매자가 더 큰 영향을 받을 수 있다는 지적이 나온다. 재건축 비용 정보는 없다.\n\n**정책 포인트**\n\n- 15억원 이하 주담대 한도 6억원이 추가로 낮춰질지가 노원 등 외곽 매수자에게 영향을 줄 수 있다.\n\n*왜 골랐나*: 노원구 매수자의 대출 의존도가 수치로 제시된 기사다.\n\n### 5. 🔴 [노원구] \"강남 떨어지면 뭐하나\"… 30대 회사원 비상 걸린 이유 [시장톡]\n\n한국경제 · 2026-10-06 · [원문](https://hankyung.com/article/2026100295606)\n\n한국부동산원 주간 동향에서 지난달 28일 기준 노원구 아파트값은 주간 0.34% 올랐고 올해 누적 상승률은 11.51%다. 강남구는 올해 누적 마이너스 0.26%다. 서울 전체 주간 상승률은 5주 연속 줄어 0.09%가 됐다. 노원구 월계동 녹천역두산위브 전용 59㎡는 7억1000만원에 거래됐다.\n\n*왜 골랐나*: 노원구 매매가 누적 상승률이 확인되는 기사다.\n\n## 인사이트\n\n- 노원구는 매입자금 중 대출 비중이 올라가고 거래의 거의 전부가 15억원 이하여서, 주담대 한도 조정에 민감한 구조로 보도됐다.[1][2]\n- 창동 서울아레나 관광특구는 추진 합의 단계다. 상계 생활권과의 연결은 인접성에 근거한 해석이며, 지정이나 효과는 확인되지 않았다.[3][4]\n- 안암1구역은 정비구역지정 단계 추정치로, 비례율 108.4%와 조합원분양가 3.3㎡당 3,500만원이 공개됐다. 종전 면적이 없어 분담금으로 읽을 수는 없다.[5]\n- 생활권계획 수립이 0건이어서 이 제도가 도시계획 변경 경로로 쓰인 사례는 아직 없다.[6]\n\n## 오늘의 개념\n\n### 생활권계획\n\n국토계획법에 따라 생활권 단위로 수립하는 계획이다. 기사에 따르면 이를 통해 해당 지역의 도시·군기본계획을 수립하거나 변경할 수 있는 법적 근거가 마련됐다.\n\n*오늘*: 시행 2년여가 지나도록 별도 수립 사례가 0건으로 확인돼, 이 경로로 생활권 단위 계획이 바뀐 곳은 아직 없다.[6]\n\n## 참고 원문\n\n1. 노도강 매입자금 30%대가 대출…강남권은 11% 그쳐 — 아주경제 · [원문](https://ajunews.com/view/20261005105550363)\n2. [국감] 주담대 줄인 강남, 대출 늘린 노원·도봉···서울 주택 매입자... — seoulfn.com · [원문](https://seoulfn.com/news/articleView.html?idxno=639398)\n3. 도봉구, 서울아레나 관광특구 지정 추진…창동 경제 활성화 '핵심과제' — job-post.co.kr · [원문](https://job-post.co.kr/news/articleView.html?idxno=230948)\n4. 서울아레나 관광특구 추진…도봉구, 민선 9기 첫 당정협의회 개최 — 문화일보 · [원문](https://munhwa.com/article/11621783)\n5. 안암1구역, 재건축 추정비례율 108.4%로 추산 — 한국주택경제신문 · [원문](https://arunews.com/news/articleView.html?idxno=67769)\n6. [단독]도시계획 혁신한다더니…‘생활권계획’ 시행 2년간 ‘0건’ — 이데일리 · [원문](https://edaily.co.kr/News/Read?mediaCodeNo=257&newsId=03634246645610296)\n\n## 오늘 흘려보낸 것\n\n중복 62건 · 후속보도 신규정보 없음 0건 · 기준 미달 564건\n\n## 📜 관련 고시\n\n- 2026-09-23 · 창동 522-19번지 일원 가로주택정비사업 조합설립인가 및 지형도면 고시 · 도봉구 · [원문](https://urban.seoul.go.kr/view/html/PMNU4030100001?noticeCode=11320NTC202609230003)\n"}, {"date": "2026-10-06", "markdown": "# 2026-10-06 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 서울 전체 아파트 시장의 가격대별 쏠림(9억·15억 이하 거래 증가)과 지역별 대출 의존도 격차를 다룬 기사가 절대 다수였지만, 이런 시황 기사는 분담금 판단에 직접 쓸 수치가 없어 대부분 제외했다. 대신 노원·상계권역에서는 정비사업 진행 단계(상계주공6단지 정비계획 공람, 상계한신3차 정비구역 지정)가 처음으로 보도됐고, 상계주공9단지·3단지의 구체적 실거래가·호가 정보가 함께 나왔다. 인접 생활권인 창동역 일대는 문화 상권 조성 투자 소식이 있었다. 전반적으로 상계권 재건축은 비용 수치보다 절차 진행과 매매가 흐름 쪽에서 움직임이 포착된 하루다.\n\n## 선별 4건\n\n### 1. 🔴 [노원구] [재건축ㆍ재개발 속도가 답이다] ①노원구 “정비사업은 생존전략”…...\n\n대한경제 · 2026-10-06 · [원문](https://dnews.co.kr/uhtml/view.jsp?idxno=202610051708413060460)\n\n상계주공6단지가 신속통합기획 방식으로 추진되는 상계주공 단지 가운데 처음으로 정비계획 공람을 실시했다. 상계한신3차도 9월 8일 상계권역 신속통합기획 대상지 중 처음으로 정비구역 지정 절차에 들어갔다. 노원구는 상계동 일대 10개 정비사업이 동시에 진행 중이라며 재건축을 '생존전략'으로 규정했다고 보도됐다. 본문이 확보되지 않아 구체적 비용 수치는 확인되지 않는다.\n\n**이번에 새로 나온 것**: 상계주공6단지가 신속통합기획 방식 상계주공 단지 중 최초로 정비계획 공람을 실시했고, 상계한신3차가 상계권역 최초로 정비구역 지정 절차에 들어갔다는 점이 새로 확인됐다.\n\n*왜 골랐나*: 상계주공6단지와 상계한신3차의 정비사업 절차 진척을 다룬 기사로, 최우선 지역(노원구·상계주공) 기준에 따라 선별했다.\n\n### 2. 🔴 [상계주공9단지] “10억 이하 아파트 좀 구해주세요”...노원구에 몰려 있다\n\n매일경제 · 2026-10-05 · [원문](https://mk.co.kr/article/12167209)\n\n올해 1월~9월23일 서울 10억원 미만 아파트 거래 중 노원구가 5505건(19.3%)으로 가장 많았다. 단지별로는 상계주공9단지가 151건으로 1위, 상계주공6단지(149건)·7단지(137건)가 뒤를 이었다. 상계주공9단지 전용79㎡는 8월 8일 8억6500만원, 전용58㎡는 8월22일 7억1000만원에 거래됐다. 기사는 재건축 기대에 따른 '몸테크' 수요 유입을 거래 증가 배경으로 지목했다.\n\n**이번에 새로 나온 것**: 상계주공9단지 전용79㎡·58㎡의 8월 구체적 거래가격(8억6500만원, 7억1000만원)이 새로 확인됐다.\n\n*왜 골랐나*: 상계주공9단지의 구체적 거래량·실거래가가 제시된 기사로, 최우선 지역 기준을 충족한다.\n\n### 3. 🔴 [상계주공3단지] 아파트 거래 절반 ‘9억 이하’에 몰리고… 강남 매물은 쌓였다\n\nsegye.com · 2026-10-06 · [원문](https://segye.com/newsView/20261005508889?OutUrl=naver)\n\n8·3세제개편안 이후 서울 아파트 매매의 9억원 이하 비중이 52.6%로 늘어난 가운데, 노원구 상계주공3단지에서는 전용73.94㎡ 매물이 12억~13억원에 나와 있다. 현지 중개업소는 이 가격이 '현재 시세보다 조금 높다'고 평가했다. 기사는 중저가 지역에서 매도자 기대가격이 높아지는 흐름을 함께 소개했다.\n\n**이번에 새로 나온 것**: 상계주공3단지 전용73.94㎡ 매물이 12억~13억원대에 형성돼 있다는 구체적 호가 정보가 새로 제시됐다.\n\n*왜 골랐나*: 상계주공3단지의 구체적 매물 호가가 제시된 기사로, 우선순위 지역 기준에 해당한다.\n\n### 4. 🔴 [창동] 가을밤 서울 골목에…각기 다른 매력의 ‘야장’ 뜬다\n\n서울경제 · 2026-10-05 · [원문](https://sedaily.com/article/20098089)\n\n서울시와 서울신용보증재단이 골목상권 야간 활성화를 위한 '달빛야장' 사업에 687억5000만원 규모 특별보증을 공급한다. 1기 선정 6곳 중 창동역상점가는 서울아레나와 연계해 K팝 공연과 지역 먹거리를 결합한 문화형 상권으로 조성된다. 선정 상권에는 2028년까지 각각 최대 20억원씩 지원된다.\n\n*왜 골랐나*: 창동역 일대가 서울아레나와 연계한 문화 상권으로 조성되는 내용으로, 상계 생활권과 인접한 창동의 생활환경 변화를 다룬 기사다.\n\n## 인사이트\n\n- 상계주공6단지는 신속통합기획 방식으로 추진되는 상계주공 단지 중 처음으로 정비계획 공람을 실시했고, 상계한신3차도 상계권역 최초로 정비구역 지정 절차를 밟으며 상계동 일대 정비사업이 동시다발적으로 속도를 내고 있다.[1]\n- 상계한신3차는 최근 90일 조합원분양가 벤치마크(정비구역지정 단계, 중앙값 81,400만원·세대총액)의 표본 단지로 집계돼 있어, 사업 단계 진척과 분양가 수준을 함께 참고할 수 있다.[1]\n- 상계주공9단지는 올해 노원구 10억원 미만 거래 중 가장 많은 151건을 기록했고, 8월 전용79㎡가 8억6500만원, 전용58㎡가 7억1000만원에 거래되며 재건축 기대에 따른 매수세가 이어지고 있다.[2]\n- 상계주공3단지 전용73.94㎡ 매물은 12억~13억원대 호가가 형성돼 있으며, 현지 중개업소도 이를 시세보다 높은 수준으로 평가해 매도자 기대가격 상승이 감지된다.[3]\n- 창동역상점가의 야간상권 조성사업은 서울아레나와 연계된 문화시설 투자로, 상계 생활권과 인접한 지역의 생활환경 변화 사례로 참고할 만하다.[4]\n\n## 오늘의 개념\n\n### 정비계획 공람\n\n정비계획 공람은 정비구역 지정에 앞서 지자체가 수립한 정비계획안을 주민과 이해관계자에게 일정 기간 공개해 의견을 듣는 절차다. 이 공람을 거쳐야 정비구역 지정 신청 등 다음 단계로 넘어갈 수 있다.\n\n*오늘*: 상계주공6단지가 신속통합기획 방식의 상계주공 단지 중 처음으로 이 공람을 실시했다는 소식이 오늘 보도됐다.[1]\n\n## 참고 원문\n\n1. [재건축ㆍ재개발 속도가 답이다] ①노원구 “정비사업은 생존전략”…... — 대한경제 · [원문](https://dnews.co.kr/uhtml/view.jsp?idxno=202610051708413060460)\n2. “10억 이하 아파트 좀 구해주세요”...노원구에 몰려 있다 — 매일경제 · [원문](https://mk.co.kr/article/12167209)\n3. 아파트 거래 절반 ‘9억 이하’에 몰리고… 강남 매물은 쌓였다 — segye.com · [원문](https://segye.com/newsView/20261005508889?OutUrl=naver)\n4. 가을밤 서울 골목에…각기 다른 매력의 ‘야장’ 뜬다 — 서울경제 · [원문](https://sedaily.com/article/20098089)\n\n## 오늘 흘려보낸 것\n\n중복 55건 · 후속보도 신규정보 없음 0건 · 기준 미달 357건\n"}, {"date": "2026-10-05", "markdown": "# 2026-10-05 재건축 비용 다이제스트\n\n## 오늘의 요약\n\n오늘은 상계주공9단지나 인접 단지의 공사비·분담금 수치가 담긴 기사가 없었다. 대신 노원구를 중심으로 한 거시 지표 기사들이 다수였다 — 대출 의존도, 매매가 상승률, 저가 거래 쏠림 등 자금 조달 환경을 보여주는 내용이다. 노원구가 서울 외곽 중에서도 대출 의존도가 가장 높고 가격 상승률도 가장 빠른 지역으로 반복 확인됐는데, 이는 재건축 완료 후 일반분양·조합원 물량을 받아줄 매수층의 자금력과 직결되는 배경 정보다. 다만 오늘 기사들만으로는 분담금·공사비를 가늠할 수 있는 직접적인 수치는 얻을 수 없다.\n\n## 선별 3건\n\n### 1. 🔴 [노원구] 세제개편안 후 서울 아파트 15억원 이하 거래 비중 80% 육박\n\n연합뉴스 · 2026-10-05 · [원문](https://yna.co.kr/view/AKR20261005011500003?input=1195m)\n\n같은 사건 보도: jnilbo.com, news.sbs.co.kr, 매일경제 외 3곳\n\n8·3 세제개편안 발표 이후 서울 아파트 거래 중 15억원 이하 비중이 약 79%, 6억원 이하 비중은 25%로 늘었다. 노원구 상계동의 한 공인중개사는 신규 전월세 매물이 사라지면서 신혼부부 등이 디딤돌대출(집값의 70%, 최대 3억2천만원, 연 3%대)을 받아 매수로 전환하는 경우가 많다고 전했다. 9억원 이하 저가 거래만 늘고 9억~15억원 구간 비중은 계속 줄고 있다.\n\n**이번에 새로 나온 것**: 세제개편안 이후 노원구 상계동에서 디딤돌대출(최대 3억2천만원, 연 3%대)을 활용한 매수 전환이 늘고 있다는 구체적 대출 조건이 처음 언급됐다.\n\n*왜 골랐나*: 노원구 상계동 공인중개사의 실제 대출 조건·거래 전환 사례가 담겨 있고, 기존 '생애최초 실수요자' 스레드에 새로운 구체적 대출 조건 정보를 더했다.\n\n### 2. 🔴 [노원구] 대출한도 또 줄인다고?...강남보다 노도강 대출 비중 제일 높아\n\n매일경제 · 2026-10-04 · [원문](https://mk.co.kr/article/12167950)\n\n올해 1~8월 노원구 주택 매입자금 중 금융기관 대출 비중이 38.2%로 지난해(30.0%)보다 8.2%포인트 올랐다. 같은 기간 강남3구·용산구의 대출 비중은 11.1%까지 낮아졌다. 8월 노원구 아파트 거래의 99.8%가 15억원 이하였으며, 이 가격대는 주담대 한도가 최대 6억원으로 묶여 있어 추가 한도 축소 논의가 외곽 지역 실수요자에게 더 큰 영향을 줄 수 있다는 지적이 나온다.\n\n**정책 포인트**\n\n- 15억원 이하 주택 주담대 한도(현행 6억원)를 추가로 낮추는 방안이 논의되고 있다 — 시행되면 대출 의존도가 높은 노원구 등 외곽 지역 매수 여력이 먼저 위축될 수 있다.\n\n*왜 골랐나*: 노원구를 포함한 외곽 지역의 대출 의존도 수치가 구체적으로 제시됐고, 대출 한도 추가 축소라는 정책 변화 가능성이 노원구 매수 여력에 직접 영향을 줄 수 있어 선정했다.\n\n### 3. 🔴 [노원구] 서울 집값 격차 줄었다는데…서민 ‘내 집’은 더 멀어졌다\n\n서울경제 · 2026-10-03 · [원문](https://sedaily.com/article/20097947)\n\n9월 서울 아파트 5분위 배율이 6.28배로 8개월 연속 하락했는데, 이는 고가 아파트 가격 하락보다 중저가 아파트 가격이 더 가파르게 오른 영향이다. 9월 노원구 아파트 매매가격은 전월 대비 2.32% 올라 서울 자치구 중 가장 높은 상승률을 보였다. 15억원 이하 아파트 대출 한도 제한이 중저가 지역 수요를 끌어올린 배경으로 지목된다.\n\n*왜 골랐나*: 노원구가 서울 자치구 중 가장 높은 월간 매매가 상승률을 기록했다는 구체적 수치가 있어 선정했다.\n\n## 인사이트\n\n- 노원구 주택 매입자금의 대출 비중이 38.2%까지 오른 것은 상계주공 등 노원구 구축 단지 매수
